  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n<script src=\"f109d521-d4a2-4c7e-8a06-2c472bb57a85\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>ISMS Tracker — ISO/IEC 27001:2022<\u002Ftitle>\n<style>\n  :root {\n    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;\n    --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;\n  }\n  html, body { background: #EFEDED; margin: 0; }\n  body::before { content: \"\"; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;\n    background-image: radial-gradient(#E1DEDE .6px, transparent .6px); background-size: 15px 15px; }\n  * { box-sizing: border-box; }\n  *:focus-visible { outline: 2px solid #CC000E; outline-offset: 1px; }\n  ::selection { background: #FBE7E8; color: #2C2D2E; }\n  a { color: #CC000E; text-decoration: none; border-bottom: 1px solid #FBE7E8; }\n  a:hover { color: #B6000C; border-bottom-color: #B6000C; }\n  input, select, textarea { font-family: var(--mono); accent-color: #CC000E; }\n  input[type=text], input[type=date], input[type=number], input[type=password], textarea, select {\n    border: 1px solid #C4C1C1; border-radius: 2px; padding: 5px 7px; font-size: 11.5px;\n    background: #fff; color: #2C2D2E; max-width: 100%; }\n  input:focus, select:focus, textarea:focus { border-color: #CC000E; box-shadow: 0 0 0 3px #FBE7E8; }\n  table { border-collapse: separate; border-spacing: 0; }\n  tbody tr { transition: background .13s ease; }\n  tbody tr:hover { background: #F7F6F6; }\n  button { font-family: var(--sans); transition: transform .12s ease, box-shadow .15s ease, background .16s ease, color .16s ease, border-color .16s ease; }\n  button:not(:disabled):hover { box-shadow: 0 3px 10px rgba(38,36,31,.13); }\n  button:not(:disabled):active { transform: translateY(1px); box-shadow: none; }\n  .scroller { overflow: auto; -webkit-overflow-scrolling: touch; }\n  .scroller::-webkit-scrollbar { height: 11px; width: 11px; }\n  .scroller::-webkit-scrollbar-thumb { background: #C4C1C1; border-radius: 6px; }\n  .scroller::-webkit-scrollbar-track { background: #E4E2E1; }\n  @keyframes fadeUp { from { opacity: 0; transform: translateY(7px) } to { opacity: 1; transform: none } }\n  @keyframes stampIn { from { opacity: 0; transform: scale(1.3) rotate(-9deg) } to { opacity: 1; transform: scale(1) rotate(-1.2deg) } }\n  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }\n  @keyframes sweep { from { background-position: 200% 0 } to { background-position: -200% 0 } }\n  @keyframes rowflash { 0%, 100% { background: transparent } 18%, 62% { background: #FBE7E8 } }\n  @keyframes annBlink { 0%, 92%, 100% { transform: scaleY(1) } 95%, 97% { transform: scaleY(.12) } }\n  @keyframes annBob { 0%, 100% { transform: translateY(0) rotate(0deg) } 50% { transform: translateY(-2.5px) rotate(-1.5deg) } }\n  @keyframes annThink { 0%, 100% { opacity: .25; transform: translateY(0) } 50% { opacity: 1; transform: translateY(-2px) } }\n  @keyframes annPing { 0% { box-shadow: 0 0 0 0 rgba(204,0,14,.5) } 70%, 100% { box-shadow: 0 0 0 12px rgba(204,0,14,0) } }\n  /* The character. Eyes track the cursor through two custom properties written\n     straight onto the element, so following the mouse costs no re-render. */\n  .annexa { animation: annBob 3.6s ease-in-out infinite; }\n  .annexa .eye { transform-origin: center; animation: annBlink 5.2s ease-in-out infinite; }\n  .annexa .pupil { transform: translate(var(--ax, 0px), var(--ay, 0px)); transition: transform .16s cubic-bezier(.2,.7,.3,1); }\n  .annexa.busy-face .eye { animation: annBlink 1.1s ease-in-out infinite; }\n  .annexa .dot { animation: annThink 1s ease-in-out infinite; }\n  .annexa .dot:nth-child(2) { animation-delay: .16s; }\n  .annexa .dot:nth-child(3) { animation-delay: .32s; }\n  .annexa-btn:hover .annexa { animation-duration: 1.1s; }\n  .annexa-ping { animation: annPing 1.9s ease-out infinite; }\n  .annexa-bubble { opacity: 0; transform: translateY(4px); transition: opacity .18s ease, transform .18s ease; pointer-events: none; }\n  .annexa-btn:hover .annexa-bubble, .annexa-btn:focus-visible .annexa-bubble { opacity: 1; transform: none; }\n  @media (prefers-reduced-motion: reduce) {\n    .annexa, .annexa .eye, .annexa .dot, .annexa-ping { animation: none !important; }\n  }\n  .pane { animation: fadeUp .3s cubic-bezier(.2,.7,.3,1) both; }\n  /* An element that animates transform with fill-mode both keeps a matrix\n     forever, and a transformed ancestor becomes the containing block for its\n     fixed-position descendants — which put the character, the assistant and\n     every overlay off-screen. <main> gets an opacity-only entrance so nothing\n     inside it is re-anchored. */\n  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }\n  main.pane { animation: fadeIn .3s ease both; }\n  .stamp { animation: stampIn .5s cubic-bezier(.2,1.3,.4,1) both; }\n  .flashrow { animation: rowflash 1.9s ease-in-out 3; box-shadow: inset 3px 0 0 #CC000E; }\n  .card { transition: box-shadow .2s ease, transform .2s ease, border-color .2s ease; }\n  .card:hover { box-shadow: 0 8px 22px rgba(38,36,31,.11); transform: translateY(-2px); border-color: #C4C1C1; }\n  .navitem { transition: background .16s ease, border-color .16s ease, padding-left .16s ease; }\n  .navitem:hover { background: #F7F6F6; border-left-color: #B6000C !important; }\n  .busy { background: linear-gradient(90deg, transparent, #FBE7E8, transparent); background-size: 200% 100%; animation: sweep 1.1s linear infinite; }\n  @media (max-width: 859px) {\n    [data-stack] { grid-template-columns: 1fr !important; }\n    [data-wordmark], [data-settings-word], [data-ai-word] { display: none !important; }\n    [data-org] { border-left: none !important; padding-left: 0 !important; }\n  }\n  @keyframes slideIn { from { transform: translateX(-100%) } to { transform: none } }\n  [data-drawer=\"yes\"] { animation: slideIn .22s cubic-bezier(.2,.7,.3,1) both; }\n  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family: var(--sans); background: #EFEDED; color: #2C2D2E; min-height: 100vh; font-size: 13px\">\n\n  <sc-if value=\"{{ locked }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 90; background: #EFEDED; display: flex; align-items: center; justify-content: center; padding: 24px\">\n      <div class=\"pane\" role=\"dialog\" aria-label=\"Unlock the vault\" style=\"background: #FFFFFF; border: 1px solid #C4C1C1; border-top: 3px solid #CC000E; border-radius: 4px; padding: 26px; max-width: 460px; width: 100%; box-shadow: 0 22px 60px rgba(44,45,46,.18)\">\n        <span style=\"display: inline-flex; align-items: center; gap: 9px; margin-bottom: 14px\">\n          <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 64 64\" role=\"img\" aria-label=\"ISMS Tracker\">\n            <path d=\"M5 5h54v33c0 11.5-12 18.5-27 21C17 56.5 5 49.5 5 38Z\" fill=\"#E3000F\"><\u002Fpath>\n            <text x=\"32\" y=\"35.5\" text-anchor=\"middle\" font-size=\"19.5\" font-weight=\"800\" fill=\"#ffffff\" letter-spacing=\"-0.4\">ISMS<\u002Ftext>\n          <\u002Fsvg>\n          <span style=\"font-size: 15px; font-weight: 700\">ISMS Tracker<\u002Fspan>\n        <\u002Fspan>\n        <h1 style=\"margin: 0 0 5px; font-size: 19px; font-weight: 700; letter-spacing: -.01em\">This project is encrypted<\u002Fh1>\n        <p style=\"margin: 0 0 16px; font-size: 12.5px; line-height: 1.65; color: #54585B; text-wrap: pretty\">Your passphrase derives the key that decrypts it. It is never stored, so there is no way to recover the project without it.<\u002Fp>\n        <div style=\"display: grid; gap: 9px\">\n          <input type=\"password\" value=\"{{ vaultPass }}\" sc-camel-on-change=\"{{ setVaultPass }}\" placeholder=\"Passphrase\" aria-label=\"Passphrase\" style=\"width: 100%; min-height: 42px\">\n          <input type=\"text\" value=\"{{ vaultCode }}\" sc-camel-on-change=\"{{ setVaultCode }}\" placeholder=\"Authenticator code, if you set one\" aria-label=\"Authenticator code\" inputmode=\"numeric\" style=\"width: 100%; min-height: 42px\">\n          <button sc-camel-on-click=\"{{ unlock }}\" disabled=\"{{ vaultBusy }}\" style=\"font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .07em; padding: 12px; min-height: 44px; border: none; border-radius: 2px; background: #CC000E; color: #fff; cursor: pointer\">UNLOCK<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasVaultErr }}\">\n          <div style=\"margin-top: 11px; background: #FBE3E4; border-left: 3px solid #B6000C; border-radius: 2px; padding: 10px 12px; font-size: 12px; line-height: 1.55\">{{ vaultErr }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <header style=\"position: sticky; top: 0; z-index: 30; background: #FFFFFF; border-bottom: 2px solid #2C2D2E; display: flex; align-items: center; gap: 12px; padding: 12px 20px; box-shadow: 0 1px 0 rgba(138,51,36,.35), 0 4px 14px rgba(38,36,31,.06)\">\n    <button sc-camel-on-click=\"{{ toggleNav }}\" aria-label=\"{{ navBtnLabel }}\" aria-expanded=\"{{ navOpen }}\" title=\"{{ navBtnLabel }}\" style=\"font-family: var(--mono); font-size: 15px; line-height: 1; padding: 8px 11px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #2C2D2E; cursor: pointer; font-weight: 600\">{{ navGlyph }}<\u002Fbutton>\n    <span style=\"display: inline-flex; align-items: center; gap: 9px; flex-shrink: 0\">\n      <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 64 64\" role=\"img\" aria-label=\"ISMS Tracker\" style=\"display: block; flex-shrink: 0\">\n        <path d=\"M5 5h54v33c0 11.5-12 18.5-27 21C17 56.5 5 49.5 5 38Z\" fill=\"#E3000F\"><\u002Fpath>\n        <text x=\"32\" y=\"35.5\" text-anchor=\"middle\" font-size=\"19.5\" font-weight=\"800\" fill=\"#ffffff\" letter-spacing=\"-0.4\">ISMS<\u002Ftext>\n      <\u002Fsvg>\n      <span style=\"line-height: 1.15\" data-wordmark=\"\">\n        <span style=\"display: block; font-size: 15px; font-weight: 700; color: #2C2D2E; letter-spacing: -.015em\">ISMS Tracker<\u002Fspan>\n        <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; color: #65696C; letter-spacing: .02em\">ISO/IEC 27001:2022<\u002Fspan>\n      <\u002Fspan>\n    <\u002Fspan>\n    <div style=\"flex: 1; min-width: 0; border-left: 1px solid #E1DEDE; padding-left: 12px\" data-org=\"\">\n      <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: #65696C\">Organisation<\u002Fdiv>\n      <div style=\"font-size: 16px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{ company }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align: right; flex-shrink: 0\">\n      <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: #65696C\">{{ gateEyebrow }}<\u002Fdiv>\n      <div style=\"font-family: var(--mono); font-size: 12px; font-weight: 800; color: {{ gateColor }}\">{{ gateReadout }}<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ hasVault }}\">\n      <button sc-camel-on-click=\"{{ lockNow }}\" aria-label=\"Lock now\" title=\"Lock the vault\" style=\"font-family: var(--mono); font-size: 13px; padding: 9px 11px; min-height: 38px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #2C2D2E; cursor: pointer; flex-shrink: 0\">🔒<\u002Fbutton>\n    <\u002Fsc-if>\n    <button sc-camel-on-click=\"{{ openSettings }}\" aria-label=\"Settings\" title=\"Settings — profile, organisation document, data\" style=\"display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .07em; padding: 9px 12px; min-height: 38px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #2C2D2E; cursor: pointer; flex-shrink: 0\">\n      <span aria-hidden=\"true\" style=\"font-size: 13px; line-height: 1\">⚙<\u002Fspan>\n      <span data-settings-word=\"\">SETTINGS<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fheader>\n\n  <div style=\"display: flex; align-items: flex-start; max-width: 1560px; margin: 0 auto\">\n\n    <sc-if value=\"{{ isDrawer }}\">\n      <div sc-camel-on-click=\"{{ closeNav }}\" aria-hidden=\"true\" style=\"position: fixed; inset: 0; z-index: 25; background: rgba(38,36,31,.42)\"><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ navOpen }}\" hint-placeholder-val=\"{{ true }}\">\n      <aside data-sidebar=\"\" data-drawer=\"{{ drawerFlag }}\" class=\"pane\" style=\"width: 214px; flex-shrink: 0; position: {{ navPos }}; left: 0; top: {{ navTop }}; z-index: {{ navZ }}; background: {{ navBg }}; box-shadow: {{ navShadow }}; border-right: 1px solid {{ navEdge }}; padding: 18px 10px 40px; align-self: flex-start; max-height: {{ navMaxH }}; overflow-y: auto\">\n        <nav aria-label=\"Sections\" style=\"display: flex; flex-direction: column; gap: 2px\">\n          <sc-for list=\"{{ nav }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ t.go }}\" aria-current=\"{{ t.current }}\" class=\"navitem\" style=\"display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; padding: 9px 11px; cursor: pointer; border-radius: 3px; border: none; border-left: 3px solid {{ t.edge }}; background: {{ t.bg }}; color: {{ t.fg }}\">\n              <span style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; color: {{ t.num }}\">{{ $index }}<\u002Fspan>\n              <span style=\"flex: 1\">\n                <span style=\"display: block; font-size: 12.5px; font-weight: {{ t.weight }}\">{{ t.n }}<\u002Fspan>\n                <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; color: #65696C; margin-top: 1px\">{{ t.hint }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fnav>\n      <\u002Faside>\n    <\u002Fsc-if>\n\n    <!-- No z-index here. A z-index on main makes it a stacking context, and every\n         overlay inside it is then confined below main's own layer — so the header\n         (z-index 30) painted over dialogs asking for 60. They stay correctly\n         positioned but hidden, which is the worst kind of bug to measure. -->\n    <main class=\"pane\" style=\"flex: 1; min-width: 0; position: relative; padding: 18px 20px 80px\">\n\n      <div style=\"display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px\">\n        <h1 style=\"font-size: 21px; font-weight: 700; letter-spacing: -.01em; margin: 0\">{{ tabTitle }}<\u002Fh1>\n        <span style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: #65696C; white-space: nowrap\">{{ tabPart }}<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin: 0 0 18px; font-size: 12.5px; color: #54585B; line-height: 1.65; max-width: 860px\">{{ tabNote }}<\u002Fp>\n\n      <sc-if value=\"{{ hasStepNote }}\">\n        <div class=\"pane\" style=\"display: flex; align-items: flex-start; gap: 11px; background: #FBEEDC; border: 1px solid #C4C1C1; border-left: 3px solid #8A5A00; border-radius: 3px; padding: 11px 13px; margin-bottom: 14px; max-width: 860px\">\n          <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: #65696C; flex-shrink: 0; padding-top: 2px\">Why you are here<\u002Fspan>\n          <span style=\"flex: 1; font-size: 12.5px; line-height: 1.6\">{{ stepNote }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ clearStepNote }}\" aria-label=\"Dismiss\" style=\"font-family: var(--mono); font-size: 11px; padding: 3px 8px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #54585B; cursor: pointer; flex-shrink: 0\">✕<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ loading }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-family: var(--mono); font-size: 11.5px; color: #54585B; padding: 24px 0\">Loading your tracker…<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ encrypted }}\">\n        <div style=\"background: #FBEEDC; border: 1px solid #C4C1C1; border-left: 3px solid #8A5A00; padding: 14px 16px; border-radius: 3px; max-width: 720px\">\n          <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: #65696C\">Vault locked<\u002Fdiv>\n          <p style=\"margin: 8px 0 0; font-size: 12.5px; line-height: 1.65\">Browser storage holds ciphertext for this tracker. Nothing has been written or overwritten. The unlock screen arrives with the Settings phase; until then the numbers below come from the seed state.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isOverview }}\">\n        <div>\n          <div data-stack=\"\" style=\"display: grid; grid-template-columns: minmax(230px,280px) 1fr; gap: 16px; margin-bottom: 20px\">\n            <div class=\"stamp\" style=\"border: 3px double {{ gateColor }}; color: {{ gateColor }}; padding: 15px 12px; text-align: center; transform: rotate(-1.2deg); background: rgba(255,255,255,.72); border-radius: 3px\">\n              <div style=\"font-family: var(--mono); font-size: 9px; letter-spacing: .22em\">STAGE 2 READINESS<\u002Fdiv>\n              <div style=\"font-family: var(--mono); font-size: 26px; font-weight: 800; letter-spacing: .04em; margin: 6px 0 4px\">{{ gateWord }}<\u002Fdiv>\n              <div style=\"font-family: var(--mono); font-size: 9px; letter-spacing: .13em\">{{ gateCount }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-left: 3px solid #CC000E; padding: 14px 16px; border-radius: 3px\">\n              <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: #65696C\">What stands between you and a clean certificate<\u002Fdiv>\n              <sc-if value=\"{{ clear }}\">\n                <p style=\"margin: 8px 0 0; font-size: 13px; color: #54585B\">Nothing outstanding on the four gates. Book the Stage 2 audit.<\u002Fp>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ hasBlockers }}\" hint-placeholder-val=\"{{ true }}\">\n                <ul style=\"margin: 8px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.8\">\n                  <sc-for list=\"{{ blockers }}\" as=\"b\" hint-placeholder-count=\"3\">\n                    <li><b style=\"font-family: var(--mono); color: #B6000C\">{{ b.n }}<\u002Fb> {{ b.t }}<span style=\"font-family: var(--mono); font-size: 10px; color: #65696C; margin-left: 6px\">{{ b.ref }}<\u002Fspan><\u002Fli>\n                  <\u002Fsc-for>\n                <\u002Ful>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(175px,1fr)); gap: 10px; margin-bottom: 20px\">\n            <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"6\">\n              <div class=\"card\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-top: 2px solid {{ s.tone }}; padding: 12px 14px; border-radius: 3px\">\n                <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: #65696C\">{{ s.label }}<\u002Fdiv>\n                <div style=\"font-family: var(--mono); font-size: 23px; font-weight: 800; letter-spacing: -.01em; margin: 5px 0 3px; color: {{ s.tone }}\">{{ s.value }}<\u002Fdiv>\n                <div style=\"font-size: 11.5px; color: #54585B; line-height: 1.5\">{{ s.note }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); gap: 20px; background: #FFFFFF; border: 1px solid #E1DEDE; padding: 18px; border-radius: 3px\">\n            <sc-for list=\"{{ meters }}\" as=\"mt\" hint-placeholder-count=\"4\">\n              <div>\n                <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px\">\n                  <span style=\"font-size: 12.5px; color: #54585B\">{{ mt.label }}<\u002Fspan>\n                  <span style=\"font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: {{ mt.tone }}\">{{ mt.pctText }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height: 7px; background: #E1DEDE; border-radius: 3px; overflow: hidden\">\n                  <div style=\"height: 100%; width: {{ mt.width }}; background: {{ mt.tone }}; border-radius: 3px; transition: width .35s ease\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <section class=\"card\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-left: 3px solid #FBE7E8; border-radius: 3px; padding: 16px; margin: 20px 0 14px\">\n            <h2 style=\"font-size: 15px; font-weight: 700; margin: 0 0 10px\">Legend<\u002Fh2>\n            <div>\n              <div style=\"display: flex; gap: 13px; align-items: flex-start; padding: 11px 0; line-height: 1.6; border-bottom: 1px solid #E1DEDE\">\n                <span style=\"width: 18px; height: 18px; background: #17693A; border-radius: 3px; flex-shrink: 0; margin-top: 1px\"><\u002Fspan>\n                <span style=\"font-size: 13px\"><b style=\"display: block; margin-bottom: 2px\">Verified / Complete<\u002Fb><span style=\"color: #54585B; font-size: 12.5px\">Evidence exists and you have checked it.<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 13px; align-items: flex-start; padding: 11px 0; line-height: 1.6; border-bottom: 1px solid #E1DEDE\">\n                <span style=\"width: 18px; height: 18px; background: #8A5A00; border-radius: 3px; flex-shrink: 0; margin-top: 1px\"><\u002Fspan>\n                <span style=\"font-size: 13px\"><b style=\"display: block; margin-bottom: 2px\">In progress / Drafting<\u002Fb><span style=\"color: #54585B; font-size: 12.5px\">Started, not finished.<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 13px; align-items: flex-start; padding: 11px 0; line-height: 1.6; border-bottom: 1px solid #E1DEDE\">\n                <span style=\"width: 18px; height: 18px; background: #B6000C; border-radius: 3px; flex-shrink: 0; margin-top: 1px\"><\u002Fspan>\n                <span style=\"font-size: 13px\"><b style=\"display: block; margin-bottom: 2px\">Implemented / In review<\u002Fb><span style=\"color: #54585B; font-size: 12.5px\">Done but not yet verified by you.<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 13px; align-items: flex-start; padding: 11px 0; line-height: 1.6; border-bottom: 1px solid #E1DEDE\">\n                <span style=\"width: 18px; height: 18px; background: #B6000C; border-radius: 3px; flex-shrink: 0; margin-top: 1px\"><\u002Fspan>\n                <span style=\"font-size: 13px\"><b style=\"display: block; margin-bottom: 2px\">Overdue / Gap / Needs update<\u002Fb><span style=\"color: #54585B; font-size: 12.5px\">Would be a finding today.<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 13px; align-items: flex-start; padding: 11px 0; line-height: 1.6\">\n                <span style=\"width: 18px; height: 18px; background: #65696C; border-radius: 3px; flex-shrink: 0; margin-top: 1px\"><\u002Fspan>\n                <span style=\"font-size: 13px\"><b style=\"display: block; margin-bottom: 2px\">Not started<\u002Fb><span style=\"color: #54585B; font-size: 12.5px\">No work yet.<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"margin-top: 26px\">\n              <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: #65696C\">Risk bands — score = likelihood × impact<\u002Fdiv>\n              <div style=\"display: flex; gap: 10px; flex-wrap: wrap; margin-top: 11px\">\n                <span style=\"font-family: var(--mono); font-size: 11px; padding: 7px 13px; border-radius: 3px; background: #17693A; color: #fff; font-weight: 700; letter-spacing: .04em\">Low 1–3<\u002Fspan>\n                <span style=\"font-family: var(--mono); font-size: 11px; padding: 7px 13px; border-radius: 3px; background: #8A5A00; color: #fff; font-weight: 700; letter-spacing: .04em\">Medium 4–8<\u002Fspan>\n                <span style=\"font-family: var(--mono); font-size: 11px; padding: 7px 13px; border-radius: 3px; background: #B4551A; color: #fff; font-weight: 700; letter-spacing: .04em\">High 9–14<\u002Fspan>\n                <span style=\"font-family: var(--mono); font-size: 11px; padding: 7px 13px; border-radius: 3px; background: #B6000C; color: #fff; font-weight: 700; letter-spacing: .04em\">Critical 15–25<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"margin-top: 26px\">\n              <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: #65696C\">The four gates<\u002Fdiv>\n              <ul style=\"margin: 11px 0 0; padding-left: 20px; font-size: 12.5px; line-height: 2.05; color: #54585B\">\n                <li>Every mandatory document approved or published <span style=\"font-family: var(--mono); font-size: 10px\">7.5<\u002Fspan><\u002Fli>\n                <li>Every excluded control carries a written justification <span style=\"font-family: var(--mono); font-size: 10px\">6.1.3 d)<\u002Fspan><\u002Fli>\n                <li>Every residual risk at or below your threshold <span style=\"font-family: var(--mono); font-size: 10px\">6.1.2 a)<\u002Fspan><\u002Fli>\n                <li>Every applicable sub-clause verified <span style=\"font-family: var(--mono); font-size: 10px\">4–10<\u002Fspan><\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <p style=\"font-size: 12px; color: #54585B; margin-top: 4px; max-width: 900px; line-height: 1.75; text-wrap: pretty\">Clauses 4–10 are mandatory in full — every <i>shall<\u002Fi> applies whatever your business does. Annex A is selectable, which is exactly why clause 6.1.3 d) makes you justify each inclusion <i>and<\u002Fi> each exclusion.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isPlan }}\">\n        <div>\n          <div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: #FFFFFF; border: 1px solid #E1DEDE; border-radius: 3px; padding: 10px 12px; margin-bottom: 14px\">\n            <div style=\"display: flex; border: 1px solid #C4C1C1; border-radius: 2px; overflow: hidden\">\n              <button sc-camel-on-click=\"{{ setWeek }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; padding: 6px 11px; border: none; cursor: pointer; background: {{ weekBg }}; color: {{ weekFg }}\">WEEKS<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ setDay }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; padding: 6px 11px; border: none; cursor: pointer; background: {{ dayBg }}; color: {{ dayFg }}\">DAYS<\u002Fbutton>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ toggleAll }}\" style=\"font-family: var(--mono); font-size: 10.5px; padding: 6px 11px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #2C2D2E; cursor: pointer; white-space: nowrap\">{{ allOpenLabel }}<\u002Fbutton>\n            <label style=\"display: flex; align-items: center; gap: 7px\">\n              <span style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: #65696C\">Zoom<\u002Fspan>\n              <input type=\"range\" min=\"16\" max=\"54\" value=\"{{ zoom }}\" sc-camel-on-change=\"{{ setZoom }}\" aria-label=\"Timeline zoom\" style=\"width: 90px\">\n            <\u002Flabel>\n            <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: #65696C\">{{ planCount }}<\u002Fspan>\n            <sc-if value=\"{{ reordered }}\">\n              <button sc-camel-on-click=\"{{ resetOrder }}\" title=\"Put the twelve steps back in the workbook's order\" style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .06em; padding: 6px 10px; min-height: 32px; border: 1px solid #CC000E; border-radius: 2px; background: #fff; color: #CC000E; cursor: pointer\">RESET ORDER<\u002Fbutton>\n            <\u002Fsc-if>\n            <span style=\"flex: 1\"><\u002Fspan>\n            <button sc-camel-on-click=\"{{ exportPlan }}\" style=\"font-family: var(--mono); font-size: 10.5px; padding: 6px 11px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #2C2D2E; cursor: pointer; white-space: nowrap\">EXPORT CSV<\u002Fbutton>\n          <\u002Fdiv>\n\n          <section style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-left: 3px solid #CC000E; border-radius: 3px; margin-bottom: 14px\">\n            <div style=\"display: flex; align-items: center; gap: 10px; padding: 11px 13px\">\n              <button sc-camel-on-click=\"{{ toggleGuide }}\" aria-expanded=\"{{ guideAria }}\" aria-label=\"Toggle the guide\" style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 3px 9px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #2C2D2E; cursor: pointer\">{{ guideGlyph }}<\u002Fbutton>\n              <span style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: #65696C\">Where you are<\u002Fspan>\n              <span style=\"font-size: 12.5px; font-weight: 600\">{{ guideSummary }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ guideOpen }}\">\n              <div style=\"border-top: 1px solid #E1DEDE; padding: 13px\">\n                <p style=\"margin: 0 0 12px; font-size: 12px; line-height: 1.65; color: #54585B; max-width: 780px; text-wrap: pretty\">These are not a queue. Policy work runs alongside an open gap assessment, and the risk method is usually settled before the gap closes. Everything outstanding is listed; the first is a suggestion, not an instruction.<\u002Fp>\n                <sc-for list=\"{{ guideSteps }}\" as=\"s\" hint-placeholder-count=\"4\">\n                  <div style=\"border: 1px solid #E1DEDE; border-left: 3px solid {{ s.edge }}; border-radius: 3px; padding: 12px; margin-bottom: 9px\">\n                    <div style=\"display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap\">\n                      <span style=\"font-family: var(--mono); font-size: 11px; font-weight: 800; color: #CC000E\">{{ s.n }}<\u002Fspan>\n                      <span style=\"font-size: 13.5px; font-weight: 700\">{{ s.title }}<\u002Fspan>\n                      <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: #65696C\">{{ s.stage }} · {{ s.part }}<\u002Fspan>\n                      <sc-if value=\"{{ s.startHere }}\">\n                        <span style=\"font-family: var(--mono); font-size: 8.5px; font-weight: 700; letter-spacing: .09em; padding: 2px 6px; border-radius: 2px; background: #CC000E; color: #fff\">START HERE<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <p style=\"margin: 7px 0 9px; font-size: 12px; line-height: 1.6; color: #54585B; text-wrap: pretty\">{{ s.what }}<\u002Fp>\n                    <div style=\"background: #F7F6F6; border-radius: 2px; padding: 8px 10px; margin-bottom: 9px\">\n                      <div style=\"font-family: var(--mono); font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: #65696C\">Complete when<\u002Fdiv>\n                      <div style=\"font-size: 12px; margin-top: 2px\">{{ s.test }}<\u002Fdiv>\n                      <sc-if value=\"{{ s.hasWhy }}\">\n                        <div style=\"font-size: 12px; margin-top: 6px; color: #8A5A00; font-weight: 600\">{{ s.why }}<\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <div style=\"display: flex; gap: 6px; flex-wrap: wrap; align-items: center\">\n                      <button sc-camel-on-click=\"{{ s.take }}\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 7px 11px; min-height: 34px; border: none; border-radius: 2px; background: #CC000E; color: #fff; cursor: pointer\">TAKE ME THERE<\u002Fbutton>\n                      <sc-if value=\"{{ s.docs }}\">\n                        <span style=\"font-family: var(--mono); font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: #65696C; margin-left: 4px\">Documents for this step<\u002Fspan>\n                      <\u002Fsc-if>\n                      <sc-for list=\"{{ s.docs }}\" as=\"d\" hint-placeholder-count=\"2\">\n                        <button sc-camel-on-click=\"{{ d.go }}\" title=\"{{ d.title }}\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; padding: 5px 8px; min-height: 30px; border: 1px solid {{ d.tone }}; border-radius: 2px; background: #fff; color: {{ d.tone }}; cursor: pointer\">{{ d.id }}<\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ hasDone }}\">\n                  <button sc-camel-on-click=\"{{ toggleDone }}\" style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .06em; padding: 7px 11px; min-height: 34px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #54585B; cursor: pointer\">{{ doneLabel }}<\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-for list=\"{{ doneSteps }}\" as=\"s\" hint-placeholder-count=\"0\">\n                  <div style=\"border: 1px solid #E1DEDE; border-left: 3px solid #17693A; border-radius: 3px; padding: 10px 12px; margin-top: 8px; display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap\">\n                    <span style=\"font-family: var(--mono); font-size: 11px; font-weight: 800; color: #17693A\">{{ s.n }}<\u002Fspan>\n                    <span style=\"font-size: 13px; font-weight: 600; flex: 1\">{{ s.title }}<\u002Fspan>\n                    <span style=\"font-family: var(--mono); font-size: 9.5px; color: #17693A\">{{ s.test }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n\n          <sc-if value=\"{{ isPlanDesk }}\" hint-placeholder-val=\"{{ true }}\">\n            <div class=\"scroller\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-radius: 3px; max-height: 74vh\">\n              <sc-raw-table style=\"width: 100%; min-width: 1100px; table-layout: fixed\">\n                <sc-raw-thead>\n                  <sc-raw-tr>\n                    <sc-raw-th style=\"width: 300px; position: sticky; left: 0; top: 0; z-index: 4; background: #2C2D2E; color: #fff; font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; text-align: left; padding: 9px 8px\">Task<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"width: 124px; position: sticky; top: 0; z-index: 3; background: #2C2D2E; color: #fff; font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; padding: 9px 6px\">Window<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"width: 52px; position: sticky; top: 0; z-index: 3; background: #2C2D2E; color: #fff; font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; padding: 9px 6px\">Dur<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"width: 168px; position: sticky; top: 0; z-index: 3; background: #2C2D2E; color: #fff; font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; padding: 9px 6px\">Complete<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"background: #2C2D2E; position: sticky; top: 0; z-index: 3; padding: 0\">\n                      <div style=\"display: flex; width: {{ timelineW }}\">\n                        <sc-for list=\"{{ cols }}\" as=\"c\" hint-placeholder-count=\"20\">\n                          <div style=\"width: {{ c.w }}; flex-shrink: 0; text-align: center; padding: 9px 0; font-family: var(--mono); font-size: 8.5px; font-weight: {{ c.weight }}; color: {{ c.fg }}; border-left: 1px solid {{ c.edge }}\">{{ c.label }}<\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fsc-raw-th>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-raw-thead>\n                <sc-raw-tbody>\n                  <sc-for list=\"{{ planRows }}\" as=\"r\" hint-placeholder-count=\"12\">\n                    <sc-raw-tr draggable=\"{{ r.drag }}\" sc-camel-on-drag-start=\"{{ r.onDragStart }}\" sc-camel-on-drag-over=\"{{ r.onDragOver }}\" sc-camel-on-drop=\"{{ r.onDrop }}\" sc-camel-on-drag-end=\"{{ r.onDragEnd }}\" style=\"background: {{ r.rowBg }}; opacity: {{ r.grabOp }}\">\n                      <sc-raw-td style=\"position: sticky; left: 0; z-index: 2; background: {{ r.stickyBg }}; border-bottom: 1px solid #E1DEDE; padding: 5px 8px; font-weight: {{ r.titleWeight }}; box-shadow: inset 0 2px 0 {{ r.dropEdge }}\">\n                        <sc-if value=\"{{ r.isSec }}\">\n                          <span style=\"display: flex; align-items: center; gap: 8px; padding-left: {{ r.indent }}\">\n                            <sc-if value=\"{{ r.drag }}\">\n                              <span title=\"Drag to reorder this step\" aria-hidden=\"true\" style=\"flex-shrink: 0; font-family: var(--mono); font-size: 12px; line-height: 1; color: #A9A5A5; cursor: grab; letter-spacing: -1px\" style-hover=\"color: #CC000E\">⠿<\u002Fspan>\n                            <\u002Fsc-if>\n                            <button sc-camel-on-click=\"{{ r.toggle }}\" aria-expanded=\"{{ r.ariaOpen }}\" aria-label=\"Toggle section\" style=\"font-family: var(--mono); font-size: 11px; padding: 2px 7px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #2C2D2E; cursor: pointer; flex-shrink: 0\">{{ r.glyph }}<\u002Fbutton>\n                            <span style=\"font-family: var(--mono); color: #CC000E; font-size: 11px; flex-shrink: 0\">{{ r.wbs }}<\u002Fspan>\n                            <span style=\"flex: 1; font-size: {{ r.titleSize }}\">{{ r.title }}<\u002Fspan>\n                            <sc-if value=\"{{ r.drag }}\">\n                              <span style=\"display: flex; gap: 3px; flex-shrink: 0\">\n                                <button sc-camel-on-click=\"{{ r.nudgeUp }}\" aria-label=\"Move this step earlier\" title=\"Move earlier\" style=\"font-family: var(--mono); font-size: 9px; width: 22px; min-height: 24px; border: 1px solid #E1DEDE; border-radius: 2px; background: #fff; color: #65696C; cursor: pointer\" style-hover=\"border-color: #CC000E; color: #CC000E\">▲<\u002Fbutton>\n                                <button sc-camel-on-click=\"{{ r.nudgeDown }}\" aria-label=\"Move this step later\" title=\"Move later\" style=\"font-family: var(--mono); font-size: 9px; width: 22px; min-height: 24px; border: 1px solid #E1DEDE; border-radius: 2px; background: #fff; color: #65696C; cursor: pointer\" style-hover=\"border-color: #CC000E; color: #CC000E\">▼<\u002Fbutton>\n                              <\u002Fspan>\n                            <\u002Fsc-if>\n                          <\u002Fspan>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ r.isTask }}\">\n                          <span style=\"display: block; padding-left: {{ r.indent }}\">\n                            <span style=\"font-family: var(--mono); font-size: 10.5px; color: #65696C; margin-right: 8px\">{{ r.wbs }}<\u002Fspan>\n                            <span style=\"font-size: 12.5px\">{{ r.title }}<\u002Fspan>\n                            <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; color: #CC000E; margin-top: 1px\">{{ r.clause }}<\u002Fspan>\n                          <\u002Fspan>\n                        <\u002Fsc-if>\n                      <\u002Fsc-raw-td>\n                      <sc-raw-td style=\"text-align: center; border-bottom: 1px solid #E1DEDE; font-family: var(--mono); font-size: 10.5px; white-space: nowrap; padding: 4px 6px; color: {{ r.winTone }}; font-weight: {{ r.winWeight }}\">{{ r.window }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"text-align: center; border-bottom: 1px solid #E1DEDE; padding: 4px 6px\">\n                        <sc-if value=\"{{ r.isTask }}\">\n                          <input type=\"number\" min=\"1\" value=\"{{ r.dur }}\" sc-camel-on-change=\"{{ r.setDur }}\" aria-label=\"Duration in working days\" style=\"width: 44px; text-align: center\">\n                        <\u002Fsc-if>\n                      <\u002Fsc-raw-td>\n                      <sc-raw-td style=\"text-align: center; border-bottom: 1px solid #E1DEDE; padding: 4px 6px\">\n                        <sc-if value=\"{{ r.isSec }}\">\n                          <span style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; color: #CC000E\">{{ r.pctText }}<\u0       <\u002Fsc-if>\n                  <sc-if value=\"{{ r.isTask }}\">\n                    <div class=\"card\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-left: 3px solid {{ r.edge }}; border-radius: 3px; padding: 12px\">\n                      <div style=\"display: flex; gap: 8px\">\n                        <span style=\"font-family: var(--mono); font-size: 11px; color: #CC000E; font-weight: 700\">{{ r.wbs }}<\u002Fspan>\n                        <span style=\"font-size: 13.5px; font-weight: 600; line-height: 1.35\">{{ r.title }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"font-family: var(--mono); font-size: 10.5px; color: {{ r.winTone }}; margin: 7px 0 9px\">{{ r.window }} · {{ r.dur }} wd · <span style=\"color: #CC000E\">{{ r.clause }}<\u002Fspan>{{ r.lateNote }}<\u002Fdiv>\n                      <sc-if value=\"{{ r.auto }}\">\n                        <span style=\"display: inline-flex; align-items: center; gap: 8px\">\n                          <span style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; color: #17693A\">{{ r.pctText }}<\u002Fspan>\n                          <span style=\"font-family: var(--mono); font-size: 8.5px; letter-spacing: .1em; color: #65696C; background: #E4E2E1; border-radius: 2px; padding: 2px 5px\">AUTO<\u002Fspan>\n                          <button sc-camel-on-click=\"{{ r.takeOver }}\" style=\"font-family: var(--mono); font-size: 9.5px; padding: 4px 8px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #54585B; cursor: pointer\">EDIT<\u002Fbutton>\n                        <\u002Fspan>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ r.manual }}\">\n                        <span style=\"display: flex; align-items: center; gap: 9px\">\n                          <input type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"{{ r.pctNum }}\" sc-camel-on-change=\"{{ r.setPct }}\" aria-label=\"Percent complete\" Fbutton>\n                <button sc-camel-on-click=\"{{ exportRegX }}\" style=\"font-family: var(--mono); font-size: 10.5px; padding: 8px 11px; min-height: 34px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #2C2D2E; cursor: pointer; white-space: nowrap\">EXCEL<\u002Fbutton>\n              <\u002Fdiv>\n              <div class=\"scroller\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-radius: 3px; max-height: 72vh\">\n                <sc-raw-table style=\"width: 100%; min-width: 1000px; table-layout: fixed\">\n                  <sc-raw-thead>\n                    <sc-raw-tr>\n                      <sc-raw-th style=\"position: sticky; top: 0; z-index: 3; background: #2C2D2E; color: #fff; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; text-align: left; padding: 9px 8px\">Deliverable<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"width: 168px; position: sticky; top: 0; z-index: 3; background: #2C2D2E; color: #fff; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; text-align: left; padding: 9px 8px\">Category<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"width: 106px; position: sticky; top: 0; z-index: 3; background: #2C2D2E; color: #fff; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; padding: 9px 6px\">Obligation<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"width: 210px; position: sticky; top: 0; z-index: 3; background: #2C2D2E; color: #fff; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; text-align: left; padding: 9px 8px\">Cites<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"width: 178px; position: sticky; top: 0; z-index: 3; background: #2C2D2E; color: #fff; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; padding: 9px 6px\">Tracked as<\u002Fsc-raw
