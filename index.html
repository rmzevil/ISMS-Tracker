ggle }}\" aria-expanded=\"{{ t.ariaOpen }}\" aria-label=\"Toggle theme\" style=\"font-family: var(--mono); font-size: 11px; padding: 2px 7px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #2C2D2E; cursor: pointer\">{{ t.glyph }}<\u002Fbutton>\n                          <span style=\"font-family: var(--mono); font-size: 11px; color: #CC000E; font-weight: 700\">{{ t.g }}<\u002Fspan>\n                          <span style=\"font-size: 13px; font-weight: 700\">{{ t.name }}<\u002Fspan>\n                          <span style=\"font-family: var(--mono); font-size: 9.5px; color: #65696C\">{{ t.meta }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-raw-td>\n                    <\u002Fsc-raw-tr>\n                    <sc-for list=\"{{ t.rows }}\" as=\"c\" hint-placeholder-count=\"5\">\n                      <sc-raw-tr data-row-id=\"{{ c.id }}\" class=\"{{ c.flash }}\">\n                        <sc-raw-td style=\"border-bottom: 1px solid #E1DEDE; padding: 7px 8px; vertical-align: top\">\n                          <div style=\"font-family: var(--mono); font-size: 11px; font-weight: 700\">{{ c.id }}<\u002Fdiv>\n                          <sc-if value=\"{{ c.isNew }}\">\n                            <div style=\"font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: .07em; color: #CC000E; margin-top: 2px\">NEW 2022<\u002Fdiv>\n                          <\u002Fsc-if>\n                        <\u002Fsc-raw-td>\n                        <sc-raw-td style=\"border-bottom: 1px solid #E1DEDE; padding: 7px 8px; font-size: 12.5px; line-height: 1.4; vertical-align: top\">{{ c.title }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"border-bottom: 1px solid #E1DEDE; padding: 7px 6px; text-align: center; vertical-align: top\">\n                          <button sc-camel-on-click=\"{{ c.toggleApp }}\" aria-label=\"Toggle applicability\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .07em; padding: 4px 9px; border-radius: 2px; cursor: pointer; border: 1px solid {{ c.appEdge }}; background: {{ c.appBg }}; color: {{ c.appFg }}\">{{ c.appWord }}<\u002Fbutton>\n                        <\u002Fsc-raw-td>\n                        <sc-raw-td style=\"border-bottom: 1px solid #E1DEDE; padding: 7px 6px; text-align: center; vertical-align: top\">\n                          <sc-if value=\"{{ c.srcManual }}\">\n                            <span style=\"font-family: var(--mono); font-size: 8.5px; font-weight: 700; letter-spacing: .07em; padding: 3px 6px; border-radius: 2px; border: 1px solid #CC000E; color: #CC000E\">YOURS<\u002Fspan>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ c.srcAuto }}\">\n                            <span style=\"font-family: var(--mono); font-size: 8.5px; letter-spacing: .07em; color: {{ c.srcTone }}\">{{ c.srcLabel }}<\u002Fspan>\n                          <\u002Fsc-if>\n                        <\u002Fsc-raw-td>\n                        <sc-raw-td style=\"border-bottom: 1px solid #E1DEDE; padding: 7px 6px; text-align: center; vertical-align: top\">\n                          <sc-if value=\"{{ c.app }}\">\n                            <sc-raw-select value=\"{{ c.status }}\" sc-camel-on-change=\"{{ c.setStatus }}\" aria-label=\"Control status\" style=\"font-family: var(--mono); font-size: 10.5px; width: 100%; border-left: 3px solid {{ c.statusTone }}\">\n                              <sc-for list=\"{{ c.statuses }}\" as=\"o\" hint-placeholder-count=\"3\">\n                                <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                              <\u002Fsc-for>\n                            <\u002Fsc-raw-select>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ c.excluded }}\">\n                            <span title=\"Implementation status does not apply to a control outside the SoA\" style=\"font-family: var(--mono); font-size: 13px; color: #65696C\">—<\u002Fspan>\n                          <\u002Fsc-if>\n                        <\u002Fsc-raw-td>\n                        <sc-raw-td style=\"border-bottom: 1px solid #E1DEDE; padding: 7px 8px; vertical-align: top\">\n                          <sc-if value=\"{{ c.app }}\">\n                            <input type=\"text\" value=\"{{ c.owner }}\" sc-camel-on-change=\"{{ c.setOwner }}\" placeholder=\"required by A.5.2\" aria-label=\"Control owner\" style=\"width: 100%; border-color: {{ c.ownerEdge }}; background: {{ c.ownerBg }}\">\n                          <\u002Fsc-if>\n                        <\u002Fsc-raw-td>\n                        <sc-raw-td style=\"border-bottom: 1px solid #E1DEDE; padding: 7px 8px; vertical-align: top\">\n                          <textarea value=\"{{ c.why }}\" sc-camel-on-change=\"{{ c.setWhy }}\" rows=\"2\" placeholder=\"why this control is included or excluded\" aria-label=\"Justification\" style=\"width: 100%; resize: vertical; line-height: 1.5; font-size: 11px\"><\u002Ftextarea>\n                          <div style=\"display: flex; gap: 6px; align-items: center; margin-top: 4px\">\n                            <sc-if value=\"{{ c.whyManual }}\">\n                              <span style=\"font-family: var(--mono); font-size: 8.5px; font-weight: 700; letter-spacing: .07em; padding: 2px 5px; border-radius: 2px; border: 1px solid #CC000E; color: #CC000E\">YOURS<\u002Fspan>\n                            <\u002Fsc-if>\n                            <sc-if value=\"{{ c.canCite }}\">\n                              <button sc-camel-on-click=\"{{ c.cite }}\" title=\"Write the 6.1.3 d) justification from whatever decided this control\" style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .06em; padding: 3px 7px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #54585B; cursor: pointer\">CITE<\u002Fbutton>\n                            <\u002Fsc-if>\n                            <sc-if value=\"{{ c.whyMissing }}\">\n                              <span style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; color: #B6000C\">gate 6.1.3 d)<\u002Fspan>\n                            <\u002Fsc-if>\n                          <\u002Fdiv>\n                        <\u002Fsc-raw-td>\n                        <sc-raw-td style=\"border-bottom: 1px solid #E1DEDE; padding: 7px 6px; vertical-align: top\">\n                          <sc-if value=\"{{ c.hasLinks }}\">\n                            <span style=\"display: flex; gap: 4px; flex-wrap: wrap; justify-content: center\">\n                              <sc-for list=\"{{ c.riskChips }}\" as=\"r\" hint-placeholder-count=\"1\">\n                                <button sc-camel-on-click=\"{{ r.go }}\" title=\"Open this risk\" style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; padding: 3px 6px; border: 1px solid #CC000E; border-radius: 2px; background: #fff; color: #CC000E; cursor: pointer\">{{ r.id }}<\u002Fbutton>\n                              <\u002Fsc-for>\n                              <sc-for list=\"{{ c.docChips }}\" as=\"d\" hint-placeholder-count=\"1\">\n                                <button sc-camel-on-click=\"{{ d.go }}\" title=\"Open in the document register\" style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; padding: 3px 6px; border: 1px solid {{ d.tone }}; border-radius: 2px; background: #fff; color: {{ d.tone }}; cursor: pointer\">{{ d.id }}<\u002Fbutton>\n                              <\u002Fsc-for>\n                            <\u002Fspan>\n                          <\u002Fsc-if>\n                        <\u002Fsc-raw-td>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-for>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isSoaMobile }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 8px\">\n              <sc-for list=\"{{ soaThemes }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <div>\n                  <div style=\"background: #2C2D2E; color: #fff; padding: 9px 12px; border-radius: 3px; display: flex; align-items: center; gap: 9px; margin-top: 6px\">\n                    <button sc-camel-on-click=\"{{ t.toggle }}\" aria-expanded=\"{{ t.ariaOpen }}\" aria-label=\"Toggle theme\" style=\"font-family: var(--mono); font-size: 11px; padding: 2px 8px; border: 1px solid #54585B; border-radius: 2px; background: transparent; color: #fff; cursor: pointer\">{{ t.glyph }}<\u002Fbutton>\n                    <span style=\"font-family: var(--mono); font-size: 11px; opacity: .65\">{{ t.g }}<\u002Fspan>\n                    <span style=\"flex: 1; font-weight: 700; font-size: 13px\">{{ t.name }}<\u002Fspan>\n                    <span style=\"font-family: var(--mono); font-size: 9.5px; opacity: .72\">{{ t.meta }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ t.rows }}\" as=\"c\" hint-placeholder-count=\"4\">\n                    <div data-row-id=\"{{ c.id }}\" class=\"card {{ c.flash }}\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-left: 3px solid {{ c.statusTone }}; border-radius: 3px; padding: 12px; margin-top: 8px\">\n                      <div style=\"display: flex; gap: 8px; align-items: center; margin-bottom: 5px\">\n                        <span style=\"font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: #CC000E\">{{ c.id }}<\u002Fspan>\n                        <sc-if value=\"{{ c.isNew }}\">\n                          <span style=\"font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: .07em; color: #CC000E; border: 1px solid #CC000E; border-radius: 2px; padding: 1px 4px\">NEW 2022<\u002Fspan>\n                        <\u002Fsc-if>\n                        <span style=\"flex: 1\"><\u002Fspan>\n                        <button sc-camel-on-click=\"{{ c.toggleApp }}\" aria-label=\"Toggle applicability\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .07em; padding: 7px 12px; min-height: 34px; border-radius: 2px; cursor: pointer; border: 1px solid {{ c.appEdge }}; background: {{ c.appBg }}; color: {{ c.appFg }}\">{{ c.appWord }}<\u002Fbutton>\n                      <\u002Fdiv>\n                      <div style=\"font-size: 13px; font-weight: 600; line-height: 1.35\">{{ c.title }}<\u002Fdiv>\n                      <div style=\"font-family: var(--mono); font-size: 9px; letter-spacing: .07em; color: {{ c.srcTone }}; margin: 4px 0 9px\">{{ c.srcLabel }}<\u002Fdiv>\n                      <div style=\"display: grid; gap: 7px\">\n                        <sc-if value=\"{{ c.app }}\">\n                          <sc-raw-select value=\"{{ c.status }}\" sc-camel-on-change=\"{{ c.setStatus }}\" aria-label=\"Control status\" style=\"font-family: var(--mono); font-size: 11px; width: 100%; min-height: 44px; border-left: 3px solid {{ c.statusTone }}\">\n                            <sc-for list=\"{{ c.statuses }}\" as=\"o\" hint-placeholder-count=\"3\">\n                              <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                            <\u002Fsc-for>\n                          <\u002Fsc-raw-select>\n                          <input type=\"text\" value=\"{{ c.owner }}\" sc-camel-on-change=\"{{ c.setOwner }}\" placeholder=\"control owner — required by A.5.2\" aria-label=\"Control owner\" style=\"width: 100%; min-height: 44px; border-color: {{ c.ownerEdge }}; background: {{ c.ownerBg }}\">\n                        <\u002Fsc-if>\n                        <textarea value=\"{{ c.why }}\" sc-camel-on-change=\"{{ c.setWhy }}\" rows=\"3\" placeholder=\"why this control is included or excluded\" aria-label=\"Justification\" style=\"width: 100%; resize: vertical; line-height: 1.55\"><\u002Ftextarea>\n                        <div style=\"display: flex; gap: 7px; align-items: center; flex-wrap: wrap\">\n                          <sc-if value=\"{{ c.whyManual }}\">\n                            <span style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .07em; padding: 3px 6px; border-radius: 2px; border: 1px solid #CC000E; color: #CC000E\">YOURS<\u002Fspan>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ c.canCite }}\">\n                            <button sc-camel-on-click=\"{{ c.cite }}\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #54585B; cursor: pointer\">CITE<\u002Fbutton>\n                          <\u002Fsc-if>\n                          <sc-for list=\"{{ c.riskChips }}\" as=\"r\" hint-placeholder-count=\"1\">\n                            <button sc-camel-on-click=\"{{ r.go }}\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 9px 12px; min-height: 38px; border: 1px solid #CC000E; border-radius: 2px; background: #fff; color: #CC000E; cursor: pointer\">{{ r.id }}<\u002Fbutton>\n                          <\u002Fsc-for>\n                          <sc-for list=\"{{ c.docChips }}\" as=\"d\" hint-placeholder-count=\"1\">\n                            <button sc-camel-on-click=\"{{ d.go }}\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 9px 12px; min-height: 38px; border: 1px solid {{ d.tone }}; border-radius: 2px; background: #fff; color: {{ d.tone }}; cursor: pointer\">{{ d.id }}<\u002Fbutton>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <p style=\"font-size: 11px; color: #65696C; margin-top: 12px; max-width: 900px; line-height: 1.65\">Applicability is decided, never defaulted, in strict precedence: a risk citing the control wins, then the organisation profile, then a covering document, then the baseline ISMS set. <b>Decided by<\u002Fb> names which of those settled it. Override the decision and it becomes <b>YOURS<\u002Fb> — the engine stops writing that row, and that provenance is what an auditor asks for under 6.1.3 d).<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isStub }}\">\n        <div style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-left: 3px solid #C4C1C1; padding: 16px 18px; border-radius: 3px; max-width: 720px\">\n          <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: #65696C\">Not ported yet<\u002Fdiv>\n          <p style=\"margin: 8px 0 10px; font-size: 12.5px; line-height: 1.7; color: #54585B\">{{ stubNote }}<\u002Fp>\n          <div style=\"font-family: var(--mono); font-size: 10.5px; color: #2C2D2E; background: #E4E2E1; border-radius: 2px; padding: 8px 10px; display: inline-block\">{{ stubCount }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fmain>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isSettings }}\">\n        <div style=\"position: fixed; inset: 0; z-index: 60; background: rgba(44,45,46,.5); display: flex; align-items: center; justify-content: center; padding: 72px 16px 20px\">\n        <div class=\"pane\" role=\"dialog\" aria-label=\"Settings\" style=\"background: #EFEDED; border: 1px solid #C4C1C1; border-radius: 4px; width: 100%; max-width: 920px; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 22px 60px rgba(44,45,46,.3)\">\n        <div data-set-head=\"\" style=\"flex-shrink: 0; background: #EFEDED; border-bottom: 1px solid #C4C1C1; border-radius: 4px 4px 0 0; padding: 16px 18px 12px\">\n          <div style=\"display: flex; justify-content: flex-end\">\n            <button sc-camel-on-click=\"{{ closeSettings }}\" aria-label=\"Close settings\" style=\"display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 9px 15px; min-height: 40px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #2C2D2E; cursor: pointer\" style-hover=\"border-color: #CC000E; color: #CC000E\"><span aria-hidden=\"true\">✕<\u002Fspan>CLOSE<\u002Fbutton>\n          <\u002Fdiv>\n          <h2 style=\"margin: 6px 0 0; font-size: 21px; font-weight: 700; letter-spacing: -.015em\">Settings<\u002Fh2>\n          <p style=\"margin: 5px 0 0; font-size: 13px; color: #54585B; line-height: 1.6\">Profile, organisation document, keys, vault and backups.<\u002Fp>\n          <div class=\"scroller\" style=\"display: flex; gap: 6px; margin-top: 12px; padding-bottom: 3px; overflow-x: auto\">\n            <sc-for list=\"{{ setNav }}\" as=\"s\" hint-placeholder-count=\"8\">\n              <button sc-camel-on-click=\"{{ s.go }}\" style=\"flex-shrink: 0; font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 7px 10px; min-height: 32px; border: 1px solid #E1DEDE; border-radius: 2px; background: #FFFFFF; color: #54585B; cursor: pointer; white-space: nowrap\" style-hover=\"border-color: #CC000E; color: #CC000E\">{{ s.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- minmax(0,1fr) caps the column at the panel width. An implicit grid\n             column is min-content-floored, so one wide child (a table, a long\n             key) pushed the whole panel sideways. -->\n        <div class=\"scroller\" data-set-body=\"\" tabindex=\"0\" style=\"flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 16px 18px 18px\">\n          <section id=\"set-project\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">This project<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: #54585B; line-height: 1.6\">Used on every generated document and as the anchor date for the plan.<\u002Fp>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 11px\">\n              <label style=\"display: block\">\n                <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: #65696C; margin-bottom: 4px\">Organisation<\u002Fspan>\n                <input type=\"text\" value=\"{{ company }}\" sc-camel-on-change=\"{{ setCompany }}\" placeholder=\"the legal entity being certified\" aria-label=\"Organisation\" style=\"width: 100%; min-height: 38px\">\n              <\u002Flabel>\n              <label style=\"display: block\">\n                <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: #65696C; margin-bottom: 4px\">Project start<\u002Fspan>\n                <input type=\"date\" value=\"{{ startDate }}\" sc-camel-on-change=\"{{ setStart }}\" aria-label=\"Project start date\" style=\"width: 100%; min-height: 38px\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <label style=\"display: block; margin-top: 11px\">\n              <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: #65696C; margin-bottom: 4px\">ISMS scope · clause 4.3<\u002Fspan>\n              <textarea value=\"{{ scope }}\" sc-camel-on-change=\"{{ setScope }}\" rows=\"3\" placeholder=\"what the ISMS covers, and what it deliberately excludes\" aria-label=\"ISMS scope\" style=\"width: 100%; resize: vertical; line-height: 1.6\"><\u002Ftextarea>\n            <\u002Flabel>\n          <\u002Fsection>\n\n          <section id=\"set-profile\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Organisation profile<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: #54585B; line-height: 1.6; max-width: 660px; text-wrap: pretty\">These seven answers decide which Annex A controls the engine proposes. A control you have overridden by hand is never touched by a change here.<\u002Fp>\n            <sc-for list=\"{{ profileQs }}\" as=\"p\" hint-placeholder-count=\"7\">\n              <div style=\"display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-bottom: 1px solid #E1DEDE\">\n                <span style=\"flex: 1\">\n                  <span style=\"display: block; font-size: 13px; font-weight: 600; line-height: 1.45\">{{ p.q }}<\u002Fspan>\n                  <sc-if value=\"{{ p.hasHint }}\">\n                    <span style=\"display: block; font-size: 11.5px; color: #65696C; line-height: 1.55; margin-top: 3px\">{{ p.hint }}<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fspan>\n                <span style=\"display: flex; border: 1px solid #C4C1C1; border-radius: 2px; overflow: hidden; flex-shrink: 0\">\n                  <button sc-camel-on-click=\"{{ p.setYes }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; padding: 8px 13px; min-height: 36px; border: none; cursor: pointer; background: {{ p.yesBg }}; color: {{ p.yesFg }}\">YES<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ p.setNo }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; padding: 8px 13px; min-height: 36px; border: none; cursor: pointer; background: {{ p.noBg }}; color: {{ p.noFg }}\">NO<\u002Fbutton>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n\n          <section id=\"set-overrides\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Decisions you have taken over<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: #54585B; line-height: 1.6; max-width: 660px; text-wrap: pretty\">Every row here is a place you overruled the engine. It stops deriving that field, which is exactly what you want for a judgement you own — and worth reviewing when the profile or the risk register moves on. Handing one back does not delete anything you typed.<\u002Fp>\n            <sc-if value=\"{{ hasOverrides }}\">\n              <div>\n                <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 9px\">\n                  <span style=\"font-family: var(--mono); font-size: 11px; font-weight: 700; color: #CC000E\">{{ overrideCount }} overridden<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ handBackAll }}\" style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .06em; padding: 7px 11px; min-height: 34px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #54585B; cursor: pointer\">HAND ALL BACK<\u002Fbutton>\n                <\u002Fdiv>\n                <sc-for list=\"{{ overrides }}\" as=\"o\" hint-placeholder-count=\"3\">\n                  <div style=\"display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #E1DEDE\">\n                    <span style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .07em; padding: 3px 6px; border-radius: 2px; border: 1px solid #CC000E; color: #CC000E; flex-shrink: 0\">{{ o.kind }}<\u002Fspan>\n                    <span style=\"flex: 1; font-size: 12.5px\">{{ o.what }}<\u002Fspan>\n                    <button sc-camel-on-click=\"{{ o.hand }}\" title=\"Let the engine derive this again\" style=\"font-family: var(--mono); font-size: 9.5px; padding: 6px 10px; min-height: 32px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #54585B; cursor: pointer; flex-shrink: 0\">HAND BACK<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noOverrides }}\">\n              <p style=\"margin: 0; font-size: 12.5px; color: #65696C\">Nothing overridden yet. Every status on screen is derived.<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fsection>\n\n          <section id=\"set-data\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">This browser's data<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: #54585B; line-height: 1.6; max-width: 660px; text-wrap: pretty\">Everything lives in this browser and goes nowhere else. A backup is the only copy that survives clearing site data.<\u002Fp>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n              <button sc-camel-on-click=\"{{ backup }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: #2C2D2E; color: #fff; cursor: pointer\">DOWNLOAD BACKUP<\u002Fbutton>\n              <label style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; display: flex; align-items: center; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #2C2D2E; cursor: pointer\">RESTORE BACKUP<input type=\"file\" accept=\"application/json\" sc-camel-on-change=\"{{ restore }}\" aria-label=\"Restore a backup\" style=\"display: none\"><\u002Flabel>\n              <button sc-camel-on-click=\"{{ newProject }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid #B6000C; border-radius: 2px; background: #fff; color: #B6000C; cursor: pointer\">START A NEW PROJECT<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"set-import\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Read your organisation's own document<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: #54585B; line-height: 1.6; max-width: 680px; text-wrap: pretty\">Upload a company profile, prospectus or intranet page — HTML, PDF, text or Markdown — and it will be read for the things clauses 4.1 to 4.3 ask for: external and internal issues, interested parties, locations, systems, and what belongs inside the scope. Nothing is written until you have seen it and ticked what to keep.<\u002Fp>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n              <label style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; display: flex; align-items: center; border: none; border-radius: 2px; background: #CC000E; color: #fff; cursor: pointer\">UPLOAD A DOCUMENT<input type=\"file\" accept=\".html,.htm,.pdf,.txt,.md,.json,text/html,application/pdf,text/plain\" sc-camel-on-change=\"{{ pickDoc }}\" aria-label=\"Upload an organisation document\" style=\"display: none\"><\u002Flabel>\n              <sc-if value=\"{{ isImpBusy }}\">\n                <span class=\"busy\" style=\"font-family: var(--mono); font-size: 10.5px; padding: 8px 12px; border-radius: 2px; color: #54585B\">{{ impBusy }}…<\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ hasImpSrc }}\">\n                <span style=\"font-family: var(--mono); font-size: 10px; color: #65696C\">{{ impSrc }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <details style=\"margin-top: 11px\">\n              <summary style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: #65696C; cursor: pointer\">Or paste the relevant sections<\u002Fsummary>\n              <textarea value=\"{{ pasteVal }}\" sc-camel-on-change=\"{{ pasteDoc }}\" rows=\"5\" placeholder=\"Paste the parts of the document that describe the organisation, its market, its sites and its systems.\" aria-label=\"Paste organisation text\" style=\"width: 100%; resize: vertical; margin-top: 8px; line-height: 1.6\"><\u002Ftextarea>\n              <button sc-camel-on-click=\"{{ readPaste }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; margin-top: 7px; padding: 9px 13px; min-height: 38px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #2C2D2E; cursor: pointer\">READ THIS TEXT<\u002Fbutton>\n            <\u002Fdetails>\n            <sc-if value=\"{{ hasImpErr }}\">\n              <div style=\"margin-top: 11px; background: #FBEEDC; border-left: 3px solid #8A5A00; border-radius: 2px; padding: 10px 12px; font-size: 12px; line-height: 1.6\">{{ impErr }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasFound }}\">\n              <div style=\"margin-top: 13px; border-top: 1px solid #E1DEDE; padding-top: 13px\">\n                <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: #65696C; margin-bottom: 9px\">What it found — untick anything you do not want<\u002Fdiv>\n                <sc-for list=\"{{ foundRows }}\" as=\"g\" hint-placeholder-count=\"5\">\n                  <div style=\"border: 1px solid #E1DEDE; border-radius: 2px; padding: 10px 11px; margin-bottom: 8px\">\n                    <div style=\"display: flex; align-items: center; gap: 9px; margin-bottom: 6px\">\n                      <button sc-camel-on-click=\"{{ g.toggle }}\" aria-pressed=\"{{ g.on }}\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 5px 10px; min-height: 30px; border: 1px solid #C4C1C1; border-radius: 2px; background: {{ g.bg }}; color: {{ g.fg }}; cursor: pointer\">KEEP<\u002Fbutton>\n                      <span style=\"font-size: 12.5px; font-weight: 600; flex: 1\">{{ g.label }}<\u002Fspan>\n                      <span style=\"font-family: var(--mono); font-size: 10px; color: #65696C\">{{ g.count }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                      <div style=\"font-size: 11.5px; color: #54585B; line-height: 1.55; padding: 2px 0 2px 11px; border-left: 2px solid #E1DEDE\">{{ it.t }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ g.hasMore }}\">\n                      <div style=\"font-family: var(--mono); font-size: 10px; color: #65696C; margin-top: 4px; padding-left: 11px\">{{ g.more }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px\">\n                  <button sc-camel-on-click=\"{{ applyFound }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: #17693A; color: #fff; cursor: pointer\">APPLY WHAT IS TICKED<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ discardFound }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #54585B; cursor: pointer\">DISCARD<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n\n          <section id=\"set-vault\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Vault — encrypt this browser's copy<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: #54585B; line-height: 1.6; max-width: 680px; text-wrap: pretty\">A passphrase derives an AES-GCM key, and everything written to browser storage goes through it. The key is held in memory only. <b>Forgetting the passphrase loses the project<\u002Fb> — there is no recovery path, so keep a downloaded backup somewhere you trust.<\u002Fp>\n            <sc-if value=\"{{ hasVault }}\">\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n                <span style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: #17693A\">VAULT ON — storage holds ciphertext<\u002Fspan>\n                <span style=\"flex: 1\"><\u002Fspan>\n                <button sc-camel-on-click=\"{{ lockNow }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: #2C2D2E; color: #fff; cursor: pointer\">LOCK NOW<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ vaultOff }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid #B6000C; border-radius: 2px; background: #fff; color: #B6000C; cursor: pointer\">TURN OFF<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noVault }}\">\n              <div style=\"display: grid; gap: 9px; max-width: 460px\">\n                <input type=\"password\" value=\"{{ vaultPass }}\" sc-camel-on-change=\"{{ setVaultPass }}\" placeholder=\"Passphrase — at least 10 characters\" aria-label=\"New passphrase\" style=\"width: 100%; min-height: 38px\">\n                <input type=\"password\" value=\"{{ vaultPass2 }}\" sc-camel-on-change=\"{{ setVaultPass2 }}\" placeholder=\"Repeat the passphrase\" aria-label=\"Repeat passphrase\" style=\"width: 100%; min-height: 38px\">\n                <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n                  <button sc-camel-on-click=\"{{ genTotp }}\" style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .06em; padding: 9px 12px; min-height: 36px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #2C2D2E; cursor: pointer\">ADD AN AUTHENTICATOR<\u002Fbutton>\n                  <sc-if value=\"{{ hasTotp }}\">\n                    <span style=\"font-family: var(--mono); font-size: 10px; color: #17693A\">secret generated — add it below, then enter a code<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <sc-if value=\"{{ hasTotp }}\">\n                  <div style=\"background: #F7F6F6; border: 1px solid #E1DEDE; border-radius: 2px; padding: 10px 12px\">\n                    <div style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: #65696C; margin-bottom: 5px\">Add this secret to your authenticator<\u002Fdiv>\n                    <div style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; word-break: break-all; color: #2C2D2E\">{{ vaultTotp }}<\u002Fdiv>\n                    <input type=\"text\" value=\"{{ vaultCode }}\" sc-camel-on-change=\"{{ setVaultCode }}\" placeholder=\"Then enter the 6-digit code\" aria-label=\"Authenticator code\" inputmode=\"numeric\" style=\"width: 100%; margin-top: 9px; min-height: 38px\">\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <button sc-camel-on-click=\"{{ turnVaultOn }}\" disabled=\"{{ vaultBusy }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 10px 13px; min-height: 40px; border: none; border-radius: 2px; background: #CC000E; color: #fff; cursor: pointer\">TURN THE VAULT ON<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasVaultErr }}\">\n              <div style=\"margin-top: 11px; background: #FBE3E4; border-left: 3px solid #B6000C; border-radius: 2px; padding: 10px 12px; font-size: 12px; line-height: 1.55\">{{ vaultErr }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n\n          <section id=\"set-key\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">AI assistance API<\u002Fh2>\n            <p style=\"margin: 0 0 11px; font-size: 12px; color: #54585B; line-height: 1.6; max-width: 680px; text-wrap: pretty\">Optional. Without a key, reading a document uses the built-in model. With one, calls go straight from this browser to Anthropic and the key is stored only here.<\u002Fp>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n              <input type=\"password\" value=\"{{ aiKey }}\" sc-camel-on-change=\"{{ setAiKey }}\" placeholder=\"sk-ant-…\" aria-label=\"Anthropic API key\" style=\"flex: 1; min-width: 220px; min-height: 38px; font-family: var(--mono)\">\n              <button sc-camel-on-click=\"{{ clearAiKey }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #54585B; cursor: pointer\">CLEAR<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-family: var(--mono); font-size: 10px; margin-top: 7px; color: {{ keyTone }}\">{{ keyState }}<\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"set-sync\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Cloud sync<\u002Fh2>\n            <p style=\"margin: 0 0 11px; font-size: 12px; color: #54585B; line-height: 1.6; max-width: 680px; text-wrap: pretty\">Pushes the project to a private bin on your own jsonbin account, so you can carry it between machines. Attachments stay here — they live under a separate key and are never part of the payload.<\u002Fp>\n            <div style=\"font-family: var(--mono); font-size: 10.5px; margin-bottom: 11px; color: {{ syncWarnTone }}\">{{ syncWarn }}<\u002Fdiv>\n            <div style=\"display: grid; gap: 9px; max-width: 520px\">\n              <input type=\"password\" value=\"{{ jbKey }}\" sc-camel-on-change=\"{{ setJbKey }}\" placeholder=\"jsonbin master key\" aria-label=\"jsonbin master key\" style=\"width: 100%; min-height: 38px; font-family: var(--mono)\">\n              <input type=\"text\" value=\"{{ jbId }}\" sc-camel-on-change=\"{{ setJbId }}\" placeholder=\"bin id — left empty, a push creates one\" aria-label=\"jsonbin bin id\" style=\"width: 100%; min-height: 38px; font-family: var(--mono)\">\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n                <button sc-camel-on-click=\"{{ doPush }}\" disabled=\"{{ syncBusy }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: #2C2D2E; color: #fff; cursor: pointer\">PUSH<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ doPull }}\" disabled=\"{{ syncBusy }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #2C2D2E; cursor: pointer\">PULL<\u002Fbutton>\n                <span style=\"font-family: var(--mono); font-size: 10px; color: #65696C\">{{ lastSync }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u0  .13em; text-transform: uppercase; color: #65696C\">Deliverable mind map<\u002Fspan>\n                    <label style=\"display: flex; align-items: center; gap: 7px\">\n                      <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: #65696C\">Zoom<\u002Fspan>\n                      <input type=\"range\" min=\"0.4\" max=\"1.6\" step=\"0.1\" value=\"{{ mapZoom }}\" sc-camel-on-change=\"{{ setMapZoom }}\" aria-label=\"Map zoom\" style=\"width: 120px\">\n                    <\u002Flabel>\n                    <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: #65696C\">{{ mapCounts }}<\u002Fspan>\n                    <span style=\"flex: 1\"><\u002Fspan>\n                    <span style=\"display: flex; gap: 13px; flex-wrap: wrap\">\n                      <span style=\"display: flex; align-items: center; gap: 6px; font-size: 11px; color: #54585B\"><span style=\"width: 11px; height: 11px; border-radius: 2px; background: #E4F0E8; border: 1px solid #17693A\"><\u002Fspan>approved<\u002Fspan>\n                      <span style=\"display: flex; align-items: center; gap: 6px; font-size: 11px; color: #54585B\"><span style=\"width: 11px; height: 11px; border-radius: 2px; background: #fff; border: 1px solid #8A5A00\"><\u002Fspan>tracked<\u002Fspan>\n                      <span style=\"display: flex; align-items: center; gap: 6px; font-size: 11px; color: #54585B\"><span style=\"width: 11px; height: 11px; border-radius: 2px; background: #fff; border: 1px solid #C4C1C1\"><\u002Fspan>not tracked<\u002Fspan>\n                    <\u002Fspan>\n                    <button sc-camel-on-click=\"{{ closeMap }}\" aria-label=\"Close the mind map\" style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 7px 12px; min-height: 34px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #2C2D2E; cursor: pointer\">✕<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div class=\"scroller\" style=\"flex: 1; padding: 14px; min-height: 0\">\n                    <div style=\"width: {{ frameW }}; height: {{ frameH }}\">\n                      <div style=\"position: relative; width: {{ innerW }}; height: {{ innerH }}; transform: {{ scale }}; transform-origin: 0 0\">\n                        <svg sc-camel-view-box=\"{{ viewBox }}\" role=\"presentation\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible\">\n                          <g stroke=\"#C4C1C1\" stroke-width=\"1\" fill=\"none\">\n                            <sc-for list=\"{{ links }}\" as=\"l\" hint-placeholder-count=\"20\">\n                              <path d=\"{{ l.d }}\"><\u002Fpath>\n                            <\u002Fsc-for>\n                          <\u002Fg>\n                        <\u002Fsvg>\n                        <div style=\"position: absolute; left: {{ spineLeft }}; top: {{ spineTop }}; width: 184px; height: 30px; border-radius: 3px; background: #CC000E; color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 12px; font-weight: 800; letter-spacing: .04em\">ISO 27001 ISMS<\u002Fdiv>\n                        <sc-for list=\"{{ nodes }}\" as=\"n\" hint-placeholder-count=\"30\">\n                          <div title=\"{{ n.t }}\" style=\"position: absolute; left: {{ n.left }}; top: {{ n.top }}; width: {{ n.wpx }}; min-height: {{ n.hpx }}; box-sizing: border-box; display: flex; align-items: center; justify-content: {{ n.centre }}; padding: 3px 6px; border-radius: 3px; background: {{ n.fill }}; border: 1px solid {{ n.stroke }}; color: {{ n.fg }}; font-size: {{ n.fs }}; font-weight: {{ n.fw }}; line-height: 1.2; overflow: hidden; text-wrap: pretty\">{{ n.t }}<\u002Fdiv>\n                        <\u002Fsc-for>\n                        <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"12\">\n                          <button sc-camel-on-click=\"{{ c.go }}\" title=\"{{ c.title }}\" style=\"position: absolute; left: {{ c.left }}; top: {{ c.top }}; width: {{ c.wpx }}; min-height: {{ c.hpx }}; box-sizing: border-box; display: flex; align-items: center; text-align: left; padding: 3px 6px; border-radius: 3px; background: {{ c.fill }}; border: 1px solid {{ c.stroke }}; color: {{ c.fg }}; font-family: var(--sans); font-size: {{ c.fs }}; line-height: 1.2; cursor: pointer; overflow: hidden\" style-hover=\"border-color: #CC000E\">{{ c.t }}<\u002Fbutton>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;startTab&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Overview&quot;, &quot;Plan&quot;, &quot;Documents&quot;, &quot;Clauses 4–10&quot;, &quot;Risk register&quot;, &quot;Annex A / SoA&quot;], &quot;default&quot;: &quot;Overview&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Behaviour&quot; },\n  &quot;dataSource&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Saved tracker&quot;, &quot;Seed example&quot;], &quot;default&quot;: &quot;Saved tracker&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Behaviour&quot; },\n  &quot;sidebarOpen&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behaviour&quot; }\n}\">\nconst NAV = [\n  { n: \"Overview\", hint: \"Where you stand\", part: \"\", note: \"Where you stand. Every number here is derived from the other tabs — nothing on this page is editable. An auditor opens with: are you ready, and what is still open?\" },\n  { n: \"Plan\", hint: \"Part 1 · 12-step workbook\", part: \"Course part 1\", note: \"The implementation plan, dated from one project start. Completion is derived from what each task actually produces — the clause it records and the documents its own title matches — never from its position in the list.\" },\n  { n: \"Documents\", hint: \"Part 2-9 · build order\", part: \"Course parts 2–9\", note: \"The documented information required by clause 7.5, in the order the course builds it. Obligation is read from the catalogue: only the standard's own documented-information list counts as mandatory.\" },\n  { n: \"Clauses 4–10\", hint: \"Part 4 · gap assessment\", part: \"Course part 4\", note: \"The gap assessment. Every sub-clause with its shall text, grouped by clause. Conformity is derived from status, evidence and the linked documents; Verified stays your judgement under clause 9.2.\" },\n  { n: \"Risk register\", hint: \"Part 6 · 6.1.2 / 6.1.3\", part: \"Course part 6\", note: \"Risk assessment and treatment. Likelihood × impact, where impact is averaged from four factors; residual is derived from the controls you have actually implemented, so it cannot be talked down.\" },\n  { n: \"Annex A / SoA\", hint: \"Part 7 · 93 controls\", part: \"Course part 7\", note: \"The Statement of Applicability. 93 controls in four themes. Applicability is decided in strict precedence and never defaulted; an auditor asks who decided and why, so the decision's source is on every row.\" },\n];\n\nconst STUB = {\n  1: [\"The Gantt, the 25 WBS tasks and the derived completion column land in the next phase.\", \"25 tasks · 5 sections\"],\n  2: [\"The 36-document register, the obligation legend and the DocBuilder wizard land in a later phase.\", \"36 documents · 158 questions\"],\n  3: [\"All 30 sub-clauses with their shall text and derived conformity land in a later phase.\", \"30 sub-clauses\"],\n  4: [\"The dual-view register, the five-point scales, the four impact factors and the heat map land in a later phase.\", \"5×5 heat map · PESTEL\"],\n  5: [\"The 93 controls, the applicability precedence engine and the SoA justifications land in a later phase.\", \"93 controls · 4 themes\"],\n};\n\nclass Component extends DCLogic {\n  state = { tab: 0, navOpen: true, core: null, st: null, encrypted: false, mobile: false,\n    gran: \"week\", zoom: 30, closed: {}, saved: 0,\n    docQ: \"\", docCat: \"All\", docClosed: {}, docNote: \"\", files: {},\n    clQ: \"\", clClosed: {},\n    riskQ: \"\", riskOpen: null, heat: \"inherent\", wiz: false, mAns: {}, aAns: {},\n    dragStep: null, overStep: null, legendOpen: false, heatOpen: false, numbersOpen: false, heatSel: null,\n    guideOpen: false, showDone: false, flash: null, stepNote: \"\",\n    settingsOpen: false, cfg: null, locked: false, hasVault: false, vaultTotp: \"\", imp: { busy: \"\", err: \"\", src: null, found: null, pick: {} },\n    buildId: null, previewOpen: false,\n    docView: \"phases\", regQ: \"\", regCat: \"All\", regClosed: {}, mapZoom: 1, mapOpen: false,\n    vaultPass: \"\", vaultPass2: \"\", vaultCode: \"\", vaultErr: \"\", vaultBusy: false,\n    syncMsg: \"\", syncBusy: false,\n    aiOpen: false, aiQ: \"\", aiA: \"\", aiBusy: false, aiSel: \"\",\n    soaQ: \"\", soaFilter: \"All\", soaClosed: {} };\n\n  /* Every write goes through here: clone, mutate, re-derive to a fixed point, persist.\n     Nothing is written while the vault is locked or while showing the seed. */\n  up(fn) {\n    const core = this.state.core;\n    const w = core.deepClone(this.state.st);\n    fn(w);\n    const next = this.propagate(core, w);\n    this.setState({ st: next }, () => this.persist(next));\n  }\n\n  upMan(kind, id, fn) {\n    this.up(s => { s.manual = { ...(s.manual || {}), [`${kind}:${id}`]: true }; fn(s); });\n  }\n\n  /* Settings are not project data: they never enter the tracker state object,\n     so a cloud push or an exported backup cannot carry the API key. */\n  upCfg(patch) {\n    const cfg = { ...(this.state.cfg || {}), ...patch };\n    this.setState({ cfg });\n    if (this.state.encrypted) return;\n    if ((this.props.dataSource || \"Saved tracker\") !== \"Saved tracker\") return;\n    try { localStorage.setItem(this.state.core.SKEY, JSON.stringify(cfg)); } catch (e) { /* quota */ }\n  }\n\n  persist(st) {\n    if (this.state.encrypted) return;\n    if ((this.props.dataSource || \"Saved tracker\") !== \"Saved tracker\") return;\n    clearTimeout(this.saveT);\n    this.saveT = setTimeout(async () => {\n      try {\n        const { KEY, seal } = this.state.core;\n        const body = this.vaultKey\n          ? JSON.stringify({ __enc: true, ...(await seal(this.vaultKey, st)) })\n          : JSON.stringify(st);\n        localStorage.setItem(KEY, body);\n        this.setState({ saved: Date.now() });\n      } catch (e) { /* quota or private mode — the session keeps working */ }\n    }, 350);\n  }\n\n  componentDidMount() {\n    this.annexaOn = (e) => this.annexaFollow(e.clientX, e.clientY);\n    window.addEventListener(\"mousemove\", this.annexaOn, { passive: true });\n    /* Escape closes whichever overlay is on top. One handler covers all five —\n       a modal that traps you until you find its ✕ is the wrong kind of modal. */\n    this.escOn = (e) => {\n      if (e.key !== \"Escape\") return;\n      const s = this.state;\n      if (s.mapOpen) this.setState({ mapOpen: false });\n      else if (s.heatOpen) this.setState({ heatOpen: false, heatSel: null });\n      else if (s.buildId) this.setState({ buildId: null });\n      else if (s.settingsOpen) this.setState({ settingsOpen: false });\n      else if (s.aiOpen) this.setState({ aiOpen: false });\n      else return;\n      e.preventDefault();\n    };\n    window.addEventListener(\"keydown\", this.escOn);\n    const startTab = NAV.findIndex(t => t.n === (this.props.startTab || \"Overview\"));\n    const narrow = window.matchMedia(\"(max-width: 859px)\").matches;\n    this.setState({ tab: startTab < 0 ? 0 : startTab, navOpen: !narrow && this.props.sidebarOpen !== false });\n\n    const mq = window.matchMedia(\"(max-width: 859px)\");\n    /* A drawer that opens over the content on load would hide it, so entering\n       mobile closes the nav and leaving it restores the rail. */\n    this.mqOn = () => this.setState(s => (mq.matches === s.mobile ? null\n      : { mobile: mq.matches, navOpen: !mq.matches }));\n    mq.addEventListener(\"change\", this.mqOn);\n    this.mqOn();\n\n    import((window.__resources && window.__resources.ismsCore) || \"./isms-core.js\").then(core => {\n      let raw = null, encrypted = false, locked = false;\n      if ((this.props.dataSource || \"Saved tracker\") === \"Saved tracker\") {\n        try {\n          const s = localStorage.getItem(core.KEY);\n          if (s) {\n            const parsed = JSON.parse(s);\n            if (parsed && parsed.__enc) { encrypted = true; locked = true; } else raw = parsed;\n          }\n        } catch (e) { raw = null; }\n      }\n      let files = {};\n      try { files = JSON.parse(localStorage.getItem(core.FKEY) || \"{}\") || {}; } catch (e) { files = {}; }\n      let cfg = core.defaultSettings();\n      try { cfg = { ...cfg, ...(JSON.parse(localStorage.getItem(core.SKEY) || \"{}\") || {}) }; } catch (e) { /* defaults */ }\n      let hasVault = false;\n      try { hasVault = !!JSON.parse(localStorage.getItem(core.VAULT_KEY) || \"null\"); } catch (e) { hasVault = false; }\n      this.setState({ core, encrypted, locked, hasVault, files, cfg,\n        st: this.propagate(core, core.hydrate(raw)) });\n    }).catch(e => { this.loadError = e.message; this.forceUpdate(); });\n  }\n\n  /* ANNEXA's eyes follow the cursor. Written straight onto the element as two\n     custom properties and throttled to one frame, so an interactive character\n     costs no React re-render and no work between frames. */\n  annexaFollow(x, y) {\n    if (this.annexaQueued) return;\n    this.annexaQueued = true;\n    requestAnimationFrame(() => {\n      this.annexaQueued = false;\n      const els = document.querySelectorAll(\".annexa\");\n      for (let i = 0; i < els.length; i++) {\n        const r = els[i].getBoundingClientRect();\n        if (!r.width) continue;\n        const dx = x - (r.left + r.width / 2);\n        const dy = y - (r.top + r.height / 2);\n        const d = Math.sqrt(dx * dx + dy * dy) || 1;\n        const k = Math.min(1, d / 240) * 1.8;\n        els[i].style.setProperty(\"--ax\", (dx / d * k).toFixed(2) + \"px\");\n        els[i].style.setProperty(\"--ay\", (dy / d * k).toFixed(2) + \"px\");\n      }\n    });\n  }\n\n  componentWillUnmount() {\n    if (this.annexaOn) window.removeEventListener(\"mousemove\", this.annexaOn);\n    if (this.escOn) window.removeEventListener(\"keydown\", this.escOn);\n    if (this.mqOn) window.matchMedia(\"(max-width: 859px)\").removeEventListener(\"change\", this.mqOn);\n  }\n\n  /* Propagate derived status. Ported from the App's derivation effect: touches only\n     entries the user has not decided by hand, never writes Verified, and stops as\n     soon as nothing differs. The original re-ran on every state change, so it\n     converged across renders; here one call iterates to the same fixed point.\n     Storage is never written from this pass. */\n  propagate(core, input) {\n    const { CLAUSES, CONTROLS, deepClone, isManual, controlDecision, autoControlStatus,\n      autoClauseStatus, suggestControls, autoResidual, treatmentPlan, autoRiskStatus } = core;\n    let n = input;\n    for (let pass = 0; pass < 6; pass++) {\n      const w = deepClone(n);\n      let changed = 0;\n      CLAUSES.filter(c => c.req).forEach(c => {\n        if (isManual(w, \"clause\", c.id)) return;\n        const want = autoClauseStatus(w, c);\n        if (w.clauses[c.id] && w.clauses[c.id].s !== want && w.clauses[c.id].s !== \"Verified\") {\n          w.clauses[c.id].s = want; changed++;\n        }\n      });\n      CONTROLS.forEach(c => {\n        const rec = w.controls[c.id];\n        if (!rec) return;\n        const d = controlDecision(w, c.id);\n        if (!isManual(w, \"soa\", c.id) && rec.app !== d.app) { rec.app = d.app; changed++; }\n        if (!isManual(w, \"why\", c.id) && rec.why !== d.why) { rec.why = d.why; changed++; }\n        if (!isManual(w, \"control\", c.id)) {\n          const want = autoControlStatus(w, c.id);\n          if (rec.s !== want) { rec.s = want; changed++; }\n        }\n      });\n      w.risks.forEach((r, i) => {\n        if (!isManual(w, \"aref\", r.id)) {\n          const sug = suggestControls(r).join(\", \");\n          if (sug && sug !== r.aref) { w.risks[i].aref = sug; changed++; }\n        }\n        if (!isManual(w, \"res\", r.id)) {\n          const res = autoResidual(w, w.risks[i]);\n          if (res.rL !== r.rL || res.rI !== r.rI) { w.risks[i].rL = res.rL; w.risks[i].rI = res.rI; changed++; }\n        }\n        if (!isManual(w, \"plan\", r.id)) {\n          const want = treatmentPlan(w, w.risks[i]);\n          if (want !== r.plan) { w.risks[i].plan = want; changed++; }\n        }\n        if (isManual(w, \"risk\", r.id)) return;\n        const want = autoRiskStatus(w, r);\n        if (want !== r.status) { w.risks[i].status = want; changed++; }\n      });\n      if (!changed) return n;\n      n = w;\n    }\n    return n;\n  }\n\n  /* One task row per WBS entry, dated from the single project start.\n     Percent complete is derived unless the override ledger says otherwise. */\n  /* The twelve workbook steps in the user's order. */\n  stepOrder() {\n    const { TASKS } = this.state.core;\n    const def = TASKS.filter(t => t.sec && !t.lvl).map(t => t.wbs);\n    const saved = this.state.st.order;\n    if (!Array.isArray(saved) || !saved.length) return def;\n    const keep = saved.filter(w => def.indexOf(w) >= 0);\n    return keep.concat(def.filter(w => keep.indexOf(w) < 0));\n  }\n\n  /* Reordering a step has to move its dates, otherwise the row moves and the\n     plan silently disagrees with itself.\n\n     The workbook defines twelve start SLOTS, and several of its steps run\n     concurrently — Management Support and Scope both begin on day one. So the\n     slots are what get preserved: position 3 keeps whatever start the workbook\n     gave position 3, and whichever step now sits there begins on that day. A\n     step's tasks keep their offsets relative to their own block, so its internal\n     shape is untouched.\n\n     The alternative — packing the blocks end to end — was tried and rejected: it\n     serialises steps the workbook runs in parallel, so swapping two concurrent\n     steps silently added 41 days to a 681-day programme. Under slot arithmetic,\n     swapping two steps that genuinely start on the same day correctly changes\n     nothing, and default order is the identity. A long step moved into a short\n     slot now overlaps the step after it, which is true and which the Gantt\n     shows, rather than being hidden by inflating the schedule. */\n  offsets() {\n    const { TASKS } = this.state.core;\n    const st = this.state.st;\n    const off = {};\n    TASKS.filter(t => !t.sec).forEach(t => { off[t.wbs] = (st.tasks[t.wbs] || t).off; });\n    const def = TASKS.filter(t => t.sec && !t.lvl).map(t => t.wbs);\n    const order = this.stepOrder();\n    if (order.join(\"|\") === def.join(\"|\")) return off;\n    const block = {};\n    def.forEach(w => {\n      const ls = TASKS.filter(t => !t.sec && t.wbs.indexOf(w + \".\") === 0);\n      block[w] = { a: ls.length ? Math.min(...ls.map(t => off[t.wbs])) : 0, ls };\n    });\n    const slot = def.map(w => block[w].a);\n    const out = { ...off };\n    order.forEach((w, i) => {\n      const shift = slot[i] - block[w].a;\n      block[w].ls.forEach(t => { out[t.wbs] = Math.max(0, off[t.wbs] + shift); });\n    });\n    return out;\n  }\n\n  moveStep(from, to) {\n    if (!from || !to || from === to) return;\n    const cur = this.stepOrder().slice();\n    const i = cur.indexOf(from), j = cur.indexOf(to);\n    if (i < 0 || j < 0) return;\n    cur.splice(j, 0, cur.splice(i, 1)[0]);\n    this.up(s => { s.order = cur; });\n    this.setState({ dragStep: null, overStep: null,\n      stepNote: `Step order changed — every date after it has moved.` });\n  }\n\n  schedule() {\n    const { TASKS, addWorkdays, parseISO, isManual, taskProgress } = this.state.core;\n    const st = this.state.st, start = parseISO(st.start), out = {};\n    const offs = this.offsets();\n    TASKS.filter(t => !t.sec).forEach(t => {\n      const c = st.tasks[t.wbs] || { off: t.off, dur: t.dur, pct: 0 };\n      const s = addWorkdays(start, offs[t.wbs] == null ? c.off : offs[t.wbs]);\n      const auto = isManual(st, \"task\", t.wbs) ? null : taskProgress(st, t.wbs);\n      out[t.wbs] = { s, e: addWorkdays(s, c.dur - 1), ...c,\n        off: offs[t.wbs] == null ? c.off : offs[t.wbs],\n        pct: auto == null ? c.pct : auto / 100, auto: auto != null };\n    });\n    return out;\n  }\n\n  /* Ported verbatim from the App metrics memo — one source of truth for every\n     number on this page and in the generated documents. */\n  metrics(sched) {\n    const { DOCS, isManual, parseISO } = this.state.core;\n    const st = this.state.st;\n    const today = new Date(); today.setHours(0, 0, 0, 0);\n    const T = Object.values(sched);\n    const w = T.reduce((a, t) => a + t.dur, 0);\n    const cl = Object.values(st.clauses);\n    const clApp = cl.filter(c => c.s !== \"Not Applicable\").length;\n    const clVer = cl.filter(c => c.s === \"Verified\").length;\n    const ct = Object.entries(st.controls);\n    const app = ct.filter(([, v]) => v.app);\n    const mand = DOCS.filter(d => d.ob === \"Mandatory\");\n    return {\n      planned: w ? T.reduce((a, t) => a + t.dur * t.pct, 0) / w : 0,\n      overdue: T.filter(t => t.e < today && t.pct < 1).length,\n      done: T.filter(t => t.pct >= 1).length, total: T.length,\n      clVer, clApp, clPct: clApp ? clVer / clApp : 0,\n      appN: app.length, exclN: ct.length - app.length,\n      ctImp: app.filter(([, v]) => v.s === \"Implemented\").length,\n      ctPlan: app.filter(([, v]) => v.s === \"Planned\").length,\n      ctConf: app.filter(([id, v]) => v.s === \"Implemented\" && isManual(st, \"control\", id)).length,\n      noOwner: app.filter(([, v]) => !String(v.owner || \"\").trim()).length,\n      ctPct: app.length ? app.filter(([, v]) => v.s === \"Implemented\").length / app.length : 0,\n      noWhy: ct.filter(([, v]) => !v.app && !v.why.trim()).length,\n      mandOut: mand.filter(d => ![\"Approved\", \"Published\"].includes(st.docs[d.id] && st.docs[d.id].s)).length,\n      mandN: mand.length,\n      outside: st.risks.filter(r => r.rL * r.rI > st.threshold).length,\n      openHigh: st.risks.filter(r => r.status === \"Open\" && r.L * r.I >= 9).length,\n      finish: T.reduce((a, t) => (t.e > a ? t.e : a), parseISO(st.start)),\n    };\n  }\n\n  /* The Gantt. Bar length is proportional to working days, so a two-day task is\n     visibly shorter than a full week. Geometry is computed here, never in the\n     template. The column rules are painted on the cell, not the bar track, so a\n     vertical line runs the full row height instead of one stub per row. */\n  planPane(sched) {\n    const { TASKS, addWorkdays, parseISO, fmtShort, toISO, taskProgress, isManual } = this.state.core;\n    const { st, gran, zoom, closed, mobile } = this.state;\n    const day = gran === \"day\";\n    const SPAN = 100;\n    const colW = day ? Math.max(7, Math.round(zoom / 2.6)) : zoom;\n    const perWD = day ? colW : colW / 5;\n    const TOTAL = SPAN * perWD;\n    const every = day ? 5 : 4;\n    const start = parseISO(st.start);\n    const today = new Date(); today.setHours(0, 0, 0, 0);\n    const weekend = (d) => d.getDay() === 0 || d.getDay() === 6;\n\n    const cols = [];\n    let d = new Date(start.getTime());\n    while (weekend(d)) d.setDate(d.getDate() + 1);\n    const nCols = day ? SPAN : SPAN / 5;\n\n    let todayWD = -1;\n    {\n      const base = addWorkdays(start, 0);\n      if (today >= base) {\n ,\n            why: rec.why || \"\",\n            whyManual: isManual(st, \"why\", c.id),\n            whyMissing: !rec.app && !String(rec.why || \"\").trim(),\n            setWhy: (e) => { const v = e.target.value; this.upMan(\"why\", c.id, s => { s.controls[c.id].why = v; }); },\n            cite: () => this.upMan(\"why\", c.id, s => { s.controls[c.id].why = d.why; s.controls[c.id].app = d.app; }),\n            canCite: rec.why !== d.why,\n            hasLinks: cites.length > 0 || docs.length > 0,\n            riskChips: cites.map(r => ({ id: r.id, go: () => this.setState({ tab: 4, riskQ: r.id, riskOpen: r.id }) })),\n            docChips: docs.map(id => ({\n              id,\n              tone: [\"Approved\", \"Published\"].includes((st.docs[id] || {}).s) ? \"#17693A\" : \"#8A5A00\",\n              go: () => this.setState({ tab: 2, docQ: id, docNote: `Jumped to ${id} from control ${c.id}.` }),\n            })),\n          };\n        }) : [],\n      };\n    }).filter(t => t.rows.length || (soaFilter === \"All\" && !q));\n\n    return {\n      soaThemes: themes, soaQ, soaFilter,\n      soaFilters: [\"All\", \"In SoA\", \"Excluded\", \"Needs owner\", \"No justification\", \"New in 2022\"],\n      setSoaQ: (e) => this.setState({ soaQ: e.target.value }),\n      setSoaFilter: (e) => this.setState({ soaFilter: e.target.value }),\n      soaStats: [\n        { label: \"In SoA\", value: String(inSoA), tone: \"#17693A\" },\n        { label: \"Excluded\", value: String(excluded), tone: \"#54585B\" },\n        { label: \"Implemented\", value: `${implemented}/${inSoA}`, tone: \"#CC000E\" },\n        { label: \"Without an owner\", value: String(noOwner), tone: noOwner ? \"#8A5A00\" : \"#17693A\" },\n        { label: \"Excluded, unjustified\", value: String(noWhy), tone: noWhy ? \"#B6000C\" : \"#17693A\" },\n      ],\n      soaAllLabel: THEMES.every(t => soaClosed[t.g] !== true) ? \"COLLAPSE ALL\" : \"EXPAND ALL\",\n      toggleSoaAll: () => this.setState(s => {\n        const querySelector(`[data-row-id=\"${CSS.escape(id)}\"]`);\n        if (!el) return;\n        const box = el.closest(\".scroller\");\n        if (box) box.scrollTop = Math.max(0, el.offsetTop - box.clientHeight / 2);\n        else window.scrollTo({ top: Math.max(0, el.getBoundingClientRect().top + window.scrollY - 220), behavior: \"smooth\" });\n      });\n    });\n  }\n\n  tellStep(t) {\n    clearTimeout(this.stepT);\n    this.setState({ stepNote: t || \"\" });\n    this.stepT = setTimeout(() => this.setState({ stepNote: \"\" }), 9000);\n  }\n\n  flashClass(tab, id) {\n    const f = this.state.flash;\n    return f && f.tab === tab && f.id === id ? \"flashrow\" : \"\";\n  }\n\n  /* Settings. The profile answers drive Annex A applicability, so each one names\n     what it will change; the override ledger is the audit trail of every place\n     you overruled the engine, and every entry can be handed back. */\n  settingsPane() {\n    const { PROFILE_QS, DEFAULT_PROFILE, CONTROLS, DOCS, CLAUSES, hydrate, defaultState } = this.state.core;\n    const st = this.state.st;\n    const prof = { ...DEFAULT_PROFILE, ...(st.profile || {}) };\n\n    const MAN = {\n      soa: \"Applicability\", why: \"Justification\", control: \"Control status\",\n      clause: \"Clause status\", task: \"Task progress\", risk: \"Risk status\",\n      res: \"Residual score\", aref: \"Annex A mapping\", plan: \"Treatment plan\",\n    };\n    const labelFor = (kind, id) => {\n      if (kind === \"task\") { return `Task ${id}`; }\n      if (kind === \"clause\") { const c = CLAUSES.find(x => x.id === id); return `Clause ${id}${c ? \" · \" + c.title : \"\"}`; }\n      if (kind === \"risk\" || kind === \"res\" || kind === \"aref\" || kind === \"plan\") return `Risk ${id}`;\n      const c = CONTROLS.find(x => x.id === id);\n      return `${id}${c ? \" · \" + c.title : \"\"}`;\n    };\n    const overrides = Object.keys(st.manual || {}).filter(k => st.manual[k]).map(k => {\n      const [kind, ...rest] = k.split(\ this.say(\"Backup restored.\");\n          } catch (err) { this.say(\"That file is not a tracker backup.\"); }\n        };\n        r.readAsText(f);\n      },\n      /* A new project starts with an empty risk register — clause 6.1.2 asks what\n         THIS organisation faces, and inherited rows are somebody else's answer. */\n      newProject: () => {\n        if (!confirm(\"Start a new project? This clears every status, answer and risk in this browser. Download a backup first if you want to keep it.\")) return;\n        const fresh = this.propagate(this.state.core, hydrate(defaultState()));\n        fresh.risks = [];\n        this.setState({ st: fresh, tab: 0 }, () => this.persist(fresh));\n        this.say(\"New project started. The risk register is empty.\");\n      },\n      /* AI key. Optional: with no key the built-in model is used, so nothing\n         here is a precondition for the import working. */\n      aiKey: (this.state.cfg || {}).anthropicKey || \"\",\n      setAiKey: (e) => this.upCfg({ anthropicKey: e.target.value }),\n      clearAiKey: () => this.upCfg({ anthropicKey: \"\" }),\n      keyState: (this.state.cfg || {}).anthropicKey ? \"Your key — calls go straight to Anthropic from this browser and is stored only here, outside the project data.\" : \"No key saved — the built-in model is used.\",\n      keyTone: (this.state.cfg || {}).anthropicKey ? \"#17693A\" : \"#65696C\",\n\n      /* Organisation document import. */\n      impBusy: this.state.imp.busy, isImpBusy: !!this.state.imp.busy,\n      impErr: this.state.imp.err, hasImpErr: !!this.state.imp.err,\n      impSrc: this.state.imp.src ? `${this.state.imp.src.name} · read as ${this.state.imp.src.kind}` : \"\",\n      hasImpSrc: !!this.state.imp.src,\n      pickDoc: (e) => { const f = e.target.files && e.target.files[0]; e.target.value = \"\"; if (f) this.runImport(f); },\n      pasteDoc: (e) => { const v = e.target.value; this.setState(s => ({ imp: { ...s.imp, paste: v } })); },\n      pasteVal: this.state.imp.paste || \"\",\n      readPaste: () => { const t = this.state.imp.paste; if (t && t.trim()) this.runImport(t); },\n      hasFound: !!this.state.imp.found,\n      foundRows: (() => {\n        const f = this.state.imp.found; if (!f) return [];\n        const rows = [\n          [\"company\", \"Organisation name\", f.company ? [f.company] : []],\n          [\"external\", \"External issues · 4.1\", f.external],\n          [\"internal\", \"Internal issues · 4.1\", f.internal],\n          [\"climate\", \"Climate relevance · 4.1\", f.climate ? [f.climate] : []],\n          [\"parties\", \"Interested parties · 4.2\", (f.parties || []).map(p => `${p.party} — ${p.needs}`)],\n          [\"locations\", \"Locations · 4.3\", f.locations],\n          [\"systems\", \"Systems · 4.3\", f.systems],\n          [\"inScope\", \"In scope · 4.3\", f.inScope],\n          [\"outScope\", \"Out of scope · 4.3\", f.outScope],\n        ];\n        return rows.filter(r => r[2] && r[2].length).map(([k, label, items]) => ({\n          k, label, count: `${items.length}`, items: items.slice(0, 6).map(t => ({ t })),\n          more: items.length > 6 ? `+${items.length - 6} more` : \"\", hasMore: items.length > 6,\n          on: this.state.imp.pick[k] !== false,\n          bg: this.state.imp.pick[k] !== false ? \"#2C2D2E\" : \"#FFFFFF\",\n          fg: this.state.imp.pick[k] !== false ? \"#FFFFFF\" : \"#54585B\",\n          toggle: () => this.setState(s => ({ imp: { ...s.imp, pick: { ...s.imp.pick, [k]: s.imp.pick[k] === false } } })),\n        }));\n      })(),\n      applyFound: () => this.applyImport(),\n      discardFound: () => this.setState({ imp: { busy: \"\", err: \"\", src: null, found: null, pick: {} } }),\n\n      notPorted: [],\n    };\n  }\n\n  /* Organisation profile import. Reads a company document — the HTML export, a\n     PDF, a pasted extract — and proposes answers for the clause 4.1–4.3 fields.\n     It never writes silently: everything found is shown first, each group s).map(x => str(x, 200)).slice(0, 20),\n        inScope: arr(p.inScope).map(x => str(x, 160)).slice(0, 15),\n        outScope: arr(p.outScope).map(x => str(x, 200)).slice(0, 15),\n      };\n      const total = found.external.length + found.internal.length + found.parties.length\n        + found.locations.length + found.systems.length + found.inScope.length + found.outScope.length;\n      if (!total) throw new Error(\"Nothing usable came back. The document may not describe the organisation in terms clauses 4.1 to 4.3 can use — try pasting the relevant sections instead.\");\n      this.setState({ imp: {\n        busy: \"\", src: { name: content.name, kind: content.kind }, found,\n        err: partial ? \"The reply was cut short, so this is a partial reading. Everything shown was read cleanly and is safe to apply; run it again on a shorter extract to pick up the rest.\" : \"\",\n        pick: { company: true, external: true, internal: true, climate: true, parties: true, locations: true, systems: true, inScope: true, outScope: true },\n      } });\n    } catch (e) {\n      const noKey = !(this.state.cfg || {}).anthropicKey;\n      this.setState(s => ({ imp: { ...s.imp, busy: \"\", found: null,\n        err: String(e.message || \"Could not read that document\").slice(0, 320)\n          + (noKey ? \" (read using the built-in model — saving your own Anthropic key below usually reads longer documents more reliably)\" : \"\") } }));\n    }\n  }\n\n  applyImport() {\n    const { profileToAnswers } = this.state.core;\n    const { found, pick } = this.state.imp;\n    if (!found) return;\n    const ans = profileToAnswers(found) || {};\n    const on = {\n      threats: pick.external, external: pick.external, weaknesses: pick.internal,\n      internal: pick.internal, climate: pick.climate, parties: pick.parties,\n      locations: pick.locations, systems: pick.systems, inScope: pick.inScope, outScope: pick.outScope,\n    };\n    this.up(s => {\n      if (pick.company && found.company) s.project.company = found.company;\n      Object.keys(ans).forEach(doc => {\n        s.answers[doc] = s.answers[doc] || {};\n        Object.keys(ans[doc]).forEach(q => {\n          if (on[q] === false) return;\n          s.answers[doc][q] = ans[doc][q];\n        });\n      });\n    });\n    this.setState({ imp: { busy: \"\", err: \"\", src: null, found: null, pick: {} } });\n    this.say(\"Organisation profile applied. The document builder fields it filled are marked as yours.\");\n  }\n\n  /* The document builder. One pane per document: its own questions, the fields the\n     engine already knows, and the rendered document. Fields the tracker derives\n     are shown filled and marked LIVE — they move when the register moves, so\n     typing over one is a decision, not a correction, and it is recorded as yours. */\n  buildPane() {\n    const { DOCS, DOC_FORMS, renderTemplate, buildTemplate, liveAnswers, isLiveField,\n      docProgress, DOC_STATUSES, STATUS_COLOR } = this.state.core;\n    const st = this.state.st;\n    const doc = DOCS.find(d => d.id === this.state.buildId);\n    if (!doc) return {};\n    const form = DOC_FORMS[doc.id] || {};\n    const qs = form.qs || doc.qs || [];\n    const stored = st.answers[doc.id] || {};\n    const answers = liveAnswers({ ...doc, qs }, st, stored);\n    const pr = docProgress({ ...doc, qs }, answers);\n    const rec = st.docs[doc.id] || {};\n\n    const meta = {\n      id: doc.id, name: doc.name, ref: doc.ref,\n      company: st.project.company || \"the organisation\",\n      version: rec.ver || \"0.1 draft\",\n      date: new Date().toISOString().slice(0, 10),\n      scope: st.project.scope || \"\",\n    };\n    const tpl = form.tpl || doc.tpl;\n    let rendered = \"\";\n    try {\n      rendered = tpl ? renderTemplate({ ...doc, tpl }, answers, meta)\n        : buildTemplate(doc, meta.company);\n    } catch (e) { rendered = \"This document's template could not be rendered: \" + e.message; }\n\n    return {\n      buildOpen: true,\n      bId: doc.id, bName: doc.name, bRef: doc.ref, bWhy: doc.why || \"\",\n      bHasWhy: !!doc.why,\n      bProgress: `${pr.filled} of ${pr.total} answered`,\n      bPct: `${Math.round(pr.pct * 100)}%`,\n      bBarW: `${Math.round(pr.pct * 100)}%`,\n      bTone: pr.pct === 1 ? \"#17693A\" : pr.pct > 0 ? \"#8A5A00\" : \"#65696C\",\n      bStatus: rec.s, bStatuses: DOC_STATUSES,\n      bStatusTone: STATUS_COLOR[rec.s] || \"#65696C\",\n      setBStatus: (e) => { const v = e.target.value; this.up(s => { s.docs[doc.id].s = v; }); },\n      closeBuild: () => this.setState({ buildId: null }),\n\n      bQs: qs.map((q, i) => {\n        const live = isLiveField(st, doc.id, q.id);\n        const v = answers[q.id] == null ? \"\" : String(answers[q.id]);\n        const set = (e) => {\n          const val = e.target.value;\n          this.upMan(\"field\", `${doc.id}:${q.id}`, s => {\n            s.answers[doc.id] = { ...(s.answers[doc.id] || {}), [q.id]: val };\n          });\n        };\n        return {\n          key: q.id, n: String(i + 1), q: q.q, hint: q.h || \"\", hasHint: !!q.h,\n          ph: q.p || \"\", v, live, notLive: !live,\n          filled: !!String(v).trim(),\n          edge: String(v).trim() ? (live ? \"#17693A\" : \"#CC000E\") : \"#C4C1C1\",\n          isList: q.k === \"list\", isArea: q.k === \"area\", isText: q.k === \"text\",\n          isSelect: q.k === \"select\",\n          opts: (q.o || []).map(o => ({ o })),\n          rows: q.k === \"list\" ? 4 : q.k === \"area\" ? 3 : 1,\n          set,\n          /* Handing a live field back lets the engine own it again. */\n          handBack: () => this.up(s => {\n            const m = { ...(s.manual || {}) }; delete m[`field:${doc.id}:${q.id}`]; s.manual = m;\n          }),\n          overridden: !live && !!this.state.core.isManual(st, \"field\", `${doc.id}:${q.id}`),\n        };\n      }),\n\n      bRendered: rendered,\n      copyDoc: () => {\n        navigator.clipboard && navigator.clipboard.writeTe
