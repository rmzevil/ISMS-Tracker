.55); display: flex; align-items: stretch; justify-content: center; padding: 72px 16px 20px\">\n                <div class=\"pane\" role=\"dialog\" aria-label=\"Deliverable mind map\" sc-camel-on-click=\"{{ stopMap }}\" style=\"background: var(--surface); border: 1px solid var(--rule); border-top: 3px solid #CC000E; border-radius: 4px; width: 100%; max-width: 1240px; display: flex; flex-direction: column; box-shadow: 0 22px 60px rgba(44,45,46,.34)\">\n                  <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line)\">\n                    <span style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint)\">Deliverable mind map<\u002Fspan>\n                    <label style=\"display: flex; align-items: center; gap: 7px\">\n                      <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint)\">Zoom<\u002Fspan>\n                      <input type=\"range\" min=\"0.4\" max=\"1.6\" step=\"0.1\" value=\"{{ mapZoom }}\" sc-camel-on-change=\"{{ setMapZoom }}\" aria-label=\"Map zoom\" style=\"width: 120px\">\n                    <\u002Flabel>\n                    <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint)\">{{ mapCounts }}<\u002Fspan>\n                    <span style=\"flex: 1\"><\u002Fspan>\n                    <span style=\"display: flex; gap: 13px; flex-wrap: wrap\">\n                      <span style=\"display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-soft)\"><span style=\"width: 11px; height: 11px; border-radius: 2px; background: var(--success-soft); border: 1px solid #17693A\"><\u002Fspan>approved<\u002Fspan>\n                      <span style=\"display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-soft)\"><span style=\"width: 11px; height: 11px; border-radius: 2px; background: var(--surface); border: 1px solid #8A5A00\"><\u002Fspan>tracked<\u002Fspan>\n                      <span style=\"display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-soft)\"><span style=\"width: 11px; height: 11px; border-radius: 2px; background: var(--surface); border: 1px solid var(--rule)\"><\u002Fspan>not tracked<\u002Fspan>\n                    <\u002Fspan>\n                    <button sc-camel-on-click=\"{{ closeMap }}\" aria-label=\"Close the mind map\" style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 7px 12px; min-height: 34px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">✕<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div class=\"scroller\" style=\"flex: 1; padding: 14px; min-height: 0\">\n                    <div style=\"width: {{ frameW }}; height: {{ frameH }}\">\n                      <div style=\"position: relative; width: {{ innerW }}; height: {{ innerH }}; transform: {{ scale }}; transform-origin: 0 0\">\n                        <svg sc-camel-view-box=\"{{ viewBox }}\" role=\"presentation\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible\">\n                          <g stroke=\"var(--rule)\" stroke-width=\"1\" fill=\"none\">\n                            <sc-for list=\"{{ links }}\" as=\"l\" hint-placeholder-count=\"20\">\n                              <path d=\"{{ l.d }}\"><\u002Fpath>\n                            <\u002Fsc-for>\n                          <\u002Fg>\n                        <\u002Fsvg>\n                        <div style=\"position: absolute; left: {{ spineLeft }}; top: {{ spineTop }}; width: 184px; height: 30px; border-radius: 3px; background: #CC000E; color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 12px; font-weight: 800; letter-spacing: .04em\">ISO 27001 ISMS<\u002Fdiv>\n                        <sc-for list=\"{{ nodes }}\" as=\"n\" hint-placeholder-count=\"30\">\n                          <div title=\"{{ n.t }}\" style=\"position: absolute; left: {{ n.left }}; top: {{ n.top }}; width: {{ n.wpx }}; min-height: {{ n.hpx }}; box-sizing: border-box; display: flex; align-items: center; justify-content: {{ n.centre }}; padding: 3px 6px; border-radius: 3px; background: {{ n.fill }}; border: 1px solid {{ n.stroke }}; color: {{ n.fg }}; font-size: {{ n.fs }}; font-weight: {{ n.fw }}; line-height: 1.2; overflow: hidden; text-wrap: pretty\">{{ n.t }}<\u002Fdiv>\n                        <\u002Fsc-for>\n                        <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"12\">\n                          <button sc-camel-on-click=\"{{ c.go }}\" title=\"{{ c.title }}\" style=\"position: absolute; left: {{ c.left }}; top: {{ c.top }}; width: {{ c.wpx }}; min-height: {{ c.hpx }}; box-sizing: border-box; display: flex; align-items: center; text-align: left; padding: 3px 6px; border-radius: 3px; background: {{ c.fill }}; border: 1px solid {{ c.stroke }}; color: {{ c.fg }}; font-family: var(--sans); font-size: {{ c.fs }}; line-height: 1.2; cursor: pointer; overflow: hidden\" style-hover=\"border-color: var(--accent-text)\">{{ c.t }}<\u002Fbutton>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;startTab&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Overview&quot;, &quot;Plan&quot;, &quot;Documents&quot;, &quot;Clauses 4–10&quot;, &quot;Risk register&quot;, &quot;Annex A / SoA&quot;], &quot;default&quot;: &quot;Overview&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Behaviour&quot; },\n  &quot;dataSource&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Saved tracker&quot;, &quot;Seed example&quot;], &quot;default&quot;: &quot;Saved tracker&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Behaviour&quot; },\n  &quot;sidebarOpen&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behaviour&quot; }\n}\">\nconst NAV = [\n  { n: \"Overview\", hint: \"Where you stand\", part: \"\", note: \"Where you stand. Every number here is derived from the other tabs — nothing on this page is editable. An auditor opens with: are you ready, and what is still open?\" },\n  { n: \"Plan\", hint: \"Part 1 · 12-step workbook\", part: \"Course part 1\", note: \"The implementation plan, dated from one project start. Completion is derived from what each task actually produces — the clause it records and the documents its own title matches — never from its position in the list.\" },\n  { n: \"Documents\", hint: \"Part 2-9 · build order\", part: \"Course parts 2–9\", note: \"The documented information required by clause 7.5, in the order the course builds it. Obligation is read from the catalogue: only the standard's own documented-information list counts as mandatory.\" },\n  { n: \"Clauses 4–10\", hint: \"Part 4 · gap assessment\", part: \"Course part 4\", note: \"The gap assessment. Every sub-clause with its shall text, grouped by clause. Conformity is derived from status, evidence and the linked documents; Verified stays your judgement under clause 9.2.\" },\n  { n: \"Risk register\", hint: \"Part 6 · 6.1.2 / 6.1.3\", part: \"Course part 6\", note: \"Risk assessment and treatment. Likelihood × impact, where impact is averaged from four factors; residual is derived from the controls you have actually implemented, so it cannot be talked down.\" },\n  { n: \"Annex A / SoA\", hint: \"Part 7 · 9 ernal],\n          [\"internal\", \"Internal issues · 4.1\", f.internal],\n          [\"climate\", \"Climate relevance · 4.1\", f.climate ? [f.climate] : []],\n          [\"parties\", \"Interested parties · 4.2\", (f.parties || []).map(p => `${p.party} — ${p.needs}`)],\n          [\"locations\", \"Locations · 4.3\", f.locations],\n          [\"systems\", \"Systems · 4.3\", f.systems],\n          [\"inScope\", \"In scope · 4.3\", f.inScope],\n          [\"outScope\", \"Out of scope · 4.3\", f.outScope],\n        ];\n        return rows.filter(r => r[2] && r[2].length).map(([k, label, items]) => ({\n          k, label, count: `${items.length}`, items: items.slice(0, 6).map(t => ({ t })),\n          more: items.length > 6 ? `+${items.length - 6} more` : \"\", hasMore: items.length > 6,\n          on: this.state.imp.pick[k] !== false,\n          bg: this.state.imp.pick[k] !== false ? \"#2C2D2E\" : \"var(--surface)\",\n          fg: this.state.imp.pick[k] !== false ? \"#FFFFFF\" : \"var(--ink-soft)\",\n          toggle: () => this.setState(s => ({ imp: { ...s.imp, pick: { ...s.imp.pick, [k]: s.imp.pick[k] === false } } })),\n        }));\n      })(),\n      applyFound: () => this.applyImport(),\n      discardFound: () => this.setState({ imp: { busy: \"\", err: \"\", src: null, found: null, pick: {} } }),\n\n      jbKeyType: this.state.syncKeyVisible ? \"text\" : \"password\",\n      jbKeyVisible: this.state.syncKeyVisible,\n      jbKeyPressed: this.state.syncKeyVisible ? \"true\" : \"false\",\n      jbKeyEyeLabel: this.state.syncKeyVisible ? \"Hide jsonbin master key\" : \"Show jsonbin master key\",\n      toggleJbKey: () => this.setState(s => ({ syncKeyVisible: !s.syncKeyVisible })),\n\n      notPorted: [],\n    };\n  }\n\n  /* Organisation profile import. Reads a company document — the HTML export, a\n     PDF, a pasted extract — and proposes answers for the clause 4.1–4.3 fields.\n     It never writes silently: everything found is shown first, each group is\n     opt- r(x, 200)).slice(0, 20),\n        inScope: arr(p.inScope).map(x => str(x, 160)).slice(0, 15),\n        outScope: arr(p.outScope).map(x => str(x, 200)).slice(0, 15),\n      };\n      const total = found.external.length + found.internal.length + found.parties.length\n        + found.locations.length + found.systems.length + found.inScope.length + found.outScope.length;\n      if (!total) throw new Error(\"Nothing usable came back. The document may not describe the organisation in terms clauses 4.1 to 4.3 can use — try pasting the relevant sections instead.\");\n      this.setState({ imp: {\n        busy: \"\", src: { name: content.name, kind: content.kind }, found,\n        err: partial ? \"The reply was cut short, so this is a partial reading. Everything shown was read cleanly and is safe to apply; run it again on a shorter extract to pick up the rest.\" : \"\",\n        pick: { company: true, external: true, internal: true, climate: true, parties: true, locations: true, systems: true, inScope: true, outScope: true },\n      } });\n    } catch (e) {\n      const noKey = !(this.state.cfg || {}).anthropicKey;\n      this.setState(s => ({ imp: { ...s.imp, busy: \"\", found: null,\n        err: String(e.message || \"Could not read that document\").slice(0, 320)\n          + (noKey ? \" (read using the built-in model — saving your own Anthropic key below usually reads longer documents more reliably)\" : \"\") } }));\n    }\n  }\n\n  applyImport() {\n    const { profileToAnswers } = this.state.core;\n    const { found, pick } = this.state.imp;\n    if (!found) return;\n    const ans = profileToAnswers(found) || {};\n    const on = {\n      threats: pick.external, external: pick.external, weaknesses: pick.internal,\n      internal: pick.internal, climate: pick.climate, parties: pick.parties,\n      locations: pick.locations, systems: pick.systems, inScope: pick.inScope, outScope: pick.outScope,\n    };\n    this.up(s => {\n      if (pick.company && found.company) s.project.     qid: q.id,\n        hadValue: Object.prototype.hasOwnProperty.call(oldAnswers, q.id),\n        value: oldAnswers[q.id],\n        manual: !!(st.manual || {})[`field:${key}`],\n        drafted: !!(st.drafted || {})[key],\n      };\n    });\n    this.up(s => {\n      s.answers[doc.id] = { ...(s.answers[doc.id] || {}) };\n      s.manual = { ...(s.manual || {}) };\n      s.drafted = { ...(s.drafted || {}) };\n      updates.forEach(({ q, value }) => {\n        const key = `${doc.id}:${q.id}`;\n        s.answers[doc.id][q.id] = value;\n        s.manual[`field:${key}`] = true;\n        s.drafted[key] = true;\n      });\n    });\n    this.setState({ buildAiBusy: false, buildAiMsg: message, buildUndo: { docId: doc.id, fields: undo } });\n  }\n\n  async draftBuilderField(docId, qid) {\n    if (this.state.buildAiBusy) return;\n    const core = this.state.core;\n    const doc0 = core.DOCS.find(d => d.id === docId);\n    if (!doc0) return;\n    const doc = { ...doc0, qs: core.docQuestions(doc0) };\n    const q = doc.qs.find(x => x.id === qid);\n    if (!q) return;\n    const cfg = this.state.cfg || {};\n    if (!cfg.anthropicKey && !(window.claude && window.claude.complete)) {\n      this.setState({ buildAiMsg: \"Add an Anthropic API key in Settings before using AI drafting.\" });\n      return;\n    }\n    const answers = core.liveAnswers(doc, this.state.st, this.state.st.answers[doc.id] || {});\n    const generation = (this.builderAiGeneration || 0) + 1;\n    this.builderAiGeneration = generation;\n    this.setState({ buildAiBusy: true, buildAiMsg: `Drafting field ${this.state.buildStep + 1}…` });\n    try {\n      const raw = await core.askClaude({\n        system: core.DRAFT_SYSTEM,\n        messages: [{ role: \"user\", content: core.fieldPrompt(doc, q, answers, this.builderMeta(doc), \"\", this.state.st) }],\n        apiKey: cfg.anthropicKey || \"\",\n      });\n      if (this.builderAiGeneration !== generation || this.state.buildId !== docId) return;\n      this.commitBuilderDrafts(doc, [{ q, value: this.normaliseBuilderDraft(q, raw) }], \"AI draft added. Review it before approving the document.\");\n    } catch (e) {\n      if (this.builderAiGeneration !== generation) return;\n      this.setState({ buildAiBusy: false, buildAiMsg: `Nothing changed — ${String(e.message || e).slice(0, 180)}` });\n    }\n  }\n\n  async fillBuilderEmpty(docId) {\n    if (this.state.buildAiBusy) return;\n    const core = this.state.core;\n    const doc0 = core.DOCS.find(d => d.id === docId);\n    if (!doc0) return;\n    const doc = { ...doc0, qs: core.docQuestions(doc0) };\n    const cfg = this.state.cfg || {};\n    if (!cfg.anthropicKey && !(window.claude && window.claude.complete)) {\n      this.setState({ buildAiMsg: \"Add an Anthropic API key in Settings before using AI drafting.\" });\n      return;\n    }\n    const answers = core.liveAnswers(doc, this.state.st, this.state.st.answers[doc.id] || {});\n    const empty = doc.qs.filter(q => !String(answers[q.id] || \"\").trim());\n    if (!empty.length) { this.setState({ buildAiMsg: \"Every field already has a value.\" }); return; }\n    const generation = (this.builderAiGeneration || 0) + 1;\n    this.builderAiGeneration = generation;\n    this.setState({ buildAiBusy: true, buildAiMsg: `Drafting ${empty.length} empty field${empty.length === 1 ? \"\" : \"s\"}…` });\n    try {\n      const updates = [];\n      const working = { ...answers };\n      for (let i = 0; i < empty.length; i++) {\n        const q = empty[i];\n        this.setState({ buildAiMsg: `Drafting empty field ${i + 1} of ${empty.length}…` });\n        const raw = await core.askClaude({\n          system: core.DRAFT_SYSTEM,\n          messages: [{ role: \"user\", content: core.fieldPrompt(doc, q, working, this.builderMeta(doc), \"\", this.state.st) }],\n          apiKey: cfg.anthropicKey || \"\",\n        });\n        if (this.builderAiGeneration !== generation || this.state.buildId !== docId) return;\n        const value = this.normaliseBuilderDraft(q, raw);\n        working[q.id] = value;\n        updates.push({ q, value });\n      }\n      this.commitBuilderDrafts(doc, updates, `${updates.length} AI draft${updates.length === 1 ? \"\" : \"s\"} added. Review every field before approval.`);\n    } catch (e) {\n      if (this.builderAiGeneration !== generation) return;\n      this.setState({ buildAiBusy: false, buildAiMsg: `Nothing changed — ${String(e.message || e).slice(0, 180)}` });\n    }\n  }\n\n  undoBuilderAi() {\n    const undo = this.state.buildUndo;\n    if (!undo || !undo.fields || !undo.fields.length) return;\n    this.up(s => {\n      s.answers[undo.docId] = { ...(s.answers[undo.docId] || {}) };\n      s.manual = { ...(s.manual || {}) };\n      s.drafted = { ...(s.drafted || {}) };\n      undo.fields.forEach(old => {\n        const key = `${undo.docId}:${old.qid}`;\n        if (old.hadValue) s.answers[undo.docId][old.qid] = old.value;\n        else delete s.answers[undo.docId][old.qid];\n        if (old.manual) s.manual[`field:${key}`] = true;\n        else delete s.manual[`field:${key}`];\n        if (old.drafted) s.drafted[key] = true;\n        else delete s.drafted[key];\n      });\n    });\n    this.setState({ buildUndo: null, buildAiMsg: \"The last AI drafting operation was undone.\" });\n  }\n\n  buildPane() {\n    const { DOCS, docQuestions, renderTemplate, buildTemplate, liveAnswers, isLiveField,\n      docProgress, DOC_STATUSES, STATUS_COLOR, SHEET_DOCS, xlsxFrom } = this.state.core;\n    const st = this.state.st;\n    const base = DOCS.find(d => d.id === this.state.buildId);\n    if (!base) return {};\n    const qs = docQuestions(base);\n    const doc = { ...base, qs };\n    const stored = st.answers[doc.id] || {};\n    const answers = liveAnswers(doc, st, stored);\n    const pr = docProgress(doc, answers);\n    const rec = st.docs[doc.id] || {};\n    const meta = this.builderMeta(doc);\n    const tpl = doc.tpl;\n    const active = Math.max(0, Math.min(qs.length - 1, this.state.buildStep || 0));\n    let rendered = \"\";\n    try {\n      rendered = tpl ? renderTemplate(doc, answers, meta)\n        : buildTemplate(doc, meta.company);\n    } catch (e) { rendered = \"This document's template could not be rendered: \" + e.message; }\n\n    const rows = qs.map((q, i) => {\n      const key = `${doc.id}:${q.id}`;\n      const live = isLiveField(st, doc.id, q.id);\n      const v = answers[q.id] == null ? \"\" : String(answers[q.id]);\n      const filled = !!v.trim();\n      const drafted = !!(st.drafted || {})[key];\n      const overridden = !live && !!this.state.core.isManual(st, \"field\", key);\n      const liveOverride = overridden && !!this.state.core.LIVE[key];\n      const set = (e) => {\n        const val = e.target.value;\n        this.upMan(\"field\", key, s => {\n          s.answers[doc.id] = { ...(s.answers[doc.id] || {}), [q.id]: val };\n          s.drafted = { ...(s.drafted || {}) }; delete s.drafted[key];\n        });\n      };\n      return {\n        key: q.id, n: String(i + 1), q: q.q, hint: q.h || \"\", hasHint: !!q.h,\n        ph: q.p || \"\", v, live, disabled: live || this.state.buildAiBusy, drafted, overridden, liveOverride,\n        filled, edge: filled ? (live ? \"var(--success-text)\" : drafted ? \"var(--warning-text)\" : \"var(--accent-text)\") : \"var(--rule)\",\n        isList: q.k === \"list\", isArea: q.k === \"area\", isText: q.k === \"text\",\n        isSelect: q.k === \"select\", opts: (q.o || []).map(o => ({ o })), set,\n        aiLabel: filled ? \"AI: IMPROVE THIS FIELD\" : \"AI: DRAFT THIS FIELD\",\n        edit: () => this.upMan(\"field\", key, s => {\n          s.answers[doc.id] = { ...(s.answers[doc.id] || {}), [q.id]: v };\n          s.drafted = { ...(s.drafted || {}) }; delete s.drafted[key];\n        }),\n        handBack: () => this.up(s => {\n          s.manual = { ...(s.manual || {}) }; delete s.manual[`field:${key}`];\n          s.drafted = { ...(s.drafted || {}) }; delete s.drafted[key];\n        }),\n        draft: () => this.draftBuilderField(doc.id, q.id),\n      };\n    });\n\n    const sheet = SHEET_DOCS[doc.id];\n\n    return {\n      buildOpen: true,\n      bId: doc.id, bName: doc.name, bRef: doc.ref, bWhy: doc.why || \"\",\n      bHasWhy: !!doc.why,\n      bProgress: `${pr.filled} of ${pr.total} answered`,\n      bPct: `${Math.round(pr.pct * 100)}%`,\n      bBarW: `${Math.round(pr.pct * 100)}%`,\n      bTone: pr.pct === 1 ? \"var(--success-text)\" : pr.pct > 0 ? \"var(--warning-text)\" : \"var(--ink-faint)\",\n      bStatus: rec.s, bStatuses: DOC_STATUSES,\n      bStatusTone: STATUS_COLOR[rec.s] || \"var(--ink-faint)\",\n      setBStatus: (e) => { const v = e.target.value; this.up(s => { s.docs[doc.id].s = v; }); },\n      closeBuild: () => this.closeBuilder(),\n      bTotal: String(qs.length),\n      bQs: rows.length ? [rows[active]] : [],\n      bRail: rows.map((q, i) => ({\n        n: String(i + 1), title: q.q,\n        label: `Field ${i + 1} of ${rows.length}: ${q.q}${q.filled ? \", answered\" : \", empty\"}${q.drafted ? \", AI draft\" : \"\"}`,\n        current: i === active ? \"step\" : \"false\",\n        edge: q.edge, bg: i === active ? \"var(--accent-soft)\" : \"var(--surface)\",\n        state: q.drafted ? \"AI\" : q.filled ? \"●\" : \"○\",\n        go: () => this.setState({ buildStep: i, previewOpen: false }),\n      })),\n      prevB: () => this.setState({ buildStep: Math.max(0, active - 1), previewOpen: false }),\n      nextB: () => active >= qs.length - 1\n        ? this.setState({ previewOpen: true })\n        : this.setState({ buildStep: active + 1, previewOpen: false }),\n      bNextLabel: active >= qs.length - 1 ? \"PREVIEW DOCUMENT\" : \"NEXT\",\n      bAtStart: active <= 0,\n      bAiBusy: this.state.buildAiBusy,\n      bAiMsg: this.state.buildAiMsg || \"AI writes are marked, reversible, and never applied after a failed request.\",\n      bAiClass: this.state.buildAiBusy ? \"busy\" : \"\",\n      fillBEmpty: () => this.fillBuilderEmpty(doc.id),\n      undoBAi: () => this.undoBuilderAi(),\n      bUndoDisabled: !this.state.buildUndo || this.state.buildUndo.docId !== doc.id,\n\n      bRendered: rendered,\n      copyDoc: () => {\n        navigator.clipboard && navigator.clipboard.writeText(rendered);\n        this.say(`${doc.id} copied as Markdown.`);\n      },\n      downloadWord: () => {\n        try { this.saveBlob(this.state.core.docxFrom(rendered, doc.name), `${doc.id} ${doc.name}.docx`); }\n        catch (e) { this.say(\"Word export failed: \" + e.message); }\n      },\n      downloadDoc: () => {\n        const a = document.createElement(\"a\");\n        a.href = URL.createObjectURL(new Blob([rendered], { type: \"text/markdown;charset=utf-8\" }));\n        a.download = `${doc.id} ${doc.name}.md`.replace(/[\\\\/:*?\"<>|]/g, \"-\");\n        a.click(); URL.revokeObjectURL(a.href);\n      },\n      openDocTab: () => {\n        const url = URL.createObjectURL(new Blob([rendered], { type: \"text/plain;charset=utf-8\" }));\n        const opened = window.open(url, \"_blank\", \"noopener,noreferrer\");\n        if (!opened) this.say(\"The browser blocked the document tab. Allow pop-ups for this page and try again.\");\n        setTimeout(() => URL.revokeObjectURL(url), 60000);\n      },\n      bHasSheet: !!sheet,\n      downloadSheet: () => {\n        if (!sheet) return;\n        try {\n          const data = sheet.build(st);\n          this.saveBlob(xlsxFrom(data.header, data.rows, data.widths, data.name), `${doc.id} ${data.name}.xlsx`.replace(/[\\\\/:*?\"<>|]/g, \"-\"));\n        } catch (e) { this.say(\"Excel export failed: \" + e.message); }\n      },\n      bPreviewOpen: this.state.previewOpen,\n      toggleBPreview: () => this.setState(s => ({ previewOpen: !s.previewOpen })),\n      bPreviewLabel: this.state.previewOpen ? \"HIDE THE DOCUMENT\" : \"SHOW THE DOCUMENT\",\n    };\n  }\n\n  /* Documents, second view: one row per deliverable across every phase. The\n     phase register answers \"what do I build next\"; this answers \"what does the\n     standard actually oblige me to hold\", which is a different question and the\n     one an auditor opens with. */\n  registerPane() {\n    const { DELIVERABLES, deliverableTree, delState, DEL_CATS, DEL_CAT_COLOR,\n      STATUS_COLOR, csv, xlsxFrom } = this.state.core;\n    const st = this.state.st;\n    const { regQ, regCat, regClosed } = this.state;\n    const q = regQ.trim().toLowerCase();\n    const pass = (d) => (regCat === \"All\" || d.cat === regCat)\n      && (!q || (d.name + \" \" + (d.cites || []).join(\" \")).toLowerCase().includes(q));\n\n    const groups = deliverableTree(DELIVERABLES).map(g => {\n      const items = (g.items || []).filter(pass);\n      const open = (q || regCat !== \"All\") ? true : regClosed[g.key] !== true;\n      return {\n        key: g.key, label: g.label, kind: g.kind, open,\n        glyph: open ? \"−\" : \"+\", ariaOpen: open ? \"true\" : \"false\",\n        meta: `${(g.items || []).length} deliverables`,\n        toggle: () => this.setState(s => ({ regClosed: { ...s.regClosed, [g.key]: open } })),\n        rows: open ? items.map(d => {\n          const link = delState(st, d);\n          return {\n            key: String(d.id), name: d.name, cat: d.cat, typ: d.typ,\n            catTone: DEL_CAT_COLOR[d.cat] || \"#65696C\",\n            mandatory: d.typ === \"Mandatory\",\n            typLabel: String(d.typ || \"Additional\").toUpperCase(),\n            typBg: d.typ === \"Mandatory\" ? \"#B6000C\" : \"transparent\",\n            typFg: d.typ === \"Mandatory\" ? \"#FFFFFF\" : \"#65696C\",\n            typEdge: d.typ === \"Mandatory\" ? \"#B6000C\" : \"#C4C1C1\",\n            cites: (d.cites || []).join(\", \"),\n            docId: link.id || \"\", hasDoc: !!link.id,\n            status: link.s || \"\",\n            statusTone: STATUS_COLOR[link.s] || \"#65696C\",\n            go: () => link.id && this.setState({ docView: \"phases\", docQ: link.id, docNote: `Jumped to ${link.id} from the deliverable register.` }),\n          };\n        }) : [],\n      };\n    }).filter(g => g.rows.length || (regCat === \"All\" && !q));\n\n    const flat = DELIVERABLES.filter(pass);\n    const head = [\"Deliverable\", \"Category\", \"Obligation\", \"Cites\", \"Tracked as\", \"Status\"];\n    const body = () => flat.map(d => {\n      const l = delState(st, d);\n      return [d.name, d.cat, d.typ, (d.cites || []).join(\" \"), l.id || \"\", l.s || \"not tracked\"];\n    });\n    return {\n      regGroups: groups, regQ, regCat,\n      regCats: [\"All\"].concat(DEL_CATS),\n      regCount: `${flat.length} of ${DELIVERABLES.length} deliverables`,\n      setRegQ: (e) => this.setState({ regQ: e.target.value }),\n      setRegCat: (e) => this.setState({ regCat: e.target.value }),\n      regAllLabel: deliverableTree(DELIVERABLES).every(g => regClosed[g.key] !== true) ? \"COLLAPSE ALL\" : \"EXPAND ALL\",\n      toggleRegAll: () => this.setState(s => {\n        const keys = deliverableTree(DELIVERABLES).map(g => g.key);\n        const openNow = keys.every(k => s.regClosed[k] !== true);\n        const next = { ...s.regClosed };\n        keys.forEach(k => { next[k] = openNow; });\n        return { regClosed: next };\n      }),\n      exportReg: () => csv([head, ...body()], \"isms-deliverable-register.csv\"),\n      exportRegX: () => this.saveBlob(xlsxFrom(head, body(), [46, 20, 14, 26, 12, 16], \"Deliverables\"),\n        \"isms-deliverable-register.xlsx\"),\n    };\n  }\n\n  /* Documents, third view: the real mind map. mindLayout precomputes a y for every\n     node so the branches can be drawn with orthogonal elbows either side of a\n     centre spine — the geometry is the point, so this draws it rather than\n     flattening it to a list. Records carry their document's status, because the\n     question this view answers is which clause has nothing filed against it. */\n  mapPane() {\n    const { mindLayout, MIND_DOC, STATUS_COLOR } = this.state.core;\n    const st = this.state.st;\n    let L;\n    try { L = mindLayout(st); } catch (e) { return { mapError: e.message, hasMapError: true, nodes: [], links: [], chips: [] }; }\n\n    const HUB_X = 150, CL_X = 300, SUB_X = 520, DEEP_X = 730, ROW = 26;\n    const nodes = [], links = [], chips = [];\n    const box = (side, x, w) => side === \"R\" ? x : -x - w;\n    const elbow = (x1, y1, x2, y2) => {\n      const mx = x1 + (x2 - x1) / 2;\n      return `M ${x1} ${y1} H ${mx} V ${y2} H ${x2}`;\n    };\n    const pub = (name) => {\n      const id = MIND_DOC[name];\n      if (!id) return { docId: \"\", done: false, s: \"\" };\n      const d = (st.docs || {})[id] || {};\n      return { docId: id, done: [\"Approved\", \"Published\"].indexOf(d.s) >= 0, s: d.s || \"Not Started\" };\n    };\n    const clauseS = (id) => ((st.clauses || {})[id] || {}).s || null;\n\n    [\"R\", \"L\"].forEach(sideKey => {\n      const set = L[sideKey];\n      if (!set) return;\n      const top = -(set.height || 0) / 2;\n      const sg = sideKey === \"R\" ? 1 : -1;\n      (set.hubs || []).forEach(hub => {\n        const hy = top + hub.y, hx = box(sideKey, HUB_X, 74);\n        nodes.push({ key: sideKey + hub.id, kind: \"hub\", x: hx, y: hy - 13, w: 74, h: 26,\n          t: hub.id, fill: \"#2C2D2E\", stroke: \"#2C2D2E\", fg: \"#FFFFFF\", weight: 700, size: 11 });\n        links.push({ key: \"l\" + sideKey + hub.id, d: elbow(sg * 92, 0, sideKey === \"R\" ? hx : hx + 74, hy) });\n\n        (hub.clauses || []).forEach(cl => {\n          const cy = top + cl.y, cx = box(sideKey, CL_X, 168);\n          nodes.push({ key: sideKey + \"c\" + cl.id, kind: \"clause\", x: cx, y: cy - 15, w: 168, h: 30,\n            t: `${cl.id}. ${cl.title}`, fill: \"#FFFFFF\", stroke: \"#CC000E\", fg: \"#2C2D2E\", weight: 700, size: 10.5 });\n          links.push({ key: \"lc\" + sideKey + cl.id,\n            d: elbow(sideKey === \"R\" ? hx + 74 : hx, hy, sideKey === \"R\" ? cx : cx + 168, cy) });\n\n          (cl.kids || []).forEach(sc => {\n            const sy = top + sc.y, sx = box(sideKey, SUB_X, 196);\n            const s1 = sc.id ? clauseS(sc.id) : null;\n            nodes.push({ key: sideKey + \"s\" + sc.id, kind: \"sub\", x: sx, y: sy - 13, w: 196, h: 26,\n              t: `${sc.label} ${sc.title}`, fill: \"#F7F6F6\",\n              stroke: s1 ? (STATUS_COLOR[s1] || \"#C4C1C1\") : \"#C4C1C1\",\n              fg: \"#2C2D2E\", weight: 500, size: 9.5 });\n            links.push({ key: \"ls\" + sideKey + sc.id,\n              d: elbow(sideKey === \"R\" ? cx + 168 : cx, cy, sideKey === \"R\" ? sx : sx + 196, sy) });\n\n            /* deeper sub-clauses (6.1.3, 7.5.2, 9.2.1 …) and the records filed\n               against them. Weighting each tail by its record count is what keeps\n               the record column from overlapping itself. */\n            const tails = [];\n            (sc.deeper || []).forEach(d => tails.push({ kind: \"deep\", id: d.id, t: `${d.id} ${d.title}`, recs: d.recs || [] }));\n            (sc.recs || []).forEach(r => tails.push({ kind: \"rec\", t: r, recs: [] }));\n            const weight = tails.map(tl => tl.kind === \"deep\" ? Math.max(1, tl.recs.length) : 1);\n            const totalRows = weight.reduce((a, b) => a + b, 0);\n            let row = 0;\n            tails.forEach((tl, i) => {\n              const w = weight[i];\n              const ty = sy - (totalRows - 1) * ROW / 2 + (row + (w - 1) / 2) * ROW;\n              row += w;\n              if (tl.kind === \"deep\") {\n                const dx = box(sideKey, DEEP_X, 186);\n                const ds = clauseS(tl.id);\n                nodes.push({ key: sideKey + \"d\" + tl.id, kind: \"deep\", x: dx, y: ty - 12, w: 186, h: 24,\n                  t: tl.t, fill: \"#FFFFFF\", stroke: ds ? (STATUS_COLOR[ds] || \"#C4C1C1\") : \"#C4C1C1\",\n                  fg: \"#54585B\", weight: 600, size: 9.5 });\n                links.push({ key: \"ld\" + sideKey + tl.id,\n                  d: elbow(sideKey === \"R\" ? sx + 196 : sx, sy, sideKey === \"R\" ? dx : dx + 186, ty) });\n                tl.recs.forEach((r, j) => {\n                  const ry = ty - (tl.recs.length - 1) * ROW / 2 + j * ROW;\n                  const rx = sideKey === \"R\" ? dx + 186 + 34 : dx - 34 - 236;\n                  const p = pub(r);\n                  chips.push({ key: sideKey + \"r\" + tl.id + j, x: rx, y: ry - 12, w: 236, h: 24, t: r,\n                    fill: p.done ? \"#E4F0E8\" : \"#FFFFFF\",\n                    stroke: p.done ? \"#17693A\" : (p.docId ? \"#8A5A00\" : \"#C4C1C1\"),\n                    fg: p.done ? \"#17693A\" : \"#54585B\",\n                    title: p.docId ? `${p.docId} — ${p.s}` : \"not tracked as a document\",\n                    docId: p.docId, go: p.docId ? () => this.setState({ docView: \"phases\", docQ: p.docId, docNote: `Jumped to ${p.docId} from the map.` }) : null });\n                  links.push({ key: \"lr\" + sideKey + tl.id + j,\n                    d: elbow(sideKey === \"R\" ? dx + 186 : dx, ty, sideKey === \"R\" ? rx : rx + 236, ry) });\n                });\n              } else {\n                const dxr = box(sideKey, DEEP_X, 186);\n                const rx = sideKey === \"R\" ? dxr + 186 + 34 : dxr - 34 - 236;\n                const p = pub(tl.t);\n                chips.push({ key: sideKey + \"rr\" + sc.id + i, x: rx, y: ty - 12, w: 236, h: 24, t: tl.t,\n                  fill: p.done ? \"#E4F0E8\" : \"#FFFFFF\",\n                  stroke: p.done ? \"#17693A\" : (p.docId ? \"#8A5A00\" : \"#C4C1C1\"),\n                  fg: p.done ? \"#17693A\" : \"#54585B\",\n                  title: p.docId ? `${p.docId} — ${p.s}` : \"not tracked as a document\",\n                  docId: p.docId, go: p.docId ? () => this.setState({ docView: \"phases\", docQ: p.docId, docNote: `Jumped to ${p.docId} from the map.` }) : null });\n                links.push({ key: \"lrr\" + sideKey + sc.id + i,\n                  d: elbow(sideKey === \"R\" ? sx + 196 : sx, sy, sideKey === \"R\" ? rx : rx + 236, ty) });\n              }\n            });\n          });\n        });\n      });\n    });\n\n    /* Labels are HTML boxes positioned over an SVG that draws only the\n       connectors. A {{ }} hole inside an SVG <text> is emitted as an HTML\n       <span>, which SVG cannot lay out — every label measured 0×0 and the map\n       drew as empty outlines. HTML labels also wrap instead of being clipped to\n       a character count, so nothing has to be truncated to fit. */\n    const all = [...nodes, ...chips];\n    const pad = 40;\n    const minX = Math.min(-110, ...all.map(n => n.x)) - pad;\n    const maxX = Math.max(110, ...all.map(n => n.x + n.w)) + pad;\n    const minY = Math.min(-30, ...all.map(n => n.y)) - pad;\n    const maxY = Math.max(30, ...all.map(n => n.y + n.h)) + pad;\n    const W = maxX - minX, H = maxY - minY;\n    const place = (n) => {\n      n.left = `${n.x - minX}px`;\n      n.top = `${n.y - minY}px`;\n      n.wpx = `${n.w}px`;\n      n.hpx = `${n.h}px`;\n      n.fs = `${n.size || 9}px`;\n      n.fw = n.weight || 500;\n    };\n    nodes.forEach(n => { place(n); n.centre = n.kind === \"hub\" ? \"center\" : \"flex-start\"; });\n    chips.forEach(c => { c.size = 9.5; place(c); });\n    const z = this.state.mapZoom;\n\n    return {\n      mapError: \"\", hasMapError: false,\n      nodes, links, chips,\n      viewBox: `${minX} ${minY} ${W} ${H}`,\n      innerW: `${W}px`, innerH: `${H}px`,\n      spineLeft: `${-92 - minX}px`, spineTop: `${-15 - minY}px`,\n      scale: `scale(${z})`,\n      frameW: `${Math.round(W * z)}px`, frameH: `${Math.round(H * z)}px`,\n      mapZoom: z,\n      setMapZoom: (e) => this.setState({ mapZoom: Number(e.target.value) }),\n      mapCounts: `${nodes.length} nodes · ${chips.length} records`,\n      mapOpen: this.state.mapOpen,\n      openMap: () => this.setState({ mapOpen: true }),\n      closeMap: () => this.setState({ mapOpen: false }),\n      stopMap: (e) => e.stopPropagation(),\n    };\n  }\n\n  /* The vault. A passphrase derives an AES-GCM key by PBKDF2 and every project\n     write goes through it, so persistent project storage is ciphertext. A\n     temporary key may live in this tab's sessionStorage until its idle deadline;\n     forgetting the passphrase still loses the project and is said plainly. */\n  async installVault(pass, code) {\n    const core = this.state.core;\n    const { deriveKey, seal, KEY, totpValid } = core;\n    this.setState({ vaultBusy: true, vaultErr: \"\" });\n    try {\n      if (String(pass || \"\").length < 10) throw new Error(\"Use at least 10 characters. A passphrase of a few words beats a short complex string.\");\n      const salt = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));\n      const key = await deriveKey(pass, salt);\n      const secret = this.state.vaultTotp || \"\";\n      if (secret && !(await totpValid(secret, code))) throw new Error(\"That code does not match the authenticator. Check it and try again.\");\n      const blob = await seal(key, this.state.st);\n      const auth = await seal(key, { totp: secret || \"\" });\n      const meta = { v: 2, salt, auth: { __enc: 1, ...auth } };\n      core.writeVaultMeta(meta, localStorage);\n      localStorage.setItem(KEY, JSON.stringify({ __enc: true, ...blob }));\n      this.vaultMeta = meta;\n      this.vaultMetaLegacy = false;\n      this.vaultKey = key;\n      await this.startVaultSession(key);\n      this.setState({ vaultBusy: false, vaultPass: \"\", vaultPass2: \"\", vaultCode: \"\", locked: false, encrypted: false, hasVault: true }, () => {\n        this.persistConfig(this.state.cfg || core.defaultSettings(), key, true);\n        this.persistFiles(this.state.files || {}, key, true);\n      });\n      this.say(\"Vault on. This browser's copy is now encrypted.\");\n    } catch (e) {\n      this.setState({ vaultBusy: false, vaultErr: String(e.message || e).slice(0, 240) });\n    }\n  }\n\n  async unlockVault(pass, code) {\n    const core = this.state.core;\n    const { deriveKey, unseal, KEY, totpValid, hydrate, seal } = core;\n    this.setState({ vaultBusy: true, vaultErr: \"\" });\n    try {\n      if (this.lockWrite) await this.lockWrite;\n      const vaultRecord = core.readVaultMeta(localStorage);\n      const meta = vaultRecord.meta || {};\n      const key = await deriveKey(pass, meta.salt);\n      let secret = String(meta.totp || \"\");\n      if (meta.auth) {\n        const auth = await unseal(key, meta.auth);\n        secret = String((auth && auth.totp) || \"\");\n      }\n      if (secret && !(await totpValid(secret, code))) throw new Error(\"That authenticator code is not valid right now.\");\n      const blob = JSON.parse(localStorage.getItem(KEY) || \"{}\");\n      const data = await unseal(key, blob);\n      let files = this.stagedFiles || this.state.files || {};\n      if (!this.stagedFiles && this.storedFilesEncrypted) {\n        try { files = await unseal(key, this.storedFilesEncrypted); }\n        catch (e) { files = {}; }\n      }\n      const localSecrets = core.secretSettings(this.legacyConfigSecrets || this.state.cfg || {});\n      let secretRecovery = { status: \"absent\", anthropicKey: localSecrets.anthropicKey };\n      let secrets = localSecrets;\n      if (this.storedSecretsEncrypted) {\n        if (this.remoteSecretRecoveryStatus === \"pending\" || this.storedSecretsEncrypted.__enc === 1) {\n          secretRecovery = await core.recoverSyncedAnthropicKey(key, this.storedSecretsEncrypted, localSecrets);\n          secrets = { ...localSecrets, anthropicKey: secretRecovery.anthropicKey };\n          if (secretRecovery.status === \"invalid\") {\n            try { localStorage.removeItem(core.CKEY); } catch (e) { /* Invalid remote bytes stay out of durable storage. */ }\n          }\n        } else {\n          try { secrets = core.secretSettings(await unseal(key, this.storedSecretsEncrypted)); }\n          catch (e) { secrets = localSecrets; }\n        }\n      }\n      if (this.remoteSecretRecoveryStatus === \"invalid\") {\n        secretRecovery = { status: \"invalid\", anthropicKey: localSecrets.anthropicKey };\n      }\n      const cfg = core.mergeSettings(this.state.cfg || {}, secrets);\n      if (meta.totp !== undefined || vaultRecord.legacy || !meta.auth) {\n        const auth = await seal(key, { totp: secret });\n        const migrated = { v: 2, salt: meta.salt, auth: { __enc: 1, ...auth } };\n        core.writeVaultMeta(migrated, localStorage);\n        this.vaultMeta = migrated;\n        this.vaultMetaLegacy = false;\n      } else this.vaultMeta = meta;\n      this.vaultKey = key;\n      this.stagedFiles = null;\n      this.storedFilesEncrypted = null;\n      this.storedSecretsEncrypted = null;\n      this.legacyConfigSecrets = null;\n      this.remoteSecretRecoveryStatus = null;\n      await this.startVaultSession(key);\n      const st = this.propagate(this.state.core, hydrate(data));\n      this.setState({ vaultBusy: false, locked: false, encrypted: false, st, files, cfg, vaultPass: \"\", vaultCode: \"\" }, () => {\n        this.persistConfig(cfg, key, true);\n        this.persistFiles(files, key, true);\n        if (secretRecovery.status === \"invalid\") this.say(this.cloudSecretWarning(secretRecovery.anthropicKey));\n      });\n    } catch (e) {\n      this.setState({ vaultBusy: false, vaultErr: \"That passphrase did not open the vault.\" });\n    }\n  }\n\n  async removeVault() {\n    const core = this.state.core;\n    const { KEY, dropSession } = core;\n    if (!confirm(\"Turn the vault off? Browser storage goes back to plain JSON on this machine.\")) return;\n    this.lockWriteGeneration = (this.lockWriteGeneration || 0) + 1;\n    try {\n      core.dropVaultMeta(localStorage);\n      localStorage.setItem(KEY, JSON.stringify(this.state.st));\n      localStorage.setItem(core.FKEY, JSON.stringify(this.state.files || {}));\n    } catch (e) { /* quota */ }\n    dropSession();\n    clearTimeout(this.sessionT);\n    this.vaultKey = null;\n    this.vaultMeta = null;\n    this.storedFilesEncrypted = null;\n    this.storedSecretsEncrypted = null;\n    this.tabSessionExpected = false;\n    this.setState({ hasVault: false, locked: false, encrypted: false, vaultErr: \"\" }, () => {\n      this.persistConfig(this.state.cfg || core.defaultSettings(), null, false);\n      this.persistFiles(this.state.files || {}, null, false);\n    });\n    this.say(\"Vault off. This browser's copy is plain JSON again.\");\n  }\n\n  /* Cloud sync. The state object is sealed with the vault key before it leaves,\n     so jsonbin holds ciphertext it cannot read. Attachments live under their own\n     key and are never part of this payload. */\n  scheduleAutoPush() {\n    clearTimeout(this.autoSyncT);\n    const cfg = this.state.cfg || {};\n    if (!cfg.autoSync || !cfg.jbKey) return;\n    this.autoSyncT = setTimeout(() => this.syncPush({ auto: true }), 1800);\n  }\n\n  stageRemoteVault(payload, cfg) {\n    const core = this.state.core;\n    if (!payload.vault || !payload.vault.salt || !payload.vault.auth) {\n      throw new Error(\"That encrypted copy has no portable vault metadata. Unlock the matching local vault first.\");\n    }\n    if (!payload.tracker || !(payload.tracker.__enc || payload.tracker.enc)) throw new Error(\"The encrypted cloud record is incomplete.\");\n    this.stagedFiles = this.state.files || {};\n    this.storedFilesEncrypted = null;\n    this.legacyConfigSecrets = core.secretSettings(cfg);\n    this.remoteSecretRecoveryStatus = payload.secrets == null\n      ? \"absent\"\n      : core.isSealedSecretRecord(payload.secrets) ? \"pending\" : \"invalid\";\n    this.storedSecretsEncrypted = this.remoteSecretRecoveryStatus === \"pending\" ? payload.secrets : null;\n    const nextCfg = core.mergeSettings({ ...cfg, ...(payload.prefs || {}) }, cfg);\n    try {\n      localStorage.setItem(core.KEY, JSON.stringify({ __enc: true, ...payload.tracker }));\n      core.writeVaultMeta(payload.vault, localStorage);\n      localStorage.setItem(core.SKEY, JSON.stringify(core.publicSettings(nextCfg)));\n      if (this.storedSecretsEncrypted) localStorage.setItem(core.CKEY, JSON.stringify(this.storedSecretsEncrypted));\n      else localStorage.removeItem(core.CKEY);\n    } catch (e) { throw new Error(\"The cloud copy was valid, but this browser could not stage it safely.\"); }\n    core.dropSession();\n    clearTimeout(this.sessionT);\n    this.vaultKey = null;\n    this.vaultMeta = payload.vault;\n    this.tabSessionExpected = false;\n    this.setState({\n      cfg: nextCfg, hasVault: true, locked: true, encrypted: true,\n      syncBusy: false, syncMsg: \"Cloud copy staged. Unlock it with that project's passphrase and authenticator code.\",\n      vaultPass: \"\", vaultCode: \"\", vaultErr: this.remoteSecretRecoveryStatus === \"invalid\"\n        ? `Cloud copy pulled. Unlock it to finish replacing this browser's project. ${this.cloudSecretWarning(this.legacyConfigSecrets.anthropicKey)}`\n        : \"Cloud copy pulled. Unlock it to finish replacing this browser's project.\",\n    });\n  }\n\n  cloudSecretWarning(anthropicKey) {\n    return anthropicKey\n      ? \"Project restored. The cloud API-key record could not be opened, so this browser's existing API key was kept. Re-enter the API key and push to cloud once to repair the cloud copy.\"\n      : \"Project restored. The cloud API-key record could not be opened, so no API key was restored. Re-enter it and push to cloud once to repair the cloud copy.\";\n  }\n\n  async syncPush(options) {\n    const automatic = !!(options && options.auto);\n    if (this.syncPushActive || this.state.syncBusy) { if (automatic) this.autoPushQueued = true; return; }\n    this.syncPushActive = true;\n    const { jbPush, jbCreate, buildPayload, readVaultMeta } = this.state.core;\n    const cfg = this.state.cfg || {};\n    this.setState({ syncBusy: true, syncMsg: \"\" });\n    let message = \"\";\n    try {\n      if (!cfg.jbKey) throw new Error(\"Add your jsonbin master key first.\");\n      if (this.state.hasVault && !this.vaultKey) throw new Error(\"Unlock the vault before pushing an encrypted copy.\");\n      const meta = this.vaultMeta || readVaultMeta(localStorage).meta;\n      const payload = await buildPayload(this.state.st, cfg, meta, this.vaultKey);\n      let id = cfg.jbId;\n      if (!id) id = await jbCreate(cfg.jbKey, payload);\n      else await jbPush(cfg.jbKey, id, payload);\n      const at = new Date().toISOString();\n      this.upCfg({ jbId: id, lastSync: at });\n      message = this.vaultKey\n        ? \"Pushed, encrypted with your vault passphrase.\"\n        : \"Pushed. No vault is on, so this copy is readable by anyone with the key — turn the vault on first if that matters.\";\n    } catch (e) { message = \"Push failed: \" + String(e.message || e).slice(0, 200); }\n    this.setState({ syncBusy: false, syncMsg: message }, () => {\n      this.syncPushActive = false;\n      if (this.autoPushQueued) { this.autoPushQueued = false; this.scheduleAutoPush(); }\n    });\n  }\n\n  async syncPull(options) {\n    const automatic = !!(options && options.auto);\n    if (this.syncPushActive || this.state.syncBusy) return;\n    const core = this.state.core;\n    const { jbPull, unseal, hydrate, readPayload } = core;\n    const cfg = this.state.cfg || {};\n    this.setState({ syncBusy: true, syncMsg: \"\" });\n    try {\n      if (!cfg.jbKey || !cfg.jbId) throw new Error(\"Add your jsonbin key and bin id first.\");\n      const ask = !options || options.confirm !== false;\n      if (ask && !confirm(\"Pull replaces this browser's project with the cloud copy. Download a backup first if you are unsure.\")) {\n        this.setState({ syncBusy: false }); return;\n      }\n      const payload = readPayload(await jbPull(cfg.jbKey, cfg.jbId));\n      let data = payload.tracker;\n      if (payload.enc) {\n        const sameVault = this.vaultKey && (!payload.vault || (this.vaultMeta && payload.vault.salt === this.vaultMeta.salt));\n        if (!sameVault) { this.stageRemoteVault(payload, cfg); return; }\n        try { data = await unseal(this.vaultKey, payload.tracker); }\n        catch (e) { throw new Error(\"The cloud project record could not be authenticated. Nothing was replaced.\"); }\n      }\n      const st = this.propagate(core, hydrate(data));\n      const localSecrets = core.secretSettings(cfg);\n      const secretRecovery = await core.recoverSyncedAnthropicKey(this.vaultKey, payload.secrets, localSecrets);\n      const secrets = { ...localSecrets, anthropicKey: secretRecovery.anthropicKey };\n      const nextCfg = core.mergeSettings({ ...cfg, ...(payload.prefs || {}) }, secrets);\n      this.setState({\n        syncBusy: false, st, cfg: nextCfg,\n        syncMsg: secretRecovery.status === \"invalid\"\n          ? this.cloudSecretWarning(secretRecovery.anthropicKey)\n          : automatic ? \"Automatic pull completed.\" : \"Pulled and validated.\",\n      }, () => {\n        this.persist(st, { skipAuto: true });\n        this.persistConfig(nextCfg);\n      });\n    } catch (e) { this.setState({ syncBusy: false, syncMsg: \"Pull failed: \" + String(e.message || e).slice(0, 200) }); }\n  }\n\n  async testSyncConnection() {\n    if (this.state.syncBusy) return;\n    const core = this.state.core;\n    const cfg = this.state.cfg || {};\n    this.setState({ syncBusy: true, syncMsg: \"\" });\n    try {\n      if (!cfg.jbKey || !cfg.jbId) throw new Error(\"Add both the jsonbin master key and Bin ID first.\");\n      const payload = core.readPayload(await core.jbPull(cfg.jbKey, cfg.jbId));\n      if (!payload.tracker) throw new Error(\"The bin is reachable, but it does not contain a tracker record.\");\n      if (payload.enc && !(payload.tracker.iv && payload.tracker.ct)) throw new Error(\"The bin contains an incomplete encrypted tracker record.\");\n      this.setState({ syncBusy: false, syncMsg: `Connection works. Tracker payload v${payload.v}${payload.enc ? \" is encrypted\" : \" is readable\"}.` });\n    } catch (e) { this.setState({ syncBusy: false, syncMsg: \"Connection failed: \" + String(e.message || e).slice(0, 200) }); }\n  }\n\n  copyConnectionCode() {\n    try {\n      const code = this.state.core.encodeConnection(this.state.cfg || {});\n      if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error(\"Clipboard access is unavailable. Copy from a secure password manager instead.\");\n      navigator.clipboard.writeText(code);\n      this.setState({ syncMsg: \"Connection code copied. It grants access to the private bin — treat it as a secret.\" });\n    } catch (e) { this.setState({ syncMsg: String(e.message || e).slice(0, 200) }); }\n  }\n\n  applyConnectionCode() {\n    try {\n      const decoded = this.state.core.decodeConnection(this.state.syncCode);\n      this.upCfg({ jbKey: decoded.jbKey, jbId: decoded.jbId });\n      this.setState({ syncCode: \"\", syncMsg: \"Connection code applied. Test the connection before pulling.\" });\n    } catch (e) { this.setState({ syncMsg: String(e.message || e).slice(0, 200) }); }\n  }\n\n  /* The assistant. Two ways in: ask it something, or select text anywhere in the\n     tracker and press Explain. It is given the current tab and the live counts,\n     so \"what should I do next\" gets an answer about this project rather than\n     about ISO 27001 in general. It never writes to the project. */\n  componentDidUpdate() {\n    if (this.selBound) return;\n    this.selBound = true;\n    document.addEventListener(\"selectionchange\", () => {\n      const t = String(document.getSelection() || \"\").trim();\n      if (t.length > 3 && t.length < 1200) this.setState({ aiSel: t.slice(0, 1200) });\n      else if (!t) this.setState({ aiSel: \"\" });\n    });\n  }\n\n  aiContext() {\n    const st = this.state.st;\n    if (!st) return \"\";\n    const m = this.metrics(this.schedule());\n    const tab = (NAV[this.state.tab] || {}).n;\n    return [\n      `The user is on the \"${tab}\" tab.`,\n      `Organisation: ${st.project.company || \"unnamed\"}.`,\n      `Mandatory documents outstanding: ${m.mandOut} of ${m.mandN}.`,\n      `Sub-clauses verified: ${m.clVer} of ${m.clApp}.`,\n      `Annex A: ${m.appN} applicable, ${m.exclN} excluded, ${m.ctImp} implemented, ${m.noWhy} exclusions unjustified.`,\n      `Risks: ${st.risks.length} logged, ${m.outside} above the acceptance threshold of ${st.threshold}.`,\n      `Risk method: ${st.rmethod || \"asset\"}, ${st.ranalysis || \"qualitative\"}.`,\n    ].join(\" \");\n  }\n\n  async askAssistant(question, selection) {\n    const { askClaude, SYSTEM } = this.state.core;\n    this.setState({ aiBusy: true, aiA: \"\" });\n    try {\n      const prompt = selection\n        ? `${this.aiContext()}\\n\\nThe user selected this text in the tracker and asked for an explanation:\\n\\n\"\"\"${selection}\"\"\"\\n\\n${question || \"Explain what this means and what it requires of them.\"}`\n        : `${this.aiContext()}\\n\\n${question}`;\n      const text = await askClaude({\n        system: SYSTEM, messages: [{ role: \"user\", content: prompt }],\n        apiKey: (this.state.cfg || {}).anthropicKey,\n      });\n      this.setState({ aiBusy: false, aiA: String(text || \"\").trim() || \"No answer came back.\" });\n    } catch (e) {\n      this.setState({ aiBusy: false, aiA: \"Could not reach the model: \" + String(e.message || e).slice(0, 220) });\n    }\n  }\n\n  /* docxFrom and xlsxFrom hand back a Blob — this is what actually saves it. */\n  saveBlob(blob, name) {\n    if (!blob) { this.say(\"Nothing to export.\"); return; }\n    const a = document.createElement(\"a\");\n    a.href = URL.createObjectURL(blob);\n    a.download = name.replace(/[\\\\/:*?\"<>|]/g, \"-\");\n    a.click();\n    setTimeout(() => URL.revokeObjectURL(a.href), 4000);\n  }\n\n  say(t) {\n    clearTimeout(this.noteT);\n    this.setState({ docNote: t });\n    this.noteT = setTimeout(() => this.setState({ docNote: \"\" }), 5000);\n  }\n\n  /* Attachments live under thei soa,\n      isPlan: tab === 1,\n      isPlanDesk: tab === 1 && !mobile,\n      isPlanMobile: tab === 1 && mobile,\n      isDocs: tab === 2,\n      isDocsDesk: tab === 2 && !mobile,\n      isDocsMobile: tab === 2 && mobile,\n      isClauses: tab === 3,\n      isClDesk: tab === 3 && !mobile,\n      isClMobile: tab === 3 && mobile,\n      isRisks: tab === 4,\n      isSoa: tab === 5,\n      isSoaDesk: tab === 5 && !mobile,\n      isSoaMobile: tab === 5 && mobile,\n      gateEyebrow: gate ? \"Stage 2\" : \"Gates open\",\n      gateColor: gate ? \"var(--success-text)\" : \"var(--danger-text)\",\n      gateReadout: gate ? \"READY\" : `${open}/4 OPEN`,\n      gateWord: gate ? \"READY\" : \"NOT READY\",\n      gateCount: open ? `${open} OF 4 GATES OPEN` : \"4 OF 4 GATES CLEAR\",\n      clear: open === 0,\n      hasBlockers: open > 0,\n      blockers: gateSegments.filter(item => item.n > 0),\n      gateSegments,\n      overviewMetrics,\n      nextMove: nextMove || {},\n      hasNextMove: !!nextMove,\n      noNextMove: !nextMove,\n      overviewPriorities,\n      priorityCount: overviewPriorities.length\n        ? `${overviewPriorities.length} ACTION${overviewPriorities.length === 1 ? \"\" : \"S\"}` : \"ALL CLEAR\",\n      hasOverviewPriorities: overviewPriorities.length > 0,\n      noOverviewPriorities: overviewPriorities.length === 0,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>\n"
  </script>
