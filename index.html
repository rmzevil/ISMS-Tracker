  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n<script src=\"16b14766-4fa2-48c7-bde4-3f6fd91ccde1\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>ISMS Tracker — ISO/IEC 27001:2022<\u002Ftitle>\n<style>\n  /* The palette, named by role rather than by hue, so the dark theme is a\n     value swap and not a second stylesheet. Split into text and fill variants\n     because the same charcoal that reads as ink on paper has to become a\n     visible button face on a dark page — inverting one token for both roles\n     puts white text on a white button. */\n  :root {\n    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;\n    --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;\n    --page: #EFEDED;\n    --surface: #FFFFFF;\n    --subtle: #F7F6F6;\n    --sunken: #E4E2E1;\n    --line: #E1DEDE;\n    --line-2: #C4C1C1;\n    --wire: #A29F9F;\n    --hair: #F1EFEF;\n    --ink: #2C2D2E;\n    --ink-2: #54585B;\n    --ink-3: #65696C;\n    --faint: #6E6A6A;\n    --solid: #2C2D2E;\n    --solid-hover: #1E1F20;\n    --on-fill: #FFFFFF;\n    --accent: #CC000E;\n    --accent-fill: #CC000E;\n    --accent-wash: #FBE7E8;\n    --danger: #B6000C;\n    --danger-fill: #B6000C;\n    --ok: #17693A;\n    --ok-fill: #17693A;\n    --ok-wash: #E4F0E8;\n    --warn: #8A5A00;\n    --warn-fill: #8A5A00;\n    --warn-fill-2: #B85A18;\n    --warn-wash: #FBEEDC;\n    /* Done, not yet checked by you. Its own hue, because it used to share the\n       gap red — which put two identical red swatches in the legend. */\n    --info: #1C5C86;\n    --info-fill: #1C5C86;\n    --info-wash: #E5EFF6;\n    --danger-wash: #FBE3E4;\n    --scrim: rgba(44,45,46,.5);\n    --scrim-2: rgba(44,45,46,.55);\n    --on-fill-dim: #B9B6B6;\n    --stamp: rgba(255,255,255,.72);\n    --shadow: rgba(44,45,46,.3);\n    /* The focus ring was --accent-wash, which is a near-black in dark mode:\n       the ring existed and could not be seen. A translucent accent works on\n       either page. */\n    --focus-ring: rgba(204,0,14,.16);\n    --ping: rgba(204,0,14,.5);\n    --ping-out: rgba(204,0,14,0);\n    color-scheme: light;\n  }\n  html[data-theme=\"dark\"] {\n    --page: #16171A;\n    --surface: #1E2023;\n    --subtle: #24262A;\n    --sunken: #2B2E33;\n    --line: #32353A;\n    --line-2: #474B52;\n    --wire: #7A8088;\n    --hair: #26292D;\n    --ink: #EDEBE9;\n    --ink-2: #C2C5C9;\n    --ink-3: #9BA0A5;\n    --faint: #8E9298;\n    --solid: #3E434A;\n    --solid-hover: #4A5057;\n    --on-fill: #FFFFFF;\n    --accent: #F0555F;\n    --accent-fill: #C81E29;\n    --accent-wash: #38191C;\n    --danger: #FF8A90;\n    --danger-fill: #B02028;\n    --ok: #5FBE87;\n    --ok-fill: #1E6B3E;\n    --ok-wash: #17301F;\n    --warn: #E0A83A;\n    --warn-fill: #7A5410;\n    --warn-fill-2: #B2551C;\n    --warn-wash: #3A2A10;\n    --info: #6FB3E4;\n    --info-fill: #1D5480;\n    --info-wash: #15283A;\n    --danger-wash: #3B1A1C;\n    --scrim: rgba(0,0,0,.62);\n    --scrim-2: rgba(0,0,0,.66);\n    --on-fill-dim: #B9B6B6;\n    --stamp: rgba(30,32,35,.72);\n    --shadow: rgba(0,0,0,.5);\n    --focus-ring: rgba(240,85,95,.34);\n    --ping: rgba(240,85,95,.42);\n    --ping-out: rgba(240,85,95,0);\n    color-scheme: dark;\n  }\n<\u002Fstyle>\n<script>\n  /* Applied before the first paint, so a dark-mode user never sees a light\n     flash. Only the word \"light\" or \"dark\" is stored, and it is stored outside\n     the vault: appearance is not a secret, and the lock screen needs it too. */\n  (function () {\n    try {\n      var t = localStorage.getItem(\"isms-theme\");\n      document.documentElement.setAttribute(\"data-theme\", t === \"dark\" ? \"dark\" : \"light\");\n    } catch (e) { document.documentElement.setAttribute(\"data-theme\", \"light\"); }\n  })();\n<\u002Fscript>\n<style>\n  html, body { background: var(--page); margin: 0; }\n  body::before { content: \"\"; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;\n    background-image: radial-gradient(var(--line) .6px, transparent .6px); background-size: 15px 15px; }\n  * { box-sizing: border-box; }\n  *:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }\n  ::selection { background: var(--accent-wash); color: var(--ink); }\n  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-wash); }\n  a:hover { color: var(--danger); border-bottom-color: var(--danger); }\n  input, select, textarea { font-family: var(--mono); accent-color: var(--accent); }\n  input[type=text], input[type=date], input[type=number], input[type=password], textarea, select {\n    border: 1px solid var(--line-2); border-radius: 2px; padding: 5px 7px; font-size: 11.5px;\n    background: var(--surface); color: var(--ink); max-width: 100%; }\n  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus-ring); }\n  table { border-collapse: separate; border-spacing: 0; }\n  tbody tr { transition: background .13s ease; }\n  tbody tr:hover { background: var(--subtle); }\n  /* Buttons carry most of this app's interaction, so they get a real press:\n     a lift with a soft cast shadow and a top sheen on hover, a short squash on\n     the press. Every property here is one the inline styles never set — the\n     colour of a button stays the button's own business. */\n  button { font-family: var(--sans); -webkit-tap-highlight-color: transparent;\n    transition: transform .16s cubic-bezier(.2,.8,.3,1), box-shadow .2s ease, filter .2s ease,\n      background .16s ease, color .16s ease, border-color .16s ease; }\n  button:not(:disabled):hover { transform: translateY(-1.5px);\n    filter: saturate(1.07) brightness(1.06);\n    box-shadow: 0 7px 18px -8px var(--shadow), inset 0 1px 0 rgba(255,255,255,.18); }\n  button:not(:disabled):active { transform: translateY(0) scale(.975); filter: brightness(.95);\n    box-shadow: inset 0 2px 4px rgba(0,0,0,.2); transition-duration: .06s; }\n  button:disabled { filter: grayscale(.4); cursor: not-allowed; }\n  /* The file pickers are labels wearing a button's clothes. They answer the\n     pointer the same way or half the row looks dead. */\n  label:has(> input[type=file]) { transition: transform .16s cubic-bezier(.2,.8,.3,1), box-shadow .2s ease, filter .2s ease; }\n  label:has(> input[type=file]):hover { transform: translateY(-1.5px); filter: brightness(1.06);\n    box-shadow: 0 7px 18px -8px var(--shadow); }\n  label:has(> input[type=file]):active { transform: translateY(0) scale(.975); filter: brightness(.95); }\n  .scroller { overflow: auto; -webkit-overflow-scrolling: touch; }\n  .scroller::-webkit-scrollbar { height: 11px; width: 11px; }\n  .scroller::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 6px; }\n  .scroller::-webkit-scrollbar-track { background: var(--sunken); }\n  @keyframes fadeUp { from { opacity: 0; transform: translateY(7px) } to { opacity: 1; transform: none } }\n  @keyframes stampIn { from { opacity: 0; transform: scale(1.3) rotate(-9deg) } to { opacity: 1; transform: scale(1) rotate(-1.2deg) } }\n  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }\n  @keyframes sweep { from { background-position: 200% 0 } to { background-position: -200% 0 } }\n  @keyframes rowflash { 0%, 100% { background: transparent } 18%, 62% { background: var(--accent-wash) } }\n  /* Take me there has to land somewhere visible: the section it opens gets a\n     ring that fades, so the eye finds it without the page moving again. */\n  @keyframes spotRing { 0% { box-shadow: 0 0 0 0 var(--ping) } 55% { box-shadow: 0 0 0 6px var(--ping-out) } 100% { box-shadow: 0 0 0 0 var(--ping-out) } }\n  .spot { animation: spotRing 2.2s cubic-bezier(.2,.7,.3,1) 2 both; scroll-margin: 110px;\n    border-color: var(--accent) !important; }\n  @keyframes annBlink { 0%, 92%, 100% { transform: scaleY(1) } 95%, 97% { transform: scaleY(.12) } }\n  @keyframes annBob { 0%, 100% { transform: translateY(0) rotate(0deg) } 50% { transform: translateY(-2.5px) rotate(-1.5deg) } }\n  @keyframes annThink { 0%, 100% { opacity: .25; transform: translateY(0) } 50% { opacity: 1; transform: translateY(-2px) } }\n  @keyframes annPing { 0% { box-shadow: 0 0 0 0 var(--ping) } 70%, 100% { box-shadow: 0 0 0 12px var(--ping-out) } }\n  /* The character. Eyes track the cursor through two custom properties written\n     straight onto the element, so following the mouse costs no re-render. */\n  .annexa { animation: annBob 3.6s ease-in-out infinite; }\n  .annexa .eye { transform-origin: center; animation: annBlink 5.2s ease-in-out infinite; }\n  .annexa .pupil { transform: translate(var(--ax, 0px), var(--ay, 0px)); transition: transform .16s cubic-bezier(.2,.7,.3,1); }\n  .annexa.busy-face .eye { animation: annBlink 1.1s ease-in-out infinite; }\n  .annexa .dot { animation: annThink 1s ease-in-out infinite; }\n  .annexa .dot:nth-child(2) { animation-delay: .16s; }\n  .annexa .dot:nth-child(3) { animation-delay: .32s; }\n  /* Overrules the group's stroke attribute, so the map's wire colour lives here\n     and nowhere else. non-scaling-stroke belongs with it: stroke-width is in user\n     units, so without it a zoomed-out map draws sub-pixel lines and the tree\n     reads as boxes floating with no structure. */\n  svg[role=\"presentation\"] g[stroke] { stroke: var(--wire); }\n  svg[role=\"presentation\"] g[stroke] path { vector-effect: non-scaling-stroke; }\n  .annexa-btn:hover .annexa { animation-duration: 1.1s; }\n  .annexa-ping { animation: annPing 1.9s ease-out infinite; }\n  .annexa-bubble { opacity: 0; transform: translateY(4px); transition: opacity .18s ease, transform .18s ease; pointer-events: none; }\n  .annexa-btn:hover .annexa-bubble, .annexa-btn:focus-visible .annexa-bubble { opacity: 1; transform: none; }\n  @media (prefers-reduced-motion: reduce) {\n    .annexa, .annexa .eye, .annexa .dot, .annexa-ping, .spot { animation: none !important; }\n  }\n  .pane { animation: fadeUp .3s cubic-bezier(.2,.7,.3,1) both; }\n  /* An element that animates transform with fill-mode both keeps a matrix\n     forever, and a transformed ancestor becomes the containing block for its\n     fixed-position descendants — which put the character, the assistant and\n     every overlay off-screen. <main> gets an opacity-only entrance so nothing\n     inside it is re-anchored. */\n  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }\n  main.pane { animation: fadeIn .3s ease both; }\n  .stamp { animation: stampIn .5s cubic-bezier(.2,1.3,.4,1) both; }\n  .flashrow { animation: rowflash 1.9s ease-in-out 3; box-shadow: inset 3px 0 0 var(--accent); }\n  .card { transition: box-shadow .2s ease, transform .2s ease, border-color .2s ease; }\n  .card:hover { box-shadow: 0 8px 22px -8px var(--shadow); transform: translateY(-2px); border-color: var(--line-2); }\n  .navitem { transition: background .16s ease, border-color .16s ease, padding-left .16s ease; }\n  .navitem:hover { background: var(--subtle); border-left-color: var(--danger) !important; }\n  .busy { background: linear-gradient(90deg, transparent, var(--accent-wash), transparent); background-size: 200% 100%; animation: sweep 1.1s linear infinite; }\n  @media (max-width: 859px) {\n    [data-stack] { grid-template-columns: 1fr !important; }\n    [data-wordmark], [data-settings-word], [data-ai-word] { display: none !important; }\n    [data-org] { border-left: none !important; padding-left: 0 !important; }\n  }\n  @keyframes slideIn { from { transform: translateX(-100%) } to { transform: none } }\n  [data-drawer=\"yes\"] { animation: slideIn .22s cubic-bezier(.2,.7,.3,1) both; }\n\n  /* ── depth and response ──────────────────────────────────────────────────\n     The tracker is a working instrument, so the motion budget goes on feedback\n     the eye needs — where am I, what did I just change, is this thing live —\n     and nowhere else. Every rule here is a hover, focus or state response;\n     nothing loops, nothing decorates. */\n  html { scroll-behavior: smooth; }\n  .scroller::-webkit-scrollbar-thumb:hover { background: var(--accent); }\n  /* The rail on the header carries readiness: four gates, one bar. */\n  [data-gatebar] { transition: width .6s cubic-bezier(.2,.7,.3,1); }\n  /* Section cards in a dialog answer the pointer the same way overview cards do. */\n  [data-set-body] section { transition: border-color .2s ease, box-shadow .2s ease; }\n  [data-set-body] section:hover { border-color: var(--line-2); box-shadow: 0 6px 18px -8px var(--shadow); }\n  [data-set-rail] button:focus-visible { outline-offset: -2px; }\n  /* The settings rail turns into a strip above the pane on a narrow screen, and\n     the sliding marker goes with it — a vertical pip has nothing to mark once\n     the buttons run left to right. */\n  @media (max-width: 859px) {\n    [data-set-rail] { flex-direction: row !important; overflow-x: auto; overflow-y: hidden;\n      border-right: none !important; border-bottom: 1px solid var(--line-2); padding: 9px 10px !important; }\n    [data-set-pip] { display: none !important; }\n  }\n  /* ── the phone tier ──────────────────────────────────────────────────────\n     Below 520px the header runs out of room before it runs out of controls,\n     and an 11px utility button is a 22px touch target. Floors on anything you\n     have to hit, tighter chrome, and 16px on every field — iOS zooms the whole\n     page when a smaller one takes focus and never zooms back out. */\n  @media (max-width: 519px) {\n    [data-app-header] { gap: 7px !important; padding: 9px 11px !important; }\n    [data-gate-eyebrow] { display: none !important; }\n    [data-app-main] { padding: 14px 12px 72px !important; }\n    [data-overlay] { padding: 54px 9px 12px !important; }\n    [data-app-main] button, [data-overlay] button, [data-app-header] button { min-height: 34px; }\n    input[type=text], input[type=date], input[type=number], input[type=password], textarea, select {\n      font-size: 16px !important; min-height: 40px; }\n    [data-org] { flex-basis: 100%; }\n    .stamp { transform: none !important; animation: none !important; }\n    input[type=range] { height: 32px; }\n  }\n  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family: var(--sans); background: var(--page); color: var(--ink); min-height: 100vh; font-size: 13px\">\n\n  <sc-if value=\"{{ resuming }}\">\n    <div data-overlay=\"\" style=\"position: fixed; inset: 0; z-index: 91; background: var(--page); display: flex; align-items: center; justify-content: center; padding: 24px\">\n      <div style=\"text-align: center\">\n        <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-3)\">ISMS Tracker<\u002Fdiv>\n        <div style=\"font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); margin-top: 9px\">Reopening this session…<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showLock }}\">\n    <div data-overlay=\"\" style=\"position: fixed; inset: 0; z-index: 90; background: var(--page); display: flex; align-items: center; justify-content: center; padding: 24px\">\n      <div class=\"pane\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Unlock the vault\" style=\"background: var(--surface); border: 1px solid var(--line-2); border-top: 3px solid var(--accent); border-radius: 4px; padding: 26px; max-width: 460px; width: 100%; box-shadow: 0 22px 60px -20px var(--shadow)\">\n        <span style=\"display: inline-flex; align-items: center; gap: 9px; margin-bottom: 14px\">\n          <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 64 64\" role=\"img\" aria-label=\"ISMS Tracker\">\n            <path d=\"M5 5h54v33c0 11.5-12 18.5-27 21C17 56.5 5 49.5 5 38Z\" fill=\"#E3000F\"><\u002Fpath>\n            <text x=\"32\" y=\"35.5\" text-anchor=\"middle\" font-size=\"19.5\" font-weight=\"800\" fill=\"#ffffff\" letter-spacing=\"-0.4\">ISMS<\u002Ftext>\n          <\u002Fsvg>\n          <span style=\"font-size: 15px; font-weight: 700\">ISMS Tracker<\u002Fspan>\n        <\u002Fspan>\n        <h1 style=\"margin: 0 0 5px; font-size: 19px; font-weight: 700; letter-spacing: -.01em\">This project is encrypted<\u002Fh1>\n        <p style=\"margin: 0 0 16px; font-size: 12.5px; line-height: 1.65; color: var(--ink-2); text-wrap: pretty\">Your passphrase derives the key that decrypts it. It is never stored, so there is no way to recover the project without it.<\u002Fp>\n        <div style=\"display: grid; gap: 9px\">\n          <input type=\"password\" value=\"{{ vaultPass }}\" sc-camel-on-change=\"{{ setVaultPass }}\" placeholder=\"Passphrase\" aria-label=\"Passphrase\" style=\"width: 100%; min-height: 42px\">\n          <input type=\"text\" value=\"{{ vaultCode }}\" sc-camel-on-change=\"{{ setVaultCode }}\" placeholder=\"Authenticator code, if you set one\" aria-label=\"Authenticator code\" inputmode=\"numeric\" style=\"width: 100%; min-height: 42px\">\n          <button sc-camel-on-click=\"{{ unlock }}\" disabled=\"{{ vaultBusy }}\" style=\"font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .07em; padding: 12px; min-height: 44px; border: none; border-radius: 2px; background: var(--accent-fill); color: var(--on-fill); cursor: pointer\">UNLOCK<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasVaultErr }}\">\n          <div style=\"margin-top: 11px; background: var(--danger-wash); border-left: 3px solid var(--danger); border-radius: 2px; padding: 10px 12px; font-size: 12px; line-height: 1.55\">{{ vaultErr }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line)\">\n          <p style=\"margin: 0 0 9px; font-size: 11.5px; line-height: 1.6; color: var(--ink-3); text-wrap: pretty\">Not your project, or no passphrase was ever set on this browser?<\u002Fp>\n          <button sc-camel-on-click=\"{{ abandonVault }}\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 9px 12px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer\" style-hover=\"border-color: var(--accent); color: var(--accent)\">START A FRESH PROJECT<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <header data-app-header=\"\" style=\"position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 2px solid var(--ink); display: flex; align-items: center; gap: 12px; padding: 12px 20px; box-shadow: 0 4px 14px -6px var(--shadow)\">\n    <div aria-hidden=\"true\" style=\"position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; background: var(--sunken)\">\n      <div data-gatebar=\"\" style=\"height: 100%; width: {{ gateFill }}; background: {{ gateColor }}\"><\u002Fdiv>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ toggleNav }}\" aria-label=\"{{ navBtnLabel }}\" aria-expanded=\"{{ navOpen }}\" title=\"{{ navBtnLabel }}\" style=\"font-family: var(--mono); font-size: 15px; line-height: 1; padding: 8px 11px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 600\">{{ navGlyph }}<\u002Fbutton>\n    <span style=\"display: inline-flex; align-items: center; gap: 9px; flex-shrink: 0\">\n      <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 64 64\" role=\"img\" aria-label=\"ISMS Tracker\" style=\"display: block; flex-shrink: 0\">\n        <path d=\"M5 5h54v33c0 11.5-12 18.5-27 21C17 56.5 5 49.5 5 38Z\" fill=\"#E3000F\"><\u002Fpath>\n        <text x=\"32\" y=\"35.5\" text-anchor=\"middle\" font-size=\"19.5\" font-weight=\"800\" fill=\"#ffffff\" letter-spacing=\"-0.4\">ISMS<\u002Ftext>\n      <\u002Fsvg>\n      <span style=\"line-height: 1.15\" data-wordmark=\"\">\n        <span style=\"display: block; font-size: 15px; font-weight: 700; color: var(--ink); letter-spacing: -.015em\">ISMS Tracker<\u002Fspan>\n        <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; color: var(--ink-3); letter-spacing: .02em\">ISO/IEC 27001:2022<\u002Fspan>\n      <\u002Fspan>\n    <\u002Fspan>\n    <div style=\"flex: 1; min-width: 0; border-left: 1px solid var(--line); padding-left: 12px\" data-org=\"\">\n      <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">Organisation<\u002Fdiv>\n      <div style=\"font-size: 16px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{ company }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align: right; flex-shrink: 0\">\n      <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap\" data-gate-eyebrow=\"\">{{ gateEyebrow }}<\u002Fdiv>\n      <div style=\"font-family: var(--mono); font-size: 12px; font-weight: 800; color: {{ gateColor }}; white-space: nowrap\">{{ gateReadout }}<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ hasVault }}\">\n      <button sc-camel-on-click=\"{{ lockNow }}\" aria-label=\"Lock now\" title=\"Lock the vault\" style=\"font-family: var(--mono); font-size: 13px; padding: 9px 11px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer; flex-shrink: 0\">🔒<\u002Fbutton>\n    <\u002Fsc-if>\n    <button sc-camel-on-click=\"{{ openLegendPop }}\" aria-label=\"What the colours and gates mean\" title=\"Legend — what the colours, bands and gates mean\" style=\"display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .07em; padding: 9px 12px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer; flex-shrink: 0\" style-hover=\"border-color: var(--accent); color: var(--accent)\">\n      <span aria-hidden=\"true\" style=\"display: grid; grid-template-columns: repeat(2, 5px); grid-template-rows: repeat(2, 5px); gap: 1.5px\">\n        <span style=\"background: var(--ok-fill); border-radius: 1px\"><\u002Fspan><span style=\"background: var(--warn-fill); border-radius: 1px\"><\u002Fspan>\n        <span style=\"background: var(--danger-fill); border-radius: 1px\"><\u002Fspan><span style=\"background: var(--ink-3); border-radius: 1px\"><\u002Fspan>\n      <\u002Fspan>\n      <span data-settings-word=\"\">LEGEND<\u002Fspan>\n    <\u002Fbutton>\n    <button sc-camel-on-click=\"{{ toggleTheme }}\" aria-label=\"{{ themeTitle }}\" title=\"{{ themeTitle }}\" style=\"display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .07em; padding: 9px 12px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer; flex-shrink: 0\" style-hover=\"border-color: var(--accent); color: var(--accent)\">\n      <span aria-hidden=\"true\" style=\"font-size: 13px; line-height: 1\">{{ themeGlyph }}<\u002Fspan>\n      <span data-settings-word=\"\">{{ themeLabel }}<\u002Fspan>\n    <\u002Fbutton>\n    <button sc-camel-on-click=\"{{ openSettings }}\" aria-label=\"Settings\" title=\"Settings — profile, organisation document, data\" style=\"display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .07em; padding: 9px 12px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer; flex-shrink: 0\">\n      <span aria-hidden=\"true\" style=\"font-size: 13px; line-height: 1\">⚙<\u002Fspan>\n      <span data-settings-word=\"\">SETTINGS<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fheader>\n\n  <div style=\"display: flex; align-items: flex-start; max-width: 1560px; margin: 0 auto\">\n\n    <sc-if value=\"{{ isDrawer }}\">\n      <div sc-camel-on-click=\"{{ closeNav }}\" aria-hidden=\"true\" data-overlay=\"\" style=\"position: fixed; inset: 0; z-index: 25; background: var(--scrim)\"><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ navOpen }}\" hint-placeholder-val=\"{{ true }}\">\n      <aside data-sidebar=\"\" data-drawer=\"{{ drawerFlag }}\" class=\"pane\" style=\"width: 214px; flex-shrink: 0; position: {{ navPos }}; left: 0; top: {{ navTop }}; z-index: {{ navZ }}; background: {{ navBg }}; box-shadow: {{ navShadow }}; border-right: 1px solid {{ navEdge }}; padding: 18px 10px 40px; align-self: flex-start; max-height: {{ navMaxH }}; overflow-y: auto\">\n        <nav aria-label=\"Sections\" style=\"display: flex; flex-direction: column; gap: 2px\">\n          <sc-for list=\"{{ nav }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ t.go }}\" aria-current=\"{{ t.current }}\" class=\"navitem\" style=\"display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; padding: 9px 11px; cursor: pointer; border-radius: 3px; border: none; border-left: 3px solid {{ t.edge }}; background: {{ t.bg }}; color: {{ t.fg }}\">\n              <span title=\"{{ t.keyTitle }}\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; color: {{ t.num }}; white-space: nowrap\">{{ t.key }}<\u002Fspan>\n              <span style=\"flex: 1\">\n                <span style=\"display: block; font-size: 12.5px; font-weight: {{ t.weight }}\">{{ t.n }}<\u002Fspan>\n                <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; color: var(--ink-3); margin-top: 1px\">{{ t.hint }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fnav>\n      <\u002Faside>\n    <\u002Fsc-if>\n\n    <!-- No z-index here. A z-index on main makes it a stacking context, and every\n         overlay inside it is then confined below main's own layer — so the header\n         (z-index 30) painted over dialogs asking for 60. They stay correctly\n         positioned but hidden, which is the worst kind of bug to measure. -->\n    <main data-app-main=\"\" class=\"pane\" style=\"flex: 1; min-width: 0; position: relative; padding: 18px 20px 80px\">\n\n      <div style=\"display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px\">\n        <h1 style=\"font-size: 21px; font-weight: 700; letter-spacing: -.01em; margin: 0\">{{ tabTitle }}<\u002Fh1>\n        <span style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap\">{{ tabPart }}<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin: 0 0 18px; font-size: 12.5px; color: var(--ink-2); line-height: 1.65; max-width: 860px\">{{ tabNote }}<\u002Fp>\n\n      <sc-if value=\"{{ hasStepNote }}\">\n        <div class=\"pane\" style=\"display: flex; align-items: flex-start; gap: 11px; background: var(--warn-wash); border: 1px solid var(--line-2); border-left: 3px solid var(--warn); border-radius: 3px; padding: 11px 13px; margin-bottom: 14px; max-width: 860px\">\n          <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); flex-shrink: 0; padding-top: 2px\">Why you are here<\u002Fspan>\n          <span style=\"flex: 1; font-size: 12.5px; line-height: 1.6\">{{ stepNote }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ clearStepNote }}\" aria-label=\"Dismiss\" style=\"font-family: var(--mono); font-size: 11px; padding: 3px 8px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer; flex-shrink: 0\">✕<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ loading }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); padding: 24px 0\">Loading your tracker…<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isOverview }}\">\n        <div>\n          <div data-stack=\"\" style=\"display: grid; grid-template-columns: minmax(230px,280px) 1fr; gap: 16px; margin-bottom: 20px\">\n            <div class=\"stamp\" style=\"border: 3px double {{ gateColor }}; color: {{ gateColor }}; padding: 15px 12px; text-align: center; transform: rotate(-1.2deg); background: var(--stamp); border-radius: 3px\">\n              <div style=\"font-family: var(--mono); font-size: 9px; letter-spacing: .22em\">STAGE 2 READINESS<\u002Fdiv>\n              <div style=\"font-family: var(--mono); font-size: 26px; font-weight: 800; letter-spacing: .04em; margin: 6px 0 4px\">{{ gateWord }}<\u002Fdiv>\n              <div style=\"font-family: var(--mono); font-size: 9px; letter-spacing: .13em\">{{ gateCount }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 14px 16px; border-radius: 3px\">\n              <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">What stands between you and a clean certificate<\u002Fdiv>\n              <sc-if value=\"{{ clear }}\">\n                <p style=\"margin: 8px 0 0; font-size: 13px; color: var(--ink-2)\">Nothing outstanding on the four gates. Book the Stage 2 audit.<\u002Fp>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ hasTranscribe }}\">\n                <div style=\"display: flex; gap: 10px; align-items: flex-start; margin-top: 11px; background: var(--warn-wash); border-radius: 3px; padding: 10px 12px\">\n                  <span style=\"font-size: 12.5px; line-height: 1.6; color: var(--ink-2); flex: 1; text-wrap: pretty\">{{ transcribeText }}<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ goTranscribe }}\" style=\"flex-shrink: 0; font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 7px 10px; min-height: 32px; border: 1px solid var(--warn); border-radius: 2px; background: var(--surface); color: var(--warn); cursor: pointer\">TAKE ME THERE<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ hasBlockers }}\" hint-placeholder-val=\"{{ true }}\">\n                <ul style=\"margin: 8px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.8\">\n                  <sc-for list=\"{{ blockers }}\" as=\"b\" hint-placeholder-count=\"3\">\n                    <li style=\"margin-bottom: 2px\">\n                      <button sc-camel-on-click=\"{{ b.go }}\" title=\"Go to the rows behind this\" style=\"display: flex; align-items: baseline; gap: 7px; width: 100%; text-align: left; font-family: var(--sans); font-size: 12.5px; line-height: 1.6; color: var(--ink-2); padding: 4px 7px; margin-left: -7px; border: none; border-radius: 2px; background: transparent; cursor: pointer\" style-hover=\"background: var(--accent-wash); color: var(--ink)\">\n                        <b style=\"font-family: var(--mono); color: var(--danger); flex-shrink: 0\">{{ b.n }}<\u002Fb>\n                        <span style=\"flex: 1\">{{ b.t }}<\u002Fspan>\n                        <span style=\"font-family: var(--mono); font-size: 10px; color: var(--ink-3); flex-shrink: 0\">{{ b.ref }}<\u002Fspan>\n                        <span aria-hidden=\"true\" style=\"font-family: var(--mono); font-size: 11px; color: var(--accent); flex-shrink: 0\">→<\u002Fspan>\n                      <\u002Fbutton>\n                    <\u002Fli>\n                  <\u002Fsc-for>\n                <\u002Ful>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(175px,1fr)); gap: 10px; margin-bottom: 20px\">\n            <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"6\">\n              <button sc-camel-on-click=\"{{ s.go }}\" title=\"{{ s.goTitle }}\" class=\"card\" style=\"display: block; width: 100%; text-align: left; font-family: var(--sans); background: var(--surface); border: 1px solid var(--line); border-top: 2px solid {{ s.tone }}; padding: 12px 14px; border-radius: 3px; cursor: pointer; transition: border-color .16s ease, transform .12s ease\" style-hover=\"border-color: var(--line-2); transform: translateY(-1px)\">\n                <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">{{ s.label }}<\u002Fdiv>\n                <div style=\"font-family: var(--mono); font-size: 23px; font-weight: 800; letter-spacing: -.01em; margin: 5px 0 3px; color: {{ s.tone }}\">{{ s.value }}<\u002Fdiv>\n                <div style=\"font-size: 11.5px; color: var(--ink-2); line-height: 1.5\">{{ s.note }}<\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); gap: 20px; background: var(--surface); border: 1px solid var(--line); padding: 18px; border-radius: 3px\">\n            <sc-for list=\"{{ meters }}\" as=\"mt\" hint-placeholder-count=\"4\">\n              <div>\n                <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px\">\n                  <span style=\"font-size: 12.5px; color: var(--ink-2)\">{{ mt.label }}<\u002Fspan>\n                  <span style=\"font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: {{ mt.tone }}\">{{ mt.pctText }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height: 7px; background: var(--line); border-radius: 3px; overflow: hidden\">\n                  <div style=\"height: 100%; width: {{ mt.width }}; background: {{ mt.tone }}; border-radius: 3px; transition: width .35s ease\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isPlan }}\">\n        <div>\n          <div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; margin-bottom: 14px\">\n            <div style=\"display: flex; border: 1px solid var(--line-2); border-radius: 2px; overflow: hidden\">\n              <button sc-camel-on-click=\"{{ setWeek }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; padding: 6px 11px; border: none; cursor: pointer; background: {{ weekBg }}; color: {{ weekFg }}\">WEEKS<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ setDay }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; padding: 6px 11px; border: none; cursor: pointer; background: {{ dayBg }}; color: {{ dayFg }}\">DAYS<\u002Fbutton>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ toggleAll }}\" style=\"font-family: var(--mono); font-size: 10.5px; padding: 6px 11px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap\">{{ allOpenLabel }}<\u002Fbutton>\n            <label style=\"display: flex; align-items: center; gap: 7px\">\n              <span style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">Zoom<\u002Fspan>\n              <input type=\"range\" min=\"16\" max=\"54\" value=\"{{ zoom }}\" sc-camel-on-change=\"{{ setZoom }}\" aria-label=\"Timeline zoom\" style=\"width: 90px\">\n            <\u002Flabel>\n            <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">{{ planCount }}<\u002Fspan>\n            <sc-if value=\"{{ reordered }}\">\n              <button sc-camel-on-click=\"{{ resetOrder }}\" title=\"Put the twelve steps back in the workbook's order\" style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .06em; padding: 6px 10px; min-height: 32px; border: 1px solid var(--accent); border-radius: 2px; background: var(--surface); color: var(--accent); cursor: pointer\">RESET ORDER<\u002Fbutton>\n            <\u002Fsc-if>\n            <span style=\"flex: 1\"><\u002Fspan>\n            <button sc-camel-on-click=\"{{ exportPlan }}\" style=\"font-family: var(--mono); font-size: 10.5px; padding: 6px 11px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap\">EXPORT CSV<\u002Fbutton>\n          <\u002Fdiv>\n\n          <section style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 3px; margin-bottom: 14px\">\n            <div style=\"display: flex; align-items: center; gap: 10px; padding: 11px 13px\">\n              <button sc-camel-on-click=\"{{ toggleGuide }}\" aria-expanded=\"{{ guideAria }}\" aria-label=\"Toggle the guide\" style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 3px 9px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">{{ guideGlyph }}<\u002Fbutton>\n              <span style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">Where you are<\u002Fspan>\n              <span style=\"font-size: 12.5px; font-weight: 600\">{{ guideSummary }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ guideOpen }}\">\n              <div style=\"border-top: 1px solid var(--line); padding: 13px\">\n                <p style=\"margin: 0 0 12px; font-size: 12px; line-height: 1.65; color: var(--ink-2); max-width: 780px; text-wrap: pretty\">These are not a queue. Policy work runs alongside an open gap assessment, and the risk method is usually settled before the gap closes. Everything outstanding is listed; the first is a suggestion, not an instruction.<\u002Fp>\n                <sc-for list=\"{{ guideSteps }}\" as=\"s\" hint-placeholder-count=\"4\">\n                  <div style=\"border: 1px solid var(--line); border-left: 3px solid {{ s.edge }}; border-radius: 3px; padding: 12px; margin-bottom: 9px\">\n                    <div style=\"display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap\">\n                      <span style=\"font-family: var(--mono); font-size: 11px; font-weight: 800; color: var(--accent)\">{{ s.n }}<\u002Fspan>\n                      <span style=\"font-size: 13.5px; font-weight: 700\">{{ s.title }}<\u002Fspan>\n                      <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">{{ s.stage }} · {{ s.part }}<\u002Fspan>\n                      <sc-if value=\"{{ s.startHere }}\">\n                        <span style=\"font-family: var(--mono); font-size: 8.5px; font-weight: 700; letter-spacing: .09em; padding: 2px 6px; border-radius: 2px; background: var(--accent-fill); color: var(--on-fill)\">START HERE<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <p style=\"margin: 7px 0 9px; font-size: 12px; line-height: 1.6; color: var(--ink-2); text-wrap: pretty\">{{ s.what }}<\u002Fp>\n                    <div style=\"background: var(--subtle); border-radius: 2px; padding: 8px 10px; margin-bottom: 9px\">\n                      <div style=\"font-family: var(--mono); font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">Complete when<\u002Fdiv>\n                      <div style=\"font-size: 12px; margin-top: 2px\">{{ s.test }}<\u002Fdiv>\n                      <sc-if value=\"{{ s.hasWhy }}\">\n                        <div style=\"font-size: 12px; margin-top: 6px; color: var(--warn); font-weight: 600\">{{ s.why }}<\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <div style=\"display: flex; gap: 6px; flex-wrap: wrap; align-items: center\">\n                      <button sc-camel-on-click=\"{{ s.take }}\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 7px 11px; min-height: 34px; border: none; border-radius: 2px; background: var(--accent-fill); color: var(--on-fill); cursor: pointer\">TAKE ME THERE<\u002Fbutton>\n                      <sc-if value=\"{{ s.docs }}\">\n                        <span style=\"font-family: var(--mono); font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-left: 4px\">Documents for this step<\u002Fspan>\n                      <\u002Fsc-if>\n                      <sc-for list=\"{{ s.docs }}\" as=\"d\" hint-placeholder-count=\"2\">\n                        <button sc-camel-on-click=\"{{ d.go }}\" title=\"{{ d.title }}\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; padding: 5px 8px; min-height: 30px; border: 1px solid {{ d.tone }}; border-radius: 2px; background: var(--surface); color: {{ d.tone }}; cursor: pointer\">{{ d.id }}<\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ hasDone }}\">\n                  <button sc-camel-on-click=\"{{ toggleDone }}\" style=\"font-family: var(-  .13em; text-transform: uppercase; padding: 9px 6px\">Window<\u002Fsc-raw-th>\n                    <sc-raw-th scope=\"col\" style=\"width: 52px; position: sticky; top: 0; z-index: 3; background: var(--solid); color: var(--on-fill); font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; padding: 9px 6px\">Dur<\u002Fsc-raw-th>\n                    <sc-raw-th scope=\"col\" style=\"width: 168px; position: sticky; top: 0; z-index: 3; background: var(--solid); color: var(--on-fill); font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; padding: 9px 6px\">Complete<\u002Fsc-raw-th>\n                    <sc-raw-th scope=\"col\" style=\"background: var(--solid); position: sticky; top: 0; z-index: 3; padding: 0\">\n                      <div style=\"display: flex; width: {{ timelineW }}\">\n                        <sc-for list=\"{{ cols }}\" as=\"c\" hint-placeholder-count=\"20\">\n                          <div style=\"width: {{ c.w }}; flex-shrink: 0; text-align: center; padding: 9px 0; font-family: var(--mono); font-size: 8.5px; font-weight: {{ c.weight }}; color: {{ c.fg }}; border-left: 1px solid {{ c.edge }}\">{{ c.label }}<\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fsc-raw-th>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-raw-thead>\n                <sc-raw-tbody>\n                  <sc-for list=\"{{ planRows }}\" as=\"r\" hint-placeholder-count=\"12\">\n                    <sc-raw-tr draggable=\"{{ r.drag }}\" sc-camel-on-drag-start=\"{{ r.onDragStart }}\" sc-camel-on-drag-over=\"{{ r.onDragOver }}\" sc-camel-on-drop=\"{{ r.onDrop }}\" sc-camel-on-drag-end=\"{{ r.onDragEnd }}\" style=\"background: {{ r.rowBg }}; opacity: {{ r.grabOp }}\">\n                      <sc-raw-td style=\"position: sticky; left: 0; z-index: 2; background: {{ r.stickyBg }}; border-bottom: 1px solid var(--line); padding: 5px 8px; fo  r.isSec }}\">\n                          <span style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--accent)\">{{ r.pctText }}<\u002Fspan>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ r.auto }}\">\n                          <span style=\"display: inline-flex; align-items: center; gap: 6px\">\n                            <span style=\"font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: var(--ok)\">{{ r.pctText }}<\u002Fspan>\n                            <span style=\"font-family: var(--mono); font-size: 9px; letter-spacing: .09em; color: var(--ink-2); background: var(--sunken); border-radius: 2px; padding: 2px 5px\">AUTO<\u002Fspan>\n                            <button sc-camel-on-click=\"{{ r.takeOver }}\" title=\"Set this by hand from now on\" style=\"font-family: var(--mono); font-size: 9px; padding: 2px 6px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer\">EDIT<\u002Fbutton>\n                          <\u002Fspan>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ r.manual }}\">\n                          <span style=\"display: inline-flex; align-items: center; gap: 7px\">\n                            <input type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"{{ r.pctNum }}\" sc-camel-on-change=\"{{ r.setPct }}\" aria-label=\"Percent complete\" style=\"width: 88px\">\n                            <span style=\"font-family: var(--mono); font-size: 11px; font-weight: 700; width: 34px; text-align: right\">{{ r.pctText }}<\u002Fspan>\n                          <\u002Fspan>\n                        <\u002Fsc-if>\n                      <\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding: 0; border-bottom: 1px solid var(--line); background-image: {{ gridImg }}; background-repeat: repeat\">\n                        <div style=\"position: relative; height: 34px; width: {{ timelineW }}\">\n                          <div title=\"{{ r.window }}\" style=\"position: absolute; left: {{ r.barLeft }}; width: {{ r.barWidth }}; top: {{ r.barTop }}; height: {{ r.barH }}; background: {{ r.tone }}; border-radius: 2px; box-shadow: inset 0 1px 0 rgba(255,255,255,.22); transition: left .3s ease, width .3s ease\">\n                            <sc-if value=\"{{ r.hasFill }}\">\n                              <div style=\"position: absolute; top: 0; bottom: 0; left: 0; width: {{ r.fillW }}; background: rgba(255,255,255,.34); border-radius: 2px 0 0 2px\"><\u002Fdiv>\n                            <\u002Fsc-if>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-raw-td>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isPlanMobile }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 8px\">\n              <sc-for list=\"{{ planRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n                <div>\n                  <sc-if value=\"{{ r.isSec }}\">\n                    <div style=\"background: var(--solid); color: var(--on-fill); padding: 9px 12px; border-radius: 3px; display: flex; align-items: center; gap: 10px; margin-top: 6px; margin-left: {{ r.indent }}\">\n                      <button sc-camel-on-click=\"{{ r.toggle }}\" aria-expanded=\"{{ r.ariaOpen }}\" aria-label=\"Toggle section\" style=\"font-family: var(--mono); font-size: 13px; font-weight: 700; padding: 5px 11px; min-height: 34px; border: 1px solid var(--ink-2); border-radius: 2px; background: transparent; color: var(--on-fill); cursor: pointer; flex-shrink: 0\">{{ r.glyph }}<\u002Fbutton>\n                      <span style=\"flex: 1; font-weight: 700; font-size: 13px\"><span style=\"font-family: var(--mono); opacity: .6; margin-right: 7p {{ r.manual }}\">\n                        <span style=\"display: flex; align-items: center; gap: 9px\">\n                          <input type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"{{ r.pctNum }}\" sc-camel-on-change=\"{{ r.setPct }}\" aria-label=\"Percent complete\" style=\"flex: 1\">\n                          <span style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; width: 38px; text-align: right\">{{ r.pctText }}<\u002Fspan>\n                        <\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 0 0\">\n            <span style=\"display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-2)\"><span style=\"width: 13px; height: 13px; border-radius: 2px; background: var(--danger-fill)\"><\u002Fspan>Scheduled<\u002Fspan>\n            <span style=\"display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-2)\"><span style=\"width: 13px; height: 13px; border-radius: 2px; background: var(--ok-fill)\"><\u002Fspan>Complete<\u002Fspan>\n            <span style=\"display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-2)\"><span style=\"width: 13px; height: 13px; border-radius: 2px; background: var(--danger-fill)\"><\u002Fspan>Overdue<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 11px; color: var(--ink-3); margin-top: 10px; max-width: 900px; line-height: 1.65\">Progress marked <b style=\"font-family: var(--mono); font-size: 10px\">AUTO<\u002Fb> is derived from the clauses and documents the task produces. Press EDIT to take it over by hand; the engine then leaves that row alone. Dates recalculate from the project start date.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if valu
