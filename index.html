  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n<script>\nconst THEME_KEY = \"isms-theme-v1\";\n(function applySavedTheme() {\n  let theme = \"light\";\n  try {\n    const saved = localStorage.getItem(THEME_KEY);\n    theme = saved === \"dark\" ? \"dark\" : \"light\";\n  } catch (e) { /* Appearance remains usable in memory when storage is blocked. */ }\n  document.documentElement.dataset.theme = theme;\n  document.documentElement.style.colorScheme = theme;\n  window.__ISMS_THEME_KEY = THEME_KEY;\n}());\n<\u002Fscript>\n\n<script src=\"4348c626-aaf8-40c3-98e6-1581e9f248ca\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>ISMS Tracker — ISO/IEC 27001:2022<\u002Ftitle>\n<style>\n  :root {\n    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;\n    --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;\n    color-scheme: light;\n    --canvas: #EFEDED; --surface: #FFFFFF; --surface-raised: #FFFFFF; --surface-muted: #F7F6F6; --band: #E4E2E1;\n    --ink: #2C2D2E; --ink-soft: #54585B; --ink-faint: #65696C; --muted: var(--ink-faint); --paper: var(--surface);\n    --line: #E1DEDE; --rule: #C4C1C1; --accent-soft: #FBE7E8; --warning-soft: #FBEEDC; --danger-soft: #FBE3E4; --success-soft: #E4F0E8;\n    --accent-text: #CC000E; --success-text: #17693A; --warning-text: #8A5A00; --danger-text: #B6000C;\n    --overlay: rgba(44,45,46,.56); --dot: var(--line);\n    --accent: #CC000E; --accent-dark: #A9000B; --success: #17693A; --warning: #8A5A00;\n    --shadow-1: 0 5px 18px rgba(38,36,31,.07); --shadow-2: 0 16px 44px rgba(38,36,31,.13);\n    --ease: cubic-bezier(.2,.7,.3,1);\n  }\n  :root[data-theme=\"dark\"] {\n    color-scheme: dark;\n    --canvas: #141516; --surface: #1D1F20; --surface-raised: #242627; --surface-muted: #292B2C; --band: #30 rol+Shift+L Meta+Shift+L\" title=\"{{ themeToggleTitle }}\">\n      <span class=\"theme-toggle-icon\" aria-hidden=\"true\">{{ themeGlyph }}<\u002Fspan>\n      <span data-theme-word=\"\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 800; letter-spacing: .06em\">{{ themeLabel }}<\u002Fspan>\n    <\u002Fbutton>\n    <button sc-camel-on-click=\"{{ openSettings }}\" aria-label=\"Settings\" aria-keyshortcuts=\"Control+, Meta+,\" title=\"Settings (Ctrl/Command + ,)\" style=\"display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .07em; padding: 9px 12px; min-height: 38px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer; flex-shrink: 0\">\n      <span aria-hidden=\"true\" style=\"font-size: 13px; line-height: 1\">⚙<\u002Fspan>\n      <span data-settings-word=\"\">SETTINGS<\u002Fspan>\n      <span class=\"kbd\" data-shortcut-hint=\"\">⌘,<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fheader>\n\n  <div style=\"display: flex; align-items: flex-start; max-width: 1560px; margin: 0 auto\">\n\n    <sc-if value=\"{{ isDrawer }}\">\n      <div sc-camel-on-click=\"{{ closeNav }}\" aria-hidden=\"true\" style=\"position: fixed; inset: 0; z-index: 25; background: rgba(38,36,31,.42)\"><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ navOpen }}\" hint-placeholder-val=\"{{ true }}\">\n      <aside data-sidebar=\"\" data-drawer=\"{{ drawerFlag }}\" class=\"pane\" style=\"width: 214px; flex-shrink: 0; position: {{ navPos }}; left: 0; top: {{ navTop }}; z-index: {{ navZ }}; background: {{ navBg }}; box-shadow: {{ navShadow }}; border-right: 1px solid {{ navEdge }}; padding: 18px 10px 40px; align-self: flex-start; max-height: {{ navMaxH }}; overflow-y: auto\">\n        <nav aria-label=\"Sections\" style=\"display: flex; flex-direction: column; gap: 2px\">\n          <sc-for list=\"{{ nav }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ t.go }}\" aria-current=\"{{ t.current }}\" class=\"navitem\" style=\"display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; padding: 9px 11px; cursor: pointer; border-radius: 3px; border: none; border-left: 3px solid {{ t.edge }}; background: {{ t.bg }}; color: {{ t.fg }}\">\n              <span style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; color: {{ t.num }}\">{{ $index }}<\u002Fspan>\n              <span style=\"flex: 1\">\n                <span style=\"display: block; font-size: 12.5px; font-weight: {{ t.weight }}\">{{ t.n }}<\u002Fspan>\n                <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; color: var(--ink-faint); margin-top: 1px\">{{ t.hint }}<\u002Fspan>\n              <\u002Fspan>\n              <span class=\"kbd\" aria-hidden=\"true\">{{ t.shortcut }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fnav>\n      <\u002Faside>\n    <\u002Fsc-if>\n\n    <!-- No z-index here. A z-index on main makes it a stacking context, and every\n         overlay inside it is then confined below main's own layer — so the header\n         (z-index 30) painted over dialogs asking for 60. They stay correctly\n         positioned but hidden, which is the worst kind of bug to measure. -->\n    <main class=\"pane\" style=\"flex: 1; min-width: 0; position: relative; padding: 18px 20px 80px\">\n\n      <div style=\"display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px\">\n        <h1 style=\"font-size: 21px; font-weight: 700; letter-spacing: -.01em; margin: 0\">{{ tabTitle }}<\u002Fh1>\n        <span style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint); white-space: nowrap\">{{ tabPart }}<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin: 0 0 18px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.65; max-width: 860px\">{{ tabNote }}<\u002Fp>\n\n      <sc-if value=\"{{ hasStepNote }}\">\n        <div class=\"pane\" style=\"display: flex; align-items: flex-start; gap: 11px; background: var(--warning-soft); border: 1px solid var(--rule); border-left: 3px solid #8A5A00; border-radius: 3px; padding: 11px 13px; margin-bottom: 14px; max-width: 860px\">\n          <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); flex-shrink: 0; padding-top: 2px\">Why you are here<\u002Fspan>\n          <span style=\"flex: 1; font-size: 12.5px; line-height: 1.6\">{{ stepNote }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ clearStepNote }}\" aria-label=\"Dismiss\" style=\"font-family: var(--mono); font-size: 11px; padding: 3px 8px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink-soft); cursor: pointer; flex-shrink: 0\">✕<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ loading }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); padding: 24px 0\">Loading your tracker…<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ encrypted }}\">\n        <div style=\"background: var(--warning-soft); border: 1px solid var(--rule); border-left: 3px solid #8A5A00; padding: 14px 16px; border-radius: 3px; max-width: 720px\">\n          <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint)\">Vault locked<\u002Fdiv>\n          <p style=\"margin: 8px 0 0; font-size: 12.5px; line-height: 1.65\">Browser storage holds ciphertext for this tracker. Nothing has been written or overwritten. The unlock screen arrives with the Settings phase; until then the numbers below come from the seed state.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isOverview }}\">\n        <div class=\"overview-command\">\n          <section class=\"readiness-hero\" style=\"--gate-tone: {{ gateColor }}\">\n            <div class=\"readiness-head\">\n              <div>\n                <span class=\"eyebrow\">Stage 2 audit readiness<\u002Fspan>\n                <div class=\"readiness-state\">{{ gateWord }}<\u002Fdiv>\n                <p style=\"margin: 5px 0 0; color: var(--ink-soft); font-size: 12px; line-height: 1.55\">The result is calculated only from the four certification gates below.<\u002Fp>\n              <\u002Fdiv>\n              <span class=\"readiness-count\">{{ gateCount }}<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"gate-grid\">\n              <sc-for list=\"{{ gateSegments }}\" as=\"g\" hint-placeholder-count=\"4\">\n                <button class=\"gate-segment\" sc-camel-on-click=\"{{ g.go }}\" style=\"--gate-tone: {{ g.tone }}\" aria-label=\"{{ g.aria }}\">\n                  <b>{{ g.label }}<\u002Fb>\n                  <span>{{ g.state }}<\u002Fspan>\n                  <small>{{ g.detail }} · {{ g.ref }}<\u002Fsmall>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <sc-if value=\"{{ hasNextMove }}\" hint-placeholder-val=\"{{ true }}\">\n            <section class=\"next-move\" aria-labelledby=\"next-move-title\">\n              <span class=\"next-move-num\">{{ nextMove.n }}<\u002Fspan>\n              <div>\n                <span class=\"eyebrow\">Recommended next move<\u002Fspan>\n                <h2 id=\"next-move-title\" style=\"margin: 3px 0 2px; font-size: 15px\">{{ nextMove.title }}<\u002Fh2>\n                <p style=\"margin: 0; color: var(--ink-soft); font-size: 11px; line-height: 1.5\">{{ nextMove.why }}<\u002Fp>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ nextMove.take }}\" style=\"min-height: 38px; padding: 9px 13px; border: none; border-radius: 2px; background: var(--accent); color: #fff; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 800; white-space: nowrap\">TAKE ME THERE →<\u002Fbutton>\n            <\u002Fsection>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noNextMove }}\">\n            <section class=\"next-move\" aria-label=\"Recommended next move\">\n              <span class=\"next-move-num\">✓<\u002Fspan>\n              <div><span class=\"eyebrow\">Recommended next move<\u002Fspan><h2 style=\"margin: 3px 0 2px; font-size: 15px\">Prepare the Stage 2 audit<\u002Fh2><p style=\"margin: 0; color: var(--ink-soft); font-size: 11px\">All implementation guide steps and certification gates are clear.<\u002Fp><\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fsc-if>\n\n          <div class=\"metric-grid\" aria-label=\"Implementation progress\">\n            <sc-for list=\"{{ overviewMetrics }}\" as=\"mt\" hint-placeholder-count=\"4\">\n              <div class=\"metric-item\" style=\"--metric-tone: {{ mt.tone }}; --metric-width: {{ mt.width }}\">\n                <span class=\"eyebrow\">{{ mt.label }}<\u002Fspan>\n                <strong>{{ mt.value }}<\u002Fstrong>\n                <div class=\"metric-bar\" aria-hidden=\"true\"><span><\u002Fspan><\u002Fdiv>\n                <small style=\"display: block; margin-top: 6px; color: var(--ink-faint); font-size: 9px; line-height: 1.4\">{{ mt.note }}<\u002Fsmall>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <section class=\"priority-panel\" aria-labelledby=\"priority-title\">\n            <div class=\"priority-head\">\n              <div><span class=\"eyebrow\">Work queue<\u002Fspan><h2 id=\"priority-title\" style=\"margin: 3px 0 0; font-size: 16px\">Priority queue<\u002Fh2><\u002Fdiv>\n              <span class=\"readiness-count\">{{ priorityCount }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasOverviewPriorities }}\" hint-placeholder-val=\"{{ true }}\">\n              <sc-for list=\"{{ overviewPriorities }}\" as=\"p\" hint-placeholder-count=\"4\">\n                <button class=\"priority-row\" sc-camel-on-click=\"{{ p.go }}\" style=\"--priority-tone: {{ p.tone }}\">\n                  <span class=\"priority-number\">{{ p.number }}<\u002Fspan>\n                  <span class=\"priority-copy\"><b>{{ p.title }}<\u002Fb><small>{{ p.meta }}<\u002Fsmall><\u002Fspan>\n                  <span class=\"priority-arrow\" aria-hidden=\"true\">→<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noOverviewPriorities }}\">\n              <div style=\"padding: 18px 16px; color: var(--success-text); font-size: 12px; font-weight: 700\">No critical implementation blockers remain.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isPlan }}\">\n        <div>\n          <div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; margin-bottom: 14px\">\n            <div style=\"display: flex; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden\">\n              <button sc-camel-on-click=\"{{ setWeek }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; padding: 6px 11px; border: none; cursor: pointer; background: {{ weekBg }}; color: {{ weekFg }}\">WEEKS<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ setDay }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; padding: 6px 11px; border: none; cursor: pointer; background: {{ dayBg }}; color: {{ dayFg }}\">DAYS<\u002Fbutton>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ toggleAll }}\" style=\"font-family: var(--mono); font-size: 10.5px; padding: 6px 11px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap\">{{ allOpenLabel }}<\u002Fbutton>\n            <label style=\"display: flex; align-items: center; gap: 7px\">\n              <span style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint)\">Zoom<\u002Fspan>\n              <input type=\"range\" min=\"16\" max=\"54\" value=\"{{ zoom }}\" sc-camel-on-change=\"{{ setZoom }}\" aria-label=\"Timeline zoom\" style=\"width: 90px\">\n            <\u002Flabel>\n            <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint)\">{{ planCount }}<\u002Fspan>\n            <sc-if value=\"{{ reordered }}\">\n              <button sc-camel-on-click=\"{{ resetOrder }}\" title=\"Put the twelve steps back in the workbook's order\" style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .06em; padding: 6px 10px; min-height: 32px; border: 1px solid #CC000E; border-radius: 2px; background: var(--surface); color: var(--accent-text); cursor: pointer\">RESET ORDER<\u002Fbutton>\n            <\u002Fsc-if>\n            <span style=\"flex: 1\"><\u002Fspan>\n            <button sc-camel-on-click=\"{{ exportPlan }}\" style=\"font-family: var(--mono); font-size: 10.5px; padding: 6px 11px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap\">EXPORT CSV<\u002Fbutton>\n          <\u002Fdiv>\n\n          <section style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid #CC000E; border-radius: 3px; margin-bottom: 14px\">\n            <div style=\"display: flex; align-items: center; gap: 10px; padding: 11px 13px\">\n              <button sc-camel-on-click=\"{{ toggleGuide }}\" aria-expanded=\"{{ guideAria }}\" aria-label=\"Toggle the guide\" style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 3px 9px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">{{ guideGlyph }}<\u002Fbutton>\n              <span style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint)\">Where you are<\u002Fspan>\n              <span style=\"font-size: 12.5px; font-weight: 600\">{{ guideSummary }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ guideOpen }}\">\n              <div style=\"border-top: 1px solid var(--line); padding: 13px\">\n                <p style=\"margin: 0 0 12px; font-size: 12px; line-height: 1.65; color: var(--ink-soft); max-width: 780px; text-wrap: pretty\">These are not a queue. Policy work runs alongside an open gap assessment, and the risk method is usually settled before the gap closes. Everything outstanding is listed; the first is a suggestion, not an instruction.<\u002Fp>\n                <sc-for list=\"{{ guideSteps }}\" as=\"s\" hint-placeholder-count=\"4\">\n                  <div style=\"border: 1px solid var(--line); border-left: 3px solid {{ s.edge }}; border-radius: 3px; padding: 12px; margin-bottom: 9px\">\n                    <div style=\"display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap\">\n                      <span style=\"font-family: var(--mono); font-size: 11px; font-weight: 800; color: var(--accent-text)\">{{ s.n }}<\u002Fspan>\n                      <span style=\"font-size: 13.5px; font-weight: 700\">{{ s.title }}<\u002Fspan>\n                      <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint)\">{{ s.stage }} · {{ s.part }}<\u002Fspan>\n                      <sc-if value=\"{{ s.startHere }}\">\n                        <span style=\"font-family: var(--mono); font-size: 8.5px; font-weight: 700; letter-spacing: .09em; padding: 2px 6px; border-radius: 2px; background: #CC000E; color: #fff\">START HERE<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <p style=\"margin: 7px 0 9px; font-size: 12px; line-height: 1.6; color: var(--ink-soft); text-wrap: pretty\">{{ s.what }}<\u002Fp>\n                    <div style=\"background: var(--surface-muted); border-radius: 2px; padding: 8px 10px; margin-bottom: 9px\">\n                      <div style=\"font-family: var(--mono); font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint)\">Complete when<\u002Fdiv>\n                      <div style=\"font-size: 12px; margin-top: 2px\">{{ s.test }}<\u002Fdiv>\n                      <sc-if value=\"{{ s.hasWhy }}\">\n                        <div style=\"font-size: 12px; margin-top: 6px; color: var(--warning-text); font-weight: 600\">{{ s.why }}<\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <div style=\"display: flex; gap: 6px; flex-wrap: wrap; align-items: center\">\n                      <button sc-camel-on-click=\"{{ s.take }}\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 7px 11px; min-height: 34px; border: none; border-radius: 2px; background: #CC000E; color: #fff; cursor: pointer\">TAKE ME THERE<\u002Fbutton>\n                      <sc-if value=\"{{ s.docs }}\">\n                        <span style=\"font-family: var(--mono); font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); margin-left: 4px\">Documents for this step<\u002Fspan>\n                      <\u002Fsc-if>\n                      <sc-for list=\"{{ s.docs }}\" as=\"d\" hint-placeholder-count=\"2\">\n                        <button sc-camel-on-click=\"{{ d.go }}\" title=\"{{ d.title }}\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; padding: 5px 8px; min-height: 30px; border: 1px solid {{ d.tone }}; border-radius: 2px; background: var(--surface); color:        <\u002Fspan>\n                <span class=\"progress-pill\">{{ setupProgress }}<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"decision-callout\">\n                <span class=\"eyebrow\">Calculated recommendation<\u002Fspan>\n                <b>{{ setupVerdict }}<\u002Fb>\n                <p>{{ setupExplanation }}<\u002Fp>\n              <\u002Fdiv>\n              <sc-if value=\"{{ setupHasExisting }}\">\n                <div class=\"notice notice-warn\">Existing risks will be preserved if the approach changes, but their presentation and any current AI draft batch may become outdated.<\u002Fdiv>\n              <\u002Fsc-if>\n              <div class=\"question-section\">\n                <span class=\"eyebrow accent\">Assessment method · five required answers<\u002Fspan>\n                <sc-for list=\"{{ methodQs }}\" as=\"qq\" hint-placeholder-count=\"5\">\n                  <fieldset class=\"decision-question\">\n                    <legend>{{ qq.q }}<\u002Flegend>\n                    <div class=\"choice-row\">\n                      <sc-for list=\"{{ qq.opts }}\" as=\"o\" hint-placeholder-count=\"2\">\n                        <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" aria-pressed=\"{{ o.pressed }}\" style=\"border-color: {{ o.edge }}; background: {{ o.bg }}; color: {{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Ffieldset>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div class=\"question-section\">\n                <span class=\"eyebrow accent\">Analysis type · three required answers<\u002Fspan>\n                <sc-for list=\"{{ analysisQs }}\" as=\"qq\" hint-placeholder-count=\"3\">\n                  <fieldset class=\"decision-question\">\n                    <legend>{{ qq.q }}<\u002Flegend>\n                    <div class=\"choice-row\">\n                      <sc-for list=\"{{ qq.opts }}\" as=\"o\" hint-placeholder-count=\"2\">\n                        <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" aria-pressed=\"{{ o.pressed }}\" style=\"border-color: {{ o.edge }}; background: {{ o.bg }}; color: {{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Ffieldset>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ hasRiskAiMsg }}\"><div class=\"notice notice-warn\" role=\"status\">{{ riskAiMsg }}<\u002Fdiv><\u002Fsc-if>\n              <div class=\"action-bar\">\n                <button sc-camel-on-click=\"{{ applyMethod }}\" disabled=\"{{ setupSubmitDisabled }}\" class=\"primary-action\">SUBMIT APPROACH<\u002Fbutton>\n                <span>{{ setupRemaining }} answer(s) remaining<\u002Fspan>\n                <sc-if value=\"{{ setupCanCancel }}\"><button sc-camel-on-click=\"{{ closeWiz }}\" class=\"quiet-action\">CANCEL REVIEW<\u002Fbutton><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ riskReady }}\">\n          <section class=\"ai-review pane\" aria-labelledby=\"ai-risk-title\">\n            <div class=\"ai-review-head\">\n              <span>\n                <span class=\"eyebrow\">AI analysis · drafts only<\u002Fspan>\n                <h2 id=\"ai-risk-title\">Organization-grounded risk and Annex A suggestions<\u002Fh2>\n                <p>Uses the applied profile and context documents, the submitted method, live risks, and current SoA decisions. Nothing changes until you select and apply a draft.<\u002Fp>\n              <\u002Fspan>\n              <span class=\"status-pill status-{{ batchStatusTone }}\">{{ batchStatus }}<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"readiness-grid\">\n              <span class=\"readiness-item\"><b>Organization context<\u002Fb><small>{{ riskContextMessage }}<\u002Fsmall><\u002Fspan>\n              <span class=\"readiness-item\"><b>AI connection<\u002Fb><small>{{ providerMessage }}<\u002Fsmall><\u002Fspan>\n              <span class=\"readiness-item\"><b>Assessment approach<\u002Fb><small>{{ methodWord }} · {{ analysisWord }}<\u002Fsmall><\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ batchOutdated }}\">\n              <div class=\"notice notice-danger\"><b>Suggestions are outdated.<\u002Fb> {{ batchChanged }} changed after this batch was generated. Review the live data, then regenerate explicitly; the tracker will not call AI in the background.<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasRiskAiMsg }}\"><div class=\"notice notice-info\" role=\"status\">{{ riskAiMsg }}<\u002Fdiv><\u002Fsc-if>\n            <div class=\"action-bar\">\n              <sc-if value=\"{{ noRiskBatch }}\"><button sc-camel-on-click=\"{{ generateRiskSuggestions }}\" disabled=\"{{ riskGenerateDisabled }}\" class=\"primary-action\">GENERATE DRAFTS<\u002Fbutton><\u002Fsc-if>\n              <sc-if value=\"{{ hasRiskBatch }}\"><button sc-camel-on-click=\"{{ regenerateRiskSuggestions }}\" disabled=\"{{ riskAiBusy }}\" class=\"primary-action\">REGENERATE<\u002Fbutton><\u002Fsc-if>\n              <sc-if value=\"{{ providerMissing }}\"><button sc-camel-on-click=\"{{ openAiSettings }}\" class=\"quiet-action\">OPEN AI SETTINGS<\u002Fbutton><\u002Fsc-if>\n              <sc-if value=\"{{ riskAiBusy }}\"><span class=\"working-note\"><i><\u002Fi>Analysing bounded project context…<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ hasRiskBatch }}\"><span class=\"batch-meta\">{{ batchGenerated }}<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ hasRiskBatch }}\">\n              <div class=\"batch-summary\">\n                <p>{{ batchSummary }}<\u002Fp>\n                <sc-if value=\"{{ hasBatchWarnings }}\">\n                  <ul><sc-for list=\"{{ batchWarnings }}\" as=\"w\" hint-placeholder-count=\"2\"><li>{{ w.warning }}<\u002Fli><\u002Fsc-for><\u002Ful>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ hasRiskSuggestions }}\">\n                <div class=\"review-section-head\"><span><span class=\"eyebrow accent\">Risk drafts<\u002Fspan><b>{{ riskSuggestionCount }}<\u002Fb><\u002Fspan><small>Edit any field before selecting it.<\u002Fsmall><\u002Fdiv>\n                <div class=\"suggestion-list\">\n                  <sc-for list=\"{{ riskSuggestionRows }}\" as=\"s\" hint-placeholder-count=\"3\">\n                    <article class=\"suggestion-card suggestion-{{ s.stateTone }}\">\n                      <div class=\"suggestion-top\">\n                        <button sc-camel-on-click=\"{{ s.toggle }}\" disabled=\"{{ s.unavailable }}\" aria-pressed=\"{{ s.selected }}\" class=\"select-draft\">{{ s.selectLabel }}<\u002Fbutton>\n                        <span class=\"suggestion-title\"><b>{{ s.subject }}<\u002Fb><small>{{ s.cause }}<\u002Fsmall><\u002Fspan>\n                        <span class=\"confidence confidence-{{ s.confidenceTone }}\">{{ s.confidence }} confidence<\u002Fspan>\n                        <span class=\"draft-state\">{{ s.stateLabel }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ s.duplicate }}\"><div class=\"notice notice-warn\">A matching live risk already exists. This draft is locked to prevent duplication.<\u002Fdiv><\u002Fsc-if>\n                      <div class=\"suggestion-grid\">\n                        <label><span>{{ s.subjectLabel }}<\u002Fspan><input type=\"text\" value=\"{{ s.subject }}\" sc-camel-on-change=\"{{ s.setSubject }}\" disabled=\"{{ s.applied }}\"><\u002Flabel>\n                        <label><span>{{ s.causeLabel }}<\u002Fspan><input type=\"text\" value=\"{{ s.cause }}\" sc-camel-on-change=\"{{ s.setCause }}\" disabled=\"{{ s.applied }}\"><\u002Flabel>\n                        <label><span>Consequence / vulnerability<\u002Fspan><input type=\"text\" value=\"{{ s.consequence }}\" sc-camel-on-change=\"{{ s.setConsequence }}\" disabled=\"{{ s.applied }}\"><\u002Flabel>\n                        <label><span>Process<\u002Fspan><input type=\"text\" value=\"{{ s.proc }}\" sc-camel-on-change=\"{{ s.setProc }}\" disabled=\"{{ s.applied }}\"><\u002Flabel>\n                        <label><span>Proposed owner role<\u002Fspan><input type=\"text\" value=\"{{ s.owner }}\" sc-camel-on-change=\"{{ s.setOwner }}\" disabled=\"{{ s.applied }}\"><\u002Flabel>\n                        <label><span>Existing controls<\u002Fspan><input type=\"text\" value=\"{{ s.existing }}\" sc-camel-on-change=\"{{ s.setExisting }}\" disabled=\"{{ s.applied }}\"><\u002Flabel>\n                      <\u002Fdiv>\n                      <div class=\"score-grid\">\n                        <label><span>L<\u002Fspan><input type=\"number\" min=\"1\" max=\"5\" value=\"{{ s.L }}\" sc-camel-on-change=\"{{ s.setL }}\" disabled=\"{{ s.applied }}\"><\u002Flabel>\n                        <label><span>Operational<\u002Fspan><input type=\"number\" min=\"1\" max=\"5\" value=\"{{ s.od }}\" sc-camel-on-change=\"{{ s.setOd }}\" disabled=\"{{ s.applied }}\"><\u002Flabel>\n                        <label><span>Financial<\u002Fspan><input type=\"number\" min=\"1\" max=\"5\" value=\"{{ s.fl }}\" sc-camel-on-change=\"{{ s.setFl }}\" disabled=\"{{ s.applied }}\"><\u002Flabel>\n                        <label><span>Reputation<\u002Fspan><input type=\"number\" min=\"1\" max=\"5\" value=\"{{ s.rd }}\" sc-camel-on-change=\"{{ s.setRd }}\" disabled=\"{{ s.applied }}\"><\u002Flabel>\n                        <label><span>Legal<\u002Fspan><input type=\"number\" min=\"1\" max=\"5\" value=\"{{ s.lg }}\" sc-camel-on-change=\"{{ s.setLg }}\" disabled=\"{{ s.applied }}\"><\u002Flabel>\n                        <label><span>Treatment<\u002Fspan><sc-raw-select value=\"{{ s.opt }}\" sc-camel-on-change=\"{{ s.setOpt }}\" disabled=\"{{ s.applied }}\"><sc-for list=\"{{ s.opts }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n                      <\u002Fdiv>\n                      <div class=\"suggestion-grid two\">\n                        <label><span>Annex A controls<\u002Fspan><input type=\"text\" value=\"{{ s.aref }}\" sc-camel-on-change=\"{{ s.setAref }}\" disabled=\"{{ s.applied }}\"><\u002Flabel>\n                        <label><span>Treatment plan<\u002Fspan><textarea rows=\"2\" value=\"{{ s.plan }}\" sc-camel-on-change=\"{{ s.setPlan }}\" disabled=\"{{ s.applied }}\"><\u002Ftextarea><\u002Flabel>\n                      <\u002Fdiv>\n                      <p class=\"rationale\"><b>Basis:<\u002Fb> {{ s.rationale }} <span title=\"{{ s.confidenceReason }}\">{{ s.confidenceReason }}<\u002Fspan><\u002Fp>\n                      <button sc-camel-on-click=\"{{ s.reject }}\" disabled=\"{{ s.applied }}\" class=\"text-action\">{{ s.rejectLabel }}<\u002Fbutton>\n                    <\u002Farticle>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ hasControlSuggestions }}\">\n                <div class=\"review-section-head\"><span><span class=\"eyebrow accent\">Annex A recommendations<\u002Fspan><b>{{ controlSuggestionCount }}<\u002Fb><\u002Fspan><small>Unsafe exclusions and conflicting human decisions are locked.<\u002Fsmall><\u002Fdiv>\n                <div class=\"suggestion-list compact\">\n                  <sc-for list=\"{{ controlSuggestionRows }}\" as=\"c\" hint-placeholder-count=\"4\">\n                    <article class=\"control-draft suggestion-{{ c.stateTone }}\">\n                      <button sc-camel-on-click=\"{{ c.toggle }}\" disabled=\"{{ c.unavailable }}\" aria-pressed=\"{{ c.selected }}\" class=\"select-draft\">{{ c.selectLabel }}<\u002Fbutton>\n                      <span class=\"control-name\"><b>{{ c.id }} · {{ c.title }}<\u002Fb><small>{{ c.linked }}<\u002Fsmall><\u002Fspan>\n                      <sc-raw-select value=\"{{ c.decision }}\" sc-camel-on-change=\"{{ c.setDecision }}\" disabled=\"{{ c.applied }}\" aria-label=\"Proposed applicability for {{ c.id }}\"><option value=\"Included\">Included<\u002Foption><option value=\"Excluded\">Excluded<\u002Foption><\u002Fsc-raw-select>\n                      <textarea rows=\"2\" value=\"{{ c.why }}\" sc-camel-on-change=\"{{ c.setWhy }}\" disabled=\"{{ c.applied }}\" aria-label=\"Justification for {{ c.id }}\"><\u002Ftextarea>\n                      <span class=\"confidence confidence-{{ c.confidenceTone }}\">{{ c.confidence }}<\u002Fspan>\n                      <span class=\"draft-state\">{{ c.stateLabel }}<\u002Fspan>\n                      <sc-if value=\"{{ c.hasConflict }}\"><div class=\"notice notice-danger\">{{ c.conflict }}<\u002Fdiv><\u002Fsc-if>\n                      <button sc-camel-on-click=\"{{ c.reject }}\" disabled=\"{{ c.applied }}\" class=\"text-action\">{{ c.rejectLabel }}<\u002Fbutton>\n                    <\u002Farticle>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div class=\"action-bar sticky-review-actions\">\n                <button sc-camel-on-click=\"{{ selectHighConfidence }}\" disabled=\"{{ batchOutdated }}\" class=\"quiet-action\">SELECT HIGH CONFIDENCE<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ applySelectedSuggestions }}\" disabled=\"{{ applySuggestionsDisabled }}\" class=\"primary-action\">APPLY {{ selectedSuggestionCount }} SELECTED<\u002Fbutton>\n                <span>Every applied item records AI provenance and a human approval timestamp.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n\n          <div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; margin-bottom: 14px\">\n            <input data-context-search=\"4\" type=\"text\" value=\"{{ riskQ }}\" sc-camel-on-change=\"{{ setRiskQ }}\" placeholder=\"Search risks…\" aria-label=\"Search risks\" style=\"width: 190px\">\n            <div style=\"display: flex; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden\">\n              <button sc-camel-on-click=\"{{ setAsset }}\" title=\"Assess asset by asset\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 6px 9px; border: none; cursor: pointer; background: {{ methodAssetBg }}; color: {{ methodAssetFg }}; min-height: 34px\">ASSET<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ setScen }}\" title=\"Assess by scenario, with PESTEL\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 6px 9px; border: none; cursor: pointer; background: {{ methodScenBg }}; color: {{ methodScenFg }}; min-height: 34px\">SCENARIO<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display: flex; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden\">\n              <button sc-camel-on-click=\"{{ setQual }}\" title=\"Score in words\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 6px 9px; border: none; cursor: pointer; background: {{ qualBg }}; color: {{ qualFg }}; min-height: 34px\">QUAL<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ setQuant }}\" title=\"Score in money — SLE, ALE, annual benefit\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 6px 9px; border: none; cursor: pointer; background: {{ quantBg }}; color: {{ quantFg }}; min-height: 34px\">QUANT<\u002Fbutton>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ openWiz }}\" title=\"Review the eight submitted clause 6.1.2 answers\" style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; padding: 6px 9px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink-soft); cursor: pointer; white-space: nowrap; min-height: 34px\">REVIEW ANSWERS<\u002Fbutton>\n            <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint)\">{{ riskCount }}<\u002Fspan>\n            <label style=\"display: flex; align-items: center; gap: 7px; margin-left: auto\">\n              <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint)\">Appetite ≤<\u002Fspan>\n              <input type=\"number\" min=\"1\" max=\"25\" value=\"{{ threshold }}\" sc-camel-on-change=\"{{ setThreshold }}\" aria-label=\"Risk acceptance threshold\" style=\"width: 54px; text-align: center; font-weight: 700\">\n            <\u002Flabel>\n            <button sc-camel-on-click=\"{{ addRisk }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 6px 11px; border: none; border-radius: 2px; background: #CC000E; color: #fff; cursor: pointer; white-space: nowrap; min-height: 34px\">+ RISK<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ exportRisks }}\" style=\"font-family: var(--mono); font-size: 10.5px; padding: 6px 11px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; min-height: 34px\">EXPORT CSV<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px\">\n            <button sc-camel-on-click=\"{{ openHeat }}\" style=\"display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .07em; padding: 11px 15px; min-height: 44px; border: none; border-radius: 3px; background: #2C2D2E; color: #fff; cursor: pointer; box-shadow: 0 3px 10px rgba(44,45,46,.18)\" style-hover=\"background: #CC000E\">\n              <span aria-hidden=\"true\" style=\"display: grid; grid-template-columns: repeat(3,5px); grid-template-rows: repeat(3,5px); gap: 1.5px\">\n                <span style=\"background: #17693A\"><\u002Fspan><span style=\"background: #8A5A00\"><\u002Fspan><span style=\"background: #CC000E\"><\u002Fspan>\n                <span style=\"background: #8A5A00\"><\u002Fspan><span style=\"background: #CC000E\"><\u002Fspan><span style=\"background: #B6000C\"><\u002Fspan>\n                <span style=\"background: #17693A\"><\u002Fspan><span style=\"background: #8A5A00\"><\u002Fspan><span style=\"background: #CC000E\"><\u002Fspan>\n              <\u002Fspan>\n              OPEN THE HEAT MAP\n            <\u002Fbutton>\n            <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint)\">{{ heatSummary }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ toggleNumbers }}\" aria-expanded=\"{{ numbersAria }}\" style=\"display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; margin-bottom: 16px; padding: 10px 13px; border: 1px solid var(--line); border-left: 3px solid #FBE7E8; border-radius: 3px; background: var(--surface); cursor: pointer\" style-hover=\"border-color: var(--rule)\">\n            <span style=\"font-family: var(--mono); font-size: 11px; color: var(--accent-text); width: 11px\">{{ numbersGlyph }}<\u002Fspan>\n            <span style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint)\">How the numbers are reached<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ numbersOpen }}\">\n            <div style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid #FBE7E8; border-radius: 3px; padding: 14px; margin-bottom: 16px; max-width: 780px\">\n              <p style=\"margin: 0; font-size: 12px; line-height: 1.7; color: var(--ink-soft); text-wrap: pretty\">Impact is the average of four factors — operational disruption, financial loss, reputational damage and legal exposure — kept to one decimal, so a risk that is catastrophic financially and negligible reputationally does not read as uniformly severe. Inherent score is likelihood × that average.<\u002Fp>\n              <p style=\"margin: 10px 0 0; font-size: 12px; line-height: 1.7; color: var(--ink-soft); text-wrap: pretty\">Residual is derived from the controls you have actually implemented, not from a number you type. Full coverage takes two off likelihood and one off impact, and never below 1 — no control drives a risk to zero. Avoid removes the exposure; Transfer moves the financial consequence but leaves likelihood alone.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          \n\n          <sc-if value=\"{{ noRisks }}\">\n            <div style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid #8A5A00; border-radius: 3px; padding: 16px 18px; margin-top: 16px; max-width: 720px\">\n              <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint)\">Nothing identified yet<\u002Fdiv>\n              <p style=\"margin: 8px 0 0; font-size: 12.5px; line-height: 1.7; color: var(--ink-soft); text-wrap: pretty\">The register starts empty on purpose. Clause 6.1.2 asks what <i>this<\u002Fi> organisation faces, and a set of seeded risks belonging to someone else is the wrong place to start. Add the first one when you have it.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display: flex; flex-direction: column; gap: 9px; margin-top: 16px\">\n            <sc-for list=\"{{ riskRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n              <div data-row-id=\"{{ r.id }}\" class=\"card {{ r.flash }}\" style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid {{ r.bandTone }}; border-radius: 3px\">\n                <div style=\"display: flex; align-items: center; gap: 11px; padding: 11px 13px; flex-wrap: wrap\">\n                  <button sc-camel-on-click=\"{{ r.toggle }}\" aria-expanded=\"{{ r.ariaOpen }}\" aria-label=\"Toggle risk detail\" style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 3px 9px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">{{ r.glyph }}<\u002Fbutton>\n                  <span style=\"font-family: var(--mono); font-size: 12px; font-weight: 800; color: var(--accent-text)\">{{ r.id }}<\u002Fspan>\n                  <sc-if value=\"{{ r.aiReviewed }}\"><span class=\"ai-reviewed-badge\" title=\"AI-drafted and approved by a person\">AI · REVIEWED<\u002Fspan><\u002Fsc-if>\n                  <span style=\"flex: 1; min-width: 180px\">\n                    <span style=\"display: block; font-size: 13px; font-weight: 600; line-height: 1.35\">{{ r.subject }}<\u002Fspan>\n                    <span style=\"display: block; font-family: var(--mono); font-size: 10px; color: var(--ink-faint); margin-top: 2px\">{{ r.cause }}<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"display: flex; align-items: center; gap: 7px; flex-wrap: wrap\">\n                    <span title=\"Inherent score\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 4px 8px; border-radius: 2px; background: {{ r.bandTone }}; color: #fff\">{{ r.score }} {{ r.band }}<\u002Fspan>\n                    <span style=\"font-family: var(--mono); font-size: 11px; color: var(--rule)\">→<\u002Fspan>\n                    <span title=\"Residual score, derived from implemented controls\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 4px 8px; border-radius: 2px; border: 1px solid {{ r.rbandTone }}; color: {{ r.rbandTone }}\">{{ r.res }} {{ r.rband }}<\u002Fspan>\n                    <span style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; color: {{ r.insideTone }}\">{{ r.insideWord }}<\u002Fspan>\n                    <sc-if value=\"{{ r.quant }}\">\n                      <span title=\"Annual loss expectancy\" style=\"font-family: var(--mono); font-size: 9.5px; color: var(--ink-soft); border-left: 1px solid var(--rule); padding-left: 9px\">ALE {{ r.aleText }}<\u002Fspan>\n                    <\u002Fsc-if>\n                  <\u002Fspan>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{ r.open }}\">\n                  <div style=\"border-top: 1px solid var(--line); padding: 13px; display: grid; gap: 14px\">\n                    <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(190px,1fr)); gap: 11px\">\n                      <label style=\"display: block\">\n                        <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 4px\">Risk owner<\u002Fspan>\n                        <input type=\"text\" value=\"{{ r.owner }}\" sc-camel-on-change=\"{{ r.setOwner }}\" placeholder=\"who owns this risk\" aria-label=\"Risk owner\" style=\"width: 100%\">\n                      <\u002Flabel>\n                      <label style=\"display: block\">\n                        <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 4px\">Likelihood<\u002Fspan>\n                        <sc-raw-select value=\"{{ r.L }}\" sc-camel-on-change=\"{{ r.setL }}\" aria-label=\"Likelihood\" style=\"width: 100%; font-size: 11px\">\n                          <sc-for list=\"{{ r.likelihoods }}\" as=\"l\" hint-placeholder-count=\"5\">\n                            <option value=\"{{ l.n }}\">{{ l.label }}<\u002Fopti {{ r.setAsset }}\" placeholder=\"what is at risk\" aria-label=\"Asset\" style=\"width: 100%\">\n                        <\u002Flabel>\n                        <label style=\"display: block\">\n                          <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 4px\">Threat<\u002Fspan>\n                          <input type=\"text\" value=\"{{ r.threat }}\" sc-camel-on-change=\"{{ r.setThreat }}\" placeholder=\"what could act against it\" aria-label=\"Threat\" style=\"width: 100%\">\n                        <\u002Flabel>\n                        <label style=\"display: block\">\n                          <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 4px\">Vulnerability<\u002Fspan>\n                          <textarea value=\"{{ r.vuln }}\" sc-camel-on-change=\"{{ r.setVuln }}\" rows=\"2\" placeholder=\"the weakness the threat exploits\" aria-label=\"Vulnerability\" style=\"width: 100%; resize: vertical\"><\u002Ftextarea>\n                        <\u002Flabel>\n                      <\u002Fsc-if>\n                      <label style=\"display: block\">\n                        <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 4px\">Existing controls<\u002Fspan>\n                        <textarea value=\"{{ r.existing }}\" sc-camel-on-change=\"{{ r.setExisting }}\" rows=\"2\" placeholder=\"what is already in place\" aria-label=\"Existing controls\" style=\"width: 100%; resize: vertical\"><\u002Ftextarea>\n                      <\u002Flabel>\n                    <\u002Fdiv>\n\n                    <sc-if value=\"{{ r.quant }}\">\n                      <div style=\"background: var(--band); border-radius: 3px; padding: 12px\">\n                        <div style=\"display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin-bottom: 9px\">\n                          <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint)\">Quantitative — annual loss expectancy<\u002Fspan>\n                          <span style=\"font-family: var(--mono); font-size: 10px; color: var(--ink-soft)\">SLE = value × EF · ALE = SLE × ARO<\u002Fspan>\n                        <\u002Fdiv>\n                        <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(120px,1fr)); gap: 9px\">\n                          <label style=\"display: block\">\n                            <span style=\"display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 3px\">Asset value<\u002Fspan>\n                            <input type=\"number\" min=\"0\" value=\"{{ r.av }}\" sc-camel-on-change=\"{{ r.setAv }}\" aria-label=\"Asset value\" style=\"width: 100%\">\n                          <\u002Flabel>\n                          <label style=\"display: block\">\n                            <span style=\"display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 3px\">Exposure %<\u002Fspan>\n                            <input type=\"number\" min=\"0\" max=\"100\" value=\"{{ r.ef }}\" sc-camel-on-change=\"{{ r.setEf }}\" aria-label=\"Exposure factor percent\" style=\"width: 100%\">\n                          <\u002Flabel>\n                          <label style=\"display: block\">\n                            <span style=\"display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 3px\">ARO / year<\u002Fspan>\n                            <input type=\"number\" min=\"0 srcTone }}\">{{ c.srcLabel }}<\u002Fspan>\n                          <\u002Fsc-if>\n                        <\u002Fsc-raw-td>\n                        <sc-raw-td style=\"border-bottom: 1px solid var(--line); padding: 7px 6px; text-align: center; vertical-align: top\">\n                          <sc-if value=\"{{ c.app }}\">\n                            <sc-raw-select value=\"{{ c.status }}\" sc-camel-on-change=\"{{ c.setStatus }}\" aria-label=\"Control status\" style=\"font-family: var(--mono); font-size: 10.5px; width: 100%; border-left: 3px solid {{ c.statusTone }}\">\n                              <sc-for list=\"{{ c.statuses }}\" as=\"o\" hint-placeholder-count=\"3\">\n                                <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                              <\u002Fsc-for>\n                            <\u002Fsc-raw-select>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ c.excluded }}\">\n                            <span title=\"Implementation status does not apply to a control outside the SoA\" style=\"font-family: var(--mono); font-size: 13px; color: var(--ink-faint)\">—<\u002Fspan>\n                          <\u002Fsc-if>\n                        <\u002Fsc-raw-td>\n                        <sc-raw-td style=\"border-bottom: 1px solid var(--line); padding: 7px 8px; vertical-align: top\">\n                          <sc-if value=\"{{ c.app }}\">\n                            <input type=\"text\" value=\"{{ c.owner }}\" sc-camel-on-change=\"{{ c.setOwner }}\" placeholder=\"required by A.5.2\" aria-label=\"Control owner\" style=\"width: 100%; border-color: {{ c.ownerEdge }}; background: {{ c.ownerBg }}\">\n                          <\u002Fsc-if>\n                        <\u002Fsc-raw-td>\n                        <sc-raw-td style=\"border-bottom: 1px solid var(--line); padding: 7px 8px; vertical-align: top\">\n                          <textarea value=\"{{ c.why }}\" sc-camel-on-change=\"{{ c.setWhy }}\" rows=\"2\" placeholder=\"why this control is included or excluded\" aria-label=\"Justification\" style=\"width: 100%; resize: vertical; line-height: 1.5; font-size: 11px\"><\u002Ftextarea>\n                          <div style=\"display: flex; gap: 6px; align-items: center; margin-top: 4px\">\n                            <sc-if value=\"{{ c.whyManual }}\">\n                              <span style=\"font-family: var(--mono); font-size: 8.5px; font-weight: 700; letter-spacing: .07em; padding: 2px 5px; border-radius: 2px; border: 1px solid #CC000E; color: var(--accent-text)\">YOURS<\u002Fspan>\n                            <\u002Fsc-if>\n                            <sc-if value=\"{{ c.canCite }}\">\n                              <button sc-camel-on-click=\"{{ c.cite }}\" title=\"Write the 6.1.3 d) justification from whatever decided this control\" style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .06em; padding: 3px 7px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink-soft); cursor: pointer\">CITE<\u002Fbutton>\n                            <\u002Fsc-if>\n                            <sc-if value=\"{{ c.whyMissing }}\">\n                              <span style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; color: var(--danger-text)\">gate 6.1.3 d)<\u002Fspan>\n                            <\u002Fsc-if>\n                          <\u002Fdiv>\n                        <\u002Fsc-raw-td>\n                        <sc-raw-td style=\"border-bottom: 1px solid var(--line); padding: 7px 6px; vertical-align: top\">\n                          <sc-if value=\"{{ c.hasLinks }}\">\n                            <span style=\"display: flex; gap: 4px; flex-wrap: wrap; justify-content: center\">\n                              <sc-for list=\"{{ c.riskChips }}\" as=\"r\" hint-placeholder-count=\"1\">\n                                <button sc-camel-on-click=\"{{ r.go }}\" title=\"Open this risk\" style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; padding: 3px 6px; border: 1px solid #CC000E; border-radius: 2px; background: var(--surface); color: var(--accent-text); cursor: pointer\">{{ r.id }}<\u002Fbutton>\n                              <\u002Fsc-for>\n                              <sc-for list=\"{{ c.docChips }}\" as=\"d\" hint-placeholder-count=\"1\">\n                                <button sc-camel-on-click=\"{{ d.go }}\" title=\"Open in the document register\" style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; padding: 3px 6px; border: 1px solid {{ d.tone }}; border-radius: 2px; background: var(--surface); color: {{ d.tone }}; cursor: pointer\">{{ d.id }}<\u002Fbutton>\n                              <\u002Fsc-for>\n                            <\u002Fspan>\n                          <\u002Fsc-if>\n                        <\u002Fsc-raw-td>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-for>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isSoaMobile }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 8px\">\n              <sc-for list=\"{{ soaThemes }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <div>\n                  <div style=\"background: #2C2D2E; color: #fff; padding: 9px 12px; border-radius: 3px; display: flex; align-items: center; gap: 9px; margin-top: 6px\">\n                    <button sc-camel-on-click=\"{{ t.toggle }}\" aria-expanded=\"{{ t.ariaOpen }}\" aria-label=\"Toggle theme\" style=\"font-family: var(--mono); font-size: 11px; padding: 2px 8px; border: 1px solid #54585B; border-radius: 2px; background: transparent; color: #fff; cursor: pointer\">{{ t.glyph }}<\u002Fbutton>\n                    <span style=\"font-family: var(--mono); font-size: 11px; opacity: .65\">{{ t.g }}<\u002Fspan>\n                    <span style=\"flex: 1; font-weight: 700; font-size: 13px\">{{ t.name }}<\u002Fspan>\n                    <span style=\"font-family: var(--mono); font-size: 9.5px; opacity: .72\">{{ t.meta }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ t.rows }}\" as=\"c\" hint-placeholder-count=\"4\">\n                    <div data-row-id=\"{{ c.id }}\" class=\"card {{ c.flash }}\" style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid {{ c.statusTone }}; border-radius: 3px; padding: 12px; margin-top: 8px\">\n                      <div style=\"display: flex; gap: 8px; align-items: center; margin-bottom: 5px\">\n                        <span style=\"font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: var(--accent-text)\">{{ c.id }}<\u002Fspan>\n                        <sc-if value=\"{{ c.isNew }}\">\n                          <span style=\"font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: .07em; color: var(--accent-text); border: 1px solid #CC000E; border-radius: 2px; padding: 1px 4px\">NEW 2022<\u002Fspan>\n                        <\u002Fsc-if>\n                        <span style=\"flex: 1\"><\u002Fspan>\n                        <button sc-camel-on-click=\"{{ c.toggleApp }}\" aria-label=\"Toggle applicability\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .07em; padding: 7px 12px; min-height: 34px; border-radius: 2px; cursor: pointer; border: 1px solid {{ c.appEdge }}; background: {{ c.appBg }}; color: {{ c.appFg }}\">{{ c.appWord }}<\u002Fbutton>\n                      <\u002Fdiv>\n                      <div style=\"font-size: 13px; font-weight: 600; line-height: 1.35\">{{ c.title }}<\u002Fdiv>\n                      <div style=\"font-family: var(--mono); font-size: 9px; letter-spacing: .07em; color: {{ c.srcTone }}; margin: 4px 0 9px\">{{ c.srcLabel }}<\u002Fdiv>\n                      <div style=\"display: grid; gap: 7px\">\n                        <sc-if value=\"{{ c.app }}\">\n                          <sc-raw-select value=\"{{ c.status }}\" sc-camel-on-change=\"{{ c.setStatus }}\" aria-label=\"Control status\" style=\"font-family: var(--mono); font-size: 11px; width: 100%; min-height: 44px; border-left: 3px solid {{ c.statusTone }}\">\n                            <sc-for list=\"{{ c.statuses }}\" as=\"o\" hint-placeholder-count=\"3\">\n                              <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                            <\u002Fsc-for>\n                          <\u002Fsc-raw-select>\n                          <input type=\"text\" value=\"{{ c.owner }}\" sc-camel-on-change=\"{{ c.setOwner }}\" placeholder=\"control owner — required by A.5.2\" aria-label=\"Control owner\" style=\"width: 100%; min-height: 44px; border-color: {{ c.ownerEdge }}; background: {{ c.ownerBg }}\">\n                        <\u002Fsc-if>\n                        <textarea value=\"{{ c.why }}\" sc-camel-on-change=\"{{ c.setWhy }}\" rows=\"3\" placeholder=\"why this control is included or excluded\" aria-label=\"Justification\" style=\"width: 100%; resize: vertical; line-height: 1.55\"><\u002Ftextarea>\n                        <div style=\"display: flex; gap: 7px; align-items: center; flex-wrap: wrap\">\n                          <sc-if value=\"{{ c.whyManual }}\">\n                            <span style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .07em; padding: 3px 6px; border-radius: 2px; border: 1px solid #CC000E; color: var(--accent-text)\">YOURS<\u002Fspan>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ c.canCite }}\">\n                            <button sc-camel-on-click=\"{{ c.cite }}\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink-soft); cursor: pointer\">CITE<\u002Fbutton>\n                          <\u002Fsc-if>\n                          <sc-for list=\"{{ c.riskChips }}\" as=\"r\" hint-placeholder-count=\"1\">\n                            <button sc-camel-on-click=\"{{ r.go }}\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 9px 12px; min-height: 38px; border: 1px solid #CC000E; border-radius: 2px; background: var(--surface); color: var(--accent-text); cursor: pointer\">{{ r.id }}<\u002Fbutton>\n                          <\u002Fsc-for>\n                          <sc-for list=\"{{ c.docChips }}\" as=\"d\" hint-placeholder-count=\"1\">\n                            <button sc-camel-on-click=\"{{ d.go }}\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 9px 12px; min-height: 38px; border: 1px solid {{ d.tone }}; border-radius: 2px; background: var(--surface); color: {{ d.tone }}; cursor: pointer\">{{ d.id }}<\u002Fbutton>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <p style=\"font-size: 11px; color: var(--ink-faint); margin-top: 12px; max-width: 900px; line-height: 1.65\">Applicability is decided, never defaulted, in strict precedence: a risk citing the control wins, then the organisation profile, then a covering document, then the baseline ISMS set. <b>Decided by<\u002Fb> names which of those settled it. Override the decision and it becomes <b>YOURS<\u002Fb> — the engine stops writing that row, and that provenance is what an auditor asks for under 6.1.3 d).<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isStub }}\">\n        <div style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--rule); padding: 16px 18px; bord
