  <\u002Fsc-if>\n\n      <sc-if value=\"{{ isRisks }}\">\n        <div>\n          <div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; margin-bottom: 14px\">\n            <input type=\"text\" value=\"{{ riskQ }}\" sc-camel-on-change=\"{{ setRiskQ }}\" placeholder=\"Search risks…\" aria-label=\"Search risks\" style=\"width: 190px\">\n            <div style=\"display: flex; border: 1px solid var(--line-2); border-radius: 2px; overflow: hidden\">\n              <button sc-camel-on-click=\"{{ setAsset }}\" title=\"Assess asset by asset\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 6px 9px; border: none; cursor: pointer; background: {{ methodAssetBg }}; color: {{ methodAssetFg }}; min-height: 34px\">ASSET<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ setScen }}\" title=\"Assess by scenario, with PESTEL\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 6px 9px; border: none; cursor: pointer; background: {{ methodScenBg }}; color: {{ methodScenFg }}; min-height: 34px\">SCENARIO<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display: flex; border: 1px solid var(--line-2); border-radius: 2px; overflow: hidden\">\n              <button sc-camel-on-click=\"{{ setQual }}\" title=\"Score in words\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 6px 9px; border: none; cursor: pointer; background: {{ qualBg }}; color: {{ qualFg }}; min-height: 34px\">QUAL<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ setQuant }}\" title=\"Score in money — SLE, ALE, annual benefit\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 6px 9px; border: none; cursor: pointer; background: {{ quantBg }}; color: {{ quantFg }}; min-height: 34px\">QUANT<\u002Fbutton>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ openWiz }}\" title=\"Clause 6.1.2 — answer eight questions and let them decide\" style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; padding: 6px 9px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer; white-space: nowrap; min-height: 34px\">HELP ME CHOOSE<\u002Fbutton>\n            <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">{{ riskCount }}<\u002Fspan>\n            <label style=\"display: flex; align-items: center; gap: 7px; margin-left: auto\">\n              <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">Appetite ≤<\u002Fspan>\n              <input type=\"number\" min=\"1\" max=\"25\" value=\"{{ threshold }}\" sc-camel-on-change=\"{{ setThreshold }}\" aria-label=\"Risk acceptance threshold\" style=\"width: 54px; text-align: center; font-weight: 700\">\n            <\u002Flabel>\n            <button sc-camel-on-click=\"{{ addRisk }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 6px 11px; border: none; border-radius: 2px; background: var(--accent-fill); color: var(--on-fill); cursor: pointer; white-space: nowrap; min-height: 34px\">+ RISK<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ exportRisks }}\" style=\"font-family: var(--mono); font-size: 10.5px; padding: 6px 11px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; min-height: 34px\">EXPORT CSV<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px\">\n            <button sc-camel-on-click=\"{{ openHeat }}\" style=\"display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .07em; padding: 11px 15px; min-height: 44px; border: none; border-radius: 3px; background: var(--solid); color: var(--on-fill); cursor: pointer; box-shadow: 0 3px 10px rgba(44,45,46,.18)\" style-hover=\"background: var(--accent-fill)\">\n              <span aria-hidden=\"true\" style=\"display: grid; grid-template-columns: repeat(3,5px); grid-template-rows: repeat(3,5px); gap: 1.5px\">\n                <span style=\"background: var(--ok-fill)\"><\u002Fspan><span style=\"background: var(--warn-fill)\"><\u002Fspan><span style=\"background: var(--accent-fill)\"><\u002Fspan>\n                <span style=\"background: var(--warn-fill)\"><\u002Fspan><span style=\"background: var(--accent-fill)\"><\u002Fspan><span style=\"background: var(--danger-fill)\"><\u002Fspan>\n                <span style=\"background: var(--ok-fill)\"><\u002Fspan><span style=\"background: var(--warn-fill)\"><\u002Fspan><span style=\"background: var(--accent-fill)\"><\u002Fspan>\n              <\u002Fspan>\n              OPEN THE HEAT MAP\n            <\u002Fbutton>\n            <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">{{ heatSummary }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ toggleNumbers }}\" aria-expanded=\"{{ numbersAria }}\" style=\"display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; margin-bottom: 16px; padding: 10px 13px; border: 1px solid var(--line); border-left: 3px solid var(--accent-wash); border-radius: 3px; background: var(--surface); cursor: pointer\" style-hover=\"border-color: var(--line-2)\">\n            <span style=\"font-family: var(--mono); font-size: 11px; color: var(--accent); width: 11px\">{{ numbersGlyph }}<\u002Fspan>\n            <span style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">How the numbers are reached<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ numbersOpen }}\">\n            <div style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent-wash); border-radius: 3px; padding: 14px; margin-bottom: 16px; max-width: 780px\">\n              <p style=\"margin: 0; font-size: 12px; line-height: 1.7; color: var(--ink-2); text-wrap: pretty\">Impact is the average of four factors — operational disruption, financial loss, reputational damage and legal exposure — kept to one decimal, so a risk that is catastrophic financially and negligible reputationally does not read as uniformly severe. Inherent score is likelihood × that average.<\u002Fp>\n              <p style=\"margin: 10px 0 0; font-size: 12px; line-height: 1.7; color: var(--ink-2); text-wrap: pretty\">Residual is derived from the controls you have actually implemented, not from a number you type. Full coverage takes two off likelihood and one off impact, and never below 1 — no control drives a risk to zero. Avoid removes the exposure; Transfer moves the financial consequence but leaves likelihood alone.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          \n\n          <sc-if value=\"{{ wizOpen }}\">\n            <div class=\"pane\" style=\"background: var(--surface); border: 1px solid var(--line-2); border-top: 3px solid var(--accent); border-radius: 4px; padding: 20px; max-width: 780px; margin-bottom: 16px\">\n              <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">Clause 6.1.2 — define the process before you assess<\u002Fdiv>\n              <h2 style=\"margin: 5px 0 6px; font-size: 19px; font-weight: 700; letter-spacing: -.01em\">Which risk assessment method fits this organisation?<\u002Fh2>\n              <p style=\"margin: 0 0 14px; font-size: 12.5px; line-height: 1.65; color: var(--ink-2); max-width: 640px; text-wrap: pretty\">Eight questions. The first five choose between assessing asset by asset or by scenario; the last three decide whether you score in words or in money. Neither answer is better — the standard asks only that the method is defined and applied consistently.<\u002Fp>\n\n              <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px\">Assessment method<\u002Fdiv>\n              <sc-for list=\"{{ methodQs }}\" as=\"qq\" hint-placeholder-count=\"5\">\n                <div style=\"padding: 11px 0; border-bottom: 1px solid var(--line)\">\n                  <div style=\"font-size: 13px; font-weight: 600; line-height: 1.45; margin-bottom: 7px\">{{ qq.q }}<\u002Fdiv>\n                  <div style=\"display: flex; gap: 7px; flex-wrap: wrap\">\n                    <sc-for list=\"{{ qq.opts }}\" as=\"o\" hint-placeholder-count=\"2\">\n                      <button sc-camel-on-click=\"{{ o.pick }}\" style=\"font-size: 11.5px; padding: 7px 12px; min-height: 36px; border-radius: 2px; cursor: pointer; border: 1px solid {{ o.edge }}; background: {{ o.bg }}; color: {{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n\n              <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); margin: 16px 0 2px\">Analysis type<\u002Fdiv>\n              <sc-for list=\"{{ analysisQs }}\" as=\"qq\" hint-placeholder-count=\"3\">\n                <div style=\"padding: 11px 0; border-bottom: 1px solid var(--line)\">\n                  <div style=\"font-size: 13px; font-weight: 600; line-height: 1.45; margin-bottom: 7px\">{{ qq.q }}<\u002Fdiv>\n                  <div style=\"display: flex; gap: 7px; flex-wrap: wrap\">\n                    <sc-for list=\"{{ qq.opts }}\" as=\"o\" hint-placeholder-count=\"2\">\n                      <button sc-camel-on-click=\"{{ o.pick }}\" style=\"font-size: 11.5px; padding: 7px 12px; min-height: 36px; border-radius: 2px; cursor: pointer; border: 1px solid {{ o.edge }}; background: {{ o.bg }}; color: {{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n\n              <div style=\"display: flex; gap: 9px; flex-wrap: wrap; align-items: center; margin-top: 16px\">\n                <sc-if value=\"{{ wizDone }}\">\n                  <span style=\"display: flex; gap: 9px; align-items: center; flex-wrap: wrap\">\n                    <span style=\"font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--ok)\">{{ wizVerdict }}<\u002Fspan>\n                    <button sc-camel-on-click=\"{{ applyMethod }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 14px; min-height: 38px; border: none; border-radius: 2px; background: var(--accent-fill); color: var(--on-fill); cursor: pointer\">USE THIS METHOD<\u002Fbutton>\n                  <\u002Fspan>\n                <\u002Fsc-if>\n                <button sc-camel-on-click=\"{{ skipMethod }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 14px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">SKIP — ASSET-BASED, QUALITATIVE<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ closeWiz }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 14px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer\">CANCEL<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ noRisks }}\">\n            <div style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 3px; padding: 16px 18px; margin-top: 16px; max-width: 720px\">\n              <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">Nothing identified yet<\u002Fdiv>\n              <p style=\"margin: 8px 0 0; font-size: 12.5px; line-height: 1.7; color: var(--ink-2); text-wrap: pretty\">The register starts empty on purpose. Clause 6.1.2 asks what <i>this<\u002Fi> organisation faces, and a set of seeded risks belonging to someone else is the wrong place to start. Add the first one when you have it.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display: flex; flex-direction: column; gap: 9px; margin-top: 16px\">\n            <sc-for list=\"{{ riskRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n              <div data-row-id=\"{{ r.id }}\" class=\"card {{ r.flash }}\" style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid {{ r.bandTone }}; border-radius: 3px\">\n                <div style=\"display: flex; align-items: center; gap: 11px; padding: 11px 13px; flex-wrap: wrap\">\n                  <button sc-camel-on-click=\"{{ r.toggle }}\" aria-expanded=\"{{ r.ariaOpen }}\" aria-label=\"Toggle risk detail\" style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 3px 9px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">{{ r.glyph }}<\u002Fbutton>\n                  <span style=\"font-family: var(--mono); font-size: 12px; font-weight: 800; color: var(--accent)\">{{ r.id }}<\u002Fspan>\n                  <span style=\"flex: 1; min-width: 180px\">\n                    <span style=\"display: block; font-size: 13px; font-weight: 600; line-height: 1.35\">{{ r.subject }}<\u002Fspan>\n                    <span style=\"display: block; font-family: var(--mono); font-size: 10px; color: var(--ink-3); margin-top: 2px\">{{ r.cause }}<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"display: flex; align-items: center; gap: 7px; flex-wrap: wrap\">\n                    <span title=\"Inherent score\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 4px 8px; border-radius: 2px; background: {{ r.bandTone }}; color: var(--on-fill)\">{{ r.score }} {{ r.band }}<\u002Fspan>\n                    <span style=\"font-family: var(--mono); font-size: 11px; color: var(--faint)\">→<\u002Fspan>\n                    <span title=\"Residual score, derived from implemented controls\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 4px 8px; border-radius: 2px; border: 1px solid {{ r.rbandTone }}; color: {{ r.rbandTone }}\">{{ r.res }} {{ r.rband }}<\u002Fspan>\n                    <span style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; color: {{ r.insideTone }}\">{{ r.insideWord }}<\u002Fspan>\n                    <sc-if value=\"{{ r.quant }}\">\n                      <span title=\"Annual loss expectancy\" style=\"font-family: var(--mono); font-size: 9.5px; color: var(--ink-2); border-left: 1px solid var(--line-2); padding-left: 9px\">ALE {{ r.aleText }}<\u002Fspan>\n                    <\u002Fsc-if>\n                  <\u002Fspan>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{ r.open }}\">\n                  <div style=\"border-top: 1px solid var(--line); padding: 13px; display: grid; gap: 14px\">\n                    <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(190px,1fr)); gap: 11px\">\n                      <label style=\"display: block\">\n                        <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Risk owner<\u002Fspan>\n                        <input type=\"text\" value=\"{{ r.owner }}\" sc-camel-on-change=\"{{ r.setOwner }}\" placeholder=\"who owns this risk\" aria-label=\"Risk owner\" style=\"width: 100%\">\n                      <\u002Flabel>\n                      <label style=\"display: block\">\n                        <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Likelihood<\u002Fspan>\n                        <sc-raw-select value=\"{{ r.L }}\" sc-camel-on-change=\"{{ r.setL }}\" aria-label=\"Likelihood\" style=\"width: 100%; font-size: 11px\">\n                          <sc-for list=\"{{ r.likelihoods }}\" as=\"l\" hint-placeholder-count=\"5\">\n                            <option value=\"{{ l.n }}\">{{ l.label }}<\u002Foption>\n                          <\u002Fsc-for>\n                        <\u002Fsc-raw-select>\n                      <\u002Flabel>\n                      <label style=\"display: block\">\n                        <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Treatment option<\u002Fspan>\n                        <sc-raw-select value=\"{{ r.opt }}\" sc-camel-on-change=\"{{ r.setOpt }}\" aria-label=\"Treatment option\" style=\"width: 100%; font-size: 11px\">\n                          <sc-for list=\"{{ r.opts }}\" as=\"o\" hint-placeholder-count=\"4\">\n                            <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                          <\u002Fsc-for>\n                        <\u002Fsc-raw-select>\n                      <\u002Flabel>\n                      <label style=\"display: block\">\n                        <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Status<\u002Fspan>\n                        <sc-raw-select value=\"{{ r.status }}\" sc-camel-on-change=\"{{ r.setStatus }}\" aria-label=\"Risk status\" style=\"width: 100%; font-size: 11px; border-left: 3px solid {{ r.statusTone }}\">\n                          <sc-for list=\"{{ r.statuses }}\" as=\"o\" hint-placeholder-count=\"5\">\n                            <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                          <\u002Fsc-for>\n                        <\u002Fsc-raw-select>\n                      <\u002Flabel>\n                    <\u002Fdiv>\n\n                    <div>\n                      <div style=\"display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin-bottom: 8px\">\n                        <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">Impact — four factors<\u002Fspan>\n                        <span title=\"{{ r.impactMath }}\" style=\"font-family: var(--mono); font-size: 11px; font-weight: 800; color: {{ r.ivTone }}; border-bottom: 1px dotted {{ r.ivTone }}; cursor: help\">{{ r.iv }} · {{ r.ivClass }}<\u002Fspan>\n                        <span style=\"font-family: var(--mono); font-size: 9.5px; color: var(--ink-3)\">{{ r.impactMath }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap: 9px\">\n                        <sc-for list=\"{{ r.factors }}\" as=\"f\" hint-placeholder-count=\"4\">\n                          <label title=\"{{ f.hint }}\" style=\"display: block; background: var(--subtle); border: 1px solid var(--line); border-radius: 2px; padding: 8px 9px\">\n                            <span style=\"display: flex; align-items: baseline; gap: 6px; margin-bottom: 5px\">\n                              <span style=\"font-family: var(--mono); font-size: 10px; font-weight: 800; color: var(--accent)\">{{ f.short }}<\u002Fspan>\n                              <span style=\"font-size: 11px; color: var(--ink-2)\">{{ f.label }}<\u002Fspan>\n                            <\u002Fspan>\n                            <sc-raw-select value=\"{{ f.v }}\" sc-camel-on-change=\"{{ f.set }}\" aria-label=\"{{ f.label }}\" style=\"width: 100%; font-size: 11px\">\n                              <option value=\"0\">— not scored<\u002Foption>\n                              <sc-for list=\"{{ f.words }}\" as=\"w\" hint-placeholder-count=\"5\">\n                                <option value=\"{{ w.n }}\">{{ w.label }}<\u002Foption>\n                              <\u002Fsc-for>\n                            <\u002Fsc-raw-select>\n                          <\u002Flabel>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n\n                    <sc-if value=\"{{ r.isScenario }}\">\n                      <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 11px\">\n                        <label style=\"display: block\">\n                          <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Scenario<\u002Fspan>\n                          <textarea value=\"{{ r.scenario }}\" sc-camel-on-change=\"{{ r.setScenario }}\" rows=\"2\" placeholder=\"what happens — e.g. ransomware encrypts the training platform\" aria-label=\"Scenario\" style=\"width: 100%; resize: vertical\"><\u002Ftextarea>\n                        <\u002Flabel>\n                        <label style=\"display: block\">\n                          <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Cause<\u002Fspan>\n                          <textarea value=\"{{ r.cause }}\" sc-camel-on-change=\"{{ r.setCause }}\" rows=\"2\" placeholder=\"what sets it off\" aria-label=\"Cause\" style=\"width: 100%; resize: vertical\"><\u002Ftextarea>\n                        <\u002Flabel>\n                        <label style=\"display: block\">\n                          <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Consequence<\u002Fspan>\n                          <textarea value=\"{{ r.conseq }}\" sc-camel-on-change=\"{{ r.setConseq }}\" rows=\"2\" placeholder=\"what it costs the business\" aria-label=\"Consequence\" style=\"width: 100%; resize: vertical\"><\u002Ftextarea>\n                        <\u002Flabel>\n                      <\u002Fdiv>\n\n                      <div>\n                        <div style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px\">PESTEL — the six lenses on the scenario<\u002Fdiv>\n                        <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(230px,1fr)); gap: 9px\">\n                          <sc-for list=\"{{ r.pestel }}\" as=\"p\" hint-placeholder-count=\"6\">\n                            <label title=\"{{ p.hint }}\" style=\"display: block; background: var(--subtle); border: 1px solid var(--line); border-radius: 2px; padding: 8px 9px\">\n                              <span style=\"display: flex; align-items: baseline; gap: 6px; margin-bottom: 5px\">\n                                <span style=\"font-family: var(--mono); font-size: 10px; font-weight: 800; color: var(--accent)\">{{ p.short }}<\u002Fspan>\n                                <span style=\"font-size: 11px; color: var(--ink-2)\">{{ p.label }}<\u002Fspan>\n                              <\u002Fspan>\n                              <textarea value=\"{{ p.v }}\" sc-camel-on-change=\"{{ p.set }}\" rows=\"2\" place
