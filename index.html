t-family: var(--mono); font-size: 11.5px; font-weight: 700; color: var(--accent)\">{{ c.id }}<\u002Fspan>\n                        <span style=\"font-size: 13.5px; font-weight: 600; flex: 1\">{{ c.title }}<\u002Fspan>\n                        <sc-if value=\"{{ c.needsDoc }}\">\n                          <span style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .09em; padding: 3px 6px; border-radius: 2px; border: 1px solid var(--danger); color: var(--danger)\">DOC<\u002Fspan>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                      <p style=\"font-size: 12px; color: var(--ink-2); line-height: 1.55; margin: 7px 0 10px; text-wrap: pretty\">{{ c.req }}<\u002Fp>\n                      <div style=\"display: grid; gap: 7px\">\n                        <div style=\"display: flex; gap: 8px; align-items: center\">\n                          <sc-raw-select value=\"{{ c.status }}\" sc-camel-on-change=\"{{ c.setStatus }}\" aria-label=\"Clause status\" style=\"flex: 1; font-family: var(--mono); font-size: 11px; min-height: 44px; border-left: 3px solid {{ c.edge }}\">\n                            <sc-for list=\"{{ c.statuses }}\" as=\"o\" hint-placeholder-count=\"5\">\n                              <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                            <\u002Fsc-for>\n                          <\u002Fsc-raw-select>\n                          <span style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .08em; padding: 4px 7px; border-radius: 2px; border: 1px solid {{ c.confTone }}; background: {{ c.confBg }}; color: {{ c.confFg }}; white-space: nowrap\">{{ c.conf }}<\u002Fspan>\n                        <\u002Fdiv>\n                        <input type=\"text\" value=\"{{ c.ev }}\" sc-camel-on-change=\"{{ c.setEv }}\" placeholder=\"evidence: doc ID, link, record…\" aria-label=\"Evidence reference\" style=\"width: 100%; min-height: 44px\">\n                        <sc-if value=\"{{ c.hasDocs }}\">\n                          <span style=\"display: flex; gap: 6px; flex-wrap: wrap; align-items: center\">\n                            <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">Documents<\u002Fspan>\n                            <sc-for list=\"{{ c.docs }}\" as=\"d\" hint-placeholder-count=\"2\">\n                              <button sc-camel-on-click=\"{{ d.go }}\" style=\"font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 8px 11px; min-height: 38px; border: 1px solid {{ d.tone }}; border-radius: 2px; background: var(--surface); color: {{ d.tone }}; cursor: pointer\">{{ d.id }}<\u002Fbutton>\n                            <\u002Fsc-for>\n                          <\u002Fspan>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <p style=\"font-size: 11px; color: var(--ink-3); margin-top: 12px; max-width: 900px; line-height: 1.65\">Conformity is derived from the status you set, the evidence you record and whether the linked document has been approved. Green document chips are approved or published; amber ones are not there yet. <b>Verified<\u002Fb> is never set for you — clause 9.2 makes that your judgement.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isRisks }}\">\n        <div>\n          <div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; margin-bottom: 14px\">\n            <input type=\"text\" value=\"{{ riskQ }}\" sc-camel-on-change=\"{{ setRiskQ }}\" placeholder=\"Search risks…\" aria-label=\"Search risks\" style=\"width: 190px\">\n            <div style=\"display: flex; border: 1px solid var(--line-2); border-radius: 2px; overflow: hidden\">\n              <button sc-camel-on-click=\"{{ setAsset }}\" title=\"Assess asset by asset\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 6px 9px; border: none; cursor: pointer; background: {{ methodAssetBg }}; color: {{ methodAssetFg }}; min-height: 34px\">ASSET<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ setScen }}\" title=\"Assess by scenario, with PESTEL\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 6px 9px; border: none; cursor: pointer; background: {{ methodScenBg }}; color: {{ methodScenFg }}; min-height: 34px\">SCENARIO<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display: flex; border: 1px solid var(--line-2); border-radius: 2px; overflow: hidden\">\n              <button sc-camel-on-click=\"{{ setQual }}\" title=\"Score in words\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 6px 9px; border: none; cursor: pointer; background: {{ qualBg }}; color: {{ qualFg }}; min-height: 34px\">QUAL<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ setQuant }}\" title=\"Score in money — SLE, ALE, annual benefit\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 6px 9px; border: none; cursor: pointer; background: {{ quantBg }}; color: {{ quantFg }}; min-height: 34px\">QUANT<\u002Fbutton>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ genSugg }}\" title=\"Draft risks and Annex A decisions from your organisation profile — nothing is written until you apply it\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 6px 10px; min-height: 32px; border: none; border-radius: 2px; background: var(--accent-fill); color: var(--on-fill); cursor: pointer\">✻ AI SUGGEST<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ openWiz }}\" title=\"Clause 6.1.2 — answer eight questions and let them decide\" style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; padding: 6px 9px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer; white-space: nowrap; min-height: 34px\">HELP ME CHOOSE<\u002Fbutton>\n            <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">{{ riskCount }}<\u002Fspan>\n            <label style=\"display: flex; align-items: center; gap: 7px; margin-left: auto\">\n              <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">Appetite ≤<\u002Fspan>\n              <input type=\"number\" min=\"1\" max=\"25\" value=\"{{ threshold }}\" sc-camel-on-change=\"{{ setThreshold }}\" aria-label=\"Risk acceptance threshold\" style=\"width: 54px; text-align: center; font-weight: 700\">\n            <\u002Flabel>\n            <button sc-camel-on-click=\"{{ addRisk }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 6px 11px; border: none; border-radius: 2px; background: var(--accent-fill); color: var(--on-fill); cursor: pointer; white-space: nowrap; min-height: 34px\">+ RISK<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ exportRisks }}\" style=\"font-family: var(--mono); font-size: 10.5px; padding: 6px 11px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; min-height: 34px\">EXPORT CSV<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px\">\n            <button sc-camel-on-click=\"{{ openHeat }}\" aria-label=\"Open the risk heat map\" style=\"display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .07em; padding: 11px 15px; min-height: 44px; border: none; border-radius: 3px; background: var(--solid); color: var(--on-fill); cursor: pointer; box-shadow: 0 3px 10px var(--shadow)\" style-hover=\"background: var(--accent-fill)\">\n              <span aria-hidden=\"true\" style=\"display: grid; grid-template-columns: repeat(3,5px); grid-template-rows: repeat(3,5px); gap: 1.5px\">\n                <span style=\"background: var(--ok-fill)\"><\u002Fspan><span style=\"background: var(--warn-fill)\"><\u002Fspan><span style=\"background: var(--accent-fill)\"><\u002Fspan>\n                <span style=\"background: var(--warn-fill)\"><\u002Fspan><span style=\"background: var(--accent-fill)\"><\u002Fspan><span style=\"background: var(--danger-fill)\"><\u002Fspan>\n                <span style=\"background: var(--ok-fill)\"><\u002Fspan><span style=\"background: var(--warn-fill)\"><\u002Fspan><span style=\"background: var(--accent-fill)\"><\u002Fspan>\n              <\u002Fspan>\n              OPEN THE HEAT MAP\n            <\u002Fbutton>\n            <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">{{ heatSummary }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ toggleNumbers }}\" aria-expanded=\"{{ numbersAria }}\" style=\"display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; margin-bottom: 16px; padding: 10px 13px; border: 1px solid var(--line); border-left: 3px solid var(--accent-wash); border-radius: 3px; background: var(--surface); cursor: pointer\" style-hover=\"border-color: var(--line-2)\">\n            <span style=\"font-family: var(--mono); font-size: 11px; color: var(--accent); width: 11px\">{{ numbersGlyph }}<\u002Fspan>\n            <span style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">How the numbers are reached<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ numbersOpen }}\">\n            <div style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent-wash); border-radius: 3px; padding: 14px; margin-bottom: 16px; max-width: 780px\">\n              <p style=\"margin: 0; font-size: 12px; line-height: 1.7; color: var(--ink-2); text-wrap: pretty\">Impact is the average of four factors — operational disruption, financial loss, reputational damage and legal exposure — kept to one decimal, so a risk that is catastrophic financially and negligible reputationally does not read as uniformly severe. Inherent score is likelihood × that average.<\u002Fp>\n              <p style=\"margin: 10px 0 0; font-size: 12px; line-height: 1.7; color: var(--ink-2); text-wrap: pretty\">Residual is derived from the controls you have actually implemented, not from a number you type. Full coverage takes two off likelihood and one off impact, and never below 1 — no control drives a risk to zero. Avoid removes the exposure; Transfer moves the financial consequence but leaves likelihood alone.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          \n\n          <sc-if value=\"{{ wizOpen }}\">\n            <div data-overlay=\"\" style=\"position: fixed; inset: 0; z-index: 64; background: var(--scrim-2); display: flex; justify-content: center; padding: 20px 16px; overflow-y: auto\">\n            <div class=\"pane\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Choose a risk assessment method\" style=\"background: var(--surface); border: 1px solid var(--line-2); border-top: 3px solid var(--accent); border-radius: 4px; width: 100%; max-width: 620px; max-height: 100%; margin: auto; display: flex; flex-direction: column; box-shadow: 0 22px 60px var(--shadow)\">\n\n              <div style=\"flex-shrink: 0; padding: 16px 20px 13px; border-bottom: 1px solid var(--line)\">\n                <div style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">Clause 6.1.2 — define the process before you assess<\u002Fdiv>\n                <div style=\"display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 7px\">\n                  <span style=\"font-family: var(--mono); font-size: 11px; font-weight: 800; color: var(--accent)\">{{ wizGroup }}<\u002Fspan>\n                  <span style=\"flex: 1\"><\u002Fspan>\n                  <span style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--ink-2)\">{{ wizCounter }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display: flex; gap: 4px; margin-top: 9px\">\n                  <sc-for list=\"{{ wizSegs }}\" as=\"s\" hint-placeholder-count=\"8\">\n                    <span style=\"flex: 1; height: 4px; border-radius: 2px; background: {{ s.tone }}; transition: background .2s ease\"><\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div class=\"scroller\" style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 20px\">\n                <sc-if value=\"{{ wizAsking }}\">\n                  <div>\n                    <h2 style=\"margin: 0 0 16px; font-size: 17px; font-weight: 700; line-height: 1.4; letter-spacing: -.01em; text-wrap: pretty\">{{ wizCur.q }}<\u002Fh2>\n                    <div style=\"display: flex; flex-direction: column; gap: 9px\">\n                      <sc-for list=\"{{ wizCur.opts }}\" as=\"o\" hint-placeholder-count=\"2\">\n                        <button sc-camel-on-click=\"{{ o.pick }}\" aria-pressed=\"{{ o.on }}\" style=\"display: block; width: 100%; text-align: left; font-family: var(--sans); font-size: 13.5px; line-height: 1.5; padding: 14px 16px; min-height: 52px; border: 1px solid {{ o.edge }}; border-radius: 3px; background: {{ o.bg }}; color: {{ o.fg }}; cursor: pointer; text-wrap: pretty\" style-hover=\"border-color: var(--accent)\">{{ o.label }}<\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <sc-if value=\"{{ wizReviewOpen }}\">\n                  <div>\n                    <div style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">What your answers point at<\u002Fdiv>\n                    <div style=\"font-family: var(--mono); font-size: 19px; font-weight: 800; color: var(--accent); margin: 7px 0 9px\">{{ wizVerdict }}<\u002Fdiv>\n                    <p style=\"margin: 0 0 16px; font-size: 12.5px; line-height: 1.7; color: var(--ink-2); text-wrap: pretty\">{{ wizWhy }}<\u002Fp>\n                    <div style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px\">The eight answers<\u002Fdiv>\n                    <sc-for list=\"{{ wizRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n                      <div style=\"display: flex; gap: 11px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--hair)\">\n                        <span style=\"flex-shrink: 0; width: 58px; font-family: var(--mono); font-size: 8.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">{{ r.group }}<\u002Fspan>\n                        <span style=\"flex: 1; min-width: 0\">\n                          <span style=\"display: block; font-size: 12px; color: var(--ink-2); line-height: 1.5\">{{ r.q }}<\u002Fspan>\n                          <span style=\"display: block; font-size: 12.5px; font-weight: 600; color: var(--ink); line-height: 1.5; margin-top: 2px\">{{ r.a }}<\u002Fspan>\n                        <\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n\n              <div style=\"flex-shrink: 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 13px 20px; border-top: 1px solid var(--line); background: var(--subtle); border-radius: 0 0 4px 4px\">\n                <button sc-camel-on-click=\"{{ wizBack }}\" disabled=\"{{ wizAtStart }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 10px 14px; min-height: 40px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">BACK<\u002Fbutton>\n                <sc-if value=\"{{ wizAsking }}\">\n                  <button sc-camel-on-click=\"{{ wizNext }}\" disabled=\"{{ wizCantNext }}\" title=\"{{ wizNextHint }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 10px 16px; min-height: 40px; border: none; border-radius: 2px; background: {{ wizNextBg }}; color: var(--on-fill); cursor: {{ wizNextCursor }}\">{{ wizNextLabel }}<\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ wizReviewOpen }}\">\n                  <button sc-camel-on-click=\"{{ applyMethod }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 10px 16px; min-height: 40px; border: none; border-radius: 2px; background: var(--ok-fill); color: var(--on-fill); cursor: pointer\">{{ wizApplyLabel }}<\u002Fbutton>\n                <\u002Fsc-if>\n                <span style=\"flex: 1\"><\u002Fspan>\n                <sc-if value=\"{{ wizFirstRun }}\">\n                  <button sc-camel-on-click=\"{{ wizLeave }}\" style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .06em; padding: 10px 13px; min-height: 40px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer\">LEAVE RISK REGISTER<\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ wizReturning }}\">\n                  <button sc-camel-on-click=\"{{ closeWiz }}\" style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .06em; padding: 10px 13px; min-height: 40px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer\">CANCEL<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ noRisks }}\">\n            <div style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 3px; padding: 16px 18px; margin-top: 16px; max-width: 720px\">\n              <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">Nothing identified yet<\u002Fdiv>\n              <p style=\"margin: 8px 0 0; font-size: 12.5px; line-height: 1.7; color: var(--ink-2); text-wrap: pretty\">The register starts empty on purpose. Clause 6.1.2 asks what <i>this<\u002Fi> organisation faces, and a set of seeded risks belonging to someone else is the wrong place to start. Add the first one when you have it.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display: flex; flex-direction: column; gap: 9px; margin-top: 16px\">\n            <sc-for list=\"{{ riskRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n              <div data-row-id=\"{{ r.id }}\" class=\"card {{ r.flash }}\" style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid {{ r.bandTone }}; border-radius: 3px\">\n                <div style=\"display: flex; align-items: center; gap: 11px; padding: 11px 13px; flex-wrap: wrap\">\n                  <button sc-camel-on-click=\"{{ r.toggle }}\" aria-expanded=\"{{ r.ariaOpen }}\" aria-label=\"Toggle risk detail\" style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 3px 9px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">{{ r.glyph }}<\u002Fbutton>\n                  <span style=\"font-family: var(--mono); font-size: 12px; font-weight: 800; color: var(--accent)\">{{ r.id }}<\u002Fspan>\n                  <span style=\"flex: 1; min-width: 180px\">\n                    <span style=\"display: block; font-size: 13px; font-weight: 600; line-height: 1.35\">{{ r.subject }}<\u002Fspan>\n                    <span style=\"display: block; font-family: var(--mono); font-size: 10px; color: var(--ink-3); margin-top: 2px\">{{ r.cause }}<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"display: flex; align-items: center; gap: 7px; flex-wrap: wrap\">\n                    <span title=\"Inherent score\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 4px 8px; border-radius: 2px; background: {{ r.bandTone }}; color: var(--on-fill)\">{{ r.score }} {{ r.band }}<\u002Fspan>\n                    <span style=\"font-family: var(--mono); font-size: 11px; color: var(--faint)\">→<\u002Fspan>\n                    <span title=\"Residual score, derived from implemented controls\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 4px 8px; border-radius: 2px; border: 1px solid {{ r.rbandTone }}; color: {{ r.rbandTone }}\">{{ r.res }} {{ r.rband }}<\u002Fspan>\n                    <span style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; color: {{ r.insideTone }}\">{{ r.insideWord }}<\u002Fspan>\n                    <sc-if value=\"{{ r.quant }}\">\n                      <span title=\"Annual loss expectancy\" style=\"font-family: var(--mono); font-size: 9.5px; color: var(--ink-2); border-left: 1px solid var(--line-2); padding-left: 9px\">ALE {{ r.aleText }}<\u002Fspan>\n                    <\u002Fsc-if>\n                  <\u002Fspan>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{ r.open }}\">\n                  <div style=\"border-top: 1px solid var(--line); padding: 13px; display: grid; gap: 14px\">\n                    <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(190px,1fr)); gap: 11px\">\n                      <label style=\"display: block\">\n                        <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Risk owner<\u002Fspan>\n                        <input type=\"text\" value=\"{{ r.owner }}\" sc-camel-on-change=\"{{ r.setOwner }}\" placeholder=\"who owns this risk\" aria-label=\"Risk owner\" style=\"width: 100%\">\n                      <\u002Flabel>\n                      <label style=\"display: block\">\n                        <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Likelihood<\u002Fspan>\n                        <sc-raw-select value=\"{{ r.L }}\" sc-camel-on-change=\"{{ r.setL }}\" aria-label=\"Likelihood\" style=\"width: 100%; font-size: 11px\">\n                          <sc-for list=\"{{ r.likelihoods }}\" as=\"l\" hint-placeholder-count=\"5\">\n                            <option value=\"{{ l.n }}\">{{ l.label }}<\u002Foption>\n                          <\u002Fsc-for>\n                        <\u002Fsc-raw-select>\n                      <\u002Flabel>\n                      <label style=\"display: block\">\n                        <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Treatment option<\u002Fspan>\n                        <sc-raw-select value=\"{{ r.opt }}\" sc-camel-on-change=\"{{ r.setOpt }}\" aria-label=\"Treatment option\" style=\"width: 100%; font-size: 11px\">\n                          <sc-for list=\"{{ r.opts }}\" as=\"o\" hint-placeholder-count=\"4\">\n                            <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                          <\u002Fsc-for>\n                        <\u002Fsc-raw-select>\n                      <\u002Flabel>\n                      <label style=\"display: block\">\n                        <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Status<\u002Fspan>\n                        <sc-raw-select value=\"{{ r.status }}\" sc-camel-on-change=\"{{ r.setStatus }}\" aria-label=\"Risk status\" style=\"width: 100%; font-size: 11px; border-left: 3px solid {{ r.statusTone }}\">\n                          <sc-for list=\"{{ r.statuses }}\" as=\"o\" hint-placeholder-count=\"5\">\n                            <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                          <\u002Fsc-for>\n                        <\u002Fsc-raw-select>\n                      <\u002Flabel>\n                    <\u002Fdiv>\n\n                    <div>\n                      <div style=\"display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin-bottom: 8px\">\n                        <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">Impact — four factors<\u002Fspan>\n                        <span title=\"{{ r.impactMath }}\" style=\"font-family: var(--mono); font-size: 11px; font-weight: 800; color: {{ r.ivTone }}; border-bottom: 1px dotted {{ r.ivTone }}; cursor: help\">{{ r.iv }} · {{ r.ivClass }}<\u002Fspan>\n                        <span style=\"font-family: var(--mono); font-size: 9.5px; color: var(--ink-3)\">{{ r.impactMath }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap: 9px\">\n                        <sc-for list=\"{{ r.factors }}\" as=\"f\" hint-placeholder-count=\"4\">\n                          <label title=\"{{ f.hint }}\" style=\"display: block; background: var(--subtle); border: 1px solid var(--line); border-radius: 2px; padding: 8px 9px\">\n                            <span style=\"display: flex; align-items: baseline; gap: 6px; margin-bottom: 5px\">\n                              <span style=\"font-family: var(--mono); font-size: 10px; font-weight: 800; color: var(--accent)\">{{ f.short }}<\u002Fspan>\n                              <span style=\"font-size: 11px; color: var(--ink-2)\">{{ f.label }}<\u002Fspan>\n                            <\u002Fspan>\n                            <sc-raw-select value=\"{{ f.v }}\" sc-camel-on-change=\"{{ f.set }}\" aria-label=\"{{ f.label }}\" style=\"width: 100%; font-size: 11px\">\n                              <option value=\"0\">— not scored<\u002Foption>\n                              <sc-for list=\"{{ f.words }}\" as=\"w\" hint-placeholder-count=\"5\">\n                                <option value=\"{{ w.n }}\">{{ w.label }}<\u002Foption>\n                              <\u002Fsc-for>\n                            <\u002Fsc-raw-select>\n                          <\u002Flabel>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n\n                    <sc-if value=\"{{ r.isScenario }}\">\n                      <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 11px\">\n                        <label style=\"display: block\">\n                          <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Scenario<\u002Fspan>\n                          <textarea value=\"{{ r.scenario }}\" sc-camel-on-change=\"{{ r.setScenario }}\" rows=\"2\" placeholder=\"what happens — e.g. ransomware encrypts the training platform\" aria-label=\"Scenario\" style=\"width: 100%; resize: vertical\"><\u002Ftextarea>\n                        <\u002Flabel>\n                        <label style=\"display: block\">\n                          <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Cause<\u002Fspan>\n                          <textarea value=\"{{ r.cause }}\" sc-camel-on-change=\"{{ r.setCause }}\" rows=\"2\" placeholder=\"what sets it off\" aria-label=\"Cause\" style=\"width: 100%; resize: vertical\"><\u002Ftextarea>\n                        <\u002Flabel>\n                        <label style=\"display: block\">\n                          <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Consequence<\u002Fspan>\n                          <textarea value=\"{{ r.conseq }}\" sc-camel-on-change=\"{{ r.setConseq }}\" rows=\"2\" placeholder=\"what it costs the business\" aria-label=\"Consequence\" style=\"width: 100%; resize: vertical\"><\u002Ftextarea>\n                        <\u002Flabel>\n                      <\u002Fdiv>\n\n                      <div>\n                        <div style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px\">PESTEL — the six lenses on the scenario<\u002Fdiv>\n                        <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(230px,1fr)); gap: 9px\">\n                          <sc-for list=\"{{ r.pestel }}\" as=\"p\" hint-placeholder-count=\"6\">\n                            <label title=\"{{ p.hint }}\" style=\"display: block; background: var(--subtle); border: 1px solid var(--line); border-radius: 2px; padding: 8px 9px\">\n                              <span style=\"display: flex; align-items: baseline; gap: 6px; margin-bottom: 5px\">\n                                <span style=\"font-family: var(--mono); font-size: 10px; font-weight: 800; color: var(--accent)\">{{ p.short }}<\u002Fspan>\n                                <span style=\"font-size: 11px; color: var(--ink-2)\">{{ p.label }}<\u002Fspan>\n                              <\u002Fspan>\n                              <textarea value=\"{{ p.v }}\" sc-camel-on-change=\"{{ p.set }}\" rows=\"2\" placeholder=\"{{ p.hint }}\" aria-label=\"{{ p.label }} factor\" style=\"width: 100%; resize: vertical; font-size: 11px; line-height: 1.5\"><\u002Ftextarea>\n                            <\u002Flabel>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n\n                    <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); gap: 11px\">\n                      <sc-if value=\"{{ r.isAsset }}\">\n                        <label style=\"display: block\">\n                          <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Asset<\u002Fspan>\n                          <input type=\"text\" value=\"{{ r.asset }}\" sc-camel-on-change=\"{{ r.setAsset }}\" placeholder=\"what is at risk\" aria-label=\"Asset\" style=\"width: 100%\">\n                        <\u002Flabel>\n                        <label style=\"display: block\">\n                          <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Threat<\u002Fspan>\n                          <input type=\"text\" value=\"{{ r.threat }}\" sc-camel-on-change=\"{{ r.setThreat }}\" placeholder=\"what could act against it\" aria-label=\"Threat\" style=\"width: 100%\">\n                        <\u002Flabel>\n                        <label style=\"display: block\">\n                          <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Vulnerability<\u002Fspan>\n                          <textarea value=\"{{ r.vuln }}\" sc-camel-on-change=\"{{ r.setVuln }}\" rows=\"2\" placeholder=\"the weakness the threat exploits\" aria-label=\"Vulnerability\" style=\"width: 100%; resize: vertical\"><\u002Ftextarea>\n                        <\u002Flabel>\n                      <\u002Fsc-if>\n                      <label style=\"display: block\">\n                        <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Existing controls<\u002Fspan>\n                        <textarea value=\"{{ r.existing }}\" sc-camel-on-change=\"{{ r.setExisting }}\" rows=\"2\" placeholder=\"what is already in place\" aria-label=\"Existing controls\" style=\"width: 100%; resize: vertical\"><\u002Ftextarea>\n                      <\u002Flabel>\n                    <\u002Fdiv>\n\n                    <sc-if value=\"{{ r.quant }}\">\n                      <div style=\"background: var(--sunken); border-radius: 3px; padding: 12px\">\n                        <div style=\"display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin-bottom: 9px\">\n                          <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">Quantitative — annual loss expectancy<\u002Fspan>\n                          <span style=\"font-family: var(--mono); font-size: 10px; color: var(--ink-2)\">SLE = value × EF · ALE = SLE × ARO<\u002Fspan>\n                        <\u002Fdiv>\n                        <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(120px,1fr)); gap: 9px\">\n                          <label style=\"display: block\">\n                            <span style=\"display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px\">Asset value<\u002Fspan>\n                            <input type=\"number\" min=\"0\" value=\"{{ r.av }}\" sc-camel-on-change=\"{{ r.setAv }}\" aria-label=\"Asset value\" style=\"width: 100%\">\n                          <\u002Flabel>\n                          <label style=\"display: block\">\n                            <span style=\"display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px\">Exposure %<\u002Fspan>\n                            <input type=\"number\" min=\"0\" max=\"100\" value=\"{{ r.ef }}\" sc-camel-on-change=\"{{ r.setEf }}\" aria-label=\"Exposure factor percent\" style=\"width: 100%\">\n                          <\u002Flabel>\n                          <label style=\"display: block\">\n                            <span style=\"display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px\">ARO / year<\u002Fspan>\n                            <input type=\"number\" min=\"0\" step=\"0.1\" value=\"{{ r.aro }}\" sc-camel-on-change=\"{{ r.setAro }}\" aria-label=\"Annual rate of occurrence\" style=\"width: 100%\">\n                          <\u002Flabel>\n                          <label style=\"display: block\">\n                            <span style=\"display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px\">Res. EF %<\u002Fspan>\n                            <input type=\"number\" min=\"0\" max=\"100\" value=\"{{ r.rEf }}\" sc-camel-on-change=\"{{ r.setREf }}\" aria-label=\"Residual exposure factor percent\" style=\"width: 100%\">\n                          <\u002Flabel>\n                          <label style=\"display: block\">\n                            <span style=\"display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px\">Res. ARO<\u002Fspan>\n                            <input type=\"number\" min=\"0\" step=\"0.1\" value=\"{{ r.rAro }}\" sc-camel-on-change=\"{{ r.setRAro }}\" aria-label=\"Residual annual rate of occurrence\" style=\"width: 100%\">\n                          <\u002Flabel>\n                        <\u002Fdiv>\n                        <div style=\"display: flex; gap: 18px; flex-wrap: wrap; margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--line-2)\">\n                          <span style=\"font-family: var(--mono); font-size: 10.5px; color: var(--ink-2)\">SLE <b style=\"color: var(--ink); font-size: 12px\">{{ r.sleText }}<\u002Fb><\u002Fspan>\n                          <span style=\"font-family: var(--mono); font-size: 10.5px; color: var(--ink-2)\">ALE <b style=\"color: var(--ink); font-size: 12px\">{{ r.aleText }}<\u002Fb><\u002Fspan>\n                          <span style=\"font-family: var(--mono); font-size: 10.5px; color: var(--ink-2)\">Residual ALE <b style=\"color: var(--ink); font-size: 12px\">{{ r.rAleText }}<\u002Fb><\u002Fspan>\n                          <span style=\"font-family: var(--mono); font-size: 10.5px; color: var(--ink-2)\">Annual benefit <b style=\"color: {{ r.benefitTone }}; font-size: 12px\">{{ r.benefitText }}<\u002Fb><\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n\n                    <div>\n                      <div style=\"display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin-bottom: 5px\">\n                        <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: u
