= \"text\",\n          isSelect: q.k === \"select\",\n          opts: (q.o || []).map(o => ({ o })),\n          rows: q.k === \"list\" ? 4 : q.k === \"area\" ? 3 : 1,\n          set,\n          /* Handing a live field back lets the engine own it again. */\n          handBack: () => this.up(s => {\n            const m = { ...(s.manual || {}) }; delete m[`field:${doc.id}:${q.id}`]; s.manual = m;\n          }),\n          overridden: !live && !!this.state.core.isManual(st, \"field\", `${doc.id}:${q.id}`),\n        };\n      }),\n\n      bRendered: rendered,\n      copyDoc: () => {\n        navigator.clipboard && navigator.clipboard.writeText(rendered);\n        this.say(`${doc.id} copied as Markdown.`);\n      },\n      downloadWord: () => {\n        try { this.saveBlob(this.state.core.docxFrom(rendered, doc.name), `${doc.id} ${doc.name}.docx`); }\n        catch (e) { this.say(\"Word export failed: \" + e.message); }\n      },\n      downloadDoc: () => {\n        const a = document.createElement(\"a\");\n        a.href = URL.createObjectURL(new Blob([rendered], { type: \"text/markdown;charset=utf-8\" }));\n        a.download = `${doc.id} ${doc.name}.md`.replace(/[\\\\/:*?\"<>|]/g, \"-\");\n        a.click(); URL.revokeObjectURL(a.href);\n      },\n      bPreviewOpen: this.state.previewOpen,\n      toggleBPreview: () => this.setState(s => ({ previewOpen: !s.previewOpen })),\n      bPreviewLabel: this.state.previewOpen ? \"HIDE THE DOCUMENT\" : \"SHOW THE DOCUMENT\",\n    };\n  }\n\n  /* Documents, second view: one row per deliverable across every phase. The\n     phase register answers \"what do I build next\"; this answers \"what does the\n     standard actually oblige me to hold\", which is a different question and the\n     one an auditor opens with. */\n  registerPane() {\n    const { DELIVERABLES, deliverableTree, delState, DEL_CATS, DEL_CAT_COLOR,\n      STATUS_COLOR, csv, xlsxFrom } = this.state.core;\n    const st = this.state.st;\n    const { regQ, regCat, regClosed } = this.state;\n    const q = regQ.trim().toLowerCase();\n    const pass = (d) => (regCat === \"All\" || d.cat === regCat)\n      && (!q || (d.name + \" \" + (d.cites || []).join(\" \")).toLowerCase().includes(q));\n\n    const groups = deliverableTree(DELIVERABLES).map(g => {\n      const items = (g.items || []).filter(pass);\n      const open = (q || regCat !== \"All\") ? true : regClosed[g.key] !== true;\n      return {\n        key: g.key, label: g.label, kind: g.kind, open,\n        glyph: open ? \"−\" : \"+\", ariaOpen: open ? \"true\" : \"false\",\n        meta: `${(g.items || []).length} deliverables`,\n        toggle: () => this.setState(s => ({ regClosed: { ...s.regClosed, [g.key]: open } })),\n        rows: open ? items.map(d => {\n          const link = delState(st, d);\n          return {\n            key: String(d.id), name: d.name, cat: d.cat, typ: d.typ,\n            catTone: DEL_CAT_COLOR[d.cat] || \"#65696C\",\n            mandatory: d.typ === \"Mandatory\",\n            typLabel: String(d.typ || \"Additional\").toUpperCase(),\n            typBg: d.typ === \"Mandatory\" ? \"#B6000C\" : \"transparent\",\n            typFg: d.typ === \"Mandatory\" ? \"#FFFFFF\" : \"#65696C\",\n            typEdge: d.typ === \"Mandatory\" ? \"#B6000C\" : \"#C4C1C1\",\n            cites: (d.cites || []).join(\", \"),\n            docId: link.id || \"\", hasDoc: !!link.id,\n            status: link.s || \"\",\n            statusTone: STATUS_COLOR[link.s] || \"#65696C\",\n            go: () => link.id && this.setState({ docView: \"phases\", docQ: link.id, docNote: `Jumped to ${link.id} from the deliverable register.` }),\n          };\n        }) : [],\n      };\n    }).filter(g => g.rows.length || (regCat === \"All\" && !q));\n\n    const flat = DELIVERABLES.filter(pass);\n    const head = [\"Deliverable\", \"Category\", \"Obligation\", \"Cites\", \"Tracked as\", \"Status\"];\n    const body = () => flat.map(d => {\n      const l = delState(st, d);\n      return [d.name, d.cat, d.typ, (d.cites || []).join(\" \"), l.id || \"\", l.s || \"not tracked\"];\n    });\n    return {\n      regGroups: groups, regQ, regCat,\n      regCats: [\"All\"].concat(DEL_CATS),\n      regCount: `${flat.length} of ${DELIVERABLES.length} deliverables`,\n      setRegQ: (e) => this.setState({ regQ: e.target.value }),\n      setRegCat: (e) => this.setState({ regCat: e.target.value }),\n      regAllLabel: deliverableTree(DELIVERABLES).every(g => regClosed[g.key] !== true) ? \"COLLAPSE ALL\" : \"EXPAND ALL\",\n      toggleRegAll: () => this.setState(s => {\n        const keys = deliverableTree(DELIVERABLES).map(g => g.key);\n        const openNow = keys.every(k => s.regClosed[k] !== true);\n        const next = { ...s.regClosed };\n        keys.forEach(k => { next[k] = openNow; });\n        return { regClosed: next };\n      }),\n      exportReg: () => csv([head, ...body()], \"isms-deliverable-register.csv\"),\n      exportRegX: () => this.saveBlob(xlsxFrom(head, body(), [46, 20, 14, 26, 12, 16], \"Deliverables\"),\n        \"isms-deliverable-register.xlsx\"),\n    };\n  }\n\n  /* Documents, third view: the real mind map. mindLayout precomputes a y for every\n     node so the branches can be drawn with orthogonal elbows either side of a\n     centre spine — the geometry is the point, so this draws it rather than\n     flattening it to a list. Records carry their document's status, because the\n     question this view answers is which clause has nothing filed against it. */\n  mapPane() {\n    const { mindLayout, MIND_DOC, STATUS_COLOR } = this.state.core;\n    const st = this.state.st;\n    let L;\n    try { L = mindLayout(st); } catch (e) { return { mapError: e.message, hasMapError: true, nodes: [], links: [], chips: [] }; }\n\n    const HUB_X = 150, CL_X = 300, SUB_X = 520, DEEP_X = 730, ROW = 26;\n    const nodes = [], links = [], chips = [];\n    const box = (side, x, w) => side === \"R\" ? x : -x - w;\n    const elbow = (x1, y1, x2, y2) => {\n      const mx = x1 + (x2 - x1) / 2;\n      return `M ${x1} ${y1} H ${mx} V ${y2} H ${x2}`;\n    };\n    const pub = (name) => {\n      const id = MIND_DOC[name];\n      if (!id) return { docId: \"\", done: false, s: \"\" };\n      const d = (st.docs || {})[id] || {};\n      return { docId: id, done: [\"Approved\", \"Published\"].indexOf(d.s) >= 0, s: d.s || \"Not Started\" };\n    };\n    const clauseS = (id) => ((st.clauses || {})[id] || {}).s || null;\n\n    [\"R\", \"L\"].forEach(sideKey => {\n      const set = L[sideKey];\n      if (!set) return;\n      const top = -(set.height || 0) / 2;\n      const sg = sideKey === \"R\" ? 1 : -1;\n      (set.hubs || []).forEach(hub => {\n        const hy = top + hub.y, hx = box(sideKey, HUB_X, 74);\n        nodes.push({ key: sideKey + hub.id, kind: \"hub\", x: hx, y: hy - 13, w: 74, h: 26,\n          t: hub.id, fill: \"#2C2D2E\", stroke: \"#2C2D2E\", fg: \"#FFFFFF\", weight: 700, size: 11 });\n        links.push({ key: \"l\" + sideKey + hub.id, d: elbow(sg * 92, 0, sideKey === \"R\" ? hx : hx + 74, hy) });\n\n        (hub.clauses || []).forEach(cl => {\n          const cy = top + cl.y, cx = box(sideKey, CL_X, 168);\n          nodes.push({ key: sideKey + \"c\" + cl.id, kind: \"clause\", x: cx, y: cy - 15, w: 168, h: 30,\n            t: `${cl.id}. ${cl.title}`, fill: \"#FFFFFF\", stroke: \"#CC000E\", fg: \"#2C2D2E\", weight: 700, size: 10.5 });\n          links.push({ key: \"lc\" + sideKey + cl.id,\n            d: elbow(sideKey === \"R\" ? hx + 74 : hx, hy, sideKey === \"R\" ? cx : cx + 168, cy) });\n\n          (cl.kids || []).forEach(sc => {\n            const sy = top + sc.y, sx = box(sideKey, SUB_X, 196);\n            const s1 = sc.id ? clauseS(sc.id) : null;\n            nodes.push({ key: sideKey + \"s\" + sc.id, kind: \"sub\", x: sx, y: sy - 13, w: 196, h: 26,\n              t: `${sc.label} ${sc.title}`, fill: \"#F7F6F6\",\n              stroke: s1 ? (STATUS_COLOR[s1] || \"#C4C1C1\") : \"#C4C1C1\",\n              fg: \"#2C2D2E\", weight: 500, size: 9.5 });\n            links.push({ key: \"ls\" + sideKey + sc.id,\n              d: elbow(sideKey === \"R\" ? cx + 168 : cx, cy, sideKey === \"R\" ? sx : sx + 196, sy) });\n\n            /* deeper sub-clauses (6.1.3, 7.5.2, 9.2.1 …) and the records filed\n               against them. Weighting each tail by its record count is what keeps\n               the record column from overlapping itself. */\n            const tails = [];\n            (sc.deeper || []).forEach(d => tails.push({ kind: \"deep\", id: d.id, t: `${d.id} ${d.title}`, recs: d.recs || [] }));\n            (sc.recs || []).forEach(r => tails.push({ kind: \"rec\", t: r, recs: [] }));\n            const weight = tails.map(tl => tl.kind === \"deep\" ? Math.max(1, tl.recs.length) : 1);\n            const totalRows = weight.reduce((a, b) => a + b, 0);\n            let row = 0;\n            tails.forEach((tl, i) => {\n              const w = weight[i];\n              const ty = sy - (totalRows - 1) * ROW / 2 + (row + (w - 1) / 2) * ROW;\n              row += w;\n              if (tl.kind === \"deep\") {\n                const dx = box(sideKey, DEEP_X, 186);\n                const ds = clauseS(tl.id);\n                nodes.push({ key: sideKey + \"d\" + tl.id, kind: \"deep\", x: dx, y: ty - 12, w: 186, h: 24,\n                  t: tl.t, fill: \"#FFFFFF\", stroke: ds ? (STATUS_COLOR[ds] || \"#C4C1C1\") : \"#C4C1C1\",\n                  fg: \"#54585B\", weight: 600, size: 9.5 });\n                links.push({ key: \"ld\" + sideKey + tl.id,\n                  d: elbow(sideKey === \"R\" ? sx + 196 : sx, sy, sideKey === \"R\" ? dx : dx + 186, ty) });\n                tl.recs.forEach((r, j) => {\n                  const ry = ty - (tl.recs.length - 1) * ROW / 2 + j * ROW;\n                  const rx = sideKey === \"R\" ? dx + 186 + 34 : dx - 34 - 236;\n                  const p = pub(r);\n                  chips.push({ key: sideKey + \"r\" + tl.id + j, x: rx, y: ry - 12, w: 236, h: 24, t: r,\n                    fill: p.done ? \"#E4F0E8\" : \"#FFFFFF\",\n                    stroke: p.done ? \"#17693A\" : (p.docId ? \"#8A5A00\" : \"#C4C1C1\"),\n                    fg: p.done ? \"#17693A\" : \"#54585B\",\n                    title: p.docId ? `${p.docId} — ${p.s}` : \"not tracked as a document\",\n                    docId: p.docId, go: p.docId ? () => this.setState({ docView: \"phases\", docQ: p.docId, docNote: `Jumped to ${p.docId} from the map.` }) : null });\n                  links.push({ key: \"lr\" + sideKey + tl.id + j,\n                    d: elbow(sideKey === \"R\" ? dx + 186 : dx, ty, sideKey === \"R\" ? rx : rx + 236, ry) });\n                });\n              } else {\n                const dxr = box(sideKey, DEEP_X, 186);\n                const rx = sideKey === \"R\" ? dxr + 186 + 34 : dxr - 34 - 236;\n                const p = pub(tl.t);\n                chips.push({ key: sideKey + \"rr\" + sc.id + i, x: rx, y: ty - 12, w: 236, h: 24, t: tl.t,\n                  fill: p.done ? \"#E4F0E8\" : \"#FFFFFF\",\n                  stroke: p.done ? \"#17693A\" : (p.docId ? \"#8A5A00\" : \"#C4C1C1\"),\n                  fg: p.done ? \"#17693A\" : \"#54585B\",\n                  title: p.docId ? `${p.docId} — ${p.s}` : \"not tracked as a document\",\n                  docId: p.docId, go: p.docId ? () => this.setState({ docView: \"phases\", docQ: p.docId, docNote: `Jumped to ${p.docId} from the map.` }) : null });\n                links.push({ key: \"lrr\" + sideKey + sc.id + i,\n                  d: elbow(sideKey === \"R\" ? sx + 196 : sx, sy, sideKey === \"R\" ? rx : rx + 236, ty) });\n              }\n            });\n          });\n        });\n      });\n    });\n\n    /* Labels are HTML boxes positioned over an SVG that draws only the\n       connectors. A {{ }} hole inside an SVG <text> is emitted as an HTML\n       <span>, which SVG cannot lay out — every label measured 0×0 and the map\n       drew as empty outlines. HTML labels also wrap instead of being clipped to\n       a character count, so nothing has to be truncated to fit. */\n    const all = [...nodes, ...chips];\n    const pad = 40;\n    const minX = Math.min(-110, ...all.map(n => n.x)) - pad;\n    const maxX = Math.max(110, ...all.map(n => n.x + n.w)) + pad;\n    const minY = Math.min(-30, ...all.map(n => n.y)) - pad;\n    const maxY = Math.max(30, ...all.map(n => n.y + n.h)) + pad;\n    const W = maxX - minX, H = maxY - minY;\n    const place = (n) => {\n      n.left = `${n.x - minX}px`;\n      n.top = `${n.y - minY}px`;\n      n.wpx = `${n.w}px`;\n      n.hpx = `${n.h}px`;\n      n.fs = `${n.size || 9}px`;\n      n.fw = n.weight || 500;\n    };\n    nodes.forEach(n => { place(n); n.centre = n.kind === \"hub\" ? \"center\" : \"flex-start\"; });\n    chips.forEach(c => { c.size = 9.5; place(c); });\n    const z = this.state.mapZoom;\n\n    return {\n      mapError: \"\", hasMapError: false,\n      nodes, links, chips,\n      viewBox: `${minX} ${minY} ${W} ${H}`,\n      innerW: `${W}px`, innerH: `${H}px`,\n      spineLeft: `${-92 - minX}px`, spineTop: `${-15 - minY}px`,\n      scale: `scale(${z})`,\n      frameW: `${Math.round(W * z)}px`, frameH: `${Math.round(H * z)}px`,\n      mapZoom: z,\n      setMapZoom: (e) => this.setState({ mapZoom: Number(e.target.value) }),\n      mapCounts: `${nodes.length} nodes · ${chips.length} records`,\n      mapOpen: this.state.mapOpen,\n      openMap: () => this.setState({ mapOpen: true }),\n      closeMap: () => this.setState({ mapOpen: false }),\n      stopMap: (e) => e.stopPropagation(),\n    };\n  }\n\n  /* The vault. A passphrase derives an AES-GCM key by PBKDF2 and every project\n     write goes through it, so persistent project storage is ciphertext. A\n     temporary key may live in this tab's sessionStorage until its idle deadline;\n     forgetting the passphrase still loses the project and is said plainly. */\n  async installVault(pass, code) {\n    const { deriveKey, seal, VAULT_KEY, KEY, totpValid } = this.state.core;\n    this.setState({ vaultBusy: true, vaultErr: \"\" });\n    try {\n      if (String(pass || \"\").length < 10) throw new Error(\"Use at least 10 characters. A passphrase of a few words beats a short complex string.\");\n      const salt = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));\n      const key = await deriveKey(pass, salt);\n      const secret = this.state.vaultTotp || \"\";\n      if (secret && !(await totpValid(secret, code))) throw new Error(\"That code does not match the authenticator. Check it and try again.\");\n      const blob = await seal(key, this.state.st);\n      localStorage.setItem(VAULT_KEY, JSON.stringify({ salt, totp: secret || \"\" }));\n      localStorage.setItem(KEY, JSON.stringify({ __enc: true, ...blob }));\n      this.vaultKey = key;\n      await this.startVaultSession(key);\n      this.setState({ vaultBusy: false, vaultPass: \"\", vaultPass2: \"\", vaultCode: \"\", locked: false, encrypted: false, hasVault: true });\n      this.say(\"Vault on. This browser's copy is now encrypted.\");\n    } catch (e) {\n      this.setState({ vaultBusy: false, vaultErr: String(e.message || e).slice(0, 240) });\n    }\n  }\n\n  async unlockVault(pass, code) {\n    const { deriveKey, unseal, VAULT_KEY, KEY, totpValid, hydrate } = this.state.core;\n    this.setState({ vaultBusy: true, vaultErr: \"\" });\n    try {\n      if (this.lockWrite) await this.lockWrite;\n      const meta = JSON.parse(localStorage.getItem(VAULT_KEY) || \"{}\");\n      if (meta.totp && !(await totpValid(meta.totp, code))) throw new Error(\"That authenticator code is not valid right now.\");\n      const key = await deriveKey(pass, meta.salt);\n      const blob = JSON.parse(localStorage.getItem(KEY) || \"{}\");\n      const data = await unseal(key, blob);\n      this.vaultKey = key;\n      await this.startVaultSession(key);\n      const st = this.propagate(this.state.core, hydrate(data));\n      this.setState({ vaultBusy: false, locked: false, encrypted: false, st, vaultPass: \"\", vaultCode: \"\" });\n    } catch (e) {\n      this.setState({ vaultBusy: false, vaultErr: \"That passphrase did not open the vault.\" });\n    }\n  }\n\n  async removeVault() {\n    const { VAULT_KEY, KEY, dropSession } = this.state.core;\n    if (!confirm(\"Turn the vault off? Browser storage goes back to plain JSON on this machine.\")) return;\n    this.lockWriteGeneration = (this.lockWriteGeneration || 0) + 1;\n    try {\n      localStorage.removeItem(VAULT_KEY);\n      localStorage.setItem(KEY, JSON.stringify(this.state.st));\n    } catch (e) { /* quota */ }\n    dropSession();\n    clearTimeout(this.sessionT);\n    this.vaultKey = null;\n    this.tabSessionExpected = false;\n    this.setState({ hasVault: false, locked: false, encrypted: false, vaultErr: \"\" });\n    this.say(\"Vault off. This browser's copy is plain JSON again.\");\n  }\n\n  /* Cloud sync. The state object is sealed with the vault key before it leaves,\n     so jsonbin holds ciphertext it cannot read. Attachments live under their own\n     key and are never part of this payload. */\n  async syncPush() {\n    const { jbPush, jbCreate, seal, SYNC_V } = this.state.core;\n    const cfg = this.state.cfg || {};\n    this.setState({ syncBusy: true, syncMsg: \"\" });\n    try {\n      if (!cfg.jbKey) throw new Error(\"Add your jsonbin master key first.\");\n      const payload = this.vaultKey\n        ? { v: SYNC_V, enc: true, ...(await seal(this.vaultKey, this.state.st)) }\n        : { v: SYNC_V, enc: false, st: this.state.st };\n      let id = cfg.jbId;\n      if (!id) { id = await jbCreate(cfg.jbKey, payload); this.upCfg({ jbId: id }); }\n      else await jbPush(cfg.jbKey, id, payload);\n      this.upCfg({ lastSync: new Date().toISOString() });\n      this.setState({ syncBusy: false, syncMsg: this.vaultKey\n        ? \"Pushed, encrypted with your vault passphrase.\"\n        : \"Pushed. No vault is on, so this copy is readable by anyone with the key — turn the vault on first if that matters.\" });\n    } catch (e) { this.setState({ syncBusy: false, syncMsg: \"Push failed: \" + String(e.message || e).slice(0, 200) }); }\n  }\n\n  async syncPull() {\n    const { jbPull, unseal, hydrate } = this.state.core;\n    const cfg = this.state.cfg || {};\n    this.setState({ syncBusy: true, syncMsg: \"\" });\n    try {\n      if (!cfg.jbKey || !cfg.jbId) throw new Error(\"Add your jsonbin key and bin id first.\");\n      if (!confirm(\"Pull replaces this browser's project with the cloud copy. Download a backup first if you are unsure.\")) {\n        this.setState({ syncBusy: false }); return;\n      }\n      const raw = await jbPull(cfg.jbKey, cfg.jbId);\n      let data = raw && raw.enc ? await unseal(this.vaultKey, raw) : (raw && raw.st ? raw.st : raw);\n      if (raw && raw.enc && !this.vaultKey) throw new Error(\"That copy is encrypted. Unlock the vault on this machine first.\");\n      const st = this.propagate(this.state.core, hydrate(data));\n      this.setState({ syncBusy: false, st, syncMsg: \"Pulled.\" }, () => this.persist(st));\n    } catch (e) { this.setState({ syncBusy: false, syncMsg: \"Pull failed: \" + String(e.message || e).slice(0, 200) }); }\n  }\n\n  /* The assistant. Two ways in: ask it something, or select text anywhere in the\n     tracker and press Explain. It is given the current tab and the live counts,\n     so \"what should I do next\" gets an answer about this project rather than\n     about ISO 27001 in general. It never writes to the project. */\n  componentDidUpdate() {\n    if (this.selBound) return;\n    this.selBound = true;\n    document.addEventListener(\"selectionchange\", () => {\n      const t = String(document.getSelection() || \"\").trim();\n      if (t.length > 3 && t.length < 1200) this.setState({ aiSel: t.slice(0, 1200) });\n      else if (!t) this.setState({ aiSel: \"\" });\n    });\n  }\n\n  aiContext() {\n    const st = this.state.st;\n    if (!st) return \"\";\n    const m = this.metrics(this.schedule());\n    const tab = (NAV[this.state.tab] || {}).n;\n    return [\n      `The user is on the \"${tab}\" tab.`,\n      `Organisation: ${st.project.company || \"unnamed\"}.`,\n      `Mandatory documents outstanding: ${m.mandOut} of ${m.mandN}.`,\n      `Sub-clauses verified: ${m.clVer} of ${m.clApp}.`,\n      `Annex A: ${m.appN} applicable, ${m.exclN} excluded, ${m.ctImp} implemented, ${m.noWhy} exclusions unjustified.`,\n      `Risks: ${st.risks.length} logged, ${m.outside} above the acceptance threshold of ${st.threshold}.`,\n      `Risk method: ${st.rmethod || \"asset\"}, ${st.ranalysis || \"qualitative\"}.`,\n    ].join(\" \");\n  }\n\n  async askAssistant(question, selection) {\n    const { askClaude, SYSTEM } = this.state.core;\n    this.setState({ aiBusy: true, aiA: \"\" });\n    try {\n      const prompt = selection\n        ? `${this.aiContext()}\\n\\nThe user selected this text in the tracker and asked for an explanation:\\n\\n\"\"\"${selection}\"\"\"\\n\\n${question || \"Explain what this means and what it requires of them.\"}`\n        : `${this.aiContext()}\\n\\n${question}`;\n      const text = await askClaude({\n        system: SYSTEM, messages: [{ role: \"user\", content: prompt }],\n        apiKey: (this.state.cfg || {}).anthropicKey,\n      });\n      this.setState({ aiBusy: false, aiA: String(text || \"\").trim() || \"No answer came back.\" });\n    } catch (e) {\n      this.setState({ aiBusy: false, aiA: \"Could not reach the model: \" + String(e.message || e).slice(0, 220) });\n    }\n  }\n\n  /* docxFrom and xlsxFrom hand back a Blob — this is what actually saves it. */\n  saveBlob(blob, name) {\n    if (!blob) { this.say(\"Nothing to export.\"); return; }\n    const a = document.createElement(\"a\");\n    a.href = URL.createObjectURL(blob);\n    a.download = name.replace(/[\\\\/:*?\"<>|]/g, \"-\");\n    a.click();\n    setTimeout(() => URL.revokeObjectURL(a.href), 4000);\n  }\n\n  say(t) {\n    clearTimeout(this.noteT);\n    this.setState({ docNote: t });\n    this.noteT = setTimeout(() => this.setState({ docNote: \"\" }), 5000);\n  }\n\n  /* Attachments live under their own key and never travel in a cloud push.\n     Anything over the limit stays in memory for the session rather than\n     blowing the storage quota. */\n  attachFile(docId, e) {\n    const { PERSIST_LIMIT, sessionBlobs, prettyBytes } = this.state.core;\n    const file = e.target.files && e.target.files[0];\n    e.target.value = \"\";\n    if (!file) return;\n    sessionBlobs[docId] = file;\n    const m = { name: file.name, size: file.size, type: file.type || \"application/octet-stream\", at: new Date().toISOString() };\n    const put = (rec, msg) => {\n      this.setState(s => {\n        const files = { ...s.files, [docId]: rec };\n        this.persistFiles(files);\n        return { files };\n      });\n      this.say(msg);\n    };\n    if (file.size <= PERSIST_LIMIT) {\n      const fr = new FileReader();\n      fr.onload = () => put({ ...m, data: fr.result }, `${file.name} attached and saved.`);\n      fr.onerror = () => put(m, `${file.name} attached for this session only.`);\n      fr.readAsDataURL(file);\n    } else {\n      put(m, `${file.name} is ${prettyBytes(file.size)} — too large to store. Available until you reload.`);\n    }\n  }\n\n  viewFile(docId) {\n    if (!this.state.core.openAttachment(docId, this.state.files[docId])) {\n      this.say(\"The bytes were not kept after reload. Attach the file again to open it.\");\n    }\n  }\n\n  dropFile(docId) {\n    delete this.state.core.sessionBlobs[docId];\n    this.setState(s => {\n      const files = { ...s.files };\n      delete files[docId];\n      this.persistFiles(files);\n      return { files };\n    });\n  }\n\n  persistFiles(files) {\n    if (this.state.encrypted) return;\n    if ((this.props.dataSource || \"Saved tracker\") !== \"Saved tracker\") return;\n    try { localStorage.setItem(this.state.core.FKEY, JSON.stringify(files)); } catch (e) { /* quota */ }\n  }\n\n  renderVals() {\n    const { tab, navOpen, core, st, encrypted, mobile } = this.state;\n    const t = NAV[tab] || NAV[0];\n    const pct = (v) => `${Math.round(v * 100)}%`;\n\n    const base = {\n      nav: NAV.map((n, i) => ({\n        n: n.n, hint: n.hint, shortcut: `Alt+${i + 1}`,\n        go: () => this.setState(s => ({ tab: i, navOpen: s.mobile ? false : s.navOpen })),\n        current: tab === i ? \"page\" : undefined,\n        edge: tab === i ? \"#CC000E\" : \"transparent\",\n        bg: tab === i ? \"#FFFFFF\" : \"transparent\",\n        fg: tab === i ? \"#2C2D2E\" : \"#54585B\",\n        num: tab === i ? \"#CC000E\" : \"#65696C\",\n        weight: tab === i ? 700 : 500,\n      })),\n      navOpen,\n      isDrawer: navOpen && mobile,\n      drawerFlag: mobile ? \"yes\" : \"no\",\n      navPos: mobile ? \"fixed\" : \"sticky\",\n      navTop: \"66px\",\n      navZ: mobile ? 26 : 1,\n      navBg: mobile ? \"#FFFFFF\" : \"transparent\",\n      navShadow: mobile ? \"6px 0 24px rgba(38,36,31,.18)\" : \"none\",\n      navEdge: mobile ? \"#E1DEDE\" : \"transparent\",\n      navMaxH: \"calc(100vh - 66px)\",\n      navGlyph: mobile ? \"☰\" : (navOpen ? \"◧\" : \"▤\"),\n      /* Assistant */\n      aiOpen: this.state.aiOpen, aiQ: this.state.aiQ, aiA: this.state.aiA,\n      aiBusy: this.state.aiBusy, hasAiA: !!this.state.aiA,\n      noAiA: !this.state.aiA && !this.state.aiBusy,\n      aiSel: this.state.aiSel, hasSel: !!this.state.aiSel,\n      selPreview: this.state.aiSel.length > 90 ? this.state.aiSel.slice(0, 90) + \"…\" : this.state.aiSel,\n      /* One character, three moods, each derived — never a mood the assistant\n         is not actually in. The line it greets you with names what this tab is\n         for, so the character is a way into the work rather than decoration. */\n      annexaBusy: !!this.state.aiBusy,\n      annexaAlert: !!this.state.aiA && !this.state.aiOpen,\n      annexaFace: this.state.aiBusy ? \"busy-face\" : \"\",\n      annexaTone: this.state.aiBusy ? \"#8A5A00\" : (this.state.aiA ? \"#17693A\" : \"#CC000E\"),\n      annexaMouth: this.state.aiBusy\n        ? \"M 15 26.8 H 23\"\n        : (this.state.aiA ? \"M 13.6 25.6 Q 19 30.6 24.4 25.6\" : \"M 14.6 26.3 Q 19 29.2 23.4 26.3\"),\n      annexaState: this.state.aiBusy ? \"Thinking…\" : (this.state.aiA ? \"Answer ready\" : \"Ask me anything\"),\n      annexaLine: this.state.aiBusy\n        ? \"Reading your project…\"\n        : (this.state.aiA ? \"I have an answer for you\" : [\n            \"Ask me where you stand\",\n            \"Ask me which step is next\",\n            \"Ask me which document to write\",\n            \"Ask me what clause 9.2 wants\",\n            \"Ask me how a risk is scored\",\n            \"Ask me which exclusion is weak\",\n          ][tab] || \"Ask me about this project\"),\n      /* Collapsed is the resting state: the character alone, no label. Opening\n         the panel expands the launcher to the named pill, so the two read as one\n         object rather than a button and an unrelated window. */\n      annexaWide: !!this.state.aiOpen,\n      annexaAria: this.state.aiOpen ? \"true\" : \"false\",\n      annexaPad: this.state.aiOpen ? \"8px 15px 8px 9px\" : \"8px\",\n      annexaGap: this.state.aiOpen ? \"10px\" : \"0px\",\n      annexaTrack: (e) => this.annexaFollow(e.clientX, e.clientY),\n      annexaRest: () => {\n        const els = document.querySelectorAll(\".annexa\");\n        for (let i = 0; i < els.length; i++) {\n          els[i].style.setProperty(\"--ax\", \"0px\");\n          els[i].style.setProperty(\"--ay\", \"0px\");\n        }\n      },\n      toggleAi: () => this.setState(s => ({ aiOpen: !s.aiOpen })),\n      setAiQ: (e) => this.setState({ aiQ: e.target.value }),\n      askAi: () => { const q = this.state.aiQ.trim(); if (q) this.askAssistant(q, null); },\n      explainSel: () => { const s = this.state.aiSel; if (s) { this.setState({ aiOpen: true }); this.askAssistant(null, s); } },\n      clearAiA: () => this.setState({ aiA: \"\" }),\n      aiPrompts: [\n        \"What should I do next, and why that before anything else?\",\n        \"Which of my Annex A exclusions would an auditor challenge?\",\n        \"Explain what clause 9.2 expects me to have ready.\",\n      ].map(p => ({ p, ask: () => { this.setState({ aiQ: p }); this.askAssistant(p, null); } })),\n\n      /* Vault */\n      locked: this.state.locked, hasVault: this.state.hasVault, noVault: !this.state.hasVault,\n      vaultPass: this.state.vaultPass, vaultPass2: this.state.vaultPass2,\n      vaultCode: this.state.vaultCode, vaultErr: this.state.vaultErr,\n      hasVaultErr: !!this.state.vaultErr, vaultBusy: this.state.vaultBusy,\n      vaultTotp: this.state.vaultTotp, hasTotp: !!this.state.vaultTotp,\n      setVaultPass: (e) => this.setState({ vaultPass: e.target.value }),\n      setVaultPass2: (e) => this.setState({ vaultPass2: e.target.value }),\n      setVaultCode: (e) => this.setState({ vaultCode: e.target.value }),\n      genTotp: () => {\n        const { b32enc } = this.state.core;\n        const secret = b32enc(crypto.getRandomValues(new Uint8Array(20)));\n        this.setState({ vaultTotp: secret });\n      },\n      totpUri: this.state.vaultTotp\n        ? `otpauth://totp/ISMS%20Tracker?secret=${this.state.vaultTotp}&issuer=ISMS%20Tracker`\n        : \"\",\n      turnVaultOn: () => {\n        if (this.state.vaultPass !== this.state.vaultPass2) { this.setState({ vaultErr: \"The two passphrases do not match.\" }); return; }\n        this.installVault(this.state.vaultPass, this.state.vaultCode);\n      },\n      unlock: () => this.unlockVault(this.state.vaultPass, this.state.vaultCode),\n      vaultOff: () => this.removeVault(),\n      lockNow: () => this.lockVault(),\n      /* An escape hatch from the lock screen. Without one, a forgotten\n         passphrase makes the app permanently unopenable on this machine — and\n         the copy is undecryptable anyway, so the only honest offer is to start\n         over. It says plainly what is lost. */\n      abandonVault: () => {\n        if (!confirm(\"Start a fresh project on this browser?\\n\\nThe encrypted copy stored here cannot be decrypted without the passphrase, and this discards it. Any downloaded backup file is unaffected.\")) return;\n        const { KEY, VAULT_KEY, hydrate, dropSession } = this.state.core;\n        this.lockWriteGeneration = (this.lockWriteGeneration || 0) + 1;\n        try { localStorage.removeItem(KEY); localStorage.removeItem(VAULT_KEY); } catch (e) { /* quota */ }\n        dropSession();\n        clearTimeout(this.sessionT);\n        clearTimeout(this.saveT);\n        this.vaultKey = null;\n        this.tabSessionExpected = false;\n        this.setState({\n          locked: false, encrypted: false, hasVault: false,\n          vaultPass: \"\", vaultPass2: \"\", vaultCode: \"\", vaultErr: \"\",\n          st: this.propagate(this.state.core, hydrate(null)),\n        }, () => this.say(\"Fresh project started. This browser's encrypted copy was discarded.\"));\n      },\n\n      /* Cloud sync */\n      jbKey: (this.state.cfg || {}).jbKey || \"\",\n      jbId: (this.state.cfg || {}).jbId || \"\",\n      setJbKey: (e) => this.upCfg({ jbKey: e.target.value }),\n      setJbId: (e) => this.upCfg({ jbId: e.target.value }),\n      lastSync: (this.state.cfg || {}).lastSync\n        ? \"Last pushed \" + new Date((this.state.cfg || {}).lastSync).toLocaleString()\n        : \"Never pushed from this browser.\",\n      syncMsg: this.state.syncMsg, hasSyncMsg: !!this.state.syncMsg,\n      syncBusy: this.state.syncBusy,\n      doPush: () => this.syncPush(),\n      doPull: () => this.syncPull(),\n      syncWarn: this.state.hasVault\n        ? \"The vault is on, so the copy pushed is encrypted with your passphrase.\"\n        : \"No vault is on. A pushed copy would be readable by anyone holding the jsonbin key — turn the vault on first.\",\n      syncWarnTone: this.state.hasVault ? \"#17693A\" : \"#8A5A00\",\n\n      openSettings: () => this.openSettingsPanel(),\n      closeSettings: () => this.closeSettingsPanel(),\n      shortcutOpen: this.state.shortcutOpen,\n      openShortcuts: () => this.openShortcutGuide(),\n      closeShortcuts: () => this.closeShortcutGuide(),\n      navBtnLabel: navOpen ? \"Hide sections\" : \"Show sections\",\n      toggleNav: () => this.setState(s => ({ navOpen: !s.navOpen })),\n      closeNav: () => this.setState({ navOpen: false }),\n      tabTitle: t.n, tabPart: t.part, tabNote: t.note,\n      isOverview: tab === 0 && !!st,\n      isPlan: false, isPlanDesk: false, isPlanMobile: false,\n      isDocs: false, isDocsDesk: false, isDocsMobile: false,\n      isClauses: false, isClDesk: false, isClMobile: false,\n      isRisks: false, isSoa: false, isSoaDesk: false, isSoaMobile: false,\n      isSettings: this.state.settingsOpen,\n      legacySettings: false,\n      buildOpen: false,\n      isStub: false,\n      stubNote: STUB[tab] ? STUB[tab][0] : \"\",\n      stubCount: STUB[tab] ? STUB[tab][1] : \"\",\n      loading: !st && !this.loadError,\n      encrypted,\n      stepNote: this.state.stepNote,\n      hasStepNote: !!this.state.stepNote,\n      clearStepNote: () => this.tellStep(\"\"),\n      company: (st && st.project.company) || \"Your organisation\",\n      gateEyebrow: \"Gates open\", gateColor: \"#65696C\", gateReadout: \"—\",\n      gateWord: \"—\", gateCount: \"\", clear: false, hasBlockers: false,\n      blockers: [], stats: [], meters: [],\n    };\n    if (!st || !core) return base;\n\n    const sched = this.schedule();\n    const plan = tab === 1 ? { ...this.planPane(sched), ...this.guidePane() } : {};\n    const docs = tab === 2 ? {\n      ...(this.state.docView === \"phases\" ? this.docsPane() : {}),\n      ...(this.state.docView === \"register\" ? this.registerPane() : {}),\n      ...(this.state.docView === \"map\" ? this.mapPane() : {}),\n      docView: this.state.docView,\n      isPhaseView: this.state.docView === \"phases\",\n      isRegView: this.state.docView === \"register\",\n      isMapView: this.state.docView === \"map\",\n      viewBtns: [[\"phases\",\"PHASES\"],[\"register\",\"REGISTER\"],[\"map\",\"MAP\"]].map(([k,l]) => ({\n        k, l,\n        bg: this.state.docView === k ? \"#2C2D2E\" : \"#FFFFFF\",\n        fg: this.state.docView === k ? \"#FFFFFF\" : \"#54585B\",\n        go: () => this.setState({ docView: k }),\n      })),\n    } : {};\n    const clauses = tab === 3 ? this.clausePane() : {};\n    const risks = tab === 4 ? this.riskPane() : {};\n    const settings = this.state.settingsOpen ? this.settingsPane() : {};\n    const build = this.state.buildId ? this.buildPane() : {};\n    const soa = tab === 5 ? this.soaPane() : {};\n    const m = this.metrics(sched);\n    const gate = m.mandOut === 0 && m.noWhy === 0 && m.outside === 0 && m.clPct === 1;\n    const open = [m.mandOut, m.noWhy, m.outside, m.clApp - m.clVer].filter(x => x > 0).length;\n    const s = (n) => (n === 1 ? \"\" : \"s\");\n    const blockers = [\n      { n: m.mandOut, t: `mandatory document${s(m.mandOut)} not approved`, ref: \"Clause 7.5\" },\n      { n: m.noWhy, t: `excluded control${s(m.noWhy)} without a justification`, ref: \"Clause 6.1.3 d)\" },\n      { n: m.outside, t: `residual risk${s(m.outside)} above your acceptance threshold`, ref: \"Clause 6.1.2 a)\" },\n      { n: m.clApp - m.clVer, t: `sub-clause${s(m.clApp - m.clVer)} not yet verified`, ref: \"Clauses 4–10\" },\n    ].filter(b => b.n > 0);\n\n    return {\n      ...base,\n      ...plan,\n      ...docs,\n      ...clauses,\n      ...risks,\n      ...settings,\n      ...build,\n      ...soa,\n      isPlan: tab === 1,\n      isPlanDesk: tab === 1 && !mobile,\n      isPlanMobile: tab === 1 && mobile,\n      isDocs: tab === 2,\n      isDocsDesk: tab === 2 && !mobile,\n      isDocsMobile: tab === 2 && mobile,\n      isClauses: tab === 3,\n      isClDesk: tab === 3 && !mobile,\n      isClMobile: tab === 3 && mobile,\n      isRisks: tab === 4,\n      isSoa: tab === 5,\n      isSoaDesk: tab === 5 && !mobile,\n      isSoaMobile: tab === 5 && mobile,\n      gateEyebrow: gate ? \"Stage 2\" : \"Gates open\",\n      gateColor: gate ? \"#17693A\" : \"#B6000C\",\n      gateReadout: gate ? \"READY\" : `${open}/4 OPEN`,\n      gateWord: gate ? \"READY\" : \"NOT READY\",\n      gateCount: blockers.length ? `${blockers.length} OPEN GATE${blockers.length === 1 ? \"\" : \"S\"}` : \"ALL GATES CLEAR\",\n      clear: blockers.length === 0,\n      hasBlockers: blockers.length > 0,\n      blockers,\n      stats: [\n        { label: \"Plan complete\", value: pct(m.planned), note: `${m.done} of ${m.total} tasks finished`, tone: \"#CC000E\" },\n        { label: \"Risks logged\", value: String(st.risks.length), note: st.risks.length ? `${m.openHigh} at high or critical` : \"6.1.2 — none identified yet\", tone: st.risks.length ? \"#CC000E\" : \"#8A5A00\" },\n        { label: \"Tasks overdue\", value: String(m.overdue), note: \"past due, under 100%\", tone: m.overdue ? \"#B6000C\" : \"#17693A\" },\n        { label: \"Clause conformity\", value: pct(m.clPct), note: `${m.clVer} of ${m.clApp} verified`, tone: \"#17693A\" },\n        { label: \"SoA controls applied\", value: `${m.appN}/93`, note: `${m.exclN} excluded · ${m.ctImp} implemented · ${m.ctPlan} planned`, tone: \"#CC000E\" },\n        { label: \"Documents outstanding\", value: String(m.mandOut), note: `of ${m.mandN} mandatory`, tone: m.mandOut ? \"#8A5A00\" : \"#17693A\" },\n      ],\n      meters: [\n        { label: \"Implementation plan\", pctText: pct(m.planned), width: pct(m.planned), tone: \"#CC000E\" },\n        { label: \"Clauses 4–10 verified\", pctText: pct(m.clPct), width: pct(m.clPct), tone: \"#17693A\" },\n        { label: \"Applicable Annex A implemented\", pctText: pct(m.ctPct), width: pct(m.ctPct), tone: \"#17693A\" },\n        { label: \"Mandatory documents approved\", pctText: pct(1 - m.mandOut / Math.max(1, m.mandN)), width: pct(1 - m.mandOut / Math.max(1, m.mandN)), tone: \"#8A5A00\" },\n      ],\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>\n"
