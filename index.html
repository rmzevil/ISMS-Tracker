der: none; border-radius: 3px; background: var(--accent-fill); color: var(--on-fill); cursor: pointer\">{{ genLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ suggPartial }}\">\n            <div style=\"background: var(--warn-wash); border-radius: 3px; padding: 11px 13px; margin-bottom: 13px\">\n              <div style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--warn)\">Cut short<\u002Fdiv>\n              <p style=\"margin: 5px 0 0; font-size: 12px; line-height: 1.6; color: var(--ink-2); text-wrap: pretty\">{{ suggPartialWhy }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ suggStale }}\">\n            <div style=\"background: var(--warn-wash); border-radius: 3px; padding: 11px 13px; margin-bottom: 13px\">\n              <div style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--warn)\">Outdated<\u002Fdiv>\n              <p style=\"margin: 5px 0 0; font-size: 12px; line-height: 1.6; color: var(--ink-2); text-wrap: pretty\">{{ suggStaleWhy }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ suggTabRisks }}\">\n            <div>\n              <sc-if value=\"{{ hasSugg }}\">\n                <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px\">\n                  <button sc-camel-on-click=\"{{ pickHigh }}\" style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; padding: 7px 10px; min-height: 32px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer\">SELECT HIGH CONFIDENCE<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ clearPicks }}\" style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; padding: 7px 10px; min-height: 32px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer\">CLEAR<\u002Fbutton>\n                  <span style=\"flex: 1\"><\u002Fspan>\n                  <sc-if value=\"{{ hasPicked }}\">\n                    <button sc-camel-on-click=\"{{ applyPicked }}\" disabled=\"{{ suggStale }}\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 8px 13px; min-height: 34px; border: none; border-radius: 2px; background: var(--ok-fill); color: var(--on-fill); cursor: pointer\">ADD {{ pickedCount }} TO THE REGISTER<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-for list=\"{{ suggRisks }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid {{ r.edge }}; border-radius: 3px; padding: 13px 15px; margin-bottom: 10px\">\n                  <div style=\"display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 7px\">\n                    <span style=\"flex: 1; min-width: 200px; font-size: 13.5px; font-weight: 700; line-height: 1.45; text-wrap: pretty\">{{ r.subject }}<\u002Fspan>\n                    <span style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .08em; padding: 3px 6px; border-radius: 2px; border: 1px solid {{ r.confTone }}; color: {{ r.confTone }}\">{{ r.conf }}<\u002Fspan>\n                    <span style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--ink-2)\">{{ r.score }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ r.hasDetail }}\">\n                    <div style=\"font-size: 12px; color: var(--ink-3); line-height: 1.55; margin-bottom: 6px\">{{ r.detail }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"font-size: 12.5px; color: var(--ink-2); line-height: 1.6; margin-bottom: 4px\"><b style=\"color: var(--ink)\">Threat<\u002Fb> {{ r.threat }}<\u002Fdiv>\n                  <div style=\"font-size: 12.5px; color: var(--ink-2); line-height: 1.6; margin-bottom: 4px\"><b style=\"color: var(--ink)\">Weakness<\u002Fb> {{ r.vuln }}<\u002Fdiv>\n                  <div style=\"font-size: 12.5px; color: var(--ink-2); line-height: 1.6; margin-bottom: 4px\"><b style=\"color: var(--ink)\">{{ r.opt }}<\u002Fb> — {{ r.plan }}<\u002Fdiv>\n                  <div style=\"display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--hair)\">\n                    <span style=\"font-family: var(--mono); font-size: 10px; color: var(--ink-3)\">Annex A {{ r.refs }}<\u002Fspan>\n                    <span style=\"font-family: var(--mono); font-size: 10px; color: var(--ink-3)\">Owner {{ r.owner }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size: 11.5px; color: var(--ink-3); line-height: 1.55; margin-top: 6px; font-style: italic\">{{ r.why }}<\u002Fdiv>\n                  <div style=\"display: flex; gap: 7px; flex-wrap: wrap; margin-top: 11px\">\n                    <button sc-camel-on-click=\"{{ r.toggle }}\" aria-pressed=\"{{ r.on }}\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 7px 11px; min-height: 32px; border: 1px solid var(--line-2); border-radius: 2px; background: {{ r.boxBg }}; color: {{ r.boxFg }}; cursor: pointer\">{{ r.boxLabel }}<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ r.applyOne }}\" disabled=\"{{ suggStale }}\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 7px 11px; min-height: 32px; border: none; border-radius: 2px; background: var(--solid); color: var(--on-fill); cursor: pointer\">ADD THIS ONE<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ r.reject }}\" style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; padding: 7px 11px; min-height: 32px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--danger); cursor: pointer\">REJECT<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ suggTabControls }}\">\n            <div>\n              <sc-for list=\"{{ suggControls }}\" as=\"c\" hint-placeholder-count=\"5\">\n                <div style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid {{ c.edge }}; border-radius: 3px; padding: 12px 14px; margin-bottom: 9px\">\n                  <div style=\"display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap\">\n                    <span style=\"font-family: var(--mono); font-size: 11.5px; font-weight: 800; color: var(--accent)\">{{ c.id }}<\u002Fspan>\n                    <span style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .07em; color: {{ c.vTone }}\">{{ c.verdict }}<\u002Fspan>\n                    <span style=\"flex: 1\"><\u002Fspan>\n                    <span style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .08em; padding: 3px 6px; border-radius: 2px; border: 1px solid {{ c.confTone }}; color: {{ c.confTone }}\">{{ c.conf }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <p style=\"margin: 7px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--ink-2); text-wrap: pretty\">{{ c.why }}<\u002Fp>\n                  <sc-if value=\"{{ c.blocked }}\">\n                    <div style=\"margin-top: 9px; background: var(--warn-wash); border-radius: 2px; padding: 8px 10px; font-size: 11.5px; line-height: 1.55; color: var(--ink-2)\"><b style=\"color: var(--warn)\">Cannot apply.<\u002Fb> {{ c.clash }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px\">\n                    <sc-if value=\"{{ c.allowed }}\">\n                      <button sc-camel-on-click=\"{{ c.apply }}\" disabled=\"{{ suggStale }}\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 7px 11px; min-height: 32px; border: none; border-radius: 2px; background: var(--ok-fill); color: var(--on-fill); cursor: pointer\">APPLY AS MY DECISION<\u002Fbutton>\n                    <\u002Fsc-if>\n                    <button sc-camel-on-click=\"{{ c.reject }}\" style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; padding: 7px 11px; min-height: 32px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--danger); cursor: pointer\">REJECT<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ legendPop }}\">\n    <div sc-camel-on-click=\"{{ closeLegendPop }}\" data-overlay=\"\" style=\"position: fixed; inset: 0; z-index: 68; background: var(--scrim-2); display: flex; justify-content: center; padding: 20px 16px; overflow-y: auto\">\n      <div class=\"pane\" role=\"dialog\" aria-modal=\"true\" aria-label=\"What the colours and gates mean\" sc-camel-on-click=\"{{ stopLegend }}\" style=\"background: var(--surface); border: 1px solid var(--line-2); border-top: 3px solid var(--accent); border-radius: 4px; width: 100%; max-width: 620px; max-height: 100%; margin: auto; display: flex; flex-direction: column; box-shadow: 0 22px 60px var(--shadow)\">\n        <div style=\"flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 15px 18px 12px; border-bottom: 1px solid var(--line)\">\n          <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">Reading this tracker<\u002Fspan>\n          <span style=\"flex: 1; font-size: 15px; font-weight: 700\">Legend<\u002Fspan>\n          <button sc-camel-on-click=\"{{ closeLegendPop }}\" aria-label=\"Close the legend\" style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 7px 12px; min-height: 34px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"scroller\" style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px 18px\">\n\n            <div>\n              <div style=\"display: flex; gap: 13px; align-items: flex-start; padding: 11px 0; line-height: 1.6; border-bottom: 1px solid var(--line)\">\n                <span style=\"width: 18px; height: 18px; background: var(--ok-fill); border-radius: 3px; flex-shrink: 0; margin-top: 1px\"><\u002Fspan>\n                <span style=\"font-size: 13px\"><b style=\"display: block; margin-bottom: 2px\">Verified / Complete<\u002Fb><span style=\"color: var(--ink-2); font-size: 12.5px\">Evidence exists and you have checked it.<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 13px; align-items: flex-start; padding: 11px 0; line-height: 1.6; border-bottom: 1px solid var(--line)\">\n                <span style=\"width: 18px; height: 18px; background: var(--warn-fill); border-radius: 3px; flex-shrink: 0; margin-top: 1px\"><\u002Fspan>\n                <span style=\"font-size: 13px\"><b style=\"display: block; margin-bottom: 2px\">In progress / Drafting<\u002Fb><span style=\"color: var(--ink-2); font-size: 12.5px\">Started, not finished.<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 13px; align-items: flex-start; padding: 11px 0; line-height: 1.6; border-bottom: 1px solid var(--line)\">\n                <span style=\"width: 18px; height: 18px; background: var(--info-fill); border-radius: 3px; flex-shrink: 0; margin-top: 1px\"><\u002Fspan>\n                <span style=\"font-size: 13px\"><b style=\"display: block; margin-bottom: 2px\">In review / Treated<\u002Fb><span style=\"color: var(--ink-2); font-size: 12.5px\">Done but not yet verified by you.<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 13px; align-items: flex-start; padding: 11px 0; line-height: 1.6; border-bottom: 1px solid var(--line)\">\n                <span style=\"width: 18px; height: 18px; background: var(--danger-fill); border-radius: 3px; flex-shrink: 0; margin-top: 1px\"><\u002Fspan>\n                <span style=\"font-size: 13px\"><b style=\"display: block; margin-bottom: 2px\">Overdue / Gap / Needs update<\u002Fb><span style=\"color: var(--ink-2); font-size: 12.5px\">Would be a finding today.<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 13px; align-items: flex-start; padding: 11px 0; line-height: 1.6\">\n                <span style=\"width: 18px; height: 18px; background: var(--ink-3); border-radius: 3px; flex-shrink: 0; margin-top: 1px\"><\u002Fspan>\n                <span style=\"font-size: 13px\"><b style=\"display: block; margin-bottom: 2px\">Not started<\u002Fb><span style=\"color: var(--ink-2); font-size: 12.5px\">No work yet.<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"margin-top: 26px\">\n              <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">Risk bands — score = likelihood × impact<\u002Fdiv>\n              <div style=\"display: flex; gap: 10px; flex-wrap: wrap; margin-top: 11px\">\n                <span style=\"font-family: var(--mono); font-size: 11px; padding: 7px 13px; border-radius: 3px; background: var(--ok-fill); color: var(--on-fill); font-weight: 700; letter-spacing: .04em\">Low 1–3<\u002Fspan>\n                <span style=\"font-family: var(--mono); font-size: 11px; padding: 7px 13px; border-radius: 3px; background: var(--warn-fill); color: var(--on-fill); font-weight: 700; letter-spacing: .04em\">Medium 4–8<\u002Fspan>\n                <span style=\"font-family: var(--mono); font-size: 11px; padding: 7px 13px; border-radius: 3px; background: var(--warn-fill-2); color: var(--on-fill); font-weight: 700; letter-spacing: .04em\">High 9–14<\u002Fspan>\n                <span style=\"font-family: var(--mono); font-size: 11px; padding: 7px 13px; border-radius: 3px; background: var(--danger-fill); color: var(--on-fill); font-weight: 700; letter-spacing: .04em\">Critical 15–25<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"margin-top: 26px\">\n              <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">The four gates<\u002Fdiv>\n              <ul style=\"margin: 11px 0 0; padding-left: 20px; font-size: 12.5px; line-height: 2.05; color: var(--ink-2)\">\n                <li>Every mandatory document approved or published <span style=\"font-family: var(--mono); font-size: 10px\">7.5<\u002Fspan><\u002Fli>\n                <li>Every excluded control carries a written justification <span style=\"font-family: var(--mono); font-size: 10px\">6.1.3 d)<\u002Fspan><\u002Fli>\n                <li>Every residual risk at or below your threshold <span style=\"font-family: var(--mono); font-size: 10px\">6.1.2 a)<\u002Fspan><\u002Fli>\n                <li>Every applicable sub-clause verified <span style=\"font-family: var(--mono); font-size: 10px\">4–10<\u002Fspan><\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n          <p style=\"font-size: 12px; color: var(--ink-2); margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); line-height: 1.75; text-wrap: pretty\">Clauses 4–10 are mandatory in full — every <i>shall<\u002Fi> applies whatever your business does. Annex A is selectable, which is exactly why clause 6.1.3 d) makes you justify each inclusion <i>and<\u002Fi> each exclusion.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ flowOpen }}\">\n    <div sc-camel-on-click=\"{{ closeFlow }}\" data-overlay=\"\" style=\"position: fixed; inset: 0; z-index: 69; background: var(--scrim-2); display: flex; justify-content: center; padding: 20px 16px; overflow-y: auto\">\n      <div class=\"pane\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Process flow\" sc-camel-on-click=\"{{ stopFlow }}\" style=\"background: var(--page); border: 1px solid var(--line-2); border-top: 3px solid var(--info); border-radius: 4px; width: 100%; max-width: 1080px; max-height: 100%; margin: auto; display: flex; flex-direction: column; box-shadow: 0 22px 60px var(--shadow)\">\n        <div style=\"flex-shrink: 0; display: flex; align-items: center; gap: 11px; flex-wrap: wrap; background: var(--surface); border-bottom: 1px solid var(--line-2); border-radius: 4px 4px 0 0; padding: 14px 18px\">\n          <span style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--info)\">{{ flowRef }} · process flow<\u002Fspan>\n          <span style=\"flex: 1; min-width: 160px; font-size: 16px; font-weight: 700; letter-spacing: -.01em\">{{ flowTitle }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ closeFlow }}\" aria-label=\"Close the process flow\" style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 7px 12px; min-height: 34px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"scroller\" style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px 18px\">\n          <div data-stack=\"\" style=\"display: grid; grid-template-columns: 208px minmax(0, 1fr) 224px; gap: 14px; align-items: start\">\n\n            <section style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--line-2); border-radius: 3px; padding: 12px\">\n              <div style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">Inputs<\u002Fdiv>\n              <sc-for list=\"{{ flowInputs }}\" as=\"i\" hint-placeholder-count=\"4\">\n                <div style=\"border-top: 1px solid var(--hair); padding: 8px 0 0; margin-top: 8px\">\n                  <div style=\"font-size: 12px; font-weight: 600; line-height: 1.4\">{{ i.t }}<\u002Fdiv>\n                  <div style=\"font-family: var(--mono); font-size: 9.5px; color: var(--ink-3); margin-top: 2px; line-height: 1.4\">from {{ i.from }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ flowNoInputs }}\">\n                <p style=\"margin: 8px 0 0; font-size: 11.5px; color: var(--ink-3); line-height: 1.55\">Nothing arrives from another process — this one starts on its own trigger.<\u002Fp>\n              <\u002Fsc-if>\n            <\u002Fsection>\n\n            <div style=\"display: flex; gap: 10px; align-items: stretch; overflow-x: auto; padding-bottom: 4px\">\n              <sc-for list=\"{{ flowStages }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <div style=\"display: flex; align-items: stretch; gap: 10px; flex-shrink: 0\">\n                  <div style=\"min-width: 178px; max-width: 230px; background: var(--surface); border: 1px solid var(--line); border-top: 2px solid var(--info); border-radius: 3px; padding: 11px\">\n                    <div style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--info)\">Stage {{ s.n }}<\u002Fdiv>\n                    <sc-for list=\"{{ s.acts }}\" as=\"a\" hint-placeholder-count=\"2\">\n                      <div style=\"display: flex; gap: 8px; align-items: flex-start; background: var(--subtle); border-radius: 2px; padding: 8px 9px; margin-top: 8px\">\n                        <span style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; color: var(--ink-3); flex-shrink: 0\">{{ a.n }}<\u002Fspan>\n                        <span style=\"font-size: 12px; line-height: 1.45; text-wrap: pretty\">{{ a.t }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ s.hasNext }}\">\n                    <span aria-hidden=\"true\" style=\"display: flex; align-items: center; font-family: var(--mono); font-size: 15px; color: var(--info); flex-shrink: 0\">→<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <section style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--ok); border-radius: 3px; padding: 12px\">\n              <div style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">Outputs<\u002Fdiv>\n              <sc-for list=\"{{ flowOutputs }}\" as=\"o\" hint-placeholder-count=\"3\">\n                <div style=\"border-top: 1px solid var(--hair); padding: 8px 0 0; margin-top: 8px\">\n                  <div style=\"font-size: 12px; font-weight: 600; line-height: 1.4\">{{ o.t }}<\u002Fdiv>\n                  <sc-if value=\"{{ o.hasTo }}\">\n                    <div style=\"font-family: var(--mono); font-size: 9.5px; color: var(--ink-3); margin-top: 2px; line-height: 1.45\">to {{ o.to }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ flowNoOutputs }}\">\n                <p style=\"margin: 8px 0 0; font-size: 11.5px; color: var(--ink-3); line-height: 1.55\">The records this produces stay inside the process.<\u002Fp>\n              <\u002Fsc-if>\n            <\u002Fsection>\n          <\u002Fdiv>\n          <p style=\"margin: 14px 0 0; font-size: 11px; color: var(--ink-3); line-height: 1.65; max-width: 900px; text-wrap: pretty\">Read from your own process pack: the activities as the map groups them left to right, the records that arrive, and the processes that consume what this one produces. Stages are the columns of the source map, not a strict sequence of arrows.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ viewerOpen }}\">\n    <div sc-camel-on-click=\"{{ closeViewer }}\" data-overlay=\"\" style=\"position: fixed; inset: 0; z-index: 69; background: var(--scrim-2); display: flex; justify-content: center; padding: 20px 16px; overflow-y: auto\">\n      <div class=\"pane\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Document\" sc-camel-on-click=\"{{ stopViewer }}\" style=\"background: var(--page); border: 1px solid var(--line-2); border-top: 3px solid var(--accent); border-radius: 4px; width: 100%; max-width: 860px; max-height: 100%; margin: auto; display: flex; flex-direction: column; box-shadow: 0 22px 60px var(--shadow)\">\n        <div style=\"flex-shrink: 0; background: var(--surface); border-bottom: 1px solid var(--line-2); border-radius: 4px 4px 0 0; padding: 14px 18px\">\n          <div style=\"display: flex; align-items: center; gap: 11px; flex-wrap: wrap\">\n            <span style=\"font-family: var(--mono); font-size: 12px; font-weight: 800; color: var(--accent)\">{{ viewerId }}<\u002Fspan>\n            <span style=\"flex: 1; min-width: 180px; font-size: 15px; font-weight: 700\">{{ viewerTitle }}<\u002Fspan>\n            <button sc-camel-on-click=\"{{ closeViewer }}\" aria-label=\"Close the document\" style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 7px 12px; min-height: 34px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">✕<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; color: var(--ink-3); margin-top: 6px\">{{ viewerSub }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"scroller\" style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px 18px\">\n          <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 13px\">\n            <button sc-camel-on-click=\"{{ viewerBuild }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: var(--accent-fill); color: var(--on-fill); cursor: pointer\">OPEN THE BUILDER<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ viewerWord }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: var(--solid); color: var(--on-fill); cursor: pointer\">DOWNLOAD WORD<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ viewerCopy }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">COPY MARKDOWN<\u002Fbutton>\n          <\u002Fdiv>\n          <pre style=\"margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px; font-family: var(--mono); font-size: 11.5px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; color: var(--ink)\">{{ viewerText }}<\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ keysOpen }}\">\n    <div sc-camel-on-click=\"{{ closeKeys }}\" data-overlay=\"\" style=\"position: fixed; inset: 0; z-index: 70; background: var(--scrim-2); display: flex; align-items: center; justify-content: center; padding: 72px 16px 20px\">\n      <div class=\"pane\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Keyboard shortcuts\" style=\"background: var(--surface); border: 1px solid var(--line-2); border-top: 3px solid var(--accent); border-radius: 4px; width: 100%; max-width: 520px; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 22px 60px var(--shadow)\">\n        <div style=\"flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 15px 18px 12px; border-bottom: 1px solid var(--line)\">\n          <span style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">Keyboard<\u002Fspan>\n          <span style=\"flex: 1; font-size: 15px; font-weight: 700\">Shortcuts<\u002Fspan>\n          <button sc-camel-on-click=\"{{ closeKeys }}\" aria-label=\"Close the shortcuts\" style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 7px 12px; min-height: 34px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"scroller\" style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px 18px\">\n          <sc-for list=\"{{ shortcutGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n            <div style=\"margin-bottom: 16px\">\n              <div style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); margin-bottom: 7px\">{{ g.head }}<\u002Fdiv>\n              <sc-for list=\"{{ g.rows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div style=\"display: flex; align-items: baseline; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--hair)\">\n                  <kbd style=\"flex-shrink: 0; min-width: 62px; font-family: var(--mono); font-size: 10.5px; font-weight: 700; text-align: center; padding: 4px 7px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 3px; background: var(--subtle); color: var(--ink)\">{{ r.k }}<\u002Fkbd>\n                  <span style=\"font-size: 12.5px; color: var(--ink-2); line-height: 1.5\">{{ r.w }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <p style=\"margin: 0; font-size: 11.5px; color: var(--ink-3); line-height: 1.6; text-wrap: pretty\">Shortcuts stay out of the way while you are typing in a field, and while a panel is open only Escape and <b>?<\u002Fb> respond.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isSettings }}\">\n        <div data-overlay=\"\" style=\"position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 72px 16px 20px\">\n        <div class=\"pane\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Settings\" style=\"background: var(--page); border: 1px solid var(--line-2); border-radius: 4px; width: 100%; max-width: 920px; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 22px 60px var(--shadow)\">\n        <div data-set-head=\"\" style=\"flex-shrink: 0; display: flex; align-items: center; gap: 14px; background: var(--page); border-bottom: 1px solid var(--line-2); border-radius: 4px 4px 0 0; padding: 14px 18px\">\n          <div style=\"flex: 1; min-width: 0\">\n            <h2 style=\"margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.015em\">Settings<\u002Fh2>\n            <p style=\"margin: 3px 0 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.5\">{{ setCount }} sections, one at a time.<\u002Fp>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ closeSettings }}\" aria-label=\"Close settings\" style=\"display: flex; align-items: center; gap: 8px; flex-shrink: 0; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 9px 15px; min-height: 40px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap\" style-hover=\"border-color: var(--accent); color: var(--accent)\"><span aria-hidden=\"true\">✕<\u002Fspan>CLOSE<\u002Fbutton>\n        <\u002Fdiv>\n        <!-- minmax(0,1fr) caps the column at the panel width. An implicit grid\n             column is min-content-floored, so one wide child (a table, a long\n             key) pushed the whole panel sideways. -->\n        <div style=\"flex: 1; min-height: 0; display: grid; grid-template-columns: 210px minmax(0, 1fr)\" data-stack=\"\">\n          <nav aria-label=\"Settings sections\" data-set-rail=\"\" class=\"scroller\" style=\"position: relative; min-height: 0; display: flex; flex-direction: column; gap: 3px; border-right: 1px solid var(--line-2); background: var(--subtle); padding: 12px 10px; overflow-y: auto\">\n            <div data-set-pip=\"\" aria-hidden=\"true\" style=\"position: absolute; left: 10px; top: {{ setPipTop }}; width: 3px; height: 34px; border-radius: 2px; background: var(--accent-fill); transition: top .32s cubic-bezier(.2,.7,.3,1)\"><\u002Fdiv>\n            <sc-for list=\"{{ setNav }}\" as=\"s\" hint-placeholder-count=\"8\">\n              <button sc-camel-on-click=\"{{ s.go }}\" aria-current=\"{{ s.aria }}\" style=\"display: flex; align-items: center; gap: 9px; flex-shrink: 0; text-align: left; font-family: var(--mono); font-size: 10px; font-weight: {{ s.weight }}; letter-spacing: .05em; text-transform: uppercase; padding: 9px 10px 9px 15px; min-height: 34px; border: none; border-radius: 2px; background: {{ s.bg }}; color: {{ s.fg }}; cursor: pointer; white-space: nowrap\" style-hover=\"background: var(--surface); color: var(--accent)\"><span style=\"font-size: 9px; color: var(--faint)\">{{ s.n }}<\u002Fspan>{{ s.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fnav>\n\n          <div style=\"min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column\">\n        <div class=\"scroller\" data-set-body=\"\" tabindex=\"0\" style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px 18px\">\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; transform: {{ setSlide }}; opacity: {{ setFade }}; transition: transform .3s cubic-bezier(.2,.7,.3,1), opacity .24s ease\">\n          <div>\n            <div style=\"display: flex; align-items: baseline; gap: 10px\">\n              <span style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--accent); white-space: nowrap\">{{ setEyebrow }}<\u002Fspan>\n              <span style=\"flex: 1; height: 1px; background: var(--line)\"><\u002Fspan>\n              <span style=\"font-family: var(--mono); font-size: 9.5px; color: var(--ink-3)\">{{ setPos }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin: 7px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--ink-2); text-wrap: pretty\">{{ setBlurb }}<\u002Fp>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ setIsProject }}\" hint-placeholder-val=\"{{ true }}\">\n          <section id=\"set-project\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">This project<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: var(--ink-2); line-height: 1.6\">Used on every generated document and as the anchor date for the plan.<\u002Fp>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 11px\">\n              <label style=\"display: block\">\n                <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Organisation<\u002Fspan>\n                <input type=\"text\" value=\"{{ company }}\" sc-camel-on-change=\"{{ setCompany }}\" placeholder=\"the legal entity being certified\" aria-label=\"Organisation\" style=\"width: 100%; min-height: 38px\">\n              <\u002Flabel>\n              <label style=\"display: block\">\n                <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Project start<\u002Fspan>\n                <input type=\"date\" value=\"{{ startDate }}\" sc-camel-on-change=\"{{ setStart }}\" aria-label=\"Project start date\" style=\"width: 100%; min-height: 38px\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <div style=\"margin-top: 11px; background: var(--subtle); border-radius: 3px; padding: 11px 12px\">\n              <div style=\"display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap\">\n                <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">ISMS scope · clause 4.3<\u002Fspan>\n                <span style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .08em; white-space: nowrap; padding: 2px 6px; border-radius: 2px; border: 1px solid {{ scopeTone }}; color: {{ scopeTone }}\">{{ scopeWhere }}<\u002Fspan>\n                <span style=\"flex: 1\"><\u002Fspan>\n                <button sc-camel-on-click=\"{{ openScopeDoc }}\" title=\"Open D-03, the ISMS scope and context document\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; white-space: nowrap; padding: 6px 10px; min-height: 30px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">EDIT IN D-03<\u002Fbutton>\n              <\u002Fdiv>\n              <p style=\"margin: 8px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--ink-2); text-wrap: pretty\">{{ scopeText }}<\u002Fp>\n            <\u002Fdiv>\n            <label style=\"display: block; margin-top: 11px\">\n              <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Project manager<\u002Fspan>\n              <input type=\"text\" value=\"{{ pmName }}\" sc-camel-on-change=\"{{ setPm }}\" placeholder=\"who owns delivery of this ISMS\" aria-label=\"Project manager\" style=\"width: 100%; max-width: 360px; min-height: 38px\">\n            <\u002Flabel>\n            <div style=\"display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line)\">\n              <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">Certification decision expected<\u002Fspan>\n              <span style=\"font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--ink)\">{{ certDate }}<\u002Fspan>\n              <span style=\"flex: 1; min-width: 220px; font-size: 11.5px; color: var(--ink-3); line-height: 1.55\">Derived from the last task in the plan, so it moves when the plan moves — a projection, not a booking.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          \n\n          \n\n          \n\n          \n\n\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ setIsVault }}\">\n          <section id=\"set-vault\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Vault — encrypt this browser's copy<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: var(--ink-2); line-height: 1.6; max-width: 680px; text-wrap: pretty\">A passphrase derives an AES-GCM key, and everything written to browser storage goes through it. <b>Forgetting the passphrase loses the project<\u002Fb> — there is no recovery path, so keep a downloaded backup somewhere you trust.<\u002Fp>\n            <label style=\"display: flex; align-items: center; gap: 9px; flex-wrap: wrap; background: var(--subtle); border-radius: 3px; padding: 10px 12px; margin-bottom: 11px\">\n              <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">Ask again after<\u002Fspan>\n              <sc-raw-select value=\"{{ idleMins }}\" sc-camel-on-change=\"{{ setIdle }}\" aria-label=\"Re-ask for the passphrase after\" style=\"min-height: 36px; font-family: var(--mono); font-size: 11.5px\">\n                <sc-for list=\"{{ idleChoices }}\" as=\"c\" hint-placeholder-count=\"9\">\n                  <option value=\"{{ c.v }}\">{{ c.label }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n              <span style=\"font-size: 11.5px; color: var(--ink-2); line-height: 1.5\">of no activity. A refresh inside that window does not ask again; closing the tab always does.<\u002Fspan>\n            <\u002Flabel>\n            <p style=\"margin: 0 0 12px; font-size: 11.5px; color: var(--ink-3); line-height: 1.6; max-width: 680px; text-wrap: pretty\">Worth being straight about the limit: the unlocked key is held in this tab's session storage, so anyone with access to the machine while the tab is open can reach it. The encryption is what has real strength — without the passphrase the saved data is genuinely unreadable. Treat the window as convenience, not as an access control.<\u002Fp>\n            <sc-if value=\"{{ hasVault }}\">\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n                <span style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--ok)\">VAULT ON — storage holds ciphertext<\u002Fspan>\n                <span style=\"flex: 1\"><\u002Fspan>\n                <button sc-camel-on-click=\"{{ lockNow }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: var(--solid); color: var(--on-fill); cursor: pointer\">LOCK NOW<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ vaultOff }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--danger); border-radius: 2px; background: var(--surface); color: var(--danger); cursor: pointer\">TURN OFF<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noVault }}\">\n              <div style=\"display: grid; gap: 9px; max-width: 460px\">\n                <input type=\"password\" value=\"{{ vaultPass }}\" sc-camel-on-change=\"{{ setVaultPass }}\" placeholder=\"Passphrase — at least 10 characters\" aria-label=\"New passphrase\" style=\"width: 100%; min-height: 38px\">\n                <input type=\"password\" value=\"{{ vaultPass2 }}\" sc-camel-on-change=\"{{ setVaultPass2 }}\" placeholder=\"Repeat the passphrase\" aria-label=\"Repeat passphrase\" style=\"width: 100%; min-height: 38px\">\n                <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n                  <button sc-camel-on-click=\"{{ genTotp }}\" style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .06em; padding: 9px 12px; min-height: 36px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">ADD AN AUTHENTICATOR<\u002Fbutton>\n                  <sc-if value=\"{{ hasTotp }}\">\n                    <span style=\"font-family: var(--mono); font-size: 10px; color: var(--ok)\">secret generated — add it below, then enter a code<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <sc-if value=\"{{ hasTotp }}\">\n                  <div style=\"background: var(--subtle); border: 1px solid var(--line); border-radius: 2px; padding: 10px 12px\">\n                    <div style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px\">Add this secret to your authenticator<\u002Fdiv>\n                    <div style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; word-break: break-all; color: var(--ink)\">{{ vaultTotp }}<\u002Fdiv>\n                    <input type=\"text\" value=\"{{ vaultCode }}\" sc-camel-on-change=\"{{ setVaultCode }}\" placeholder=\"Then enter the 6-digit code\" aria-label=\"Authenticator code\" inputmode=\"numeric\" style=\"width: 100%; margin-top: 9px; min-height: 38px\">\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <button sc-camel-on-click=\"{{ turnVaultOn }}\" disabled=\"{{ vaultBusy }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 10px 13px; min-height: 40px; border: none; border-radius: 2px; background: var(--accent-fill); color: var(--on-fill); cursor: pointer\">TURN THE VAULT ON<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasVaultErr }}\">\n              <div style=\"margin-top: 11px; background: var(--danger-wash); border-left: 3px solid var(--danger); border-radius: 2px; padding: 10px 12px; font-size: 12px; line-height: 1.55\">{{ vaultErr }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ setIsProfile }}\">\n          <section id=\"set-profile\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Organisation profile<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: var(--ink-2); line-height: 1.6; max-width: 660px; text-wrap: pretty\">These seven answers decide which Annex A controls the engine proposes. A control you have overridden by hand is never touched by a change here.<\u002Fp>\n            <sc-for list=\"{{ profileQs }}\" as=\"p\" hint-placeholder-count=\"7\">\n              <div style=\"display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line)\">\n                <span style=\"flex: 1\">\n                  <span style=\"display: block; font-size: 13px; font-weight: 600; line-height: 1.45\">{{ p.q }}<\u002Fspan>\n                  <sc-if value=\"{{ p.hasHint }}\">\n                    <span style=\"display: block; font-size: 11.5px; color: var(--ink-3); line-height: 1.55; margin-top: 3px\">{{ p.hint }}<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fspan>\n                <span style=\"display: flex; border: 1px solid var(--line-2); border-radius: 2px; overflow: hidden; flex-shrink: 0\">\n                  <button sc-camel-on-click=\"{{ p.setYes }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; padding: 8px 13px; min-height: 36px; border: none; cursor: pointer; background: {{ p.yesBg }}; color: {{ p.yesFg }}\">YES<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ p.setNo }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; padding: 8px 13px; min-height: 36px; border: none; cursor: pointer; background: {{ p.noBg }}; color: {{ p.noFg }}\">NO<\u002Fbutton>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ setIsKey }}\">\n          <section id=\"set-key\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">AI assistance API<\u002Fh2>\n            <p style=\"margin: 0 0 11px; font-size: 12px; color: var(--ink-2); line-height: 1.6; max-width: 680px; text-wrap: pretty\">Optional. Without a key, reading a document uses the built-in model. With one, calls go straight from this browser to Anthropic and the key is stored only here.<\u002Fp>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n              <span style=\"display: flex; align-items: stretch; flex: 1; min-width: 220px\">\n                <input type=\"{{ keyType }}\" value=\"{{ aiKey }}\" sc-camel-on-change=\"{{ setAiKey }}\" placeholder=\"sk-ant-…\" aria-label=\"Anthropic API key\" style=\"flex: 1; min-width: 0; min-height: 38px; font-family: var(--mono); border-radius: 2px 0 0 2px\">\n                <button sc-camel-on-click=\"{{ toggleKeyShown }}\" aria-label=\"{{ keyEyeLabel }}\" aria-pressed=\"{{ keyShown }}\" title=\"{{ keyEyeLabel }}\" style=\"flex-shrink: 0; width: 42px; min-height: 38px; border: 1px solid var(--line-2); border-left: none; border-radius: 0 2px 2px 0; background: var(--surface); color: var(--accent); font-size: 13px; line-height: 1; cursor: pointer\" style-hover=\"background: var(--accent-wash)\">{{ keyEye }}<\u002Fbutton>\n              <\u002Fspan>\n              <button sc-camel-on-click=\"{{ saveAiKey }}\" title=\"Keep this key in this browser\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 15px; min-height: 38px; border: none; border-radius: 2px; background: {{ keySaveTone }}; color: var(--on-fill); cursor: pointer\">{{ keySaveLabel }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ clearAiKey }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer\">CLEAR<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-family: var(--mono); font-size: 10px; margin-top: 7px; color: {{ keyTone }}\">{{ keyState }}<\u002Fdiv>\n          <\u002Fsection>\n\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ setIsImport }}\">\n          <section id=\"set-import\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Read your organisation's own document<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: var(--ink-2); line-height: 1.6; max-width: 680px; text-wrap: pretty\">Upload a company profile, prospectus or intranet page — HTML, PDF, text or Markdown — and it will be read for the things clauses 4.1 to 4.3 ask for: external and internal issues, interested parties, locations, systems, and what belongs inside the scope. Nothing is written until you have seen it and ticked what to keep.<\u002Fp>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n              <label style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; display: flex; align-items: center; border: none; border-radius: 2px; background: var(--accent-fill); color: var(--on-fill); cursor: pointer\">UPLOAD A DOCUMENT<input type=\"file\" accept=\".html,.htm,.pdf,.txt,.md,.json,text/html,application/pdf,text/plain\" sc-camel-on-change=\"{{ pickDoc }}\" aria-label=\"Upload an organisation document\" style=\"display: none\"><\u002Flabel>\n              <sc-if value=\"{{ isImpBusy }}\">\n                <span class=\"busy\" style=\"font-family: var(--mono); font-size: 10.5px; padding: 8px 12px; border-radius: 2px; color: var(--ink-2)\">{{ impBusy }}…<\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ hasImpSrc }}\">\n                <span style=\"font-family: var(--mono); font-size: 10px; color: var(--ink-3)\">{{ impSrc }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <details style=\"margin-top: 11px\">\n              <summary style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); cursor: pointer\">Or paste the relevant sections<\u002Fsummary>\n              <textarea value=\"{{ pasteVal }}\" sc-camel-on-change=\"{{ pasteDoc }}\" rows=\"5\" placeholder=\"Paste the parts of the document that describe the organisation, its market, its sites and its systems.\" aria-label=\"Paste organisation text\" style=\"width: 100%; resize: vertical; margin-top: 8px; line-height: 1.6\"><\u002Ftextarea>\n              <button sc-camel-on-click=\"{{ readPaste }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; margin-top: 7px; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">READ THIS TEXT<\u002Fbutton>\n            <\u002Fdetails>\n            <sc-if value=\"{{ hasImpErr }}\">\n              <div style=\"margin-top: 11px; background: var(--warn-wash); border-left: 3px solid var(--warn); border-radius: 2px; padding: 10px 12px; font-size: 12px; line-height: 1.6\">{{ impErr }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasFound }}\">\n              <div style=\"margin-top: 13px; border-top: 1px solid var(--line); padding-top: 13px\">\n                <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 9px\">What it found — untick anything you do not want<\u002Fdiv>\n                <sc-for list=\"{{ foundRows }}\" as=\"g\" hint-placeholder-count=\"5\">\n                  <div style=\"border: 1px solid var(--line); border-radius: 2px; padding: 10px 11px; margin-bottom: 8px\">\n                    <div style=\"display: flex; align-items: center; gap: 9px; margin-bottom: 6px\">\n                      <button sc-camel-on-click=\"{{ g.toggle }}\" aria-pressed=\"{{ g.on }}\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 5px 10px; min-height: 30px; border: 1px solid var(--line-2); border-radius: 2px; background: {{ g.bg }}; color: {{ g.fg }}; cursor: pointer\">KEEP<\u002Fbutton>\n                      <span style=\"font-size: 12.5px; font-weight: 600; flex: 1\">{{ g.label }}<\u002Fspan>\n                      <span style=\"font-family: var(--mono); font-size: 10px; color: var(--ink-3)\">{{ g.count }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                      <div style=\"font-size: 11.5px; color: var(--ink-2); line-height: 1.55; padding: 2px 0 2px 11px; border-left: 2px solid var(--line)\">{{ it.t }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ g.hasMore }}\">\n                      <div style=\"font-family: var(--mono); font-size: 10px; color: var(--ink-3); margin-top: 4px; padding-left: 11px\">{{ g.more }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px\">\n                  <button sc-camel-on-click=\"{{ applyFound }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: var(--ok-fill); color: var(--on-fill); cursor: pointer\">APPLY WHAT IS TICKED<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ discardFound }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer\">DISCARD<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ setIsData }}\">\n          <section id=\"set-data\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">This browser's data<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: var(--ink-2); line-height: 1.6; max-width: 660px; text-wrap: pretty\">Everything lives in this browser and goes nowhere else. A backup is the only copy that survives clearing site data.<\u002Fp>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n              <button sc-camel-on-click=\"{{ backup }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: var(--solid); color: var(--on-fill); cursor: pointer\">DOWNLOAD BACKUP<\u002Fbutton>\n              <label style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; display: flex; align-items: center; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">RESTORE BACKUP<input type=\"file\" accept=\"application/json\" sc-camel-on-change=\"{{ restore }}\" aria-label=\"Restore a backup\" style=\"display: none\"><\u002Flabel>\n            <\u002Fdiv>\n\n            <div style=\"margin-top: 15px; padding-top: 13px; border-top: 1px solid var(--line)\">\n              <div style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">Archive<\u002Fdiv>\n              <p style=\"margin: 6px 0 10px; font-size: 12px; color: var(--ink-2); line-height: 1.6; max-width: 660px; text-wrap: pretty\">An archive is a backup with the organisation, the date and the readiness stamped into it, so a finished engagement can be filed and told apart from the next one. Archiving and starting over downloads the file first and only clears this browser once the download has fired.<\u002Fp>\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n                <button sc-camel-on-click=\"{{ archiveDl }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">DOWNLOAD ARCHIVE<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ archiveStart }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">ARCHIVE AND START A NEW ORGANISATION<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"margin-top: 15px; border: 1px solid var(--danger); border-radius: 3px; background: var(--danger-wash); padding: 13px\">\n              <div style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--danger)\">Danger zone<\u002Fdiv>\n              <p style=\"margin: 6px 0 10px; font-size: 12px; color: var(--ink-2); line-height: 1.6; max-width: 640px; text-wrap: pretty\">Reset clears the project, the answers, the risks, the settings, the vault and the attachments from this browser. Nothing is uploaded anywhere first, and there is no undo.<\u002Fp>\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n                <button sc-camel-on-click=\"{{ newProject }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--danger); border-radius: 2px; background: var(--surface); color: var(--danger); cursor: pointer\">START A NEW PROJECT<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ resetAll }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: var(--danger-fill); color: var(--on-fill); cursor: pointer\">RESET EVERYTHING<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ setIsSync }}\">\n          <section id=\"set-sync\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Cloud sync<\u002Fh2>\n            <p style=\"margin: 0 0 11px; font-size: 12px; color: var(--ink-2); line-height: 1.6; max-width: 680px; text-wrap: pretty\">Pushes the project to a private bin on your own jsonbin account, so you can carry it between machines. Attachments stay here — they live under a separate key and are never part of the payload.<\u002Fp>\n            <div style=\"font-family: var(--mono); font-size: 10.5px; margin-bottom: 11px; color: {{ syncWarnTone }}\">{{ syncWarn }}<\u002Fdiv>\n            <div style=\"display: grid; gap: 9px; max-width: 520px\">\n              <span style=\"display: flex; align-items: stretch\">\n                <input type=\"{{ jbType }}\" value=\"{{ jbKey }}\" sc-camel-on-change=\"{{ setJbKey }}\" placeholder=\"jsonbin master key\" aria-label=\"jsonbin master key\" style=\"flex: 1; min-width: 0; min-height: 38px; font-family: var(--mono); border-radius: 2px 0 0 2px\">\n                <button sc-camel-on-click=\"{{ toggleJbShown }}\" aria-label=\"{{ jbEyeLabel }}\" aria-pressed=\"{{ jbShown }}\" title=\"{{ jbEyeLabel }}\" style=\"flex-shrink: 0; width: 42px; min-height: 38px; border: 1px solid var(--line-2); border-left: none; border-radius: 0 2px 2px 0; background: var(--surface); color: var(--accent); font-size: 13px; line-height: 1; cursor: pointer\" style-hover=\"background: var(--accent-wash)\">{{ jbEye }}<\u002Fbutton>\n              <\u002Fspan>\n              <input type=\"text\" value=\"{{ jbId }}\" sc-camel-on-change=\"{{ setJbId }}\" placeholder=\"bin id — left empty, a push creates one\" aria-label=\"jsonbin bin id\" style=\"width: 100%; min-height: 38px; font-family: var(--mono)\">\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n                <button sc-camel-on-click=\"{{ saveJb }}\" title=\"Keep the key and bin id in this browser\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 15px; min-height: 38px; border: none; border-radius: 2px; background: {{ jbSaveTone }}; color: var(--on-fill); cursor: pointer\">{{ jbSaveLabel }}<\u002Fbutton>\n                <span style=\"font-family: var(--mono); font-size: 10px; color: {{ jbSavedTone }}\">{{ jbSavedState }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n                <button sc-camel-on-click=\"{{ doPush }}\" disabled=\"{{ syncBusy }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: var(--solid); color: var(--on-fill); cursor: pointer\">PUSH<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ doPull }}\" disabled=\"{{ syncBusy }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">PULL<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ testConn }}\" disabled=\"{{ syncBusy }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">TEST CONNECTION<\u002Fbutton>\n                <span style=\"font-family: var(--mono); font-size: 10px; color: var(--ink-3)\">{{ lastSync }}<\u002Fspan>\n              <\u002Fdiv>\n              <label style=\"display: flex; align-items: flex-start; gap: 9px; background: var(--subtle); border-radius: 3px; padding: 10px 12px\">\n                <input type=\"checkbox\" checked=\"{{ autoSync }}\" sc-camel-on-change=\"{{ toggleAutoSync }}\" aria-label=\"Sync automatically\" style=\"margin-top: 2px\">\n                <span>\n                  <span style=\"display: block; font-size: 12.5px; font-weight: 600\">Sync automatically<\u002Fspan>\n                  <span style=\"display: block; font-size: 11.5px; color: var(--ink-2); line-height: 1.55; margin-top: 2px\">Pulls once when the tracker opens, then pushes a few seconds after each change. Last write wins — this carries a project between your own machines, it does not merge two people's edits.<\u002Fspan>\n                <\u002Fspan>\n              <\u002Flabel>\n            <\u002Fdiv>\n\n            <div style=\"margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line)\">\n              <div style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">Connection code<\u002Fdiv>\n              <p style=\"margin: 6px 0 9px; font-size: 12px; color: var(--ink-2); line-height: 1.6; max-width: 660px; text-wrap: pretty\">One string carrying the key and the bin id, so a second machine does not have to retype them. It grants full access to that private bin — treat it exactly like the key itself, and never paste it anywhere you would not paste a password.<\u002Fp>\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n                <button sc-camel-on-click=\"{{ copyConn }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">COPY CODE<\u002Fbutton>\n                <input type=\"text\" value=\"{{ connIn }}\" sc-camel-on-change=\"{{ setConnIn }}\" placeholder=\"paste a connection code\" aria-label=\"Connection code\" style=\"flex: 1; min-width: 180px; min-height: 38px\">\n                <button sc-camel-on-click=\"{{ applyConn }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: var(--solid); color: var(--on-fill); cursor: pointer\">APPLY<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasSyncMsg }}\">\n              <div style=\"margin-top: 11px; background: var(--subtle); border-left: 3px solid var(--line-2); border-radius: 2px; padding: 10px 12px; font-size: 12px; line-height: 1.55\">{{ syncMsg }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n          <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex-shrink: 0; display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line-2); background: var(--surface); padding: 10px 18px\">\n          <button sc-camel-on-click=\"{{ setPrev }}\" disabled=\"{{ setAtFirst }}\" style=\"display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 8px 12px; min-height: 34px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer; white-space: nowrap; opacity: {{ setPrevOpacity }}\" style-hover=\"border-color: var(--accent); color: var(--accent)\"><span aria-hidden=\"true\">←<\u002Fspan>{{ setPrevLabel }}<\u002Fbutton>\n          <span style=\"flex: 1\"><\u002Fspan>\n          <button sc-camel-on-click=\"{{ setNext }}\" disabled=\"{{ setAtLast }}\" style=\"display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 8px 12px; min-height: 34px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer; white-space: nowrap; opacity: {{ setNextOpacity }}\" style-hover=\"border-color: var(--accent); color: var(--accent)\">{{ setNextLabel }}<span aria-hidden=\"true\">→<\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n  <sc-if value=\"{{ buildOpen }}\">\n        <div data-overlay=\"\" style=\"position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 72px 16px 20px\">\n        <div class=\"pane\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Document builder\" style=\"background: var(--page); border: 1px solid var(--line-2); border-radius: 4px; width: 100%; max-width: 940px; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 22px 60px var(--shadow)\">\n          <div style=\"flex-shrink: 0; background: var(--surface); border-bottom: 2px solid var(--ink); padding: 13px 16px\">\n            <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap\">\n              <span style=\"font-family: var(--mono); font-size: 12px; font-weight: 800; color: var(--accent)\">{{ bId }}<\u002Fspan>\n              <span style=\"flex: 1; min-width: 180px; font-size: 15px; font-weight: 700\">{{ bName }}<\u002Fspan>\n              <sc-raw-select value=\"{{ bStatus }}\" sc-camel-on-change=\"{{ setBStatus }}\" aria-label=\"Document status\" style=\"font-family: var(--mono); font-size: 11px; min-height: 34px; border-left: 3px solid {{ bStatusTone }}\">\n                <sc-for list=\"{{ bStatuses }}\" as=\"o\" hint-placeholder-count=\"6\">\n                  <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n              <button sc-camel-on-click=\"{{ closeBuild }}\" aria-label=\"Close the document builder\" style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 8px 13px; min-height: 36px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">CLOSE ✕<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 10px; margin-top: 9px\">\n              <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">{{ bRef }}<\u002Fspan>\n              <span style=\"flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden\">\n                <span style=\"display: block; height: 100%; width: {{ bBarW }}; background: {{ bTone }}; border-radius: 3px; transition: width .3s ease\"><\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: {{ bTone }}\">{{ bProgress }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"scroller\" style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 16px\">\n            <sc-if value=\"{{ bHasWhy }}\">\n              <p style=\"margin: 0 0 14px; font-size: 12.5px; line-height: 1.65; color: var(--ink-2); background: var(--surface); border-left: 3px solid var(--accent-wash); border-radius: 2px; padding: 11px 13px; text-wrap: pretty\">{{ bWhy }}<\u002Fp>\n            <\u002Fsc-if>\n\n            <sc-for list=\"{{ bQs }}\" as=\"q\" hint-placeholder-count=\"6\">\n              <div style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid {{ q.edge }}; border-radius: 3px; padding: 13px; margin-bottom: 10px\">\n                <div style=\"display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin-bottom: 6px\">\n                  <span style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 800; color: var(--ink-3)\">{{ q.n }}<\u002Fspan>\n                  <span style=\"flex: 1; min-width: 200px; font-size: 13px; font-weight: 600; line-height: 1.45\">{{ q.q }}<\u002Fspan>\n                  <sc-if value=\"{{ q.live }}\">\n                    <span title=\"The tracker keeps this in step with the register\" style=\"font-family: var(--mono); font-size: 8.5px; font-weight: 700; letter-spacing: .09em; padding: 3px 6px; border-radius: 2px; background: var(--ok-wash); color: var(--ok)\">LIVE<\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ q.overridden }}\">\n                    <span style=\"display: inline-flex; gap: 6px; align-items: center\">\n                      <span style=\"font-family: var(--mono); font-size: 8.5px; font-weight: 700; letter-spacing: .09em; padding: 3px 6px; border-radius: 2px; border: 1px solid var(--accent); color: var(--accent)\">YOURS<\u002Fspan>\n                      <button sc-camel-on-click=\"{{ q.handBack }}\" title=\"Let the tracker keep this in step again\" style=\"font-family: var(--mono); font-size: 9px; padding: 4px 7px; min-height: 28px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer\">HAND BACK<\u002Fbutton>\n                    <\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <sc-if value=\"{{ q.hasHint }}\">\n                  <p style=\"margin: 0 0 8px; font-size: 11.5px; line-height: 1.6; color: var(--ink-3); text-wrap: pretty\">{{ q.hint }}<\u002Fp>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ q.isText }}\">\n                  <input type=\"text\" value=\"{{ q.v }}\" sc-camel-on-change=\"{{ q.set }}\" placeholder=\"{{ q.ph }}\" aria-label=\"{{ q.q }}\" style=\"width: 100%; min-height: 38px\">\n                <\u002Fsc-if>\n                <sc-if value=\"{{ q.isSelect }}\">\n                  <sc-raw-select value=\"{{ q.v }}\" sc-camel-on-change=\"{{ q.set }}\" aria-label=\"{{ q.q }}\" style=\"width: 100%; min-height: 38px; font-size: 12px\">\n                    <option value=\"\">— choose —<\u002Foption>\n                    <sc-for list=\"{{ q.opts }}\" as=\"o\" hint-placeholder-count=\"3\">\n                      <option value=\"{{ o.o }}\">{{ o.o }}<\u002Foption>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ q.isArea }}\">\n                  <textarea value=\"{{ q.v }}\" sc-camel-on-change=\"{{ q.set }}\" rows=\"3\" placeholder=\"{{ q.ph }}\" aria-label=\"{{ q.q }}\" style=\"width: 100%; resize: vertical; line-height: 1.6\"><\u002Ftextarea>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ q.isList }}\">\n                  <textarea value=\"{{ q.v }}\" sc-camel-on-change=\"{{ q.set }}\" rows=\"4\" placeholder=\"{{ q.ph }}\" aria-label=\"{{ q.q }} — one per line\" style=\"width: 100%; resize: vertical; line-height: 1.6\"><\u002Ftextarea>\n                <\u002Fsc-if>\n                <div style=\"display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 9px\">\n                  <button sc-camel-on-click=\"{{ q.draft }}\" disabled=\"{{ q.busy }}\" title=\"{{ q.draftTitle }}\" style=\"display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; white-space: nowrap; padding: 6px 10px; min-height: 30px; border: 1px solid var(--accent); border-radius: 2px; background: var(--surface); color: var(--accent); cursor: pointer\"><span aria-hidden=\"true\">✻<\u002Fspan>{{ q.draftLabel }}<\u002Fbutton>\n                  <sc-if value=\"{{ q.canUndo }}\">\n                    <button sc-camel-on-click=\"{{ q.undo }}\" title=\"Put back what was there before the draft\" style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; padding: 6px 10px; min-height: 30px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer\">UNDO<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ q.busy }}\">\n                    <span class=\"busy\" style=\"font-family: var(--mono); font-size: 10px; padding: 5px 9px; border-radius: 2px; color: var(--ink-2)\">drafting…<\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ q.aiDrafted }}\">\n                    <span title=\"Drafted by the assistant, then kept by you\" style=\"font-family: var(--mono); font-size: 8.5px; font-weight: 700; letter-spacing: .09em; padding: 3px 6px; border-radius: 2px; background: var(--info-wash); color: var(--info)\">AI DRAFT<\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ q.hasErr }}\">\n                    <span style=\"font-size: 11px; color: var(--danger); line-height: 1.5\">{{ q.err }}<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px\">\n              <button sc-camel-on-click=\"{{ fillEmpty }}\" disabled=\"{{ bFilling }}\" title=\"Draft every field that is still empty, one call each, and show each result here for review\" style=\"display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: var(--info-fill); color: var(--on-fill); cursor: pointer\"><span aria-hidden=\"true\">✻<\u002Fspan>{{ fillEmptyLabel }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ toggleBPreview }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: var(--solid); color: var(--on-fill); cursor: pointer\">{{ bPreviewLabel }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ copyDoc }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">COPY MARKDOWN<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ downloadWord }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: var(--accent-fill); color: var(--on-fill); cursor: pointer\">DOWNLOAD WORD<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ downloadDoc }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">MARKDOWN<\u002Fbutton>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ bPreviewOpen }}\">\n              <pre style=\"margin: 14px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px; font-family: var(--mono); font-size: 11.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; color: var(--ink); max-height: 60vh; overflow: auto\">{{ bRendered }}<\u002Fpre>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n px 6px; border-radius: 3px; background: {{ n.fill }}; border: 1px solid {{ n.stroke }}; color: {{ n.fg }}; font-size: {{ n.fs }}; font-weight: {{ n.fw }}; line-height: 1.2; overflow: hidden; text-wrap: pretty\">{{ n.t }}<\u002Fdiv>\n                        <\u002Fsc-for>\n                        <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"12\">\n                          <button sc-camel-on-click=\"{{ c.go }}\" title=\"{{ c.title }}\" style=\"position: absolute; left: {{ c.left }}; top: {{ c.top }}; width: {{ c.wpx }}; min-height: {{ c.hpx }}; box-sizing: border-box; display: flex; align-items: center; text-align: left; padding: 3px 7px 3px 9px; border-radius: 3px; background: {{ c.fill }}; border: 1px solid {{ c.stroke }}; box-shadow: inset 3px 0 0 {{ c.edge }}; color: {{ c.fg }}; font-family: var(--sans); font-size: {{ c.fs }}; line-height: 1.2; cursor: pointer; overflow: hidden; transition: transform .13s cubic-bezier(.2,.7,.3,1), box-shadow .16s ease, border-color .16s ease\" style-hover=\"border-color: var(--accent); transform: translateY(-1px); z-index: 4\">{{ c.t }}<\u002Fbutton>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;startTab&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Overview&quot;, &quot;Plan&quot;, &quot;Documents&quot;, &quot;Clauses 4–10&quot;, &quot;Risk register&quot;, &quot;Annex A / SoA&quot;], &quot;default&quot;: &quot;Overview&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Behaviour&quot; },\n  &quot;dataSource&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Saved tracker&quot;, &quot;Seed example&quot;], &quot;default&quot;: &quot;Saved tracker&quot;, &quot;ts
