e copy.\" });\n        } catch (e) { this.setState({ syncMsg: \"Could not read that code: \" + String(e.message || e).slice(0, 120) }); }\n      },\n\n      /* One section at a time. The rail owns navigation, the pane owns exactly\n         one job, and the slide is what tells you which direction you moved —\n         eight stacked panels behind one scrollbar is what made this a hunt. */\n      setNav: SET_SECS.map(([id, label], i) => ({\n        id, label,\n        n: String(i + 1).padStart(2, \"0\"),\n        aria: setAt === i ? \"true\" : \"false\",\n        bg: setAt === i ? \"var(--surface)\" : \"transparent\",\n        fg: setAt === i ? \"var(--accent)\" : \"var(--ink-2)\",\n        weight: setAt === i ? 700 : 600,\n        go: () => this.goSetSec(id),\n      })),\n      setPipTop: `${12 + setAt * 37}px`,\n      setCount: SET_WORDS[SET_SECS.length] || String(SET_SECS.length),\n      setIsProject: setSec === \"set-project\",\n      setIsVault: setSec === \"set-vault\",\n      setIsProfile: setSec === \"set-profile\",\n      setIsKey: setSec === \"set-key\",\n      /* Reading a document belongs to the profile: it is the same seven answers\n         arriving from a file instead of from the keyboard. */\n      setIsImport: setSec === \"set-profile\",\n      setIsData: setSec === \"set-data\",\n      setIsSync: setSec === \"set-sync\",\n      setEyebrow: (SET_SECS[setAt] || [])[2] || \"\",\n      setBlurb: (SET_SECS[setAt] || [])[3] || \"\",\n      setPos: `${setAt + 1} of ${SET_SECS.length}`,\n      /* Mounted at an offset, released on the next frame: one slide, not a swap. */\n      setSlide: this.state.setEnter ? `translateX(${(this.state.setDir || 1) * 30}px)` : \"none\",\n      setFade: this.state.setEnter ? 0 : 1,\n      setAtFirst: setAt <= 0,\n      setAtLast: setAt >= SET_SECS.length - 1,\n      setPrevOpacity: setAt <= 0 ? 0.35 : 1,\n      setNextOpacity: setAt >= SET_SECS.length - 1 ? 0.35 : 1,\n      setPrevLabel: setAt > 0 ? SET_SECS[setAt - 1][1] : \"Start\",\n      setNextLabel: setAt < SET_SECS.length - 1 ? SET_SECS[setAt + 1][1] : \"End\",\n      setPrev: () => { if (setAt > 0) this.goSetSec(SET_SECS[setAt - 1][0]); },\n      setNext: () => { if (setAt < SET_SECS.length - 1) this.goSetSec(SET_SECS[setAt + 1][0]); },\n\n      overrides, overrideCount: overrides.length,\n      hasOverrides: overrides.length > 0, noOverrides: overrides.length === 0,\n      handBackAll: () => { if (confirm(`Hand all ${overrides.length} decisions back to the engine? Your typed text stays; only the overrides are cleared.`)) this.up(s => { s.manual = {}; }); },\n\n\n      backup: () => {\n        const a = document.createElement(\"a\");\n        a.href = URL.createObjectURL(new Blob([JSON.stringify(st, null, 2)], { type: \"application/json\" }));\n        a.download = `isms-tracker-${st.start}.json`; a.click(); URL.revokeObjectURL(a.href);\n      },\n      restore: (e) => {\n        const f = e.target.files && e.target.files[0];\n        e.target.value = \"\";\n        if (!f) return;\n        const r = new FileReader();\n        r.onload = () => {\n          try {\n            const next = this.propagate(this.state.core, hydrate(JSON.parse(r.result)));\n            this.setState({ st: next }, () => this.persist(next));\n            this.say(\"Backup restored.\");\n          } catch (err) { this.say(\"That file is not a tracker backup.\"); }\n        };\n        r.readAsText(f);\n      },\n      /* A new project starts with an empty risk register — clause 6.1.2 asks what\n         THIS organisation faces, and inherited rows are somebody else's answer. */\n      newProject: () => {\n        if (!confirm(\"Start a new project? This clears every status, answer and risk in this browser. Download a backup first if you want to keep it.\")) return;\n        const fresh = this.propagate(this.state.core, hydrate(defaultState()));\n        fresh.risks = [];\n        this.setState({ st: fresh, tab: 0 }, () => this.persist(fresh));\n        this.say(\"New project started. The risk register is empty.\");\n      },\n      /* AI key. Optional: with no key the built-in model is used, so nothing\n         here is a precondition for the import working. A key is a thing you\n         paste, check and save — so it is typed into a draft and committed on\n         SAVE rather than written to storage on every keystroke. */\n      aiKey: this.state.keyDraft == null ? ((this.state.cfg || {}).anthropicKey || \"\") : this.state.keyDraft,\n      setAiKey: (e) => this.setState({ keyDraft: e.target.value }),\n      saveAiKey: () => {\n        const v = String(this.state.keyDraft == null ? ((this.state.cfg || {}).anthropicKey || \"\") : this.state.keyDraft).trim();\n        this.upCfg({ anthropicKey: v });\n        this.setState({ keyDraft: null });\n        this.say(v ? \"API key saved in this browser.\" : \"API key cleared — the built-in model will be used.\");\n      },\n      /* SAVED is a claim about storage, so it is only made when something is in\n         there and the field matches it. */\n      keySaveLabel: (() => {\n        const saved = (this.state.cfg || {}).anthropicKey || \"\";\n        const shown = this.state.keyDraft == null ? saved : this.state.keyDraft;\n        return (saved && shown === saved) ? \"SAVED\" : \"SAVE KEY\";\n      })(),\n      keySaveTone: (() => {\n        const saved = (this.state.cfg || {}).anthropicKey || \"\";\n        const shown = this.state.keyDraft == null ? saved : this.state.keyDraft;\n        return (saved && shown === saved) ? \"var(--solid)\" : \"var(--accent-fill)\";\n      })(),\n      clearAiKey: () => { this.upCfg({ anthropicKey: \"\" }); this.setState({ keyDraft: \"\" }); },\n      keyState: (this.state.cfg || {}).anthropicKey ? \"Your key — calls go straight to Anthropic from this browser and is stored only here, outside the project data.\" : \"No key saved — the built-in model is used.\",\n      keyTone: (this.state.cfg || {}).anthropicKey ? \"var(--ok)\" : \"var(--ink-3)\",\n\n      /* Organisation document import. */\n      impBusy: this.state.imp.busy, isImpBusy: !!this.state.imp.busy,\n      impErr: this.state.imp.err, hasImpErr: !!this.state.imp.err,\n      impSrc: this.state.imp.src ? `${this.state.imp.src.name} · read as ${this.state.imp.src.kind}` : \"\",\n      hasImpSrc: !!this.state.imp.src,\n      pickDoc: (e) => { const f = e.target.files && e.target.files[0]; e.target.value = \"\"; if (f) this.runImport(f); },\n      pasteDoc: (e) => { const v = e.target.value; this.setState(s => ({ imp: { ...s.imp, paste: v } })); },\n      pasteVal: this.state.imp.paste || \"\",\n      readPaste: () => { const t = this.state.imp.paste; if (t && t.trim()) this.runImport(t); },\n      hasFound: !!this.state.imp.found,\n      foundRows: (() => {\n        const f = this.state.imp.found; if (!f) return [];\n        const rows = [\n          [\"company\", \"Organisation name\", f.company ? [f.company] : []],\n          [\"external\", \"External issues · 4.1\", f.external],\n          [\"internal\", \"Internal issues · 4.1\", f.internal],\n          [\"climate\", \"Climate relevance · 4.1\", f.climate ? [f.climate] : []],\n          [\"parties\", \"Interested parties · 4.2\", (f.parties || []).map(p => `${p.party} — ${p.needs}`)],\n          [\"locations\", \"Locations · 4.3\", f.locations],\n          [\"systems\", \"Systems · 4.3\", f.systems],\n          [\"inScope\", \"In scope · 4.3\", f.inScope],\n          [\"outScope\", \"Out of scope · 4.3\", f.outScope],\n        ];\n        return rows.filter(r => r[2] && r[2].length).map(([k, label, items]) => ({\n          k, label, count: `${items.length}`, items: items.slice(0, 6).map(t => ({ t })),\n          more: items.length > 6 ? `+${items.length - 6} more` : \"\", hasMore: items.length > 6,\n          on: this.state.imp.pick[k] !== false,\n          bg: this.state.imp.pick[k] !== false ? \"var(--solid)\" : \"var(--surface)\",\n          fg: this.state.imp.pick[k] !== false ? \"var(--on-fill)\" : \"var(--ink-2)\",\n          toggle: () => this.setState(s => ({ imp: { ...s.imp, pick: { ...s.imp.pick, [k]: s.imp.pick[k] === false } } })),\n        }));\n      })(),\n      applyFound: () => this.applyImport(),\n      discardFound: () => this.setState({ imp: { busy: \"\", err: \"\", src: null, found: null, pick: {} } }),\n\n      notPorted: [],\n    };\n  }\n\n  /* Organisation profile import. Reads a company document — the HTML export, a\n     PDF, a pasted extract — and proposes answers for the clause 4.1–4.3 fields.\n     It never writes silently: everything found is shown first, each group is\n     opt-in, and applying only touches fields you ticked. */\n  async runImport(input) {\n    const { readProfile, PROFILE_SYSTEM, parseProfileReply, askAllowingCut } = this.state.core;\n    this.setState(s => ({ imp: { ...s.imp, busy: \"reading\", err: \"\", found: null } }));\n    try {\n      const content = input instanceof File ? await readProfile(input)\n        : { name: \"pasted text\", kind: \"text\", text: String(input || \"\") };\n      if (!String(content.text || content.b64 || \"\").trim()) throw new Error(\"That file came through empty.\");\n      this.setState(s => ({ imp: { ...s.imp, busy: \"reading the organisation\", src: { name: content.name, kind: content.kind } } }));\n      const user = content.kind === \"pdf\"\n        ? [{ type: \"document\", source: { type: \"base64\", media_type: \"application/pdf\", data: content.b64 } },\n           { type: \"text\", text: \"Read this company profile and return the JSON object described.\" }]\n        : `Company profile:\\n\\n${content.text}\\n\\nReturn the JSON object described.`;\n      const { text: raw, partial } = await askAllowingCut({\n        system: PROFILE_SYSTEM, messages: [{ role: \"user\", content: user }],\n        apiKey: (this.state.cfg || {}).anthropicKey, maxTokens: 4000,\n      });\n      const p = (parseProfileReply(raw) || {}).data || {};\n      const arr = (x) => Array.isArray(x) ? x.filter(v => v != null) : [];\n      const str = (x, n) => String(x || \"\").slice(0, n);\n      const found = {\n        company: str(p.company, 120), summary: str(p.summary, 300), climate: str(p.climate, 300),\n        external: arr(p.external).map(x => str(x, 200)).slice(0, 12),\n        internal: arr(p.internal).map(x => str(x, 200)).slice(0, 12),\n        parties: arr(p.parties).map(x => ({ party: str((x || {}).party, 80), needs: str((x || {}).needs, 200) })).filter(x => x.party).slice(0, 15),\n        locations: arr(p.locations).map(x => str(x, 160)).slice(0, 20),\n        systems: arr(p.systems).map(x => str(x, 200)).slice(0, 20),\n        inScope: arr(p.inScope).map(x => str(x, 160)).slice(0, 15),\n        outScope: arr(p.outScope).map(x => str(x, 200)).slice(0, 15),\n      };\n      const total = found.external.length + found.internal.length + found.parties.length\n        + found.locations.length + found.systems.length + found.inScope.length + found.outScope.length;\n      if (!total) throw new Error(\"Nothing usable came back. The document may not describe the organisation in terms clauses 4.1 to 4.3 can use — try pasting the relevant sections instead.\");\n      this.setState({ imp: {\n        busy: \"\", src: { name: content.name, kind: content.kind }, found,\n        err: partial ? \"The reply was cut short, so this is a partial reading. Everything shown was read cleanly and is safe to apply; run it again on a shorter extract to pick up the rest.\" : \"\",\n        pick: { company: true, external: true, internal: true, climate: true, parties: true, locations: true, systems: true, inScope: true, outScope: true },\n      } });\n    } catch (e) {\n      const noKey = !(this.state.cfg || {}).anthropicKey;\n      this.setState(s => ({ imp: { ...s.imp, busy: \"\", found: null,\n        err: String(e.message || \"Could not read that document\").slice(0, 320)\n          + (noKey ? \" (read using the built-in model — saving your own Anthropic key below usually reads longer documents more reliably)\" : \"\") } }));\n    }\n  }\n\n  applyImport() {\n    const { profileToAnswers } = this.state.core;\n    const { found, pick } = this.state.imp;\n    if (!found) return;\n    const ans = profileToAnswers(found) || {};\n    const on = {\n      threats: pick.external, external: pick.external, weaknesses: pick.internal,\n      internal: pick.internal, climate: pick.climate, parties: pick.parties,\n      locations: pick.locations, systems: pick.systems, inScope: pick.inScope, outScope: pick.outScope,\n    };\n    this.up(s => {\n      if (pick.company && found.company) s.project.company = found.company;\n      Object.keys(ans).forEach(doc => {\n        s.answers[doc] = s.answers[doc] || {};\n        Object.keys(ans[doc]).forEach(q => {\n          if (on[q] === false) return;\n          s.answers[doc][q] = ans[doc][q];\n        });\n      });\n    });\n    this.setState({ imp: { busy: \"\", err: \"\", src: null, found: null, pick: {} } });\n    this.say(\"Organisation profile applied. The document builder fields it filled are marked as yours.\");\n  }\n\n  /* The document builder. One pane per document: its own questions, the fields the\n     engine already knows, and the rendered document. Fields the tracker derives\n     are shown filled and marked LIVE — they move when the register moves, so\n     typing over one is a decision, not a correction, and it is recorded as yours. */\n  buildPane() {\n    const { DOCS, DOC_FORMS, renderTemplate, buildTemplate, liveAnswers, isLiveField,\n      docProgress, DOC_STATUSES, STATUS_COLOR } = this.state.core;\n    const st = this.state.st;\n    const doc = DOCS.find(d => d.id === this.state.buildId);\n    if (!doc) return {};\n    const form = DOC_FORMS[doc.id] || {};\n    const qs = form.qs || doc.qs || [];\n    const stored = st.answers[doc.id] || {};\n    const answers = liveAnswers({ ...doc, qs }, st, stored);\n    const pr = docProgress({ ...doc, qs }, answers);\n    const rec = st.docs[doc.id] || {};\n\n    const meta = {\n      id: doc.id, name: doc.name, ref: doc.ref,\n      company: st.project.company || \"the organisation\",\n      version: rec.ver || \"0.1 draft\",\n      date: new Date().toISOString().slice(0, 10),\n      scope: this.state.core.ismsScope(st),\n    };\n    const tpl = form.tpl || doc.tpl;\n    let rendered = \"\";\n    try {\n      rendered = tpl ? renderTemplate({ ...doc, tpl }, answers, meta)\n        : buildTemplate(doc, meta.company);\n    } catch (e) { rendered = \"This document's template could not be rendered: \" + e.message; }\n\n    return {\n      buildOpen: true,\n      bId: doc.id, bName: doc.name, bRef: doc.ref, bWhy: doc.why || \"\",\n      bHasWhy: !!doc.why,\n      bProgress: `${pr.filled} of ${pr.total} answered`,\n      bPct: `${Math.round(pr.pct * 100)}%`,\n      bBarW: `${Math.round(pr.pct * 100)}%`,\n      bTone: pr.pct === 1 ? \"var(--ok)\" : pr.pct > 0 ? \"var(--warn)\" : \"var(--ink-3)\",\n      bStatus: rec.s, bStatuses: DOC_STATUSES,\n      bStatusTone: STATUS_COLOR[rec.s] || \"var(--ink-3)\",\n      setBStatus: (e) => { const v = e.target.value; this.up(s => { s.docs[doc.id].s = v; }); },\n      closeBuild: () => this.setState({ buildId: null }),\n\n      bQs: qs.map((q, i) => {\n        const live = isLiveField(st, doc.id, q.id);\n        const v = answers[q.id] == null ? \"\" : String(answers[q.id]);\n        const set = (e) => {\n          const val = e.target.value;\n          this.upMan(\"field\", `${doc.id}:${q.id}`, s => {\n            s.answers[doc.id] = { ...(s.answers[doc.id] || {}), [q.id]: val };\n          });\n        };\n        return {\n          key: q.id, n: String(i + 1), q: q.q, hint: q.h || \"\", hasHint: !!q.h,\n          ph: q.p || \"\", v, live, notLive: !live,\n          filled: !!String(v).trim(),\n          edge: String(v).trim() ? (live ? \"var(--ok)\" : \"var(--accent)\") : \"var(--line-2)\",\n          isList: q.k === \"list\", isArea: q.k === \"area\", isTe ld\", `${doc.id}:${q.id}`),\n        };\n      }),\n\n      bRendered: rendered,\n      bFilling: !!this.state.bFilling,\n      fillEmptyLabel: this.state.bFilling ? \"DRAFTING…\" : \"AI: FILL EVERY EMPTY FIELD\",\n      fillEmpty: () => this.fillEmptyFields(doc.id),\n      copyDoc: () => {\n        navigator.clipboard && navigator.clipboard.writeText(rendered);\n        this.say(`${doc.id} copied as Markdown.`);\n      },\n      downloadWord: () => {\n        try { this.saveBlob(this.state.core.docxFrom(rendered, doc.name), `${doc.id} ${doc.name}.docx`); }\n        catch (e) { this.say(\"Word export failed: \" + e.message); }\n      },\n      downloadDoc: () => {\n        const a = document.createElement(\"a\");\n        a.href = URL.createObjectURL(new Blob([rendered], { type: \"text/markdown;charset=utf-8\" }));\n        a.download = `${doc.id} ${doc.name}.md`.replace(/[\\\\/:*?\"<>|]/g, \"-\");\n        a.click(); URL.revokeObjectURL(a.href);\n      },\n      /* Alt+Left and Alt+Right walk the builder's own fields. Moving focus\n         rather than paging a wizard keeps one behaviour for mouse and keyboard. */\n      bFieldCount: qs.length,\n      bPreviewOpen: this.state.previewOpen,\n      toggleBPreview: () => this.setState(s => ({ previewOpen: !s.previewOpen })),\n      bPreviewLabel: this.state.previewOpen ? \"HIDE THE DOCUMENT\" : \"SHOW THE DOCUMENT\",\n    };\n  }\n\n  /* Documents, second view: one row per deliverable across every phase. The\n     phase register answers \"what do I build next\"; this answers \"what does the\n     standard actually oblige me to hold\", which is a different question and the\n     one an auditor opens with. */\n  registerPane() {\n    const { DELIVERABLES, deliverableTree, delState, DEL_CATS, DEL_CAT_COLOR,\n      STATUS_COLOR, csv, xlsxFrom } = this.state.core;\n    const st = this.state.st;\n    const { regQ, regCat, regClosed } = this.state;\n    const q = regQ.trim().toLowerCase();\n    const pass = (d) => (regCat === \"All\" || d.cat === regCat)\n      && (!q || (d.name + \" \" + (d.cites || []).join(\" \")).toLowerCase().includes(q));\n\n    const groups = deliverableTree(DELIVERABLES).map(g => {\n      const items = (g.items || []).filter(pass);\n      const open = (q || regCat !== \"All\") ? true : regClosed[g.key] !== true;\n      return {\n        key: g.key, label: g.label, kind: g.kind, open,\n        glyph: open ? \"−\" : \"+\", ariaOpen: open ? \"true\" : \"false\",\n        meta: `${(g.items || []).length} deliverables`,\n        toggle: () => this.setState(s => ({ regClosed: { ...s.regClosed, [g.key]: open } })),\n        rows: open ? items.map(d => {\n          const link = delState(st, d);\n          return {\n            key: String(d.id), name: d.name, cat: d.cat, typ: d.typ,\n            catTone: DEL_CAT_COLOR[d.cat] || \"var(--ink-3)\",\n            mandatory: d.typ === \"Mandatory\",\n            typLabel: String(d.typ || \"Additional\").toUpperCase(),\n            typBg: d.typ === \"Mandatory\" ? \"var(--danger-fill)\" : \"transparent\",\n            typFg: d.typ === \"Mandatory\" ? \"var(--on-fill)\" : \"var(--ink-3)\",\n            typEdge: d.typ === \"Mandatory\" ? \"var(--danger)\" : \"var(--line-2)\",\n            cites: (d.cites || []).join(\", \"),\n            docId: link.id || \"\", hasDoc: !!link.id,\n            status: link.s || \"\",\n            statusTone: STATUS_COLOR[link.s] || \"var(--ink-3)\",\n            go: () => link.id && this.setState({ docView: \"phases\", docQ: link.id, docNote: `Jumped to ${link.id} from the deliverable register.` }),\n          };\n        }) : [],\n      };\n    }).filter(g => g.rows.length || (regCat === \"All\" && !q));\n\n    const flat = DELIVERABLES.filter(pass);\n    const head = [\"Deliverable\", \"Category\", \"Obligation\", \"Cites\", \"Tracked as\", \"Status\"];\n    const body = () => flat.map(d => {\n      const l = delState(st, d);\n      return [d.name, d.cat, d.typ, (d.cites || []).join(\" \"), l.i > {\n      const mx = x1 + (x2 - x1) / 2;\n      return `M ${x1} ${y1} H ${mx} V ${y2} H ${x2}`;\n    };\n    /* One chip per catalogue document. Four states, four hues: approved is green,\n       needs-update is red, anything started is blue, untouched is plain — the\n       same five-colour scale the legend teaches. The mandatory ones carry an\n       accent bar on the left edge, so obligation reads without a second look. */\n    const chipOf = (docId, key, x, y) => {\n      const d = mindDoc(st, docId);\n      const tone = d.done ? \"var(--ok)\" : d.stale ? \"var(--danger)\" : d.started ? \"var(--info)\" : \"var(--line-2)\";\n      return {\n        key, x, y, w: 236, h: 24,\n        t: `${d.id} · ${d.name}`,\n        fill: d.done ? \"var(--ok-wash)\" : d.stale ? \"var(--danger-wash)\" : d.started ? \"var(--info-wash)\" : \"var(--surface)\",\n        stroke: tone,\n        fg: d.done ? \"var(--ok)\" : d.stale ? \"var(--danger)\" : \"var(--ink-2)\",\n        edge: d.mandatory ? \"var(--accent)\" : \"transparent\",\n        title: `${d.id} ${d.name} — ${d.status} · ${d.mandatory ? \"mandatory\" : \"optional\"} · clause ${d.ref}`\n          + (d.record ? ` · the standard calls this “${d.record}”` : \"\")\n          + \" — click to open it in the register\",\n        docId: d.id,\n        go: () => this.setState({ mapOpen: false, docView: \"phases\", docQ: d.id, docCat: \"All\", docNote: `Jumped to ${d.id} from the mind map.` }),\n      };\n    };\n    const clauseS = (id) => ((st.clauses || {})[id] || {}).s || null;\n\n    [\"R\", \"L\"].forEach(sideKey => {\n      const set = L[sideKey];\n      if (!set) return;\n      const top = -(set.height || 0) / 2;\n      const sg = sideKey === \"R\" ? 1 : -1;\n      (set.hubs || []).forEach(hub => {\n        const hy = top + hub.y, hx = box(sideKey, HUB_X, 74);\n        nodes.push({ key: sideKey + hub.id, kind: \"hub\", x: hx, y: hy - 13, w: 74, h: 26,\n          t: hub.id, fill: \"var(--solid)\", stroke: \"var(--ink)\", fg: \"var(--on-fill)\", weight: 700, size: 11 });\n        links.push({ key: \"l\" + sideKey + hub.id, d: elbow(sg * 92, 0, sideKey === \"R\" ? hx : hx + 74, hy) });\n\n        (hub.clauses || []).forEach(cl => {\n          const cy = top + cl.y, cx = box(sideKey, CL_X, 168);\n          nodes.push({ key: sideKey + \"c\" + cl.id, kind: \"clause\", x: cx, y: cy - 15, w: 168, h: 30,\n            t: `${cl.id}. ${cl.title}`, fill: \"var(--surface)\", stroke: \"var(--accent)\", fg: \"var(--ink)\", weight: 700, size: 10.5 });\n          links.push({ key: \"lc\" + sideKey + cl.id,\n            d: elbow(sideKey === \"R\" ? hx + 74 : hx, hy, sideKey === \"R\" ? cx : cx + 168, cy) });\n\n          (cl.kids || []).forEach(sc => {\n            const sy = top + sc.y, sx = box(sideKey, SUB_X, 196);\n            const s1 = sc.id ? clauseS(sc.id) : null;\n            nodes.push({ key: sideKey + \"s\" + sc.id, kind: \"sub\", x: sx, y: sy - 13, w: 196, h: 26,\n              t: `${sc.label} ${sc.title}`, fill: \"var(--subtle)\",\n              stroke: s1 ? (STATUS_COLOR[s1] || \"var(--line-2)\") : \"var(--line-2)\",\n              fg: \"var(--ink)\", weight: 500, size: 9.5 });\n            links.push({ key: \"ls\" + sideKey + sc.id,\n              d: elbow(sideKey === \"R\" ? cx + 168 : cx, cy, sideKey === \"R\" ? sx : sx + 196, sy) });\n\n            /* deeper sub-clauses (6.1.3, 7.5.2, 9.2.1 …) and the records filed\n               against them. Weighting each tail by its record count is what keeps\n               the record column from overlapping itself. */\n            const tails = [];\n            (sc.deeper || []).forEach(d => tails.push({ kind: \"deep\", id: d.id, t: `${d.id} ${d.title}`, recs: d.recs || [] }));\n            (sc.recs || []).forEach(r => tails.push({ kind: \"rec\", t: r, recs: [] }));\n            const weight = tails.map(tl => tl.kind === \"deep\" ? Math.max(1, tl.recs.length) : 1);\n            const totalRows = weight.reduce((a, b) => a + b, 0);\n            le : `${-92 - minX}px`, spineTop: `${-15 - minY}px`,\n      scale: `scale(${z})`,\n      frameW: `${Math.round(W * z)}px`, frameH: `${Math.round(H * z)}px`,\n      mapZoom: z,\n      setMapZoom: (e) => this.setState({ mapZoom: Number(e.target.value) }),\n      /* Coverage is asserted, not assumed: every document the filter asks for is\n         either on a clause branch or in the root group, and the readout says so. */\n      mapCounts: `${chips.length} of ${L.total} documents · ${chips.filter(c => c.fill === \"var(--ok-wash)\").length} approved`,\n      mapCoverage: chips.length >= L.total ? \"complete\" : `${L.total - chips.length} missing`,\n      mapCoverTone: chips.length >= L.total ? \"var(--ok)\" : \"var(--danger)\",\n      hasRootGroup: !!card,\n      rootLeft: card ? `${card.x - minX}px` : \"0px\",\n      rootTop: card ? `${card.y - minY}px` : \"0px\",\n      rootW: card ? `${card.w}px` : \"0px\",\n      rootH: card ? `${card.h}px` : \"0px\",\n      mapOnly: only,\n      mapAllBg: only ? \"var(--surface)\" : \"var(--solid)\",\n      mapAllFg: only ? \"var(--ink-2)\" : \"var(--on-fill)\",\n      mapMandBg: only ? \"var(--accent-fill)\" : \"var(--surface)\",\n      mapMandFg: only ? \"var(--on-fill)\" : \"var(--ink-2)\",\n      setMapAll: () => this.setState({ mapOnly: false }),\n      setMapMand: () => this.setState({ mapOnly: true }),\n      mapOpen: this.state.mapOpen,\n      /* The root sits in the middle of a canvas wider and taller than the pane,\n         so opening at 0,0 shows empty margin. Centre on the spine instead. */\n      openMap: () => { this.setState({ mapOpen: true, mapZoom: 0.8 }); this.centreMap(); },\n      fitMap: () => this.fitMap(),\n      centreMap: () => this.centreMap(),\n      /* A 2400px canvas in an 880px pane needs dragging, not just scrollbars.\n         Chips keep their click because a press that starts on one is ignored. */\n      mapPanStart: (e) => {\n        if (e.button !== 0) return;\n        if (e.target && e.target.closest && e.target.closest(\"button, input\")) return;\n        const el = e.currentTarget;\n        const x0 = e.clientX, y0 = e.clientY, l0 = el.scrollLeft, t0 = el.scrollTop;\n        el.style.cursor = \"grabbing\";\n        const move = (ev) => { el.scrollLeft = l0 - (ev.clientX - x0); el.scrollTop = t0 - (ev.clientY - y0); };\n        const up = () => {\n          el.style.cursor = \"\";\n          window.removeEventListener(\"mousemove\", move);\n          window.removeEventListener(\"mouseup\", up);\n        };\n        window.addEventListener(\"mousemove\", move);\n        window.addEventListener(\"mouseup\", up);\n        e.preventDefault();\n      },\n      closeMap: () => this.setState({ mapOpen: false }),\n      stopMap: (e) => e.stopPropagation(),\n    };\n  }\n\n  /* setState is async and the overlay mounts a frame or two later, so this polls\n     for the scroller instead of assuming it is already there. */\n  /* The whole map first, detail second: opening at 1:1 lands you inside one\n     branch with no idea where you are. Fit the canvas to the pane, then centre. */\n  fitMap() {\n    let tries = 0;\n    const go = () => {\n      const el = document.querySelector(\"[data-map-scroll]\");\n      const frame = el && el.firstElementChild;\n      if (el && frame && el.clientWidth > 40) {\n        const z = this.state.mapZoom || 1;\n        const raw = frame.offsetWidth / z;\n        const fit = Math.max(0.4, Math.min(1, Math.round(((el.clientWidth - 28) / raw) * 10) / 10));\n        if (fit !== z) this.setState({ mapZoom: fit });\n        this.centreMap();\n        return;\n      }\n      if (++tries < 30) setTimeout(go, 16);\n    };\n    setTimeout(go, 0);\n  }\n\n  centreMap() {\n    let tries = 0;\n    const go = () => {\n      const el = document.querySelector(\"[data-map-scroll]\");\n      if (el && el.scrollWidth > el.clientWidth) {\n        /* Centre on the root, not on the canvas: the two halves of the cycle are\n           different heights, so the b Array(16))));\n      const key = await deriveKey(pass, salt);\n      const secret = this.state.vaultTotp || \"\";\n      if (secret && !(await totpValid(secret, code))) throw new Error(\"That code does not match the authenticator. Check it and try again.\");\n      const blob = await seal(key, this.state.st);\n      localStorage.setItem(VAULT_KEY, JSON.stringify({ salt, totp: secret || \"\" }));\n      localStorage.setItem(KEY, JSON.stringify({ __enc: true, ...blob }));\n      this.vaultKey = key;\n      await this.state.core.saveSession(key, Number((this.state.cfg || {}).idleMins));\n      this.setState({ vaultBusy: false, vaultPass: \"\", vaultPass2: \"\", vaultCode: \"\", locked: false, hasVault: true });\n      this.say(\"Vault on. This browser's copy is now encrypted.\");\n    } catch (e) {\n      this.setState({ vaultBusy: false, vaultErr: String(e.message || e).slice(0, 240) });\n    }\n  }\n\n  /* Appearance is a preference, not project data: it lives under its own key so\n     it survives a reset, works before the vault is unlocked, and never travels\n     in a backup or a cloud push. */\n  toggleTheme() {\n    const next = this.state.theme === \"dark\" ? \"light\" : \"dark\";\n    try { localStorage.setItem(\"isms-theme\", next); } catch (e) { /* private mode */ }\n    document.documentElement.setAttribute(\"data-theme\", next);\n    this.setState({ theme: next });\n  }\n\n  /* Called after every successful local write. */\n  autoPush() {\n    const c = this.state.cfg || {};\n    if (!c.autoSync || !c.jbKey || !c.jbId) return;\n    if (this.autoPulling) return;\n    if (this.state.locked) return;\n    clearTimeout(this.autoTimer);\n    this.autoTimer = setTimeout(() => {\n      if (this.syncing) { this.autoQueued = true; return; }\n      this.syncing = true;\n      this.syncPush().catch(() => {}).then(() => {\n        this.syncing = false;\n        if (this.autoQueued) { this.autoQueued = false; this.autoPush(); }\n      });\n    }, 4000);\n  }\n\n  /* Returns true only if the file actually left, because archive-and-start\n     clears the browser on the strength of that answer. */\n  downloadArchive() {\n    try {\n      const st = this.state.st;\n      const m = this.metrics(this.schedule());\n      const org = (st.project.company || \"organisation\").replace(/[^A-Za-z0-9]+/g, \"-\").replace(/^-|-$/g, \"\").toLowerCase();\n      const stamp = new Date().toISOString().slice(0, 10);\n      const archive = {\n        kind: \"isms-archive\", v: 1, archivedAt: new Date().toISOString(),\n        organisation: st.project.company || \"\", projectManager: st.project.pm || \"\",\n        readiness: {\n          mandatoryOutstanding: m.mandOut, unjustifiedExclusions: m.noWhy,\n          risksAboveAppetite: m.outside, clausesVerified: m.clVer, clausesApplicable: m.clApp,\n        },\n        st,\n      };\n      const a = document.createElement(\"a\");\n      a.href = URL.createObjectURL(new Blob([JSON.stringify(archive, null, 2)], { type: \"application/json\" }));\n      a.download = `isms-archive-${org}-${stamp}.json`;\n      a.click(); URL.revokeObjectURL(a.href);\n      return true;\n    } catch (e) {\n      this.say(\"Could not build the archive: \" + String(e.message || e).slice(0, 120));\n      return false;\n    }\n  }\n\n  async testConnection() {\n    const { jbPull } = this.state.core;\n    const cfg = this.state.cfg || {};\n    if (!cfg.jbKey) { this.setState({ syncMsg: \"Add your jsonbin master key first.\" }); return; }\n    if (!cfg.jbId) { this.setState({ syncMsg: \"No bin id yet. Push once to create one, or paste a connection code.\" }); return; }\n    this.setState({ syncBusy: true, syncMsg: \"\" });\n    try {\n      const raw = await jbPull(cfg.jbKey, cfg.jbId);\n      const enc = !!(raw && raw.enc);\n      this.setState({ syncBusy: false, syncMsg:\n        `Connection works. The bin holds ${enc ? \"an encrypted\" : \"a plaintext\"} copy${enc && !this.vaultKey ? \", which this browser cannot read until the vault is unlocked\" : \"\"}. Nothing was changed.` });\n    } catch (e) {\n      this.setState({ syncBusy: false, syncMsg: \"Connection failed: \" + String(e.message || e).slice(0, 200) });\n    }\n  }\n\n  /* One backup path, so the shortcut and the button cannot drift apart. */\n  backupNow() {\n    try {\n      const a = document.createElement(\"a\");\n      a.href = URL.createObjectURL(new Blob([JSON.stringify(this.state.st, null, 2)], { type: \"application/json\" }));\n      a.download = `isms-backup-${new Date().toISOString().slice(0, 10)}.json`;\n      a.click(); URL.revokeObjectURL(a.href);\n      this.say(\"Backup downloaded.\");\n    } catch (e) { this.say(\"Could not build the backup: \" + String(e.message || e).slice(0, 120)); }\n  }\n\n  /* Reload inside the idle window: the exported key is still in sessionStorage,\n     so unseal with it and open. Any failure falls through to the lock screen\n     rather than guessing — a stale key is discarded, never retried. */\n  async resumeSession() {\n    const { loadSession, dropSession, unseal, hydrate, KEY } = this.state.core;\n    try {\n      const key = await loadSession();\n      if (!key) { this.setState({ resuming: false }); return; }\n      const blob = JSON.parse(localStorage.getItem(KEY) || \"null\");\n      if (!blob || !blob.__enc) { dropSession(); this.setState({ resuming: false }); return; }\n      const data = await unseal(key, blob);\n      this.vaultKey = key;\n      this.setState({\n        locked: false, encrypted: true, vaultPass: \"\", vaultCode: \"\", vaultErr: \"\",\n        st: this.propagate(this.state.core, hydrate(data)),\n        resuming: false,\n      }, () => this.say(\"Unlocked for this tab — the session had not timed out.\"));\n    } catch (e) { this.state.core.dropSession(); this.setState({ resuming: false }); }\n  }\n\n  /* Activity extends the window. Throttled to once a minute: the point is to\n     avoid locking someone out mid-task, not to rewrite storage on every keypress. */\n  bindIdle() {\n    if (this.idleOn) return;\n    this.idleOn = () => {\n      const now = Date.now();\n      if (this.lastTouch && now - this.lastTouch < 60000) return;\n      this.lastTouch = now;\n      const mins = Number((this.state.cfg || {}).idleMins);\n      if (mins) this.state.core.touchSession(mins);\n    };\n    [\"pointerdown\", \"keydown\"].forEach(t => window.addEventListener(t, this.idleOn, { passive: true }));\n  }\n\n  async unlockVault(pass, code) {\n    const { deriveKey, unseal, VAULT_KEY, KEY, totpValid, hydrate } = this.state.core;\n    this.setState({ vaultBusy: true, vaultErr: \"\" });\n    try {\n      const meta = JSON.parse(localStorage.getItem(VAULT_KEY) || \"{}\");\n      if (meta.totp && !(await totpValid(meta.totp, code))) throw new Error(\"That authenticator code is not valid right now.\");\n      const key = await deriveKey(pass, meta.salt);\n      const blob = JSON.parse(localStorage.getItem(KEY) || \"{}\");\n      const data = await unseal(key, blob);\n      this.vaultKey = key;\n      await this.state.core.saveSession(key, Number((this.state.cfg || {}).idleMins));\n      const st = this.propagate(this.state.core, hydrate(data));\n      this.setState({ vaultBusy: false, locked: false, encrypted: true, st, vaultPass: \"\", vaultCode: \"\" });\n    } catch (e) {\n      this.setState({ vaultBusy: false, vaultErr: \"That passphrase did not open the vault.\" });\n    }\n  }\n\n  async removeVault() {\n    const { VAULT_KEY, KEY } = this.state.core;\n    if (!confirm(\"Turn the vault off? Browser storage goes back to plain JSON on this machine.\")) return;\n    try {\n      localStorage.removeItem(VAULT_KEY);\n      localStorage.setItem(KEY, JSON.stringify(this.state.st));\n      this.state.core.dropSession();\n    } catch (e) { /* quota */ }\n    this.vaultKey = null;\n    this.setState({ hasVault: false });\n    this.say(\"Vault off. This browser's copy is plain JSON again.\");\n  }\n\n  /* Cloud sync. The state object is sealed with the vault key before it leaves,\n     so jsonbin holds ciphertext it cannot read. Attachments live under their own\n     key and are never part of this payload. */\n  async syncPush() {\n    const { jbPush, jbCreate, seal, SYNC_V } = this.state.core;\n    const cfg = this.state.cfg || {};\n    this.setState({ syncBusy: true, syncMsg: \"\" });\n    try {\n      if (!cfg.jbKey) throw new Error(\"Add your jsonbin master key first.\");\n      const payload = this.vaultKey\n        ? { v: SYNC_V, enc: true, ...(await seal(this.vaultKey, this.state.st)) }\n        : { v: SYNC_V, enc: false, st: this.state.st };\n      let id = cfg.jbId;\n      if (!id) { id = await jbCreate(cfg.jbKey, payload); this.upCfg({ jbId: id }); }\n      else await jbPush(cfg.jbKey, id, payload);\n      this.upCfg({ lastSync: new Date().toISOString() });\n      this.setState({ syncBusy: false, syncMsg: this.vaultKey\n        ? \"Pushed, encrypted with your vault passphrase.\"\n        : \"Pushed. No vault is on, so this copy is readable by anyone with the key — turn the vault on first if that matters.\" });\n    } catch (e) { this.setState({ syncBusy: false, syncMsg: \"Push failed: \" + String(e.message || e).slice(0, 200) }); }\n  }\n\n  async syncPull() {\n    const { jbPull, unseal, hydrate } = this.state.core;\n    const cfg = this.state.cfg || {};\n    this.setState({ syncBusy: true, syncMsg: \"\" });\n    try {\n      if (!cfg.jbKey || !cfg.jbId) throw new Error(\"Add your jsonbin key and bin id first.\");\n      if (!confirm(\"Pull replaces this browser's project with the cloud copy. Download a backup first if you are unsure.\")) {\n        this.setState({ syncBusy: false }); return;\n      }\n      const raw = await jbPull(cfg.jbKey, cfg.jbId);\n      let data = raw && raw.enc ? await unseal(this.vaultKey, raw) : (raw && raw.st ? raw.st : raw);\n      if (raw && raw.enc && !this.vaultKey) throw new Error(\"That copy is encrypted. Unlock the vault on this machine first.\");\n      const st = this.propagate(this.state.core, hydrate(data));\n      this.setState({ syncBusy: false, st, syncMsg: \"Pulled.\" }, () => this.persist(st));\n    } catch (e) { this.setState({ syncBusy: false, syncMsg: \"Pull failed: \" + String(e.message || e).slice(0, 200) }); }\n  }\n\n  /* The assistant. Two ways in: ask it something, or select text anywhere in the\n     tracker and press Explain. It is given the current tab and the live counts,\n     so \"what should I do next\" gets an answer about this project rather than\n     about ISO 27001 in general. It never writes to the project. */\n  componentDidUpdate() {\n    if (this.selBound) return;\n    this.selBound = true;\n    document.addEventListener(\"selectionchange\", () => {\n      const t = String(document.getSelection() || \"\").trim();\n      if (t.length > 3 && t.length < 1200) this.setState({ aiSel: t.slice(0, 1200) });\n      else if (!t) this.setState({ aiSel: \"\" });\n    });\n  }\n\n  aiContext() {\n    const st = this.state.st;\n    if (!st) return \"\";\n    const m = this.metrics(this.schedule());\n    const tab = (NAV[this.state.tab] || {}).n;\n    return [\n      `The user is on the \"${tab}\" tab.`,\n      `Organisation: ${st.project.company || \"unnamed\"}.`,\n      `Mandatory documents outstanding: ${m.mandOut} of ${m.mandN}.`,\n      `Sub-clauses verified: ${m.clVer} of ${m.clApp}.`,\n      `Annex A: ${m.appN} applicable, ${m.exclN} excluded, ${m.ctImp} implemented, ${m.noWhy} exclusions unjustified.`,\n      `Risks: ${st.risks.length} logged, ${m.outside} above the acceptance threshold of ${st.threshold}.`,\n      `Risk method: ${st.rmethod || \"asset\"}, ${st.ranalysis || \"qualitative\"}.`,\n    ].join(\" \");\n  }\n\n  /* One request, one batch, nothing written. The suggestions live in component\n     state rather than the project: an unreviewed draft is not project data, and\n     keeping it out of storage means a stale batch can never be mistaken for a\n     decision. */\n  async generateSuggestions() {\n    const { askClaude, SUGG_SYSTEM, riskContext, parseSuggestions, suggFingerprint } = this.state.core;\n    if (this.state.suggBusy) return;\n    const st = this.state.st;\n    if (!st.project.company || !String(this.state.core.ismsScope(st) || \"\").trim()) {\n      this.setState({ suggOpen: true, suggErr: \"Add the organisation name under Settings, and answer the scope fields in D-03 — without them there is nothing to ground a risk in, and a model with no context invents one.\" });\n      return;\n    }\n    this.setState({ suggBusy: true, suggErr: \"\", suggOpen: true, sugg: null, suggPick: {} });\n    try {\n      const ctx = riskContext(st);\n      /* The organisation's own words are fenced and labelled as data. A profile\n         document is a file someone else wrote; it does not get to give\n         instructions to the model. */\n      const body = [\n        \"CONTEXT (this is the whole of what you know):\",\n        JSON.stringify({ ...ctx, organisationAnswers: undefined, profile: undefined }, null, 1),\n        \"\",\n        \"<organisation-material>\",\n        JSON.stringify({ profile: ctx.profile, answers: ctx.organisationAnswers }, null, 1),\n        \"<\u002Forganisation-material>\",\n        \"\",\n        `Propose risks for a ${ctx.method}, ${ctx.analysis} assessment, and Annex A applicability decisions that follow from them. The risk acceptance threshold is ${ctx.appetiteThreshold}.`,\n      ].join(\"\\n\");\n      const apiKey = (this.state.cfg || {}).anthropicKey;\n      const ask = (only, tokens) => askClaude({\n        system: SUGG_SYSTEM,\n        messages: [{ role: \"user\", content: body + \"\\n\\n\" + only }],\n        apiKey, maxTokens: tokens,\n      });\n      /* Running out of room is the normal failure here — eight fully described\n         risks is a lot of JSON — and the old code threw it away whole, which is\n         why the same button worked one minute and failed the next. The reply is\n         given room, and if it still stops short the text so far is salvaged:\n         parseSuggestions already reads complete entries out of a truncated\n         array and drops the half-written tail. */\n      const askSafe = async (only, tokens) => {\n        try { return { text: await ask(only, tokens), cut: false }; }\n        catch (e) {\n          if (e && e.truncated && e.partial) return { text: e.partial, cut: true };\n          throw e;\n        }\n      };\n      const [rRes, cRes] = await Promise.allSettled([\n        askSafe('Return ONLY the \"risks\" array this time. Set \"controls\" to [].', 9000),\n        askSafe('Return ONLY the \"controls\" array this time. Set \"risks\" to []. Decide applicability for the Annex A controls that the organisation context and scope speak to most directly.', 6000),\n      ]);\n      /* Each half is parsed on its own, so one bad reply cannot discard the\n         other. Only if BOTH fail is there nothing to review. */\n      let risks = [], controls = [], partial = false;\n      const notes = [];\n      if (rRes.status === \"fulfilled\") {\n        try { const p = parseSuggestions(rRes.value.text, st); risks = p.risks; partial = partial || p.partial || rRes.value.cut; }\n        catch (e) { notes.push(\"Risks: \" + String(e.message || e)); }\n      } else notes.push(\"Risks: \" + String((rRes.reason && rRes.reason.message) || rRes.reason));\n      if (cRes.status === \"fulfilled\") {\n        try { const p = parseSuggestions(cRes.value.text, st); controls = p.controls; partial = partial || p.partial || cRes.value.cut; }\n        catch (e) { notes.push(\"Annex A: \" + String(e.message || e)); }\n      } else notes.push(\"Annex A: \" + String((cRes.reason && cRes.reason.message) || cRes.reason));\n      if (!risks.length && !controls.length) throw new Error(notes.join(\" · \") || \"Nothing usable came back.\");\n      const parsed = { risks, controls, partial };\n      if (notes.length) this.setState({ suggErr: notes.join(\" · \") });\n      this.setState(s => ({\n        suggBusy: false,\n        suggErr: s.suggErr,\n        sugg: { ...parsed, fp: suggFingerprint(st), at: new Date().toISOString(),\n          method: ctx.method, analysis: ctx.analysis, partial: !!parsed.partial },\n        suggPick: parsed.risks.reduce((o, r) => { o[r.sid] = r.conf === \"high\"; return o; }, {}),\n        suggTab: parsed.risks.length ? \"risks\" : \"controls\",\n      }));\n    } catch (e) {\n      /* A truncated or unusable reply changes nothing: the batch is discarded\n         whole rather than applied in part. */\n      this.setState({ suggBusy: false, sugg: null,\n        suggErr: (e && e.truncated ? \"The model ran out of room before finishing, so the batch was discarded. Try again — nothing was changed. \" : \"\")\n          + String((e && e.message) || e).slice(0, 260) });\n    }\n  }\n\n  nextRiskId() {\n    const used = (this.state.st.risks || []).map(r => Number(String(r.id).replace(/\\D/g, \"\")) || 0);\n    const n = (used.length ? Math.max(...used) : 0) + 1;\n    return \"R-\" + String(n).padStart(2, \"0\");\n  }\n\n  /* Applying is the human decision, so this is where a permanent id is minted\n     and where provenance is recorded. Status stays Open: the model does not get\n     to close anything. */\n  applyRisks(sids) {\n    const batch = this.state.sugg;\n    if (!batch) return;\n    const take = batch.risks.filter(r => sids.indexOf(r.sid) >= 0);\n    if (!take.length) return;\n    let minted = [];\n    this.up(s => {\n      take.forEach(r => {\n        const id = (() => {\n          const used = s.risks.map(x => Number(String(x.id).replace(/\\D/g, \"\")) || 0);\n          return \"R-\" + String((used.length ? Math.max(...used) : 0) + 1).padStart(2, \"0\");\n        })();\n        minted.push(id);\n        s.risks.push({\n          id, proc: r.proc, asset: r.asset, owner: r.owner, type: r.type,\n          threat: r.threat, vuln: r.vuln, existing: r.existing,\n          L: r.L, I: 3, od: r.od, fl: r.    jbEye: this.state.showJb ? \"◡\" : \"◉\",\n      toggleJbShown: () => this.setState(s => ({ showJb: !s.showJb })),\n\n      /* Vault */\n      locked: this.state.locked, hasVault: this.state.hasVault, noVault: !this.state.hasVault,\n      /* Two flags, not one: \"resuming\" owns the splash and \"showLock\" owns the\n         passphrase prompt, so neither can paint while the other might. */\n      resuming: !!this.state.resuming,\n      showLock: this.state.locked && !this.state.resuming,\n      vaultPass: this.state.vaultPass, vaultPass2: this.state.vaultPass2,\n      vaultCode: this.state.vaultCode, vaultErr: this.state.vaultErr,\n      hasVaultErr: !!this.state.vaultErr, vaultBusy: this.state.vaultBusy,\n      vaultTotp: this.state.vaultTotp, hasTotp: !!this.state.vaultTotp,\n      setVaultPass: (e) => this.setState({ vaultPass: e.target.value }),\n      setVaultPass2: (e) => this.setState({ vaultPass2: e.target.value }),\n      setVaultCode: (e) => this.setState({ vaultCode: e.target.value }),\n      genTotp: () => {\n        const { b32enc } = this.state.core;\n        const secret = b32enc(crypto.getRandomValues(new Uint8Array(20)));\n        this.setState({ vaultTotp: secret });\n      },\n      totpUri: this.state.vaultTotp\n        ? `otpauth://totp/ISMS%20Tracker?secret=${this.state.vaultTotp}&issuer=ISMS%20Tracker`\n        : \"\",\n      turnVaultOn: () => {\n        if (this.state.vaultPass !== this.state.vaultPass2) { this.setState({ vaultErr: \"The two passphrases do not match.\" }); return; }\n        this.installVault(this.state.vaultPass, this.state.vaultCode);\n      },\n      unlock: () => this.unlockVault(this.state.vaultPass, this.state.vaultCode),\n      vaultOff: () => this.removeVault(),\n      lockNow: () => {\n        this.state.core.dropSession();\n        this.vaultKey = null;\n        this.setState({ locked: true, vaultPass: \"\", vaultCode: \"\" });\n      },\n      /* How long a refresh stays unlocked. Changing it re-stamps the live\n         session immediately, so the new window applies now rather than at the\n         next unlock. */\n      idleMins: String((this.state.cfg || {}).idleMins == null ? 10 : this.state.cfg.idleMins),\n      idleChoices: IDLE_CHOICES.map(([v, label]) => ({ v, label })),\n      idleWord: (() => {\n        const m = Number((this.state.cfg || {}).idleMins);\n        if (!m) return \"every time the page loads\";\n        const c = IDLE_CHOICES.find(x => Number(x[0]) === m);\n        return c ? \"after \" + c[1].toLowerCase() + \" of no activity\" : \"after 10 minutes of no activity\";\n      })(),\n      setIdle: (e) => {\n        const v = Number(e.target.value);\n        this.upCfg({ idleMins: v });\n        if (v && this.vaultKey) this.state.core.saveSession(this.vaultKey, v);\n        else if (!v) this.state.core.dropSession();\n      },\n      /* An escape hatch from the lock screen. Without one, a forgotten\n         passphrase makes the app permanently unopenable on this machine — and\n         the copy is undecryptable anyway, so the only honest offer is to start\n         over. It says plainly what is lost. */\n      abandonVault: () => {\n        if (!confirm(\"Start a fresh project on this browser?\\n\\nThe encrypted copy stored here cannot be decrypted without the passphrase, and this discards it. Any downloaded backup file is unaffected.\")) return;\n        const { KEY, VAULT_KEY, hydrate } = this.state.core;\n        try { localStorage.removeItem(KEY); localStorage.removeItem(VAULT_KEY); } catch (e) { /* quota */ }\n        this.state.core.dropSession();\n        this.vaultKey = null;\n        this.setState({\n          locked: false, encrypted: false, hasVault: false,\n          vaultPass: \"\", vaultPass2: \"\", vaultCode: \"\", vaultErr: \"\",\n          st: this.propagate(this.state.core, hydrate(null)),\n        }, () => this.say(\"Fresh project started. This browser's encrypted copy was discarded.\"));\n      },\n\n      /* Cloud sync. Both halves are drafts until SAVE: a key half-pasted into\n         storage is a failed push with no clue why. */\n      jbKey: this.state.jbDraft == null ? ((this.state.cfg || {}).jbKey || \"\") : this.state.jbDraft,\n      jbId: this.state.jbIdDraft == null ? ((this.state.cfg || {}).jbId || \"\") : this.state.jbIdDraft,\n      setJbKey: (e) => this.setState({ jbDraft: e.target.value }),\n      setJbId: (e) => this.setState({ jbIdDraft: e.target.value }),\n      saveJb: () => {\n        const cfg = this.state.cfg || {};\n        const k = String(this.state.jbDraft == null ? (cfg.jbKey || \"\") : this.state.jbDraft).trim();\n        const b = String(this.state.jbIdDraft == null ? (cfg.jbId || \"\") : this.state.jbIdDraft).trim();\n        this.upCfg({ jbKey: k, jbId: b });\n        this.setState({ jbDraft: null, jbIdDraft: null,\n          syncMsg: k ? \"Sync credentials saved in this browser. Nothing was pushed — press PUSH when you are ready.\" : \"Sync credentials cleared.\" });\n      },\n      jbSaveLabel: (() => {\n        const cfg = this.state.cfg || {};\n        const dirty = (this.state.jbDraft != null && this.state.jbDraft !== (cfg.jbKey || \"\"))\n          || (this.state.jbIdDraft != null && this.state.jbIdDraft !== (cfg.jbId || \"\"));\n        return (!dirty && cfg.jbKey) ? \"SAVED\" : \"SAVE\";\n      })(),\n      jbSaveTone: (() => {\n        const cfg = this.state.cfg || {};\n        const dirty = (this.state.jbDraft != null && this.state.jbDraft !== (cfg.jbKey || \"\"))\n          || (this.state.jbIdDraft != null && this.state.jbIdDraft !== (cfg.jbId || \"\"));\n        return (!dirty && cfg.jbKey) ? \"var(--solid)\" : \"var(--accent-fill)\";\n      })(),\n      jbSavedState: (this.state.cfg || {}).jbKey\n        ? ((this.state.cfg || {}).jbId ? \"key and bin id held in this browser\" : \"key held — a push will create the bin\")\n        : \"nothing saved yet\",\n      jbSavedTone: (this.state.cfg || {}).jbKey ? \"var(--ok)\" : \"var(--ink-3)\",\n      lastSync: (this.state.cfg || {}).lastSync\n        ? \"Last pushed \" + new Date((this.state.cfg || {}).lastSync).toLocaleString()\n        : \"Never pushed from this browser.\",\n      syncMsg: this.state.syncMsg, hasSyncMsg: !!this.state.syncMsg,\n      syncBusy: this.state.syncBusy,\n      doPush: () => this.syncPush(),\n      doPull: () => this.syncPull(),\n      syncWarn: this.state.hasVault\n        ? \"The vault is on, so the copy pushed is encrypted with your passphrase.\"\n        : \"No vault is on. A pushed copy would be readable by anyone holding the jsonbin key — turn the vault on first.\",\n      syncWarnTone: this.state.hasVault ? \"var(--ok)\" : \"var(--warn)\",\n\n      /* Focus moves into the scroll container as the panel mounts, so arrow keys\n         and PageDown work without clicking inside first. */\n      openSettings: () => this.setState({ settingsOpen: true }, () => {\n        requestAnimationFrame(() => {\n          const b = document.querySelector(\"[data-set-body]\");\n          if (b) b.focus({ preventScroll: true });\n        });\n      }),\n      closeSettings: () => this.setState({ settingsOpen: false, imp: { busy: \"\", err: \"\", src: null, found: null, pick: {} } }),\n      navBtnLabel: navOpen ? \"Hide sections\" : \"Show sections\",\n      toggleNav: () => this.setState(s => ({ navOpen: !s.navOpen })),\n      closeNav: () => this.setState({ navOpen: false }),\n      tabTitle: t.n, tabPart: t.part, tabNote: t.note,\n      isOverview: tab === 0 && !!st,\n      isPlan: false, isPlanDesk: false, isPlanMobile: false,\n      isDocs: false, isDocsDesk: false, isDocsMobile: false,\n      isClauses: false, isClDesk: false, isClMobile: false,\n      isRisks: false, isSoa: false, isSoaDesk: false, isSoaMobile: false,\n      isSettings: this.state.settingsOpen,\n      buildOpen: false,\n      isStub: false,\n      stubNote: STUB[tab] ? STUB[tab][0] : \"\",\n      stubCount: STUB[tab] ? STUB[tab][1] : \"\",\n      loading: !st && !this.loadError,\n      encrypted,\n      stepNote: this.state.stepNote,\n      hasStepNote: !!this.state.stepNote,\n      clearStepNote: () => this.tellStep(\"\"),\n      company: (st && st.project.company) || \"Your organisation\",\n      gateEyebrow: \"Gates\", gateColor: \"var(--ink-3)\", gateReadout: \"—\", gateFill: \"0%\",\n      gateWord: \"—\", gateCount: \"\", clear: false, hasBlockers: false,\n      flowOpen: false, viewerOpen: false,\n      blockers: [], stats: [], meters: [],\n    };\n    if (!st || !core) return base;\n\n    const sched = this.schedule();\n    const plan = tab === 1 ? { ...this.planPane(sched), ...this.guidePane() } : {};\n    const docs = tab === 2 ? {\n      ...(this.state.docView === \"phases\" ? this.docsPane() : {}),\n      ...(this.state.docView === \"register\" ? this.registerPane() : {}),\n      ...(this.state.docView === \"map\" ? this.mapPane() : {}),\n      docView: this.state.docView,\n      isPhaseView: this.state.docView === \"phases\",\n      isRegView: this.state.docView === \"register\",\n      isMapView: this.state.docView === \"map\",\n      viewBtns: [[\"phases\",\"PHASES\"],[\"register\",\"REGISTER\"],[\"map\",\"MAP\"]].map(([k,l]) => ({\n        k, l,\n        bg: this.state.docView === k ? \"var(--solid)\" : \"var(--surface)\",\n        fg: this.state.docView === k ? \"var(--on-fill)\" : \"var(--ink-2)\",\n        go: () => this.setState({ docView: k }),\n      })),\n    } : {};\n    const clauses = tab === 3 ? this.clausePane() : {};\n    const risks = tab === 4 ? this.riskPane() : {};\n    const settings = this.state.settingsOpen ? this.settingsPane() : {};\n    const build = this.state.buildId ? this.buildPane() : {};\n    const soa = tab === 5 ? this.soaPane() : {};\n    const flow = this.state.flowId ? this.flowPane() : {};\n    const viewer = this.state.viewerId ? this.viewerPane() : {};\n    const m = this.metrics(sched);\n    const gate = m.mandOut === 0 && m.noWhy === 0 && m.outside === 0 && m.clPct === 1;\n    const open = [m.mandOut, m.noWhy, m.outside, m.clApp - m.clVer].filter(x => x > 0).length;\n    const s = (n) => (n === 1 ? \"\" : \"s\");\n    /* A gate that names a number the user cannot reach is a dead end, so each\n       one carries the tab it lives on and the rows that caused it. */\n    const jump = (tab, ids) => () => this.goRows(tab, ids);\n    const mandIds = core.DOCS.filter(d => d.ob === \"Mandatory\" && !core.docPublished(st, d.id)).map(d => d.id);\n    const noWhyIds = core.CONTROLS.filter(c => { const r = st.controls[c.id] || {};\n      return !r.app && !String(r.why || \"\").trim(); }).map(c => c.id);\n    const overIds = (st.risks || []).filter(r => r.rL * r.rI > st.threshold).map(r => r.id);\n    const unverIds = core.CLAUSES.filter(c => c.req && (st.clauses[c.id] || {}).s !== \"Verified\").map(c => c.id);\n    const blockers = [\n      { n: m.mandOut, t: `mandatory document${s(m.mandOut)} not approved`, ref: \"Clause 7.5\", go: jump(2, mandIds) },\n      { n: m.noWhy, t: `excluded control${s(m.noWhy)} without a justification`, ref: \"Clause 6.1.3 d)\", go: jump(5, noWhyIds) },\n      { n: m.outside, t: `residual risk${s(m.outside)} above your acceptance threshold`, ref: \"Clause 6.1.2 a)\", go: jump(4, overIds) },\n      { n: m.clApp - m.clVer, t: `sub-clause${s(m.clApp - m.clVer)} not yet verified`, ref: \"Clauses 4–10\", go: jump(3, unverIds) },\n    ].filter(b => b.n > 0);\n\n    /* The gap stage can be complete on its documents while the register is\n       still empty. That is a transcription job, not an un-run assessment, so it\n       is an advisory rather than a fifth gate. */\n    const transcribe = core.gapTranscriptionGap ? core.gapTranscriptionGap(st) : 0;\n\n    return {\n      ...base,\n      ...plan,\n      ...docs,\n      ...clauses,\n      ...risks,\n      ...settings,\n      ...build,\n      ...soa,\n      closeFlow: () => this.setState({ flowId: null }),\n      stopFlow: (e) => e.stopPropagation(),\n      closeViewer: () => this.setState({ viewerId: null }),\n      stopViewer: (e) => e.stopPropagation(),\n      ...flow,\n      ...viewer,\n      isPlan: tab === 1,\n      isPlanDesk: tab === 1 && !mobile,\n      isPlanMobile: tab === 1 && mobile,\n      isDocs: tab === 2,\n      isDocsDesk: tab === 2 && !mobile,\n      isDocsMobile: tab === 2 && mobile,\n      isClauses: tab === 3,\n      isClDesk: tab === 3 && !mobile,\n      isClMobile: tab === 3 && mobile,\n      isRisks: tab === 4,\n      isSoa: tab === 5,\n      isSoaDesk: tab === 5 && !mobile,\n      isSoaMobile: tab === 5 && mobile,\n      gateEyebrow: gate ? \"Stage 2\" : \"Gates\",\n      gateColor: gate ? \"var(--ok)\" : \"var(--danger)\",\n      /* The hairline under the header is the same four gates as a length, so\n         readiness is legible from any tab without reading the words. */\n      gateFill: `${Math.round(((4 - Math.min(4, open)) / 4) * 100)}%`,\n      gateReadout: gate ? \"READY\" : `${open}/4 OPEN`,\n      gateWord: gate ? \"READY\" : \"NOT READY\",\n      gateCount: blockers.length ? `${blockers.length} OPEN GATE${blockers.length === 1 ? \"\" : \"S\"}` : \"ALL GATES CLEAR\",\n      clear: blockers.length === 0,\n      hasBlockers: blockers.length > 0,\n      blockers,\n      hasTranscribe: transcribe > 0,\n      transcribeText: `The gap documents are approved, but ${transcribe} sub-clause${transcribe === 1 ? \"\" : \"s\"} still carry no status. Conformity, the SoA and the gap report all read from the register, so the findings need to land there.`,\n      goTranscribe: jump(3, core.CLAUSES.filter(c => c.req && (st.clauses[c.id] || {}).s === \"Not Started\").map(c => c.id)),\n      stats: [\n        { go: jump(1, []), goTitle: \"Open the plan\", label: \"Plan complete\", value: pct(m.planned), note: `${m.done} of ${m.total} tasks finished`, tone: \"var(--accent)\" },\n        { go: jump(4, []), goTitle: \"Open the risk register\", label: \"Risks logged\", value: String(st.risks.length), note: st.risks.length ? `${m.openHigh} at high or critical` : \"6.1.2 — none identified yet\", tone: st.risks.length ? \"var(--accent)\" : \"var(--warn)\" },\n        { go: jump(1, []), goTitle: \"Open the plan\", label: \"Tasks overdue\", value: String(m.overdue), note: \"past due, under 100%\", tone: m.overdue ? \"var(--danger)\" : \"var(--ok)\" },\n        { go: jump(3, unverIds), goTitle: \"Open clauses 4 to 10\", label: \"Clause conformity\", value: pct(m.clPct), note: `${m.clVer} of ${m.clApp} verified`, tone: \"var(--ok)\" },\n        { go: jump(5, noWhyIds), goTitle: \"Open the Statement of Applicability\", label: \"SoA controls applied\", value: `${m.appN}/93`, note: `${m.exclN} excluded · ${m.ctImp} implemented · ${m.ctPlan} planned`, tone: \"var(--accent)\" },\n        { go: jump(2, mandIds), goTitle: \"Open the documents register\", label: \"Documents outstanding\", value: String(m.mandOut), note: `of ${m.mandN} mandatory`, tone: m.mandOut ? \"var(--warn)\" : \"var(--ok)\" },\n      ],\n      meters: [\n        { label: \"Implementation plan\", pctText: pct(m.planned), width: pct(m.planned), tone: \"var(--accent)\" },\n        { label: \"Clauses 4–10 verified\", pctText: pct(m.clPct), width: pct(m.clPct), tone: \"var(--ok)\" },\n        { label: \"Applicable Annex A implemented\", pctText: pct(m.ctPct), width: pct(m.ctPct), tone: \"var(--ok)\" },\n        { label: \"Mandatory documents approved\", pctText: pct(1 - m.mandOut / Math.max(1, m.mandN)), width: pct(1 - m.mandOut / Math.max(1, m.mandN)), tone: \"var(--warn)\" },\n      ],\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
