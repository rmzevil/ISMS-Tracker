t, a\n     PDF, a pasted extract — and proposes answers for the clause 4.1–4.3 fields.\n     It never writes silently: everything found is shown first, each group is\n     opt-in, and applying only touches fields you ticked. */\n  async runImport(input) {\n    const { readProfile, PROFILE_SYSTEM, parseProfileReply, askAllowingCut } = this.state.core;\n    this.setState(s => ({ imp: { ...s.imp, busy: \"reading\", err: \"\", found: null } }));\n    try {\n      const content = input instanceof File ? await readProfile(input)\n        : { name: \"pasted text\", kind: \"text\", text: String(input || \"\") };\n      if (!String(content.text || content.b64 || \"\").trim()) throw new Error(\"That file came through empty.\");\n      this.setState(s => ({ imp: { ...s.imp, busy: \"reading the organisation\", src: { name: content.name, kind: content.kind } } }));\n      const user = content.kind === \"pdf\"\n        ? [{ type: \"document\", source: { type: \"base64\", media_type: \"application/pdf\", data: content.b64 } },\n           { type: \"text\", text: \"Read this company profile and return the JSON object described.\" }]\n        : `Company profile:\\n\\n${content.text}\\n\\nReturn the JSON object described.`;\n      const { text: raw, partial } = await askAllowingCut({\n        system: PROFILE_SYSTEM, messages: [{ role: \"user\", content: user }],\n        apiKey: (this.state.cfg || {}).anthropicKey, maxTokens: 4000,\n      });\n      const p = (parseProfileReply(raw) || {}).data || {};\n      const arr = (x) => Array.isArray(x) ? x.filter(v => v != null) : [];\n      const str = (x, n) => String(x || \"\").slice(0, n);\n      const found = {\n        company: str(p.company, 120), summary: str(p.summary, 300), climate: str(p.climate, 300),\n        external: arr(p.external).map(x => str(x, 200)).slice(0, 12),\n        internal: arr(p.internal).map(x => str(x, 200)).slice(0, 12),\n        parties: arr(p.parties).map(x => ({ party: str((x || {}).party, 80), needs: str((x || {}).needs, 200) })).filter(x => x.party).slice(0, 15),\n        locations: arr(p.locations).map(x => str(x, 160)).slice(0, 20),\n        systems: arr(p.systems).map(x => str(x, 200)).slice(0, 20),\n        inScope: arr(p.inScope).map(x => str(x, 160)).slice(0, 15),\n        outScope: arr(p.outScope).map(x => str(x, 200)).slice(0, 15),\n      };\n      const total = found.external.length + found.internal.length + found.parties.length\n        + found.locations.length + found.systems.length + found.inScope.length + found.outScope.length;\n      if (!total) throw new Error(\"Nothing usable came back. The document may not describe the organisation in terms clauses 4.1 to 4.3 can use — try pasting the relevant sections instead.\");\n      this.setState({ imp: {\n        busy: \"\", src: { name: content.name, kind: content.kind }, found,\n        err: partial ? \"The reply was cut short, so this is a partial reading. Everything shown was read cleanly and is safe to apply; run it again on a shorter extract to pick up the rest.\" : \"\",\n        pick: { company: true, external: true, internal: true, climate: true, parties: true, locations: true, systems: true, inScope: true, outScope: true },\n      } });\n    } catch (e) {\n      const noKey = !(this.state.cfg || {}).anthropicKey;\n      this.setState(s => ({ imp: { ...s.imp, busy: \"\", found: null,\n        err: String(e.message || \"Could not read that document\").slice(0, 320)\n          + (noKey ? \" (read using the built-in model — saving your own Anthropic key below usually reads longer documents more reliably)\" : \"\") } }));\n    }\n  }\n\n  applyImport() {\n    const { profileToAnswers } = this.state.core;\n    const { found, pick } = this.state.imp;\n    if (!found) return;\n    const ans = profileToAnswers(found) || {};\n    const on = {\n      threats: pick.external, external: pick.external, weaknesses: pick.internal,\n      internal: pick.internal, climate: pick.climate, parties: pick.parties,\n      locations: pick.locations, systems: pick.systems, inScope: pick.inScope, outScope: pick.outScope,\n    };\n    this.up(s => {\n      if (pick.company && found.company) s.project.company = found.company;\n      Object.keys(ans).forEach(doc => {\n        s.answers[doc] = s.answers[doc] || {};\n        Object.keys(ans[doc]).forEach(q => {\n          if (on[q] === false) return;\n          s.answers[doc][q] = ans[doc][q];\n        });\n      });\n    });\n    this.setState({ imp: { busy: \"\", err: \"\", src: null, found: null, pick: {} } });\n    this.say(\"Organisation profile applied. The document builder fields it filled are marked as yours.\");\n  }\n\n  /* The document builder. One pane per document: its own questions, the fields the\n     engine already knows, and the rendered document. Fields the tracker derives\n     are shown filled and marked LIVE — they move when the register moves, so\n     typing over one is a decision, not a correction, and it is recorded as yours. */\n  buildPane() {\n    const { DOCS, DOC_FORMS, renderTemplate, buildTemplate, liveAnswers, isLiveField,\n      docProgress, DOC_STATUSES, STATUS_COLOR } = this.state.core;\n    const st = this.state.st;\n    const doc = DOCS.find(d => d.id === this.state.buildId);\n    if (!doc) return {};\n    const form = DOC_FORMS[doc.id] || {};\n    const qs = form.qs || doc.qs || [];\n    const stored = st.answers[doc.id] || {};\n    const answers = liveAnswers({ ...doc, qs }, st, stored);\n    const pr = docProgress({ ...doc, qs }, answers);\n    const rec = st.docs[doc.id] || {};\n\n    const meta = {\n      id: doc.id, name: doc.name, ref: doc.ref,\n      company: st.project.company || \"the organisation\",\n      version: rec.ver || \"0.1 draft\",\n      date: new Date().toISOString().slice(0, 10),\n      scope: st.project.scope || \"\",\n    };\n    const tpl = form.tpl || doc.tpl;\n    let rendered = \"\";\n    try {\n      rendered = tpl ? renderTemplate({ ...doc, tpl }, answers, meta)\n        : buildTemplate(doc, meta.company);\n    } catch (e) { rendered = \"This document's template could not be rendered: \" + e.message; }\n\n    return {\n      buildOpen: true,\n      bId: doc.id, bName: doc.name, bRef: doc.ref, bWhy: doc.why || \"\",\n      bHasWhy: !!doc.why,\n      bProgress: `${pr.filled} of ${pr.total} answered`,\n      bPct: `${Math.round(pr.pct * 100)}%`,\n      bBarW: `${Math.round(pr.pct * 100)}%`,\n      bTone: pr.pct === 1 ? \"var(--ok)\" : pr.pct > 0 ? \"var(--warn)\" : \"var(--ink-3)\",\n      bStatus: rec.s, bStatuses: DOC_STATUSES,\n      bStatusTone: STATUS_COLOR[rec.s] || \"var(--ink-3)\",\n      setBStatus: (e) => { const v = e.target.value; this.up(s => { s.docs[doc.id].s = v; }); },\n      closeBuild: () => this.setState({ buildId: null }),\n\n      bQs: qs.map((q, i) => {\n        const live = isLiveField(st, doc.id, q.id);\n        const v = answers[q.id] == null ? \"\" : String(answers[q.id]);\n        const set = (e) => {\n          const val = e.target.value;\n          this.upMan(\"field\", `${doc.id}:${q.id}`, s => {\n            s.answers[doc.id] = { ...(s.answers[doc.id] || {}), [q.id]: val };\n          });\n        };\n        return {\n          key: q.id, n: String(i + 1), q: q.q, hint: q.h || \"\", hasHint: !!q.h,\n          ph: q.p || \"\", v, live, notLive: !live,\n          filled: !!String(v).trim(),\n          edge: String(v).trim() ? (live ? \"var(--ok)\" : \"var(--accent)\") : \"var(--line-2)\",\n          isList: q.k === \"list\", isArea: q.k === \"area\", isText: q.k === \"text\",\n          isSelect: q.k === \"select\",\n          opts: (q.o || []).map(o => ({ o })),\n          rows: q.k === \"list\" ? 4 : q.k === \"area\" ? 3 : 1,\n          set,\n          /* Handing a live field back lets the engine own it again. */\n          handBack: () => this.up(s => {\n            const m = { ...(s.manual || {}) }; delete m[`field:${doc.id}:${q.id}`]; s.manual = m;\n          }),\n          overridden: !live && !!this.state.core.isManual(st, \"field\", `${doc.id}:${q.id}`),\n        };\n      }),\n\n      bRendered: rendered,\n      copyDoc: () => {\n        navigator.clipboard && navigator.clipboard.writeText(rendered);\n        this.say(`${doc.id} copied as Markdown.`);\n      },\n      downloadWord: () => {\n        try { this.saveBlob(this.state.core.docxFrom(rendered, doc.name), `${doc.id} ${doc.name}.docx`); }\n        catch (e) { this.say(\"Word export failed: \" + e.message); }\n      },\n      downloadDoc: () => {\n        const a = document.createElement(\"a\");\n        a.href = URL.createObjectURL(new Blob([rendered], { type: \"text/markdown;charset=utf-8\" }));\n        a.download = `${doc.id} ${doc.name}.md`.replace(/[\\\\/:*?\"<>|]/g, \"-\");\n        a.click(); URL.revokeObjectURL(a.href);\n      },\n      /* Alt+Left and Alt+Right walk the builder's own fields. Moving focus\n         rather than paging a wizard keeps one behaviour for mouse and keyboard. */\n      bFieldCount: qs.length,\n      bPreviewOpen: this.state.previewOpen,\n      toggleBPreview: () => this.setState(s => ({ previewOpen: !s.previewOpen })),\n      bPreviewLabel: this.state.previewOpen ? \"HIDE THE DOCUMENT\" : \"SHOW THE DOCUMENT\",\n    };\n  }\n\n  /* Documents, second view: one row per deliverable across every phase. The\n     phase register answers \"what do I build next\"; this answers \"what does the\n     standard actually oblige me to hold\", which is a different question and the\n     one an auditor opens with. */\n  registerPane() {\n    const { DELIVERABLES, deliverableTree, delState, DEL_CATS, DEL_CAT_COLOR,\n      STATUS_COLOR, csv, xlsxFrom } = this.state.core;\n    const st = this.state.st;\n    const { regQ, regCat, regClosed } = this.state;\n    const q = regQ.trim().toLowerCase();\n    const pass = (d) => (regCat === \"All\" || d.cat === regCat)\n      && (!q || (d.name + \" \" + (d.cites || []).join(\" \")).toLowerCase().includes(q));\n\n    const groups = deliverableTree(DELIVERABLES).map(g => {\n      const items = (g.items || []).filter(pass);\n      const open = (q || regCat !== \"All\") ? true : regClosed[g.key] !== true;\n      return {\n        key: g.key, label: g.label, kind: g.kind, open,\n        glyph: open ? \"−\" : \"+\", ariaOpen: open ? \"true\" : \"false\",\n        meta: `${(g.items || []).length} deliverables`,\n        toggle: () => this.setState(s => ({ regClosed: { ...s.regClosed, [g.key]: open } })),\n        rows: open ? items.map(d => {\n          const link = delState(st, d);\n          return {\n            key: String(d.id), name: d.name, cat: d.cat, typ: d.typ,\n            catTone: DEL_CAT_COLOR[d.cat] || \"var(--ink-3)\",\n            mandatory: d.typ === \"Mandatory\",\n            typLabel: String(d.typ || \"Additional\").toUpperCase(),\n            typBg: d.typ === \"Mandatory\" ? \"var(--danger-fill)\" : \"transparent\",\n            typFg: d.typ === \"Mandatory\" ? \"var(--on-fill)\" : \"var(--ink-3)\",\n            typEdge: d.typ === \"Mandatory\" ? \"var(--danger)\" : \"var(--line-2)\",\n            cites: (d.cites || []).join(\", \"),\n            docId: link.id || \"\", hasDoc: !!link.id,\n            status: link.s || \"\",\n            statusTone: STATUS_COLOR[link.s] || \"var(--ink-3)\",\n            go: () => link.id && this.setState({ docView: \"phases\", docQ: link.id, docNote: `Jumped to ${link.id} from the deliverable register.` }),\n          };\n        }) : [],\n      };\n    }).filter(g => g.rows.length || (regCat === \"All\" && !q));\n\n    const flat = DELIVERABLES.filter(pass);\n    const head = [\"Deliverable\", \"Category\", \"Obligation\", \"Cites\", \"Tracked as\", \"Status\"];\n    const body = () => flat.map(d => {\n      const l = delState(st, d);\n      return [d.name, d.cat, d.typ, (d.cites || []).join(\" \"), l.id || \"\", l.s || \"not tracked\"];\n    });\n    return {\n      regGroups: groups, regQ, regCat,\n      regCats: [\"All\"].concat(DEL_CATS),\n      regCount: `${flat.length} of ${DELIVERABLES.length} deliverables`,\n      setRegQ: (e) => this.setState({ regQ: e.target.value }),\n      setRegCat: (e) => this.setState({ regCat: e.target.value }),\n      regAllLabel: deliverableTree(DELIVERABLES).every(g => regClosed[g.key] !== true) ? \"COLLAPSE ALL\" : \"EXPAND ALL\",\n      toggleRegAll: () => this.setState(s => {\n        const keys = deliverableTree(DELIVERABLES).map(g => g.key);\n        const openNow = keys.every(k => s.regClosed[k] !== true);\n        const next = { ...s.regClosed };\n        keys.forEach(k => { next[k] = openNow; });\n        return { regClosed: next };\n      }),\n      exportReg: () => csv([head, ...body()], \"isms-deliverable-register.csv\"),\n      exportRegX: () => this.saveBlob(xlsxFrom(head, body(), [46, 20, 14, 26, 12, 16], \"Deliverables\"),\n        \"isms-deliverable-register.xlsx\"),\n    };\n  }\n\n  /* Documents, third view: the real mind map. mindLayout precomputes a y for every\n     node so the branches can be drawn with orthogonal elbows either side of a\n     centre spine — the geometry is the point, so this draws it rather than\n     flattening it to a list. Records carry their document's status, because the\n     question this view answers is which clause has nothing filed against it. */\n  mapPane() {\n    const { mindLayout, MIND_DOC, STATUS_COLOR } = this.state.core;\n    const st = this.state.st;\n    let L;\n    try { L = mindLayout(st); } catch (e) { return { mapError: e.message, hasMapError: true, nodes: [], links: [], chips: [] }; }\n\n    const HUB_X = 150, CL_X = 300, SUB_X = 520, DEEP_X = 730, ROW = 26;\n    const nodes = [], links = [], chips = [];\n    const box = (side, x, w) => side === \"R\" ? x : -x - w;\n    const elbow = (x1, y1, x2, y2) => {\n      const mx = x1 + (x2 - x1) / 2;\n      return `M ${x1} ${y1} H ${mx} V ${y2} H ${x2}`;\n    };\n    const pub = (name) => {\n      const id = MIND_DOC[name];\n      if (!id) return { docId: \"\", done: false, s: \"\" };\n      const d = (st.docs || {})[id] || {};\n      return { docId: id, done: [\"Approved\", \"Published\"].indexOf(d.s) >= 0, s: d.s || \"Not Started\" };\n    };\n    const clauseS = (id) => ((st.clauses || {})[id] || {}).s || null;\n\n    [\"R\", \"L\"].forEach(sideKey => {\n      const set = L[sideKey];\n      if (!set) return;\n      const top = -(set.height || 0) / 2;\n      const sg = sideKey === \"R\" ? 1 : -1;\n      (set.hubs || []).forEach(hub => {\n        const hy = top + hub.y, hx = box(sideKey, HUB_X, 74);\n        nodes.push({ key: sideKey + hub.id, kind: \"hub\", x: hx, y: hy - 13, w: 74, h: 26,\n          t: hub.id, fill: \"var(--solid)\", stroke: \"var(--ink)\", fg: \"var(--on-fill)\", weight: 700, size: 11 });\n        links.push({ key: \"l\" + sideKey + hub.id, d: elbow(sg * 92, 0, sideKey === \"R\" ? hx : hx + 74, hy) });\n\n        (hub.clauses || []).forEach(cl => {\n          const cy = top + cl.y, cx = box(sideKey, CL_X, 168);\n          nodes.push({ key: sideKey + \"c\" + cl.id, kind: \"clause\", x: cx, y: cy - 15, w: 168, h: 30,\n            t: `${cl.id}. ${cl.title}`, fill: \"var(--surface)\", stroke: \"var(--accent)\", fg: \"var(--ink)\", weight: 700, size: 10.5 });\n          links.push({ key: \"lc\" + sideKey + cl.id,\n            d: elbow(sideKey === \"R\" ? hx + 74 : hx, hy, sideKey === \"R\" ? cx : cx + 168, cy) });\n\n          (cl.kids || []).forEach(sc => {\n            const sy = top + sc.y, sx = box(sideKey, SUB_X, 196);\n            const s1 = sc.id ? clauseS(sc.id) : null;\n            nodes.push({ key: sideKey + \"s\" + sc.id, kind: \"sub\", x: sx, y: sy - 13, w: 196, h: 26,\n              t: `${sc.label} ${sc.title}`, fill: \"var(--subtle)\",\n              stroke: s1 ? (STATUS_COLOR[s1] || \"var(--line-2)\") : \"var(--line-2)\",\n              fg: \"var(--ink)\", weight: 500, size: 9.5 });\n            links.push({ key: \"ls\" + sideKey + sc.id,\n              d: elbow(sideKey === \"R\" ? cx + 168 : cx, cy, sideKey === \"R\" ? sx : sx + 196, sy) });\n\n            /* deeper sub-clauses (6.1.3, 7.5.2, 9.2.1 …) and the records filed\n               against them. Weighting each tail by its record count is what keeps\n               the record column from overlapping itself. */\n            const tails = [];\n            (sc.deeper || []).forEach(d => tails.push({ kind: \"deep\", id: d.id, t: `${d.id} ${d.title}`, recs: d.recs || [] }));\n            (sc.recs || []).forEach(r => tails.push({ kind: \"rec\", t: r, recs: [] }));\n            const weight = tails.map(tl => tl.kind === \"deep\" ? Math.max(1, tl.recs.length) : 1);\n            const totalRows = weight.reduce((a, b) => a + b, 0);\n            let row = 0;\n            tails.forEach((tl, i) => {\n              const w = weight[i];\n              const ty = sy - (totalRows - 1) * ROW / 2 + (row + (w - 1) / 2) * ROW;\n              row += w;\n              if (tl.kind === \"deep\") {\n                const dx = box(sideKey, DEEP_X, 186);\n                const ds = clauseS(tl.id);\n                nodes.push({ key: sideKey + \"d\" + tl.id, kind: \"deep\", x: dx, y: ty - 12, w: 186, h: 24,\n                  t: tl.t, fill: \"var(--surface)\", stroke: ds ? (STATUS_COLOR[ds] || \"var(--line-2)\") : \"var(--line-2)\",\n                  fg: \"var(--ink-2)\", weight: 600, size: 9.5 });\n                links.push({ key: \"ld\" + sideKey + tl.id,\n                  d: elbow(sideKey === \"R\" ? sx + 196 : sx, sy, sideKey === \"R\" ? dx : dx + 186, ty) });\n                tl.recs.forEach((r, j) => {\n                  const ry = ty - (tl.recs.length - 1) * ROW / 2 + j * ROW;\n                  const rx = sideKey === \"R\" ? dx + 186 + 34 : dx - 34 - 236;\n                  const p = pub(r);\n                  chips.push({ key: sideKey + \"r\" + tl.id + j, x: rx, y: ry - 12, w: 236, h: 24, t: r,\n                    fill: p.done ? \"var(--ok-wash)\" : \"var(--surface)\",\n                    stroke: p.done ? \"var(--ok)\" : (p.docId ? \"var(--warn)\" : \"var(--line-2)\"),\n                    fg: p.done ? \"var(--ok)\" : \"var(--ink-2)\",\n                    title: p.docId ? `${p.docId} — ${p.s}` : \"not tracked as a document\",\n                    docId: p.docId, go: p.docId ? () => this.setState({ docView: \"phases\", docQ: p.docId, docNote: `Jumped to ${p.docId} from the map.` }) : null });\n                  links.push({ key: \"lr\" + sideKey + tl.id + j,\n                    d: elbow(sideKey === \"R\" ? dx + 186 : dx, ty, sideKey === \"R\" ? rx : rx + 236, ry) });\n                });\n              } else {\n                const dxr = box(sideKey, DEEP_X, 186);\n                const rx = sideKey === \"R\" ? dxr + 186 + 34 : dxr - 34 - 236;\n                const p = pub(tl.t);\n                chips.push({ key: sideKey + \"rr\" + sc.id + i, x: rx, y: ty - 12, w: 236, h: 24, t: tl.t,\n                  fill: p.done ? \"var(--ok-wash)\" : \"var(--surface)\",\n                  stroke: p.done ? \"var(--ok)\" : (p.docId ? \"var(--warn)\" : \"var(--line-2)\"),\n                  fg: p.done ? \"var(--ok)\" : \"var(--ink-2)\",\n                  title: p.docId ? `${p.docId} — ${p.s}` : \"not tracked as a document\",\n                  docId: p.docId, go: p.docId ? () => this.setState({ docView: \"phases\", docQ: p.docId, docNote: `Jumped to ${p.docId} from the map.` }) : null });\n                links.push({ key: \"lrr\" + sideKey + sc.id + i,\n                  d: elbow(sideKey === \"R\" ? sx + 196 : sx, sy, sideKey === \"R\" ? rx : rx + 236, ty) });\n              }\n            });\n          });\n        });\n      });\n    });\n\n    /* Labels are HTML boxes positioned over an SVG that draws only the\n       connectors. A {{ }} hole inside an SVG <text> is emitted as an HTML\n       <span>, which SVG cannot lay out — every label measured 0×0 and the map\n       drew as empty outlines. HTML labels also wrap instead of being clipped to\n       a character count, so nothing has to be truncated to fit. */\n    const all = [...nodes, ...chips];\n    const pad = 40;\n    const minX = Math.min(-110, ...all.map(n => n.x)) - pad;\n    const maxX = Math.max(110, ...all.map(n => n.x + n.w)) + pad;\n    const minY = Math.min(-30, ...all.map(n => n.y)) - pad;\n    const maxY = Math.max(30, ...all.map(n => n.y + n.h)) + pad;\n    const W = maxX - minX, H = maxY - minY;\n    const place = (n) => {\n      n.left = `${n.x - minX}px`;\n      n.top = `${n.y - minY}px`;\n      n.wpx = `${n.w}px`;\n      n.hpx = `${n.h}px`;\n      n.fs = `${n.size || 9}px`;\n      n.fw = n.weight || 500;\n    };\n    nodes.forEach(n => { place(n); n.centre = n.kind === \"hub\" ? \"center\" : \"flex-start\"; });\n    chips.forEach(c => { c.size = 9.5; place(c); });\n    const z = this.state.mapZoom;\n\n    return {\n      mapError: \"\", hasMapError: false,\n      nodes, links, chips,\n      viewBox: `${minX} ${minY} ${W} ${H}`,\n      innerW: `${W}px`, innerH: `${H}px`,\n      spineLeft: `${-92 - minX}px`, spineTop: `${-15 - minY}px`,\n      scale: `scale(${z})`,\n      frameW: `${Math.round(W * z)}px`, frameH: `${Math.round(H * z)}px`,\n      mapZoom: z,\n      setMapZoom: (e) => this.setState({ mapZoom: Number(e.target.value) }),\n      mapCounts: `${nodes.length} nodes · ${chips.length} records`,\n      mapOpen: this.state.mapOpen,\n      openMap: () => this.setState({ mapOpen: true }),\n      closeMap: () => this.setState({ mapOpen: false }),\n      stopMap: (e) => e.stopPropagation(),\n    };\n  }\n\n  /* The vault. A passphrase derives an AES-GCM key by PBKDF2 and every write to\n     browser storage goes through it, so what sits on disk is ciphertext. The key\n     never leaves memory: forgetting the passphrase loses the project, which is\n     the honest cost of encryption and is said plainly in the UI. */\n  async installVault(pass, code) {\n    const { deriveKey, seal, VAULT_KEY, KEY, totpValid } = this.state.core;\n    this.setState({ vaultBusy: true, vaultErr: \"\" });\n    try {\n      if (String(pass || \"\").length < 10) throw new Error(\"Use at least 10 characters. A passphrase of a few words beats a short complex string.\");\n      const salt = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));\n      const key = await deriveKey(pass, salt);\n      const secret = this.state.vaultTotp || \"\";\n      if (secret && !(await totpValid(secret, code))) throw new Error(\"That code does not match the authenticator. Check it and try again.\");\n      const blob = await seal(key, this.state.st);\n      localStorage.setItem(VAULT_KEY, JSON.stringify({ salt, totp: secret || \"\" }));\n      localStorage.setItem(KEY, JSON.stringify({ __enc: true, ...blob }));\n      this.vaultKey = key;\n      await this.state.core.saveSession(key, Number((this.state.cfg || {}).idleMins));\n      this.setState({ vaultBusy: false, vaultPass: \"\", vaultPass2: \"\", vaultCode: \"\", locked: false, hasVault: true });\n      this.say(\"Vault on. This browser's copy is now encrypted.\");\n    } catch (e) {\n      this.setState({ vaultBusy: false, vaultErr: String(e.message || e).slice(0, 240) });\n    }\n  }\n\n  /* Appearance is a preference, not project data: it lives under its own key so\n     it survives a reset, works before the vault is unlocked, and never travels\n     in a backup or a cloud push. */\n  toggleTheme() {\n    const next = this.state.theme === \"dark\" ? \"light\" : \"dark\";\n    try { localStorage.setItem(\"isms-theme\", next); } catch (e) { /* private mode */ }\n    document.documentElement.setAttribute(\"data-theme\", next);\n    this.setState({ theme: next });\n  }\n\n  /* Called after every successful local write. */\n  autoPush() {\n    const c = this.state.cfg || {};\n    if (!c.autoSync || !c.jbKey || !c.jbId) return;\n    if (this.autoPulling) return;\n    if (this.state.locked) return;\n    clearTimeout(this.autoTimer);\n    this.autoTimer = setTimeout(() => {\n      if (this.syncing) { this.autoQueued = true; return; }\n      this.syncing = true;\n      this.syncPush().catch(() => {}).then(() => {\n        this.syncing = false;\n        if (this.autoQueued) { this.autoQueued = false; this.autoPush(); }\n      });\n    }, 4000);\n  }\n\n  /* Returns true only if the file actually left, because archive-and-start\n     clears the browser on the strength of that answer. */\n  downloadArchive() {\n    try {\n      const st = this.state.st;\n      const m = this.metrics(this.schedule());\n      const org = (st.project.company || \"organisation\").replace(/[^A-Za-z0-9]+/g, \"-\").replace(/^-|-$/g, \"\").toLowerCase();\n      const stamp = new Date().toISOString().slice(0, 10);\n      const archive = {\n        kind: \"isms-archive\", v: 1, archivedAt: new Date().toISOString(),\n        organisation: st.project.company || \"\", projectManager: st.project.pm || \"\",\n        readiness: {\n          mandatoryOutstanding: m.mandOut, unjustifiedExclusions: m.noWhy,\n          risksAboveAppetite: m.outside, clausesVerified: m.clVer, clausesApplicable: m.clApp,\n        },\n        st,\n      };\n      const a = document.createElement(\"a\");\n      a.href = URL.createObjectURL(new Blob([JSON.stringify(archive, null, 2)], { type: \"application/json\" }));\n      a.download = `isms-archive-${org}-${stamp}.json`;\n      a.click(); URL.revokeObjectURL(a.href);\n      return true;\n    } catch (e) {\n      this.say(\"Could not build the archive: \" + String(e.message || e).slice(0, 120));\n      return false;\n    }\n  }\n\n  async testConnection() {\n    const { jbPull } = this.state.core;\n    const cfg = this.state.cfg || {};\n    if (!cfg.jbKey) { this.setState({ syncMsg: \"Add your jsonbin master key first.\" }); return; }\n    if (!cfg.jbId) { this.setState({ syncMsg: \"No bin id yet. Push once to create one, or paste a connection code.\" }); return; }\n    this.setState({ syncBusy: true, syncMsg: \"\" });\n    try {\n      const raw = await jbPull(cfg.jbKey, cfg.jbId);\n      const enc = !!(raw && raw.enc);\n      this.setState({ syncBusy: false, syncMsg:\n        `Connection works. The bin holds ${enc ? \"an encrypted\" : \"a plaintext\"} copy${enc && !this.vaultKey ? \", which this browser cannot read until the vault is unlocked\" : \"\"}. Nothing was changed.` });\n    } catch (e) {\n      this.setState({ syncBusy: false, syncMsg: \"Connection failed: \" + String(e.message || e).slice(0, 200) });\n    }\n  }\n\n  /* One backup path, so the shortcut and the button cannot drift apart. */\n  backupNow() {\n    try {\n      const a = document.createElement(\"a\");\n      a.href = URL.createObjectURL(new Blob([JSON.stringify(this.state.st, null, 2)], { type: \"application/json\" }));\n      a.download = `isms-backup-${new Date().toISOString().slice(0, 10)}.json`;\n      a.click(); URL.revokeObjectURL(a.href);\n      this.say(\"Backup downloaded.\");\n    } catch (e) { this.say(\"Could not build the backup: \" + String(e.message || e).slice(0, 120)); }\n  }\n\n  /* Reload inside the idle window: the exported key is still in sessionStorage,\n     so unseal with it and open. Any failure falls through to the lock screen\n     rather than guessing — a stale key is discarded, never retried. */\n  async resumeSession() {\n    const { loadSession, dropSession, unseal, hydrate, KEY } = this.state.core;\n    try {\n      const key = await loadSession();\n      if (!key) return;\n      const blob = JSON.parse(localStorage.getItem(KEY) || \"null\");\n      if (!blob || !blob.__enc) { dropSession(); return; }\n      const data = await unseal(key, blob);\n      this.vaultKey = key;\n      this.setState({\n        locked: false, encrypted: true, vaultPass: \"\", vaultCode: \"\", vaultErr: \"\",\n        st: this.propagate(this.state.core, hydrate(data)),\n      }, () => this.say(\"Unlocked for this tab — the session had not timed out.\"));\n    } catch (e) { this.state.core.dropSession(); }\n  }\n\n  /* Activity extends the window. Throttled to once a minute: the point is to\n     avoid locking someone out mid-task, not to rewrite storage on every keypress. */\n  bindIdle() {\n    if (this.idleOn) return;\n    this.idleOn = () => {\n      const now = Date.now();\n      if (this.lastTouch && now - this.lastTouch < 60000) return;\n      this.lastTouch = now;\n      const mins = Number((this.state.cfg || {}).idleMins);\n      if (mins) this.state.core.touchSession(mins);\n    };\n    [\"pointerdown\", \"keydown\"].forEach(t => window.addEventListener(t, this.idleOn, { passive: true }));\n  }\n\n  async unlockVault(pass, code) {\n    const { deriveKey, unseal, VAULT_KEY, KEY, totpValid, hydrate } = this.state.core;\n    this.setState({ vaultBusy: true, vaultErr: \"\" });\n    try {\n      const meta = JSON.parse(localStorage.getItem(VAULT_KEY) || \"{}\");\n      if (meta.totp && !(await totpValid(meta.totp, code))) throw new Error(\"That authenticator code is not valid right now.\");\n      const key = await deriveKey(pass, meta.salt);\n      const blob = JSON.parse(localStorage.getItem(KEY) || \"{}\");\n      const data = await unseal(key, blob);\n      this.vaultKey = key;\n      await this.state.core.saveSession(key, Number((this.state.cfg || {}).idleMins));\n      const st = this.propagate(this.state.core, hydrate(data));\n      this.setState({ vaultBusy: false, locked: false, encrypted: true, st, vaultPass: \"\", vaultCode: \"\" });\n    } catch (e) {\n      this.setState({ vaultBusy: false, vaultErr: \"That passphrase did not open the vault.\" });\n    }\n  }\n\n  async removeVault() {\n    const { VAULT_KEY, KEY } = this.state.core;\n    if (!confirm(\"Turn the vault off? Browser storage goes back to plain JSON on this machine.\")) return;\n    try {\n      localStorage.removeItem(VAULT_KEY);\n      localStorage.setItem(KEY, JSON.stringify(this.state.st));\n      this.state.core.dropSession();\n    } catch (e) { /* quota */ }\n    this.vaultKey = null;\n    this.setState({ hasVault: false });\n    this.say(\"Vault off. This browser's copy is plain JSON again.\");\n  }\n\n  /* Cloud sync. The state object is sealed with the vault key before it leaves,\n     so jsonbin holds ciphertext it cannot read. Attachments live under their own\n     key and are never part of this payload. */\n  async syncPush() {\n    const { jbPush, jbCreate, seal, SYNC_V } = this.state.core;\n    const cfg = this.state.cfg || {};\n    this.setState({ syncBusy: true, syncMsg: \"\" });\n    try {\n      if (!cfg.jbKey) throw new Error(\"Add your jsonbin master key first.\");\n      const payload = this.vaultKey\n        ? { v: SYNC_V, enc: true, ...(await seal(this.vaultKey, this.state.st)) }\n        : { v: SYNC_V, enc: false, st: this.state.st };\n      let id = cfg.jbId;\n      if (!id) { id = await jbCreate(cfg.jbKey, payload); this.upCfg({ jbId: id }); }\n      else await jbPush(cfg.jbKey, id, payload);\n      this.upCfg({ lastSync: new Date().toISOString() });\n      this.setState({ syncBusy: false, syncMsg: this.vaultKey\n        ? \"Pushed, encrypted with your vault passphrase.\"\n        : \"Pushed. No vault is on, so this copy is readable by anyone with the key — turn the vault on first if that matters.\" });\n    } catch (e) { this.setState({ syncBusy: false, syncMsg: \"Push failed: \" + String(e.message || e).slice(0, 200) }); }\n  }\n\n  async syncPull() {\n    const { jbPull, unseal, hydrate } = this.state.core;\n    const cfg = this.state.cfg || {};\n    this.setState({ syncBusy: true, syncMsg: \"\" });\n    try {\n      if (!cfg.jbKey || !cfg.jbId) throw new Error(\"Add your jsonbin key and bin id first.\");\n      if (!confirm(\"Pull replaces this browser's project with the cloud copy. Download a backup first if you are unsure.\")) {\n        this.setState({ syncBusy: false }); return;\n      }\n      const raw = await jbPull(cfg.jbKey, cfg.jbId);\n      let data = raw && raw.enc ? await unseal(this.vaultKey, raw) : (raw && raw.st ? raw.st : raw);\n      if (raw && raw.enc && !this.vaultKey) throw new Error(\"That copy is encrypted. Unlock the vault on this machine first.\");\n      const st = this.propagate(this.state.core, hydrate(data));\n      this.setState({ syncBusy: false, st, syncMsg: \"Pulled.\" }, () => this.persist(st));\n    } catch (e) { this.setState({ syncBusy: false, syncMsg: \"Pull failed: \" + String(e.message || e).slice(0, 200) }); }\n  }\n\n  /* The assistant. Two ways in: ask it something, or select text anywhere in the\n     tracker and press Explain. It is given the current tab and the live counts,\n     so \"what should I do next\" gets an answer about this project rather than\n     about ISO 27001 in general. It never writes to the project. */\n  componentDidUpdate() {\n    if (this.selBound) return;\n    this.selBound = true;\n    document.addEventListener(\"selectionchange\", () => {\n      const t = String(document.getSelection() || \"\").trim();\n      if (t.length > 3 && t.length < 1200) this.setState({ aiSel: t.slice(0, 1200) });\n      else if (!t) this.setState({ aiSel: \"\" });\n    });\n  }\n\n  aiContext() {\n    const st = this.state.st;\n    if (!st) return \"\";\n    const m = this.metrics(this.schedule());\n    const tab = (NAV[this.state.tab] || {}).n;\n    return [\n      `The user is on the \"${tab}\" tab.`,\n      `Organisation: ${st.project.company || \"unnamed\"}.`,\n      `Mandatory documents outstanding: ${m.mandOut} of ${m.mandN}.`,\n      `Sub-clauses verified: ${m.clVer} of ${m.clApp}.`,\n      `Annex A: ${m.appN} applicable, ${m.exclN} excluded, ${m.ctImp} implemented, ${m.noWhy} exclusions unjustified.`,\n      `Risks: ${st.risks.length} logged, ${m.outside} above the acceptance threshold of ${st.threshold}.`,\n      `Risk method: ${st.rmethod || \"asset\"}, ${st.ranalysis || \"qualitative\"}.`,\n    ].join(\" \");\n  }\n\n  async askAssistant(question, selection) {\n    const { askClaude, SYSTEM } = this.state.core;\n    this.setState({ aiBusy: true, aiA: \"\" });\n    try {\n      const prompt = selection\n        ? `${this.aiContext()}\\n\\nThe user selected this text in the tracker and asked for an explanation:\\n\\n\"\"\"${selection}\"\"\"\\n\\n${question || \"Explain what this means and what it requires of them.\"}`\n        : `${this.aiContext()}\\n\\n${question}`;\n      const text = await askClaude({\n        system: SYSTEM, messages: [{ role: \"user\", content: prompt }],\n        apiKey: (this.state.cfg || {}).anthropicKey,\n      });\n      this.setState({ aiBusy: false, aiA: String(text || \"\").trim() || \"No answer came back.\" });\n    } catch (e) {\n      this.setState({ aiBusy: false, aiA: \"Could not reach the model: \" + String(e.message || e).slice(0, 220) });\n    }\n  }\n\n  /* docxFrom and xlsxFrom hand back a Blob — this is what actually saves it. */\n  saveBlob(blob, name) {\n    if (!blob) { this.say(\"Nothing to export.\"); return; }\n    const a = document.createElement(\"a\");\n    a.href = URL.createObjectURL(blob);\n    a.download = name.replace(/[\\\\/:*?\"<>|]/g, \"-\");\n    a.click();\n    setTimeout(() => URL.revokeObjectURL(a.href), 4000);\n  }\n\n  say(t) {\n    clearTimeout(this.noteT);\n    this.setState({ docNote: t });\n    this.noteT = setTimeout(() => this.setState({ docNote: \"\" }), 5000);\n  }\n\n  /* Attachments live under their own key and never travel in a cloud push.\n     Anything over the limit stays in memory for the session rather than\n     blowing the storage quota. */\n  attachFile(docId, e) {\n    const { PERSIST_LIMIT, sessionBlobs, prettyBytes } = this.state.core;\n    const file = e.target.files && e.target.files[0];\n    e.target.value = \"\";\n    if (!file) return;\n    sessionBlobs[docId] = file;\n    const m = { name: file.name, size: file.size, type: file.type || \"application/octet-stream\", at: new Date().toISOString() };\n    const put = (rec, msg) => {\n      this.setState(s => {\n        const files = { ...s.files, [docId]: rec };\n        this.persistFiles(files);\n        return { files };\n      });\n      this.say(msg);\n    };\n    if (file.size <= PERSIST_LIMIT) {\n      const fr = new FileReader();\n      fr.onload = () => put({ ...m, data: fr.result }, `${file.name} attached and saved.`);\n      fr.onerror = () => put(m, `${file.name} attached for this session only.`);\n      fr.readAsDataURL(file);\n    } else {\n      put(m, `${file.name} is ${prettyBytes(file.size)} — too large to store. Available until you reload.`);\n    }\n  }\n\n  viewFile(docId) {\n    if (!this.state.core.openAttachment(docId, this.state.files[docId])) {\n      this.say(\"The bytes were not kept after reload. Attach the file again to open it.\");\n    }\n  }\n\n  dropFile(docId) {\n    delete this.state.core.sessionBlobs[docId];\n    this.setState(s => {\n      const files = { ...s.files };\n      delete files[docId];\n      this.persistFiles(files);\n      return { files };\n    });\n  }\n\n  persistFiles(files) {\n    if (this.state.encrypted) return;\n    if ((this.props.dataSource || \"Saved tracker\") !== \"Saved tracker\") return;\n    try { localStorage.setItem(this.state.core.FKEY, JSON.stringify(files)); } catch (e) { /* quota */ }\n  }\n\n  renderVals() {\n    const { tab, navOpen, core, st, encrypted, mobile } = this.state;\n    const mk = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || \"\") ? \"\\u2318\" : \"Ctrl+\";\n    const IDLE_CHOICES = (core && core.IDLE_CHOICES) || [];\n    const t = NAV[tab] || NAV[0];\n    const pct = (v) => `${Math.round(v * 100)}%`;\n\n    const base = {\n      nav: NAV.map((n, i) => ({\n        n: n.n, hint: n.hint,\n        go: () => this.setState(s => ({ tab: i, navOpen: s.mobile ? false : s.navOpen })),\n        current: tab === i ? \"page\" : undefined,\n        edge: tab === i ? \"var(--accent)\" : \"transparent\",\n        bg: tab === i ? \"var(--surface)\" : \"transparent\",\n        fg: tab === i ? \"var(--ink)\" : \"var(--ink-2)\",\n        num: tab === i ? \"var(--accent)\" : \"var(--ink-3)\",\n        weight: tab === i ? 700 : 500,\n      })),\n      navOpen,\n      isDrawer: navOpen && mobile,\n      drawerFlag: mobile ? \"yes\" : \"no\",\n      navPos: mobile ? \"fixed\" : \"sticky\",\n      navTop: \"66px\",\n      navZ: mobile ? 26 : 1,\n      navBg: mobile ? \"var(--surface)\" : \"transparent\",\n      navShadow: mobile ? \"6px 0 24px rgba(38,36,31,.18)\" : \"none\",\n      navEdge: mobile ? \"var(--ink-3)\" : \"transparent\",\n      navMaxH: \"calc(100vh - 66px)\",\n      navGlyph: mobile ? \"☰\" : (navOpen ? \"◧\" : \"▤\"),\n      /* Assistant */\n      aiOpen: this.state.aiOpen, aiQ: this.state.aiQ, aiA: this.state.aiA,\n      aiBusy: this.state.aiBusy, hasAiA: !!this.state.aiA,\n      noAiA: !this.state.aiA && !this.state.aiBusy,\n      aiSel: this.state.aiSel, hasSel: !!this.state.aiSel,\n      selPreview: this.state.aiSel.length > 90 ? this.state.aiSel.slice(0, 90) + \"…\" : this.state.aiSel,\n      /* One character, three moods, each derived — never a mood the assistant\n         is not actually in. The line it greets you with names what this tab is\n         for, so the character is a way into the work rather than decoration. */\n      annexaBusy: !!this.state.aiBusy,\n      annexaAlert: !!this.state.aiA && !this.state.aiOpen,\n      annexaFace: this.state.aiBusy ? \"busy-face\" : \"\",\n      annexaTone: this.state.aiBusy ? \"var(--warn)\" : (this.state.aiA ? \"var(--ok)\" : \"var(--accent)\"),\n      annexaMouth: this.state.aiBusy\n        ? \"M 15 26.8 H 23\"\n        : (this.state.aiA ? \"M 13.6 25.6 Q 19 30.6 24.4 25.6\" : \"M 14.6 26.3 Q 19 29.2 23.4 26.3\"),\n      annexaState: this.state.aiBusy ? \"Thinking…\" : (this.state.aiA ? \"Answer ready\" : \"Ask me anything\"),\n      annexaLine: this.state.aiBusy\n        ? \"Reading your project…\"\n        : (this.state.aiA ? \"I have an answer for you\" : [\n            \"Ask me where you stand\",\n            \"Ask me which step is next\",\n            \"Ask me which document t
