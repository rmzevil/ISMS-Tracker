           <sc-for list=\"{{ soaThemes }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <div>\n                  <div style=\"background: var(--solid); color: var(--on-fill); padding: 9px 12px; border-radius: 3px; display: flex; align-items: center; gap: 9px; margin-top: 6px\">\n                    <button sc-camel-on-click=\"{{ t.toggle }}\" aria-expanded=\"{{ t.ariaOpen }}\" aria-label=\"Toggle theme\" style=\"font-family: var(--mono); font-size: 11px; padding: 2px 8px; border: 1px solid var(--ink-2); border-radius: 2px; background: transparent; color: var(--on-fill); cursor: pointer\">{{ t.glyph }}<\u002Fbutton>\n                    <span style=\"font-family: var(--mono); font-size: 11px; opacity: .65\">{{ t.g }}<\u002Fspan>\n                    <span style=\"flex: 1; font-weight: 700; font-size: 13px\">{{ t.name }}<\u002Fspan>\n                    <span style=\"font-family: var(--mono); font-size: 9.5px; opacity: .72\">{{ t.meta }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ t.rows }}\" as=\"c\" hint-placeholder-count=\"4\">\n                    <div data-row-id=\"{{ c.id }}\" class=\"card {{ c.flash }}\" style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid {{ c.statusTone }}; border-radius: 3px; padding: 12px; margin-top: 8px\">\n                      <div style=\"display: flex; gap: 8px; align-items: center; margin-bottom: 5px\">\n                        <span style=\"font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: var(--accent)\">{{ c.id }}<\u002Fspan>\n                        <sc-if value=\"{{ c.isNew }}\">\n                          <span style=\"font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: .07em; color: var(--accent); border: 1px solid var(--accent); border-radius: 2px; padding: 1px 4px\">NEW 2022<\u002Fspan>\n                        <\u002Fsc-if>\n                        <span style=\"flex: 1\"><\u002Fspan>\n                        <button sc-camel-on-click=\"{{ c.toggleApp }}\" aria-label=\"Toggle applicability\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .07em; padding: 7px 12px; min-height: 34px; border-radius: 2px; cursor: pointer; border: 1px solid {{ c.appEdge }}; background: {{ c.appBg }}; color: {{ c.appFg }}\">{{ c.appWord }}<\u002Fbutton>\n                      <\u002Fdiv>\n                      <div style=\"font-size: 13px; font-weight: 600; line-height: 1.35\">{{ c.title }}<\u002Fdiv>\n                      <div style=\"font-family: var(--mono); font-size: 9px; letter-spacing: .07em; color: {{ c.srcTone }}; margin: 4px 0 9px\">{{ c.srcLabel }}<\u002Fdiv>\n                      <div style=\"display: grid; gap: 7px\">\n                        <sc-if value=\"{{ c.app }}\">\n                          <sc-raw-select value=\"{{ c.status }}\" sc-camel-on-change=\"{{ c.setStatus }}\" aria-label=\"Control status\" style=\"font-family: var(--mono); font-size: 11px; width: 100%; min-height: 44px; border-left: 3px solid {{ c.statusTone }}\">\n                            <sc-for list=\"{{ c.statuses }}\" as=\"o\" hint-placeholder-count=\"3\">\n                              <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                            <\u002Fsc-for>\n                          <\u002Fsc-raw-select>\n                          <input type=\"text\" value=\"{{ c.owner }}\" sc-camel-on-change=\"{{ c.setOwner }}\" placeholder=\"control owner — required by A.5.2\" aria-label=\"Control owner\" style=\"width: 100%; min-height: 44px; border-color: {{ c.ownerEdge }}; background: {{ c.ownerBg }}\">\n                        <\u002Fsc-if>\n                        <textarea value=\"{{ c.why }}\" sc-camel-on-change=\"{{ c.setWhy }}\" rows=\"3\" placeholder=\"why this control is included or excluded\" aria-label=\"Justification\" style=\"width: 100%; resize: vertical; line-height: 1.55\"><\u002Ftextarea>\n                        <div style=\"display: flex; gap: 7px; align-items: center; flex-wrap: wrap\">\n                          <sc-if value=\"{{ c.whyManual }}\">\n                            <span style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .07em; padding: 3px 6px; border-radius: 2px; border: 1px solid var(--accent); color: var(--accent)\">YOURS<\u002Fspan>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ c.canCite }}\">\n                            <button sc-camel-on-click=\"{{ c.cite }}\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer\">CITE<\u002Fbutton>\n                          <\u002Fsc-if>\n                          <sc-for list=\"{{ c.riskChips }}\" as=\"r\" hint-placeholder-count=\"1\">\n                            <button sc-camel-on-click=\"{{ r.go }}\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 9px 12px; min-height: 38px; border: 1px solid var(--accent); border-radius: 2px; background: var(--surface); color: var(--accent); cursor: pointer\">{{ r.id }}<\u002Fbutton>\n                          <\u002Fsc-for>\n                          <sc-for list=\"{{ c.docChips }}\" as=\"d\" hint-placeholder-count=\"1\">\n                            <button sc-camel-on-click=\"{{ d.go }}\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 9px 12px; min-height: 38px; border: 1px solid {{ d.tone }}; border-radius: 2px; background: var(--surface); color: {{ d.tone }}; cursor: pointer\">{{ d.id }}<\u002Fbutton>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <p style=\"font-size: 11px; color: var(--ink-3); margin-top: 12px; max-width: 900px; line-height: 1.65\">Applicability is decided, never defaulted, in strict precedence: a risk citing the control wins, then the organisation profile, then a covering document, then the baseline ISMS set. <b>Decided by<\u002Fb> names which of those settled it. Override the decision and it becomes <b>YOURS<\u002Fb> — the engine stops writing that row, and that provenance is what an auditor asks for under 6.1.3 d).<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isStub }}\">\n        <div style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--line-2); padding: 16px 18px; border-radius: 3px; max-width: 720px\">\n          <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">Not ported yet<\u002Fdiv>\n          <p style=\"margin: 8px 0 10px; font-size: 12.5px; line-height: 1.7; color: var(--ink-2)\">{{ stubNote }}<\u002Fp>\n          <div style=\"font-family: var(--mono); font-size: 10.5px; color: var(--ink); background: var(--sunken); border-radius: 2px; padding: 8px 10px; display: inline-block\">{{ stubCount }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fmain>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ keysOpen }}\">\n    <div sc-camel-on-click=\"{{ closeKeys }}\" style=\"position: fixed; inset: 0; z-index: 70; background: var(--scrim-2); display: flex; align-items: center; justify-content: center; padding: 72px 16px 20px\">\n      <div class=\"pane\" role=\"dialog\" aria-label=\"Keyboard shortcuts\" style=\"background: var(--surface); border: 1px solid var(--line-2); border-top: 3px solid var(--accent); border-radius: 4px; width: 100%; max-width: 520px; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 22px 60px rgba(44,45,46,.34)\">\n        <div style=\"flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 15px 18px 12px; border-bottom: 1px solid var(--line)\">\n          <span style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">Keyboard<\u002Fspan>\n          <span style=\"flex: 1; font-size: 15px; font-weight: 700\">Shortcuts<\u002Fspan>\n          <button sc-camel-on-click=\"{{ closeKeys }}\" aria-label=\"Close the shortcuts\" style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 7px 12px; min-height: 34px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"scroller\" style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px 18px\">\n          <sc-for list=\"{{ shortcutGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n            <div style=\"margin-bottom: 16px\">\n              <div style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); margin-bottom: 7px\">{{ g.head }}<\u002Fdiv>\n              <sc-for list=\"{{ g.rows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div style=\"display: flex; align-items: baseline; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--hair)\">\n                  <kbd style=\"flex-shrink: 0; min-width: 62px; font-family: var(--mono); font-size: 10.5px; font-weight: 700; text-align: center; padding: 4px 7px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 3px; background: var(--subtle); color: var(--ink)\">{{ r.k }}<\u002Fkbd>\n                  <span style=\"font-size: 12.5px; color: var(--ink-2); line-height: 1.5\">{{ r.w }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <p style=\"margin: 0; font-size: 11.5px; color: var(--ink-3); line-height: 1.6; text-wrap: pretty\">Shortcuts stay out of the way while you are typing in a field, and while a panel is open only Escape and <b>?<\u002Fb> respond.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isSettings }}\">\n        <div style=\"position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 72px 16px 20px\">\n        <div class=\"pane\" role=\"dialog\" aria-label=\"Settings\" style=\"background: var(--page); border: 1px solid var(--line-2); border-radius: 4px; width: 100%; max-width: 920px; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 22px 60px var(--shadow)\">\n        <div data-set-head=\"\" style=\"flex-shrink: 0; background: var(--page); border-bottom: 1px solid var(--line-2); border-radius: 4px 4px 0 0; padding: 16px 18px 12px\">\n          <div style=\"display: flex; justify-content: flex-end\">\n            <button sc-camel-on-click=\"{{ closeSettings }}\" aria-label=\"Close settings\" style=\"display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 9px 15px; min-height: 40px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\" style-hover=\"border-color: var(--accent); color: var(--accent)\"><span aria-hidden=\"true\">✕<\u002Fspan>CLOSE<\u002Fbutton>\n          <\u002Fdiv>\n          <h2 style=\"margin: 6px 0 0; font-size: 21px; font-weight: 700; letter-spacing: -.015em\">Settings<\u002Fh2>\n          <p style=\"margin: 5px 0 0; font-size: 13px; color: var(--ink-2); line-height: 1.6\">Profile, organisation document, keys, vault and backups.<\u002Fp>\n          <div class=\"scroller\" style=\"display: flex; gap: 6px; margin-top: 12px; padding-bottom: 3px; overflow-x: auto\">\n            <sc-for list=\"{{ setNav }}\" as=\"s\" hint-placeholder-count=\"8\">\n              <button sc-camel-on-click=\"{{ s.go }}\" style=\"flex-shrink: 0; font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 7px 10px; min-height: 32px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer; white-space: nowrap\" style-hover=\"border-color: var(--accent); color: var(--accent)\">{{ s.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- minmax(0,1fr) caps the column at the panel width. An implicit grid\n             column is min-content-floored, so one wide child (a table, a long\n             key) pushed the whole panel sideways. -->\n        <div class=\"scroller\" data-set-body=\"\" tabindex=\"0\" style=\"flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 16px 18px 18px\">\n          <div style=\"display: flex; align-items: baseline; gap: 10px; margin-bottom: -4px\">\n            <h2 style=\"margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .02em\">Project<\u002Fh2>\n            <span style=\"flex: 1; height: 1px; background: var(--line)\"><\u002Fspan>\n          <\u002Fdiv>\n          <section id=\"set-project\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">This project<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: var(--ink-2); line-height: 1.6\">Used on every generated document and as the anchor date for the plan.<\u002Fp>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 11px\">\n              <label style=\"display: block\">\n                <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Organisation<\u002Fspan>\n                <input type=\"text\" value=\"{{ company }}\" sc-camel-on-change=\"{{ setCompany }}\" placeholder=\"the legal entity being certified\" aria-label=\"Organisation\" style=\"width: 100%; min-height: 38px\">\n              <\u002Flabel>\n              <label style=\"display: block\">\n                <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Project start<\u002Fspan>\n                <input type=\"date\" value=\"{{ startDate }}\" sc-camel-on-change=\"{{ setStart }}\" aria-label=\"Project start date\" style=\"width: 100%; min-height: 38px\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <label style=\"display: block; margin-top: 11px\">\n              <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">ISMS scope · clause 4.3<\u002Fspan>\n              <textarea value=\"{{ scope }}\" sc-camel-on-change=\"{{ setScope }}\" rows=\"3\" placeholder=\"what the ISMS covers, and what it deliberately excludes\" aria-label=\"ISMS scope\" style=\"width: 100%; resize: vertical; line-height: 1.6\"><\u002Ftextarea>\n            <\u002Flabel>\n            <label style=\"display: block; margin-top: 11px\">\n              <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px\">Project manager<\u002Fspan>\n              <input type=\"text\" value=\"{{ pmName }}\" sc-camel-on-change=\"{{ setPm }}\" placeholder=\"who owns delivery of this ISMS\" aria-label=\"Project manager\" style=\"width: 100%; max-width: 360px; min-height: 38px\">\n            <\u002Flabel>\n            <div style=\"display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line)\">\n              <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">Certification decision expected<\u002Fspan>\n              <span style=\"font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--ink)\">{{ certDate }}<\u002Fspan>\n              <span style=\"flex: 1; min-width: 220px; font-size: 11.5px; color: var(--ink-3); line-height: 1.55\">Derived from the last task in the plan, so it moves when the plan moves — a projection, not a booking.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          \n\n          \n\n          \n\n          \n\n          <div style=\"display: flex; align-items: baseline; gap: 10px; margin: 10px 0 -4px\">\n            <h2 style=\"margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .02em\">Connections<\u002Fh2>\n            <span style=\"flex: 1; height: 1px; background: var(--line)\"><\u002Fspan>\n            <span style=\"font-size: 11.5px; color: var(--ink-3)\">Keys are held in this browser only and never enter an export or a push.<\u002Fspan>\n          <\u002Fdiv>\n\n          <section id=\"set-vault\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Vault — encrypt this browser's copy<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: var(--ink-2); line-height: 1.6; max-width: 680px; text-wrap: pretty\">A passphrase derives an AES-GCM key, and everything written to browser storage goes through it. <b>Forgetting the passphrase loses the project<\u002Fb> — there is no recovery path, so keep a downloaded backup somewhere you trust.<\u002Fp>\n            <label style=\"display: flex; align-items: center; gap: 9px; flex-wrap: wrap; background: var(--subtle); border-radius: 3px; padding: 10px 12px; margin-bottom: 11px\">\n              <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">Ask again after<\u002Fspan>\n              <sc-raw-select value=\"{{ idleMins }}\" sc-camel-on-change=\"{{ setIdle }}\" aria-label=\"Re-ask for the passphrase after\" style=\"min-height: 36px; font-family: var(--mono); font-size: 11.5px\">\n                <sc-for list=\"{{ idleChoices }}\" as=\"c\" hint-placeholder-count=\"9\">\n                  <option value=\"{{ c.v }}\">{{ c.label }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n              <span style=\"font-size: 11.5px; color: var(--ink-2); line-height: 1.5\">of no activity. A refresh inside that window does not ask again; closing the tab always does.<\u002Fspan>\n            <\u002Flabel>\n            <p style=\"margin: 0 0 12px; font-size: 11.5px; color: var(--ink-3); line-height: 1.6; max-width: 680px; text-wrap: pretty\">Worth being straight about the limit: the unlocked key is held in this tab's session storage, so anyone with access to the machine while the tab is open can reach it. The encryption is what has real strength — without the passphrase the saved data is genuinely unreadable. Treat the window as convenience, not as an access control.<\u002Fp>\n            <sc-if value=\"{{ hasVault }}\">\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n                <span style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--ok)\">VAULT ON — storage holds ciphertext<\u002Fspan>\n                <span style=\"flex: 1\"><\u002Fspan>\n                <button sc-camel-on-click=\"{{ lockNow }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: var(--solid); color: var(--on-fill); cursor: pointer\">LOCK NOW<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ vaultOff }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--danger); border-radius: 2px; background: var(--surface); color: var(--danger); cursor: pointer\">TURN OFF<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noVault }}\">\n              <div style=\"display: grid; gap: 9px; max-width: 460px\">\n                <input type=\"password\" value=\"{{ vaultPass }}\" sc-camel-on-change=\"{{ setVaultPass }}\" placeholder=\"Passphrase — at least 10 characters\" aria-label=\"New passphrase\" style=\"width: 100%; min-height: 38px\">\n                <input type=\"password\" value=\"{{ vaultPass2 }}\" sc-camel-on-change=\"{{ setVaultPass2 }}\" placeholder=\"Repeat the passphrase\" aria-label=\"Repeat passphrase\" style=\"width: 100%; min-height: 38px\">\n                <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n                  <button sc-camel-on-click=\"{{ genTotp }}\" style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .06em; padding: 9px 12px; min-height: 36px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">ADD AN AUTHENTICATOR<\u002Fbutton>\n                  <sc-if value=\"{{ hasTotp }}\">\n                    <span style=\"font-family: var(--mono); font-size: 10px; color: var(--ok)\">secret generated — add it below, then enter a code<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <sc-if value=\"{{ hasTotp }}\">\n                  <div style=\"background: var(--subtle); border: 1px solid var(--line); border-radius: 2px; padding: 10px 12px\">\n                    <div style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px\">Add this secret to your authenticator<\u002Fdiv>\n                    <div style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; word-break: break-all; color: var(--ink)\">{{ vaultTotp }}<\u002Fdiv>\n                    <input type=\"text\" value=\"{{ vaultCode }}\" sc-camel-on-change=\"{{ setVaultCode }}\" placeholder=\"Then enter the 6-digit code\" aria-label=\"Authenticator code\" inputmode=\"numeric\" style=\"width: 100%; margin-top: 9px; min-height: 38px\">\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <button sc-camel-on-click=\"{{ turnVaultOn }}\" disabled=\"{{ vaultBusy }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 10px 13px; min-height: 40px; border: none; border-radius: 2px; background: var(--accent-fill); color: var(--on-fill); cursor: pointer\">TURN THE VAULT ON<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasVaultErr }}\">\n              <div style=\"margin-top: 11px; background: var(--danger-wash); border-left: 3px solid var(--danger); border-radius: 2px; padding: 10px 12px; font-size: 12px; line-height: 1.55\">{{ vaultErr }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n\n          <section id=\"set-profile\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Organisation profile<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: var(--ink-2); line-height: 1.6; max-width: 660px; text-wrap: pretty\">These seven answers decide which Annex A controls the engine proposes. A control you have overridden by hand is never touched by a change here.<\u002Fp>\n            <sc-for list=\"{{ profileQs }}\" as=\"p\" hint-placeholder-count=\"7\">\n              <div style=\"display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line)\">\n                <span style=\"flex: 1\">\n                  <span style=\"display: block; font-size: 13px; font-weight: 600; line-height: 1.45\">{{ p.q }}<\u002Fspan>\n                  <sc-if value=\"{{ p.hasHint }}\">\n                    <span style=\"display: block; font-size: 11.5px; color: var(--ink-3); line-height: 1.55; margin-top: 3px\">{{ p.hint }}<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fspan>\n                <span style=\"display: flex; border: 1px solid var(--line-2); border-radius: 2px; overflow: hidden; flex-shrink: 0\">\n                  <button sc-camel-on-click=\"{{ p.setYes }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; padding: 8px 13px; min-height: 36px; border: none; cursor: pointer; background: {{ p.yesBg }}; color: {{ p.yesFg }}\">YES<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ p.setNo }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; padding: 8px 13px; min-height: 36px; border: none; cursor: pointer; background: {{ p.noBg }}; color: {{ p.noFg }}\">NO<\u002Fbutton>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n\n          <section id=\"set-overrides\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Decisions you have taken over<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: var(--ink-2); line-height: 1.6; max-width: 660px; text-wrap: pretty\">Every row here is a place you overruled the engine. It stops deriving that field, which is exactly what you want for a judgement you own — and worth reviewing when the profile or the risk register moves on. Handing one back does not delete anything you typed.<\u002Fp>\n            <sc-if value=\"{{ hasOverrides }}\">\n              <div>\n                <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 9px\">\n                  <span style=\"font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--accent)\">{{ overrideCount }} overridden<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ handBackAll }}\" style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .06em; padding: 7px 11px; min-height: 34px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer\">HAND ALL BACK<\u002Fbutton>\n                <\u002Fdiv>\n                <sc-for list=\"{{ overrides }}\" as=\"o\" hint-placeholder-count=\"3\">\n                  <div style=\"display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line)\">\n                    <span style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .07em; padding: 3px 6px; border-radius: 2px; border: 1px solid var(--accent); color: var(--accent); flex-shrink: 0\">{{ o.kind }}<\u002Fspan>\n                    <span style=\"flex: 1; font-size: 12.5px\">{{ o.what }}<\u002Fspan>\n                    <button sc-camel-on-click=\"{{ o.hand }}\" title=\"Let the engine derive this again\" style=\"font-family: var(--mono); font-size: 9.5px; padding: 6px 10px; min-height: 32px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer; flex-shrink: 0\">HAND BACK<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noOverrides }}\">\n              <p style=\"margin: 0; font-size: 12.5px; color: var(--ink-3)\">Nothing overridden yet. Every status on screen is derived.<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fsection>\n\n          <section id=\"set-key\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">AI assistance API<\u002Fh2>\n            <p style=\"margin: 0 0 11px; font-size: 12px; color: var(--ink-2); line-height: 1.6; max-width: 680px; text-wrap: pretty\">Optional. Without a key, reading a document uses the built-in model. With one, calls go straight from this browser to Anthropic and the key is stored only here.<\u002Fp>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n              <span style=\"display: flex; align-items: stretch; flex: 1; min-width: 220px\">\n                <input type=\"{{ keyType }}\" value=\"{{ aiKey }}\" sc-camel-on-change=\"{{ setAiKey }}\" placeholder=\"sk-ant-…\" aria-label=\"Anthropic API key\" style=\"flex: 1; min-width: 0; min-height: 38px; font-family: var(--mono); border-radius: 2px 0 0 2px\">\n                <button sc-camel-on-click=\"{{ toggleKeyShown }}\" aria-label=\"{{ keyEyeLabel }}\" aria-pressed=\"{{ keyShown }}\" title=\"{{ keyEyeLabel }}\" style=\"flex-shrink: 0; width: 42px; min-height: 38px; border: 1px solid var(--line-2); border-left: none; border-radius: 0 2px 2px 0; background: var(--surface); color: var(--accent); font-size: 13px; line-height: 1; cursor: pointer\" style-hover=\"background: var(--accent-wash)\">{{ keyEye }}<\u002Fbutton>\n              <\u002Fspan>\n              <button sc-camel-on-click=\"{{ clearAiKey }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer\">CLEAR<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-family: var(--mono); font-size: 10px; margin-top: 7px; color: {{ keyTone }}\">{{ keyState }}<\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"set-import\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Read your organisation's own document<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: var(--ink-2); line-height: 1.6; max-width: 680px; text-wrap: pretty\">Upload a company profile, prospectus or intranet page — HTML, PDF, text or Markdown — and it will be read for the things clauses 4.1 to 4.3 ask for: external and internal issues, interested parties, locations, systems, and what belongs inside the scope. Nothing is written until you have seen it and ticked what to keep.<\u002Fp>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n              <label style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; display: flex; align-items: center; border: none; border-radius: 2px; background: var(--accent-fill); color: var(--on-fill); cursor: pointer\">UPLOAD A DOCUMENT<input type=\"file\" accept=\".html,.htm,.pdf,.txt,.md,.json,text/html,application/pdf,text/plain\" sc-camel-on-change=\"{{ pickDoc }}\" aria-label=\"Upload an organisation document\" style=\"display: none\"><\u002Flabel>\n              <sc-if value=\"{{ isImpBusy }}\">\n                <span class=\"busy\" style=\"font-family: var(--mono); font-size: 10.5px; padding: 8px 12px; border-radius: 2px; color: var(--ink-2)\">{{ impBusy }}…<\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ hasImpSrc }}\">\n                <span style=\"font-family: var(--mono); font-size: 10px; color: var(--ink-3)\">{{ impSrc }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <details style=\"margin-top: 11px\">\n              <summary style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); cursor: pointer\">Or paste the relevant sections<\u002Fsummary>\n              <textarea value=\"{{ pasteVal }}\" sc-camel-on-change=\"{{ pasteDoc }}\" rows=\"5\" placeholder=\"Paste the parts of the document that describe the organisation, its market, its sites and its systems.\" aria-label=\"Paste organisation text\" style=\"width: 100%; resize: vertical; margin-top: 8px; line-height: 1.6\"><\u002Ftextarea>\n              <button sc-camel-on-click=\"{{ readPaste }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; margin-top: 7px; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">READ THIS TEXT<\u002Fbutton>\n            <\u002Fdetails>\n            <sc-if value=\"{{ hasImpErr }}\">\n              <div style=\"margin-top: 11px; background: var(--warn-wash); border-left: 3px solid var(--warn); border-radius: 2px; padding: 10px 12px; font-size: 12px; line-height: 1.6\">{{ impErr }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasFound }}\">\n              <div style=\"margin-top: 13px; border-top: 1px solid var(--line); padding-top: 13px\">\n                <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 9px\">What it found — untick anything you do not want<\u002Fdiv>\n                <sc-for list=\"{{ foundRows }}\" as=\"g\" hint-placeholder-count=\"5\">\n                  <div style=\"border: 1px solid var(--line); border-radius: 2px; padding: 10px 11px; margin-bottom: 8px\">\n                    <div style=\"display: flex; align-items: center; gap: 9px; margin-bottom: 6px\">\n                      <button sc-camel-on-click=\"{{ g.toggle }}\" aria-pressed=\"{{ g.on }}\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 5px 10px; min-height: 30px; border: 1px solid var(--line-2); border-radius: 2px; background: {{ g.bg }}; color: {{ g.fg }}; cursor: pointer\">KEEP<\u002Fbutton>\n                      <span style=\"font-size: 12.5px; font-weight: 600; flex: 1\">{{ g.label }}<\u002Fspan>\n                      <span style=\"font-family: var(--mono); font-size: 10px; color: var(--ink-3)\">{{ g.count }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                      <div style=\"font-size: 11.5px; color: var(--ink-2); line-height: 1.55; padding: 2px 0 2px 11px; border-left: 2px solid var(--line)\">{{ it.t }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ g.hasMore }}\">\n                      <div style=\"font-family: var(--mono); font-size: 10px; color: var(--ink-3); margin-top: 4px; padding-left: 11px\">{{ g.more }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px\">\n                  <button sc-camel-on-click=\"{{ applyFound }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: var(--ok-fill); color: var(--on-fill); cursor: pointer\">APPLY WHAT IS TICKED<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ discardFound }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer\">DISCARD<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n\n          <section id=\"set-data\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">This browser's data<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: var(--ink-2); line-height: 1.6; max-width: 660px; text-wrap: pretty\">Everything lives in this browser and goes nowhere else. A backup is the only copy that survives clearing site data.<\u002Fp>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n              <button sc-camel-on-click=\"{{ backup }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: var(--solid); color: var(--on-fill); cursor: pointer\">DOWNLOAD BACKUP<\u002Fbutton>\n              <label style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; display: flex; align-items: center; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">RESTORE BACKUP<input type=\"file\" accept=\"application/json\" sc-camel-on-change=\"{{ restore }}\" aria-label=\"Restore a backup\" style=\"display: none\"><\u002Flabel>\n            <\u002Fdiv>\n\n            <div style=\"margin-top: 15px; padding-top: 13px; border-top: 1px solid var(--line)\">\n              <div style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">Archive<\u002Fdiv>\n              <p style=\"margin: 6px 0 10px; font-size: 12px; color: var(--ink-2); line-height: 1.6; max-width: 660px; text-wrap: pretty\">An archive is a backup with the organisation, the date and the readiness stamped into it, so a finished engagement can be filed and told apart from the next one. Archiving and starting over downloads the file first and only clears this browser once the download has fired.<\u002Fp>\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n                <button sc-camel-on-click=\"{{ archiveDl }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">DOWNLOAD ARCHIVE<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ archiveStart }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">ARCHIVE AND START A NEW ORGANISATION<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"margin-top: 15px; border: 1px solid var(--danger); border-radius: 3px; background: var(--danger-wash); padding: 13px\">\n              <div style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--danger)\">Danger zone<\u002Fdiv>\n              <p style=\"margin: 6px 0 10px; font-size: 12px; color: var(--ink-2); line-height: 1.6; max-width: 640px; text-wrap: pretty\">Reset clears the project, the answers, the risks, the settings, the vault and the attachments from this browser. Nothing is uploaded anywhere first, and there is no undo.<\u002Fp>\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n                <button sc-camel-on-click=\"{{ newProject }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--danger); border-radius: 2px; background: var(--surface); color: var(--danger); cursor: pointer\">START A NEW PROJECT<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ resetAll }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: var(--danger-fill); color: var(--on-fill); cursor: pointer\">RESET EVERYTHING<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"set-sync\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Cloud sync<\u002Fh2>\n            <p style=\"margin: 0 0 11px; font-size: 12px; color: var(--ink-2); line-height: 1.6; max-width: 680px; text-wrap: pretty\">Pushes the project to a private bin on your own jsonbin account, so you can carry it between machines. Attachments stay here — they live under a separate key and are never part of the payload.<\u002Fp>\n            <div style=\"font-family: var(--mono); font-size: 10.5px; margin-bottom: 11px; color: {{ syncWarnTone }}\">{{ syncWarn }}<\u002Fdiv>\n            <div style=\"display: grid; gap: 9px; max-width: 520px\">\n              <span style=\"display: flex; align-items: stretch\">\n                <input type=\"{{ jbType }}\" value=\"{{ jbKey }}\" sc-camel-on-change=\"{{ setJbKey }}\" placeholder=\"jsonbin master key\" aria-label=\"jsonbin master key\" style=\"flex: 1; min-width: 0; min-height: 38px; font-family: var(--mono); border-radius: 2px 0 0 2px\">\n                <button sc-camel-on-click=\"{{ toggleJbShown }}\" aria-label=\"{{ jbEyeLabel }}\" aria-pressed=\"{{ jbShown }}\" title=\"{{ jbEyeLabel }}\" style=\"flex-shrink: 0; width: 42px; min-height: 38px; border: 1px solid var(--line-2); border-left: none; border-radius: 0 2px 2px 0; background: var(--surface); color: var(--accent); font-size: 13px; line-height: 1; cursor: pointer\" style-hover=\"background: var(--accent-wash)\">{{ jbEye }}<\u002Fbutton>\n              <\u002Fspan>\n              <input type=\"text\" value=\"{{ jbId }}\" sc-camel-on-change=\"{{ setJbId }}\" placeholder=\"bin id — left empty, a push creates one\" aria-label=\"jsonbin bin id\" style=\"width: 100%; min-height: 38px; font-family: var(--mono)\">\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n                <button sc-camel-on-click=\"{{ doPush }}\" disabled=\"{{ syncBusy }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: var(--solid); color: var(--on-fill); cursor: pointer\">PUSH<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ doPull }}\" disabled=\"{{ syncBusy }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">PULL<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ testConn }}\" disabled=\"{{ syncBusy }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">TEST CONNECTION<\u002Fbutton>\n                <span style=\"font-family: var(--mono); font-size: 10px; color: var(--ink-3)\">{{ lastSync }}<\u002Fspan>\n              <\u002Fdiv>\n              <label style=\"display: flex; align-items: flex-start; gap: 9px; background: var(--subtle); border-radius: 3px; padding: 10px 12px\">\n                <input type=\"checkbox\" checked=\"{{ autoSync }}\" sc-camel-on-change=\"{{ toggleAutoSync }}\" aria-label=\"Sync automatically\" style=\"margin-top: 2px\">\n                <span>\n                  <span style=\"display: block; font-size: 12.5px; font-weight: 600\">Sync automatically<\u002Fspan>\n                  <span style=\"display: block; font-size: 11.5px; color: var(--ink-2); line-height: 1.55; margin-top: 2px\">Pulls once when the tracker opens, then pushes a few seconds after each change. Last write wins — this carries a project between your own machines, it does not merge two people's edits.<\u002Fspan>\n                <\u002Fspan>\n              <\u002Flabel>\n            <\u002Fdiv>\n\n            <div style=\"margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line)\">\n              <div style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">Connection code<\u002Fdiv>\n              <p style=\"margin: 6px 0 9px; font-size: 12px; color: var(--ink-2); line-height: 1.6; max-width: 660px; text-wrap: pretty\">One string carrying the key and the bin id, so a second machine does not have to retype them. It grants full access to that private bin — treat it exactly like the key itself, and never paste it anywhere you would not paste a password.<\u002Fp>\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n                <button sc-camel-on-click=\"{{ copyConn }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">COPY CODE<\u002Fbutton>\n                <input type=\"text\" value=\"{{ connIn }}\" sc-camel-on-change=\"{{ setConnIn }}\" placeholder=\"paste a connection code\" aria-label=\"Connection code\" style=\"flex: 1; min-width: 180px; min-height: 38px\">\n                <button sc-camel-on-click=\"{{ applyConn }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: var(--solid); color: var(--on-fill); cursor: pointer\">APPLY<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasSyncMsg }}\">\n              <div style=\"margin-top: 11px; background: var(--subtle); border-left: 3px solid var(--line-2); border-radius: 2px; padding: 10px 12px; font-size: 12px; line-height: 1.55\">{{ syncMsg }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n          \n\n          \n\n          \n        <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n  <sc-if value=\"{{ buildOpen }}\">\n        <div style=\"position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 72px 16px 20px\">\n        <div class=\"pane\" role=\"dialog\" aria-label=\"Document builder\" style=\"background: var(--page); border: 1px solid var(--line-2); border-radius: 4px; width: 100%; max-width: 940px; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 22px 60px var(--shadow)\">\n          <div style=\"flex-shrink: 0; background: var(--surface); border-bottom: 2px solid var(--ink); padding: 13px 16px\">\n            <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap\">\n              <span style=\"font-family: var(--mono); font-size: 12px; font-weight: 800; color: var(--accent)\">{{ bId }}<\u002Fspan>\n              <span style=\"flex: 1; min-width: 180px; font-size: 15px; font-weight: 700\">{{ bName }}<\u002Fspan>\n              <sc-raw-select value=\"{{ bStatus }}\" sc-camel-on-change=\"{{ setBStatus }}\" aria-label=\"Document status\" style=\"font-family: var(--mono); font-size: 11px; min-height: 34px; border-left: 3px solid {{ bStatusTone }}\">\n                <sc-for list=\"{{ bStatuses }}\" as=\"o\" hint-placeholder-count=\"6\">\n                  <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n              <button sc-camel-on-click=\"{{ closeBuild }}\" aria-label=\"Close the document builder\" style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 8px 13px; min-height: 36px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">CLOSE ✕<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 10px; margin-top: 9px\">\n              <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">{{ bRef }}<\u002Fspan>\n              <span style=\"flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden\">\n                <span style=\"display: block; height: 100%; width: {{ bBarW }}; background: {{ bTone }}; border-radius: 3px; transition: width .3s ease\"><\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: {{ bTone }}\">{{ bProgress }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"scroller\" style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 16px\">\n            <sc-if value=\"{{ bHasWhy }}\">\n              <p style=\"margin: 0 0 14px; font-size: 12.5px; line-height: 1.65; color: var(--ink-2); background: var(--surface); border-left: 3px solid var(--accent-wash); border-radius: 2px; padding: 11px 13px; text-wrap: pretty\">{{ bWhy }}<\u002Fp>\n            <\u002Fsc-if>\n\n            <sc-for list=\"{{ bQs }}\" as=\"q\" hint-placeholder-count=\"6\">\n              <div style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid {{ q.edge }}; border-radius: 3px; padding: 13px; margin-bottom: 10px\">\n                <div style=\"display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin-bottom: 6px\">\n                  <span style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 800; color: var(--ink-3)\">{{ q.n }}<\u002Fspan>\n                  <span style=\"flex: 1; min-width: 200px; font-size: 13px; font-weight: 600; line-height: 1.45\">{{ q.q }}<\u002Fspan>\n                  <sc-if value=\"{{ q.live }}\">\n                    <span title=\"The tracker keeps this in step with the register\" style=\"font-family: var(--mono); font-size: 8.5px; font-weight: 700; letter-spacing: .09em; padding: 3px 6px; border-radius: 2px; background: var(--ok-wash); color: var(--ok)\">LIVE<\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ q.overridden }}\">\n                    <span style=\"display: inline-flex; gap: 6px; align-items: center\">\n                      <span style=\"font-family: var(--mono); font-size: 8.5px; font-weight: 700; letter-spacing: .09em; padding: 3px 6px; border-radius: 2px; border: 1px solid var(--accent); color: var(--accent)\">YOURS<\u002Fspan>\n                      <button sc-camel-on-click=\"{{ q.handBack }}\" title=\"Let the tracker keep this in step again\" style=\"font-family: var(--mono); font-size: 9px; padding: 4px 7px; min-height: 28px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink-2); cursor: pointer\">HAND BACK<\u002Fbutton>\n                    <\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <sc-if value=\"{{ q.hasHint }}\">\n                  <p style=\"margin: 0 0 8px; font-size: 11.5px; line-height: 1.6; color: var(--ink-3); text-wrap: pretty\">{{ q.hint }}<\u002Fp>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ q.isText }}\">\n                  <input type=\"text\" value=\"{{ q.v }}\" sc-camel-on-change=\"{{ q.set }}\" placeholder=\"{{ q.ph }}\" aria-label=\"{{ q.q }}\" style=\"width: 100%; min-height: 38px\">\n                <\u002Fsc-if>\n                <sc-if value=\"{{ q.isSelect }}\">\n                  <sc-raw-select value=\"{{ q.v }}\" sc-camel-on-change=\"{{ q.set }}\" aria-label=\"{{ q.q }}\" style=\"width: 100%; min-height: 38px; font-size: 12px\">\n                    <option value=\"\">— choose —<\u002Foption>\n                    <sc-for list=\"{{ q.opts }}\" as=\"o\" hint-placeholder-count=\"3\">\n                      <option value=\"{{ o.o }}\">{{ o.o }}<\u002Foption>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ q.isArea }}\">\n                  <textarea value=\"{{ q.v }}\" sc-camel-on-change=\"{{ q.set }}\" rows=\"3\" placeholder=\"{{ q.ph }}\" aria-label=\"{{ q.q }}\" style=\"width: 100%; resize: vertical; line-height: 1.6\"><\u002Ftextarea>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ q.isList }}\">\n                  <textarea value=\"{{ q.v }}\" sc-camel-on-change=\"{{ q.set }}\" rows=\"4\" placeholder=\"{{ q.ph }}\" aria-label=\"{{ q.q }} — one per line\" style=\"width: 100%; resize: vertical; line-height: 1.6\"><\u002Ftextarea>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px\">\n              <button sc-camel-on-click=\"{{ toggleBPreview }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: var(--solid); color: var(--on-fill); cursor: pointer\">{{ bPreviewLabel }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ copyDoc }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">COPY MARKDOWN<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ downloadWord }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: var(--accent-fill); color: var(--on-fill); cursor: pointer\">DOWNLOAD WORD<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ downloadDoc }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">MARKDOWN<\u002Fbutton>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ bPreviewOpen }}\">\n              <pre style=\"margin: 14px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px; font-family: var(--mono); font-size: 11.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; color: var(--ink); max-height: 60vh; overflow: auto\">{{ bRendered }}<\u002Fpre>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n  <sc-if value=\"{{ heatOpen }}\">\n            <div sc-camel-on-click=\"{{ closeHeat }}\" style=\"position: fixed; inset: 0; z-index: 62; background: var(--scrim-2); display: flex; align-items: center; justify-content: center; padding: 72px 16px 20px\">\n            <div class=\"pane\" role=\"dialog\" aria-label=\"Risk heat map\" sc-camel-on-click=\"{{ stop }}\" style=\"background: var(--surface); border: 1px solid var(--line-2); border-top: 3px solid var(--accent); border-radius: 4px; width: 100%; max-width: 640px; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 22px 60px rgba(44,45,46,.34)\">\n              <div style=\"flex-shrink: 0; display: flex; align-items: center; gap: 9px; padding: 16px 18px 12px; flex-wrap: wrap\">\n                <span style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">Heat map<\u002Fspan>\n                <span style=\"flex: 1\"><\u002Fspan>\n                <div style=\"display: flex; border: 1px solid var(--line-2); border-radius: 2px; overflow: hidden\">\n                  <button sc-camel-on-click=\"{{ setHeatInherent }}\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .07em; padding: 5px 10px; border: none; cursor: pointer; background: {{ heatInherentBg }}; color: {{ heatInherentFg }}; min-height: 34px\">INHERENT<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ setHeatResidual }}\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .07em; padding: 5px 10px; border: none; cursor: pointer; background: {{ heatResidualBg }}; color: {{ heatResidualFg }}; min-height: 34px\">RESIDUAL<\u002Fbutton>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ closeHeat }}\" aria-label=\"Close the heat map\" style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 7px 12px; min-height: 34px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">✕<\u002Fbutton>\n              <\u002Fdiv>\n              <div class=\"scroller\" style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 0 18px 18px\">\n              <div style=\"display: flex; gap: 8px\">\n                <div style=\"font-family: var(--mono); font-size: 8.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; padding: 4px 0; font-size: 9.5px\">Impact<\u002Fdiv>\n                <div style=\"flex: 1\">\n                  <sc-for list=\"{{ heatCells }}\" as=\"row\" hint-placeholder-count=\"5\">\n                    <div style=\"display: flex; gap: 4px; margin-bottom: 4px; align-items: stretch\">\n                      <div style=\"width: 62px; flex-shrink: 0; text-align: right; padding-right: 5px; font-family: var(--mono); font-size: 9px; color: var(--ink-3); display: flex; flex-direction: column; justify-content: center; line-height: 1.25\">\n                        <span style=\"font-weight: 700; color: var(--ink)\">{{ row.i }}<\u002Fspan>\n                        <span>{{ row.word }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <sc-for list=\"{{ row.row }}\" as=\"c\" hint-placeholder-count=\"5\">\n                        <button sc-camel-on-click=\"{{ c.pick }}\" title=\"{{ c.title }}\" aria-label=\"{{ c.title }}\" style=\"flex: 1; aspect-ratio: 1.35; min-height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 2px; border: 1px solid {{ c.edge }}; outline: {{ c.ring }}; outline-offset: 1px; background: {{ c.bg }}; color: {{ c.fg }}; font-family: var(--mono); font-size: 12px; font-weight: 800; cursor: {{ c.cursor }}; transition: transform .12s ease\" style-hover=\"transform: scale(1.07)\">{{ c.n }}<\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"display: flex; gap: 4px; margin-top: 2px\">\n                    <div style=\"width: 62px; flex-shrink: 0\"><\u002Fdiv>\n                    <sc-for list=\"{{ likeAxis }}\" as=\"l\" hint-placeholder-count=\"5\">\n                      <div style=\"flex: 1; text-align: center; font-family: var(--mono); font-size: 9px; color: var(--ink-3); line-height: 1.3\">\n                        <span style=\"display: block; font-weight: 700; color: var(--ink)\">{{ l.n }}<\u002Fspan>\n                        <span style=\"display: block\">{{ l.label }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"text-align: center; font-family: var(--mono); font-size: 8.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); margin-top: 7px; font-size: 9.5px\">Likelihood<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ heatPick }}\">\n                <div style=\"margin-top: 14px; background: var(--subtle); border-radius: 3px; padding: 11px 13px\">\n                  <div style=\"display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap\">\n                    <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">{{ heatPickHead }}<\u002Fspan>\n                    <span style=\"flex: 1\"><\u002Fspan>\n                    <sc-if value=\"{{ heatHasRisks }}\">\n                      <button sc-camel-on-click=\"{{ filterHeat }}\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 6px 10px; min-height: 30px; border: none; border-radius: 2px; background: var(--accent-fill); color: var(--on-fill); cursor: pointer\">SHOW THESE IN THE REGISTER<\u002Fbutton>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <p style=\"margin: 7px 0 0; font-size: 12px; line-height: 1.65; color: var(--ink-2); text-wrap: pretty\">{{ heatPickBody }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ noHeatPick }}\">\n                <p style=\"margin: 14px 0 0; font-size: 11.5px; line-height: 1.6; color: var(--ink-3); text-wrap: pretty\">Hover a cell for the exact scores behind it, or click one to pull those risks into the register.<\u002Fp>\n              <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n  <sc-if value=\"{{ mapOpen }}\">\n                <div sc-camel-on-click=\"{{ closeMap }}\" style=\"position: fixed; inset: 0; z-index: 62; background: var(--scrim-2); display: flex; align-items: stretch; justify-content: center; padding: 72px 16px 20px\">\n                <div class=\"pane\" role=\"dialog\" aria-label=\"Deliverable mind map\" sc-camel-on-click=\"{{ stopMap }}\" style=\"background: var(--surface); border: 1px solid var(--line-2); border-top: 3px solid var(--accent); border-radius: 4px; width: 100%; max-width: 1240px; display: flex; flex-direction: column; box-shadow: 0 22px 60px rgba(44,45,46,.34)\">\n                  <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line)\">\n                    <span style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3)\">Deliverable mind map<\u002Fspan>\n                    <label style=\"display: flex; align-items: center; gap: 7px\">\n                      <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">Zoom<\u002Fspan>\n                      <input type=\"range\" min=\"0.4\" max=\"1.6\" step=\"0.1\" value=\"{{ mapZoom }}\" sc-camel-on-change=\"{{ setMapZoom }}\" aria-label=\"Map zoom\" style=\"width: 120px\">\n                    <\u002Flabel>\n                    <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3)\">{{ mapCounts }}<\u002Fspan>\n                    <span style=\"flex: 1\"><\u002Fspan>\n                    <span style=\"display: flex; gap: 13px; flex-wrap: wrap\">\n                      <span style=\"display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-2)\"><span style=\"width: 11px; height: 11px; border-radius: 2px; background: var(--ok-wash); border: 1px solid var(--ok)\"><\u002Fspan>approved<\u002Fspan>\n                      <span style=\"display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-2)\"><span style=\"width: 11px; height: 11px; border-radius: 2px; background: var(--surface); border: 1px solid var(--warn)\"><\u002Fspan>tracked<\u002Fspan>\n                      <span style=\"display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-2)\"><span style=\"width: 11px; height: 11px; border-radius: 2px; background: var(--surface); border: 1px solid var(--line-2)\"><\u002Fspan>not tracked<\u002Fspan>\n                    <\u002Fspan>\n                    <button sc-camel-on-click=\"{{ closeMap }}\" aria-label=\"Close the mind map\" style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 7px 12px; min-height: 34px; border: 1px solid var(--line-2); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">✕<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div class=\"scroller\" style=\"flex: 1; padding: 14px; min-height: 0\">\n                    <div style=\"width: {{ frameW }}; height: {{ frameH }}\">\n                      <div style=\"position: relative; width: {{ innerW }}; height: {{ innerH }}; transform: {{ scale }}; transform-origin: 0 0\">\n                        <svg sc-camel-view-box=\"{{ viewBox }}\" role=\"presentation\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible\">\n                          <g stroke=\"#C4C1C1\" stroke-width=\"1\" fill=\"none\">\n                            <sc-for list=\"{{ links }}\" as=\"l\" hint-placeholder-count=\"20\">\n                              <path d=\"{{ l.d }}\"><\u002Fpath>\n                            <\u002Fsc-for>\n                          <\u002Fg>\n                        <\u002Fsvg>\n                        <div style=\"position: absolute; left: {{ spineLeft }}; top: {{ spineTop }}; width: 184px; height: 30px; border-radius: 3px; background: var(--accent-fill); color: var(--on-fill); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 12px; font-weight: 800; letter-spacing: .04em\">ISO 27001 ISMS<\u002Fdiv>\n                        <sc-for list=\"{{ nodes }}\" as=\"n\" hint-placeholder-count=\"30\">\n                          <div title=\"{{ n.t }}\" style=\"position: absolute; left: {{ n.left }}; top: {{ n.top }}; width: {{ n.wpx }}; min-height: {{ n.hpx }}; box-sizing: border-box; display: flex; align-items: center; justify-content: {{ n.centre }}; padding: 3px 6px; border-radius: 3px; background: {{ n.fill }}; border: 1px solid {{ n.stroke }}; color: {{ n.fg }}; font-size: {{ n.fs }}; font-weight: {{ n.fw }}; line-height: 1.2; overflow: hidden; text-wrap: pretty\">{{ n.t }}<\u002Fdiv>\n                        <\u002Fsc-for>\n                        <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"12\">\n                          <button sc-camel-on-click=\"{{ c.go }}\" title=\"{{ c.title }}\" style=\"position: absolute; left: {{ c.left }}; top: {{ c.top }}; width: {{ c.wpx }}; min-height: {{ c.hpx }}; box-sizing: border-box; display: flex; align-items: center; text-align: left; padding: 3px 6px; border-radius: 3px; background: {{ c.fill }}; border: 1px solid {{ c.stroke }}; color: {{ c.fg }}; font-family: var(--sans); font-size: {{ c.fs }}; line-height: 1.2; cursor: pointer; overflow: hidden\" style-hover=\"border-color: var(--accent)\">{{ c.t }}<\u002Fbutton>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;startTab&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Overview&quot;, &quot;Plan&quot;, &quot;Documents&quot;, &quot;Clauses 4–10&quot;, &quot;Risk register&quot;, &quot;Annex A / SoA&quot;], &quot;default&quot;: &quot;Overview&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Behaviour&quot; },\n  &quot;dataSource&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Saved tracker&quot;, &quot;Seed example&quot;], &quot;default&quot;: &quot;Saved tracker&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Behaviour&quot; },\n  &quot;sidebarOpen&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behaviour&quot; }\n}\">\nconst NAV = [\n  { n: \"Overview\", hint: \"Where you stand\", part: \"\", note: \"Where you stand. Every number here is derived from the other tabs — nothing on this page is editable. An auditor opens with: are you ready, and what is still open?\" },\n  { n: \"Plan\", hint: \"Part 1 · 12-step workbook\", part: \"Course part 1\", note: \"The implementation plan, dated from one project start. Completion is derived from what each task actually produces — the clause it records and the documents its own title matches — never from its position in the list.\" },\n  { n: \"Documents\", hint: \"Part 2-9 · build order\", part: \"Course parts 2–9\", note: \"The documented information required by clause 7.5, in the order the course builds it. Obligation is read from the catalogue: only the standard's own documented-information list counts as mandatory.\" },\n  { n: \"Clauses 4–10\", hint: \"Part 4 · gap assessment\", part: \"Course part 4\", note: \"The gap assessment. Every sub-clause with its shall text, grouped by clause. Conformity is derived from status, evidence and the linked documents; Verified stays your judgement under clause 9.2.\" },\n  { n: \"Risk register\", hint: \"Part 6 · 6.1.2 / 6.1.3\", part: \"Course part 6\", note: \"Risk assessment and treatment. Likelihood × impact, where impact is averaged from four factors; residual is derived from the controls you have actually implemented, so it cannot be talked down.\" },\n  { n: \"Annex A / SoA\", hint: \"Part 7 · 93 controls\", part: \"Course part 7\", note: \"The Statement of Applicability. 93 controls in four themes. Applicability is decided in strict precedence and never defaulted; an auditor asks who decided and why, so the decision's source is on every row.\" },\n];\n\nconst STUB = {\n  1: [\"The Gantt, the 25 WBS tasks and the derived completion column land in the next phase.\", \"25 tasks · 5 sections\"],\n  2: [\"The 36-document register, the obligation legend and the DocBuilder wizard land in a later phase.\", \"36 documents · 158 questions\"],\n  3: [\"All 30 sub-clauses with their shall text and derived conformity land in a later phase.\", \"30 sub-clauses\"],\n  4: [\"The dual-view register, the five-point scales, the four impact factors and the heat map land in a later phase.\", \"5×5 heat map · PESTEL\"],\n  5: [\"The 93 controls, the applicability precedence engine and the SoA justifications land in a later phase.\", \"93 controls · 4 themes\"],\n};\n\nclass Component extends DCLogic {\n  state = { tab: 0, navOpen: true, core: null, st: null, encrypted: false, mobile: false,\n    gran: \"week\", zoom: 30, closed: {}, saved: 0,\n    docQ: \"\", docCat: \"All\", docClosed: {}, docNote: \"\", files: {},\n    clQ: \"\", clClosed: {},\n    riskQ: \"\", riskOpen: null, heat: \"inherent\", wiz: false, mAns: {}, aAns: {},\n    dragStep: null, overStep: null, legendOpen: false, heatOpen: false, numbersOpen: false, heatSel: null,\n    theme: (() => { try { return localStorage.getItem(\"isms-theme\") === \"dark\" ? \"dark\" : \"light\"; } catch (e) { return \"light\"; } })(),\n    guideOpen: false, showDone: false, flash: null, stepNote: \"\",\n    settingsOpen: false, cfg: null, locked: false, hasVault: false, vaultTotp: \"\", imp: { busy: \"\", err: \"\", src: null, found: null, pick: {} },\n    buildId: null, previewOpen: false,\n    docView: \"phases\", regQ: \"\", regCat: \"All\", regClosed: {}, mapZoom: 1, mapOpen: false,\n    vaultPass: \"\", vaultPass2: \"\", vaultCode: \"\", vaultErr: \"\", vaultBusy: false,\n    syncMsg: \"\", syncBusy: false,\n    aiOpen: false, aiQ: \"\", aiA: \"\", aiBusy: false, aiSel: \"\",\n    soaQ: \"\", soaFilter: \"All\", soaClosed: {} };\n\n  /* Every write goes through here: clone, mutate, re-derive to a fixed point, persist.\n     Nothing lientY);\n    window.addEventListener(\"mousemove\", this.annexaOn, { passive: true });\n    /* Escape closes whichever overlay is on top. One handler covers all five —\n       a modal that traps you until you find its ✕ is the wrong kind of modal. */\n    this.escOn = (e) => {\n      if (e.key !== \"Escape\") return;\n      const s = this.state;\n      if (s.mapOpen) this.setState({ mapOpen: false });\n      else if (s.heatOpen) this.setState({ heatOpen: false, heatSel: null });\n      else if (s.buildId) this.setState({ buildId: null });\n      else if (s.settingsOpen) this.setState({ settingsOpen: false });\n      else if (s.aiOpen) this.setState({ aiOpen: false });\n      else return;\n      e.preventDefault();\n    };\n    window.addEventListener(\"keydown\", this.escOn);\n\n    /* Shortcuts. Bare letters were wrong: they collide with every field the app\n       has, and guarding on tagName only papers over it. Everything that acts is\n       behind Alt or Ctrl/Cmd, so the only unmodified keys left are the two that\n       cannot destroy anything — \"?\" and \"/\". Repeats are ignored so a held key\n       never fires an action twice, and while an overlay owns the screen only\n       Escape and \"?\" respond. */\n    this.keysOn = (e) => {\n      if (e.repeat) return;\n      const t = e.target;\n      const typing = !!(t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)));\n      const s = this.state;\n      const mod = e.ctrlKey || e.metaKey;\n      const k = e.key;\n      const stop = () => { e.preventDefault(); e.stopPropagation(); };\n\n      /* The shortcut guide answers for itself first, from anywhere. */\n      if (!mod && !e.altKey && k === \"?\" && !typing) { this.setState(x => ({ keysOpen: !x.keysOpen })); return stop(); }\n      if (s.keysOpen) { if (k === \"Escape\") this.setState({ keysOpen: false }); return; }\n\n      /* Appearance and backup are safe under any overlay — neither navigates. */\n      if (mod && e.shiftKey && (k === \"L\" || k === \"l\")) { this.toggleTheme(); return stop(); }\n      if (mod && e.shiftKey && (k === \"B\" || k === \"b\")) { this.backupNow(); return stop(); }\n\n      /* Document-builder field stepping only makes sense inside the builder. */\n      if (e.altKey && s.buildId && (k === \"ArrowLeft\" || k === \"ArrowRight\")) {\n        const step = this.builderStep;\n        if (step) { step(k === \"ArrowRight\" ? 1 : -1); return stop(); }\n      }\n\n      const overlay = s.locked || s.settingsOpen || s.buildId || s.heatOpen || s.mapOpen;\n      if (mod && k === \",\") {\n        if (s.locked) return;\n        this.setState({ settingsOpen: true }, () => requestAnimationFrame(() => {\n          const b = document.querySelector(\"[data-set-body]\"); if (b) b.focus({ preventScroll: true });\n        }));\n        return stop();\n      }\n      if (mod && (k === \"k\" || k === \"K\")) {\n        if (s.locked) return;\n        this.setState(x => ({ aiOpen: !x.aiOpen })); return stop();\n      }\n      if (overlay) return;\n\n      if (e.altKey && /^[1-9]$/.test(k)) {\n        const i = Number(k) - 1;\n        if (i < NAV.length) { this.setState({ tab: i, flash: null }); return stop(); }\n        return;\n      }\n      if (e.altKey && (k === \"b\" || k === \"B\")) { this.setState(x => ({ navOpen: !x.navOpen })); return stop(); }\n      if (e.altKey && (k === \"l\" || k === \"L\") && s.hasVault) {\n        this.state.core.dropSession(); this.vaultKey = null; this.setState({ locked: true }); return stop();\n      }\n      if (mod || e.altKey) return;\n      if (k === \"/\" && !typing) {\n        const f = document.querySelector('main input[type=\"search\"], main input[placeholder*=\"earch\" i], main input[aria-label*=\"earch\" i]');\n        if (f) { f.focus(); f.select && f.select(); return stop(); }\n      }\n    };\n    window.addEventListener(\"keydown\", this.keysOn);\n    const startTab = NAV.findIndex(t => t.n === (this.props.startTab || \"Overview\"));\n    const narrow = window.matchMedia(\"(max-width: 859px)\").matches;\n    this.setState({ tab: startTab < 0 ? 0 : startTab, navOpen: !narrow && this.props.sidebarOpen !== false });\n\n    const mq = window.matchMedia(\"(max-width: 859px)\");\n    /* A drawer that opens over the content on load would hide it, so entering\n       mobile closes the nav and leaving it restores the rail. */\n    this.mqOn = () => this.setState(s => (mq.matches === s.mobile ? null\n      : { mobile: mq.matches, navOpen: !mq.matches }));\n    mq.addEventListener(\"change\", this.mqOn);\n    this.mqOn();\n\n    import((window.__resources && window.__resources.ismsCore) || \"./isms-core.js\").then(core => {\n      /* The vault metadata holds the salt, and without it no passphrase can\n         derive the right key. So locking requires BOTH the ciphertext and that\n         salt — otherwise the payload is unrecoverable and a lock screen is just\n         a door with no key behind it. A fresh install has neither and opens\n         straight into the project, which is what publishing should do. */\n      let hasVault = false, meta = null;\n      try { meta = JSON.parse(localStorage.getItem(core.VAULT_KEY) || \"null\"); } catch (e) { meta = null; }\n      hasVault = !!(meta && meta.salt);\n\n      let raw = null, encrypted = false, locked = false, orphaned = false;\n      if ((this.props.dataSource || \"Saved tracker\") === \"Saved tracker\") {\n        try {\n          const s = localStorage.getItem(core.KEY);\n          if (s) {\n            const parsed = JSON.parse(s);\n            if (parsed && parsed.__enc) {\n              if (hasVault) { encrypted = true; locked = true; }\n              else orphaned = true;           // ciphertext with no salt: unreadable\n            } else raw = parsed;\n          }\n        } catch (e) { raw = null; }\n      }\n      let files = {};\n      try { files = JSON.parse(localStorage.getItem(core.FKEY) || \"{}\") || {}; } catch (e) { files = {}; }\n      let
