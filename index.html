er-radius: 3px; max-width: 720px\">\n          <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint)\">Not ported yet<\u002Fdiv>\n          <p style=\"margin: 8px 0 10px; font-size: 12.5px; line-height: 1.7; color: var(--ink-soft)\">{{ stubNote }}<\u002Fp>\n          <div style=\"font-family: var(--mono); font-size: 10.5px; color: var(--ink); background: var(--band); border-radius: 2px; padding: 8px 10px; display: inline-block\">{{ stubCount }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fmain>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isSettings }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 70; background: var(--overlay); display: flex; align-items: center; justify-content: center; padding: 38px 16px 18px\">\n      <div class=\"settings-shell pane\" data-settings-modal=\"\" tabindex=\"-1\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"settings-title\">\n        <div class=\"settings-head\">\n          <div style=\"display: flex; justify-content: flex-end\">\n            <button data-settings-close=\"\" sc-camel-on-click=\"{{ closeSettings }}\" aria-label=\"Close settings\" aria-keyshortcuts=\"Escape\" style=\"display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 8px 13px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer; font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .07em\"><span aria-hidden=\"true\">✕<\u002Fspan> CLOSE <span class=\"kbd\">ESC<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n          <h2 id=\"settings-title\" style=\"margin: 3px 0 0; font-size: 20px; font-weight: 700; letter-spacing: -.015em\">Settings<\u002Fh2>\n          <p style=\"margin: 5px 0 0; font-size: 11.5px; color: var(--ink-soft)\">Configure the workspace, organisation, automation, security, and data lifecycle.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"settings-workspace\">\n          <nav class=\"settings-nav\" data-settings-nav=\"\" role=\"tablist\" aria-label=\"Settings categories\">\n            <sc-for list=\"{{ settingsNav }}\" as=\"s\" hint-placeholder-count=\"5\">\n              <button id=\"{{ s.id }}\" class=\"settings-tab\" data-settings-tab=\"{{ s.dataId }}\" role=\"tab\" aria-selected=\"{{ s.selected }}\" aria-controls=\"{{ s.controls }}\" tabindex=\"{{ s.tabIndex }}\" sc-camel-on-click=\"{{ s.select }}\" sc-camel-on-key-down=\"{{ s.keyNav }}\">\n                <span class=\"settings-tab-icon\" aria-hidden=\"true\">{{ s.icon }}<\u002Fspan>\n                <span><span class=\"settings-tab-label\">{{ s.label }}<\u002Fspan><span class=\"settings-tab-meta\">{{ s.meta }}<\u002Fspan><\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fnav>\n          <div class=\"settings-panel-scroll scroller\" data-set-body=\"\" id=\"{{ settingsPanelId }}\" role=\"tabpanel\" aria-labelledby=\"{{ settingsPanelLabelledBy }}\" tabindex=\"0\">\n            <sc-if value=\"{{ settingsWorkspace }}\"><div class=\"settings-panel-head\"><div><span class=\"eyebrow\">Workspace<\u002Fspan><h3>Project foundations<\u002Fh3><p>Set the identity, timeline and risk appetite used across every register and generated document.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ settingsOrganisation }}\"><div class=\"settings-panel-head\"><div><span class=\"eyebrow\">Organisation<\u002Fspan><h3>Context and applicability<\u002Fh3><p>Describe the organisation manually or import a profile for review. These decisions inform Annex A applicability without overriding manual judgements.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ settingsAi }}\"><div class=\"settings-panel-head\"><div><span class=\"eyebrow\">AI &amp; automation<\u002Fspan><h3>Assistance and propagation<\u002Fh3><p>Control Annexa’s API connection and how derived statuses stay aligned across the tracker.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ settingsSecurity }}\"><div class=\"settings-panel-head\"><div><span class=\"eyebrow\">Security<\u002Fspan><h3>Encryption and session access<\u002Fh3><p>Protect the browser copy and decide how long an inactive, refreshed tab may reuse its unlocked session.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ settingsData }}\"><div class=\"settings-panel-head\"><div><span class=\"eyebrow\">Data &amp; sync<\u002Fspan><h3>Portability, recovery and lifecycle<\u002Fh3><p>Move data safely between devices, keep recoverable copies, and manage project archives.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n\n          <sc-if value=\"{{ settingsWorkspace }}\">\n          <section class=\"settings-card\">\n            <h3>Project<\u002Fh3>\n            <p>The start date drives all plan dates and the whole certification timeline.<\u002Fp>\n            <div data-settings-grid=\"\" style=\"display: grid; grid-template-columns: 1.05fr 1fr 1fr 1fr; gap: 10px\">\n              <label><span class=\"field-label\">Company name<\u002Fspan><input type=\"text\" value=\"{{ company }}\" sc-camel-on-change=\"{{ setCompany }}\" placeholder=\"Your organisation\" style=\"width: 100%; min-height: 38px\"><\u002Flabel>\n              <label><span class=\"field-label\">Project manager<\u002Fspan><input type=\"text\" value=\"{{ projectManager }}\" sc-camel-on-change=\"{{ setProjectManager }}\" placeholder=\"Your name\" style=\"width: 100%; min-height: 38px\"><\u002Flabel>\n              <label><span class=\"field-label\">Project start date<\u002Fspan><input type=\"date\" value=\"{{ startDate }}\" sc-camel-on-change=\"{{ setStart }}\" style=\"width: 100%; min-height: 38px\"><\u002Flabel>\n              <label><span class=\"field-label\">Risk acceptance threshold<\u002Fspan><input type=\"number\" min=\"1\" max=\"25\" value=\"{{ threshold }}\" sc-camel-on-change=\"{{ setProjectThreshold }}\" style=\"width: 100%; min-height: 38px\"><\u002Flabel>\n            <\u002Fdiv>\n            <div style=\"margin-top: 12px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft)\">Certification decision lands <b style=\"color: var(--accent-text)\">{{ certificationDate }}<\u002Fb> on the current dates.<\u002Fdiv>\n          <\u002Fsection>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ settingsSecurity }}\">\n          <section class=\"settings-card\">\n            <h3>Lock and encryption<\u002Fh3>\n            <p>A passphrase encrypts the browser copy with AES-GCM. A temporary key can stay only in this tab until the idle timeout; forgetting the passphrase makes the saved project unrecoverable.<\u002Fp>\n            <sc-if value=\"{{ hasVault }}\">\n              <div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap\">\n                <span style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--success-text); border: 1px solid #17693A; padding: 5px 8px; border-radius: 2px\">ENCRYPTED<\u002Fspan>\n                <button sc-camel-on-click=\"{{ lockNow }}\" style=\"min-height: 38px; padding: 9px 13px; border: none; border-radius: 2px; background: #2C2D2E; color: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 10px; font-weight: 700\">LOCK NOW<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ vaultOff }}\" style=\"min-height: 38px; padding: 9px 13px; border: 1px solid #B6000C; border-radius: 2px; background: var(--surface); color: var(--danger-text); cursor: pointer; font-family: var(--mono); font-size: 10px; font-weight: 700\">TURN OFF ENCRYPTION<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noVault }}\">\n              <div style=\"display: grid; gap: 8px; max-width: 540px\">\n                <span style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; color: var(--warning-text)\">NOT ENCRYPTED<\u002Fspan>\n                <input type=\"password\" value=\"{{ vaultPass }}\" sc-camel-on-change=\"{{ setVaultPass }}\" placeholder=\"Passphrase — at least 10 characters\" aria-label=\"New vault passphrase\" style=\"width: 100%; min-height: 38px\">\n                <input type=\"password\" value=\"{{ vaultPass2 }}\" sc-camel-on-change=\"{{ setVaultPass2 }}\" placeholder=\"Repeat passphrase\" aria-label=\"Repeat vault passphrase\" style=\"width: 100%; min-height: 38px\">\n                <div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap\">\n                  <button sc-camel-on-click=\"{{ genTotp }}\" style=\"min-height: 36px; padding: 8px 11px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">ADD AUTHENTICATOR<\u002Fbutton>\n                  <sc-if value=\"{{ hasTotp }}\"><span style=\"font-size: 11px; color: var(--success-text)\">Secret generated. Add it to your authenticator, then enter a code.<\u002Fspan><\u002Fsc-if>\n                <\u002Fdiv>\n                <sc-if value=\"{{ hasTotp }}\">\n                  <div style=\"background: var(--surface-muted); border: 1px solid var(--line); border-radius: 2px; padding: 10px\">\n                    <span class=\"field-label\">Authenticator secret<\u002Fspan><div style=\"font-family: var(--mono); font-size: 11px; font-weight: 700; word-break: break-all\">{{ vaultTotp }}<\u002Fdiv>\n                    <input type=\"text\" value=\"{{ vaultCode }}\" sc-camel-on-change=\"{{ setVaultCode }}\" placeholder=\"6-digit code\" inputmode=\"numeric\" aria-label=\"Authenticator code\" style=\"width: 100%; min-height: 38px; margin-top: 8px\">\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <button sc-camel-on-click=\"{{ turnVaultOn }}\" disabled=\"{{ vaultBusy }}\" style=\"justify-self: start; min-height: 38px; padding: 9px 13px; border: none; border-radius: 2px; background: #CC000E; color: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 10px; font-weight: 700\">SET PASSWORD AND AUTHENTICATOR<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasVaultErr }}\"><div style=\"margin-top: 10px; background: var(--danger-soft); border-left: 3px solid #B6000C; padding: 9px 11px; font-size: 11.5px\">{{ vaultErr }}<\u002Fdiv><\u002Fsc-if>\n            <div style=\"margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: grid; gap: 7px\">\n              <div style=\"display: flex; align-items: center; gap: 9px; flex-wrap: wrap\">\n                <label style=\"display: flex; align-items: center; gap: 8px; margin: 0\">\n                  <span class=\"field-label\" style=\"margin: 0; white-space: nowrap\">Ask again after<\u002Fspan>\n                  <sc-raw-select value=\"{{ idleMins }}\" sc-camel-on-change=\"{{ setIdleMins }}\" aria-label=\"Vault idle timeout\" style=\"min-width: 130px; min-height: 38px; font-family: var(--mono); font-size: 10.5px\">\n                    <sc-for list=\"{{ idleChoices }}\" as=\"o\" hint-placeholder-count=\"11\">\n                      <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                <\u002Flabel>\n                <span style=\"font-size: 10.5px; color: var(--ink-faint); line-height: 1.5\">of no activity. Refreshing this tab will not ask again while the session is active; closing the tab normally ends the session.<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .04em; color: {{ sessionStatusTone }}\">{{ sessionStatus }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsection>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ settingsOrganisation }}\">\n          <section class=\"settings-card\">\n            <h3>Organisation profile — drives the Statement of Applicability<\u002Fh3>\n            <p>These answers decide which Annex A controls can be excluded and write the justification for each exclusion. Manual risk decisions still outrank this profile.<\u002Fp>\n            <sc-for list=\"{{ profileQs }}\" as=\"p\" hint-placeholder-count=\"7\">\n              <div style=\"display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line)\">\n                <span style=\"flex: 1\"><span style=\"display: block; font-size: 12px; font-weight: 600; line-height: 1.45\">{{ p.q }}<\u002Fspan><sc-if value=\"{{ p.hasHint }}\"><span style=\"display: block; margin-top: 2px; font-size: 10.5px; color: var(--ink-faint); line-height: 1.5\">{{ p.hint }}<\u002Fspan><\u002Fsc-if><\u002Fspan>\n                <span style=\"display: flex; flex-shrink: 0; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden\"><button sc-camel-on-click=\"{{ p.setYes }}\" style=\"min-height: 34px; padding: 7px 12px; border: none; background: {{ p.yesBg }}; color: {{ p.yesFg }}; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">YES<\u002Fbutton><button sc-camel-on-click=\"{{ p.setNo }}\" style=\"min-height: 34px; padding: 7px 12px; border: none; background: {{ p.noBg }}; color: {{ p.noFg }}; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">NO<\u002Fbutton><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ settingsAi }}\">\n          <section class=\"settings-card\">\n            <h3>Automatic propagation<\u002Fh3>\n            <p>Clause conformity, control status, applicability, residual scores and risk status are normally kept in step with your registers. Manual overrides remain yours.<\u002Fp>\n            <button sc-camel-on-click=\"{{ toggleAutoDerive }}\" aria-pressed=\"{{ autoDerivePressed }}\" style=\"display: flex; gap: 10px; align-items: flex-start; width: 100%; border: none; background: transparent; color: var(--ink); padding: 0; text-align: left; cursor: pointer\">\n              <span aria-hidden=\"true\" style=\"display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; flex-shrink: 0; border: 1px solid {{ autoDeriveEdge }}; border-radius: 2px; background: {{ autoDeriveBg }}; color: #FFFFFF; font-size: 12px; font-weight: 800\">{{ autoDeriveGlyph }}<\u002Fspan>\n              <span><b style=\"display: block; font-size: 12px\">Keep control and risk status up to date automatically<\u002Fb><span style=\"display: block; margin-top: 3px; font-size: 10.5px; color: var(--ink-faint); line-height: 1.55\">Turn this off when you need to set every status manually.<\u002Fspan><\u002Fspan>\n            <\u002Fbutton>\n            <div style=\"display: flex; gap: 9px; align-items: center; flex-wrap: wrap; margin-top: 12px\">\n              <button sc-camel-on-click=\"{{ handBackAll }}\" disabled=\"{{ noOverrides }}\" style=\"min-height: 36px; padding: 8px 11px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">CLEAR ALL MY OVERRIDES<\u002Fbutton>\n              <span style=\"font-family: var(--mono); font-size: 9px; color: var(--ink-faint)\">{{ overrideCount }} FIELDS SET BY HAND<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasOverrides }}\"><details style=\"margin-top: 10px\"><summary style=\"font-family: var(--mono); font-size: 9.5px; color: var(--ink-faint); cursor: pointer\">Review manual overrides<\u002Fsummary><sc-for list=\"{{ overrides }}\" as=\"o\" hint-placeholder-count=\"3\"><div style=\"display: flex; gap: 9px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line)\"><span style=\"font-family: var(--mono); font-size: 8.5px; color: var(--accent-text)\">{{ o.kind }}<\u002Fspan><span style=\"flex: 1; font-size: 11px\">{{ o.what }}<\u002Fspan><button sc-camel-on-click=\"{{ o.hand }}\" style=\"padding: 6px 8px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font-family: var(--mono); font-size: 8.5px\">HAND BACK<\u002Fbutton><\u002Fdiv><\u002Fsc-for><\u002Fdetails><\u002Fsc-if>\n          <\u002Fsection>\n\n          <section class=\"settings-card\">\n            <h3>Anthropic API — powers Annexa<\u002Fh3>\n            <p>Optional. The key is masked whenever Settings opens and is never included in an export or archive. Cloud sync includes it only as vault ciphertext when encryption is on.<\u002Fp>\n            <span class=\"field-label\">Anthropic API key<\u002Fspan>\n            <div style=\"display: grid; grid-template-columns: minmax(0,1fr) 38px auto auto; gap: 6px; align-items: center; max-width: 760px\">\n              <input type=\"{{ aiKeyType }}\" value=\"{{ aiKey }}\" sc-camel-on-change=\"{{ setAiKey }}\" placeholder=\"sk-ant-…\" aria-label=\"Anthropic API key\" autocomplete=\"off\" style=\"width: 100%; min-height: 38px; font-family: var(--mono)\">\n              <button class=\"icon-btn\" sc-camel-on-click=\"{{ toggleAiKey }}\" aria-pressed=\"{{ aiKeyPressed }}\" aria-label=\"{{ aiKeyEyeLabel }}\" title=\"{{ aiKeyEyeLabel }}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"2.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><\u002Fcircle><\u002Fsvg><\u002Fbutton>\n              <button sc-camel-on-click=\"{{ saveAiKey }}\" style=\"min-height: 38px; padding: 9px 12px; border: none; border-radius: 2px; background: #CC000E; color: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">SAVE API KEY<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ clearAiKey }}\" style=\"min-height: 38px; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); cursor: pointer; font-family: var(--mono); font-size: 9.5px\">CLEAR<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"margin-top: 7px; font-family: var(--mono); font-size: 9px; color: {{ keyTone }}\">{{ keyState }}<\u002Fdiv>\n          <\u002Fsection>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ settingsOrganisation }}\">\n          <section class=\"settings-card\">\n            <h3>Start from a company profile — optional<\u002Fh3>\n            <p>Upload an existing profile document and Annexa will draft the organisation context for clauses 4.1, 4.2 and 4.3. Nothing is applied until you review it.<\u002Fp>\n            <div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap\"><label style=\"display: inline-flex; align-items: center; min-height: 38px; padding: 9px 13px; border-radius: 2px; background: #CC000E; color: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">CHOOSE A PROFILE<input type=\"file\" accept=\".pdf,.docx,.txt,.md,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown\" sc-camel-on-change=\"{{ pickDoc }}\" aria-label=\"Choose a PDF, Word, text or Markdown organisation profile\" style=\"display: none\"><\u002Flabel><sc-if value=\"{{ isImpBusy }}\"><span class=\"busy\" style=\"padding: 7px 10px; font-family: var(--mono); font-size: 9.5px\">{{ impBusy }}…<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ hasImpSrc }}\"><span style=\"font-family: var(--mono); font-size: 9px; color: var(--ink-faint)\">{{ impSrc }}<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n            <details style=\"margin-top: 9px\"><summary style=\"font-size: 10.5px; color: var(--ink-soft); cursor: pointer\">…or paste the text instead<\u002Fsummary><textarea value=\"{{ pasteVal }}\" sc-camel-on-change=\"{{ pasteDoc }}\" rows=\"4\" placeholder=\"Paste relevant organisation profile text\" style=\"width: 100%; margin-top: 7px; line-height: 1.6\"><\u002Ftextarea><button sc-camel-on-click=\"{{ readPaste }}\" style=\"margin-top: 7px; min-height: 36px; padding: 8px 11px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font-family: var(--mono); font-size: 9.5px\">READ THIS TEXT<\u002Fbutton><\u002Fdetails>\n            <sc-if value=\"{{ hasImpErr }}\"><div style=\"margin-top: 9px; background: var(--warning-soft); border-left: 3px solid #8A5A00; padding: 9px 11px; font-size: 11px\">{{ impErr }}<\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ hasFound }}\"><div style=\"margin-top: 11px; border-top: 1px solid var(--line); padding-top: 10px\"><span class=\"field-label\">Review what Annexa found<\u002Fspan><sc-for list=\"{{ foundRows }}\" as=\"g\" hint-placeholder-count=\"5\"><div style=\"display: flex; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line)\"><button sc-camel-on-click=\"{{ g.toggle }}\" aria-pressed=\"{{ g.on }}\" style=\"min-width: 54px; padding: 6px 8px; border: 1px solid var(--rule); background: {{ g.bg }}; color: {{ g.fg }}; cursor: pointer; font-family: var(--mono); font-size: 8.5px\">KEEP<\u002Fbutton><span style=\"flex: 1; font-size: 11px\">{{ g.label }}<\u002Fspan><span style=\"font-family: var(--mono); font-size: 9px; color: var(--ink-faint)\">{{ g.count }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><div style=\"display: flex; gap: 8px; margin-top: 9px\"><button sc-camel-on-click=\"{{ applyFound }}\" style=\"min-height: 36px; padding: 8px 11px; border: none; background: #17693A; color: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">APPLY SELECTED<\u002Fbutton><button sc-camel-on-click=\"{{ discardFound }}\" style=\"min-height: 36px; padding: 8px 11px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font-family: var(--mono); font-size: 9.5px\">DISCARD<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n          <\u002Fsection>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ settingsData }}\">\n          <section class=\"settings-card\">\n            <h3>Finish a project and start a new organisation<\u002Fh3>\n            <p>Archive the whole project to a file, clear the tracker for the next organisation, or load an archive later.<\u002Fp>\n            <div style=\"background: var(--band); border-radius: 2px; padding: 10px 12px; font-size: 10.5px; line-height: 1.55\"><b>{{ archiveSummary }}<\u002Fb><\u002Fdiv>\n            <label style=\"display: block; margin-top: 9px\"><span class=\"field-label\">Note for the archive (optional)<\u002Fspan><input type=\"text\" value=\"{{ archiveNote }}\" sc-camel-on-change=\"{{ setArchiveNote }}\" placeholder=\"e.g. certified 12 March 2027, certificate no. 1234\" style=\"width: 100%; min-height: 36px\"><\u002Flabel>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-top: 9px\"><button sc-camel-on-click=\"{{ archiveOnly }}\" style=\"min-height: 36px; padding: 8px 11px; border: none; background: #2C2D2E; color: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9px; font-weight: 700\">DOWNLOAD ARCHIVE ONLY<\u002Fbutton><label style=\"display: inline-flex; align-items: center; min-height: 36px; padding: 8px 11px; border: 1px solid #CC000E; background: var(--surface); color: var(--accent-text); cursor: pointer; font-family: var(--mono); font-size: 9px; font-weight: 700\">RESTORE AN ARCHIVE<input type=\"file\" accept=\"application/json\" sc-camel-on-change=\"{{ restoreArchive }}\" style=\"display: none\"><\u002Flabel><\u002Fdiv>\n          <\u002Fsection>\n\n          <section class=\"settings-card\">\n            <h3>Backup<\u002Fh3>\n            <p>A local backup is the copy you control. Download one before a major change.<\u002Fp>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap\"><button sc-camel-on-click=\"{{ backup }}\" aria-keyshortcuts=\"Control+Shift+B Meta+Shift+B\" style=\"min-height: 38px; padding: 9px 12px; border: none; background: #2C2D2E; color: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">DOWNLOAD JSON BACKUP <span class=\"kbd\">⌘⇧B<\u002Fspan><\u002Fbutton><label style=\"display: inline-flex; align-items: center; min-height: 38px; padding: 9px 12px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">RESTORE FROM FILE<input type=\"file\" accept=\"application/json\" sc-camel-on-change=\"{{ restore }}\" style=\"display: none\"><\u002Flabel><\u002Fdiv>\n          <\u002Fsection>\n\n          <section class=\"settings-card\">\n            <h3>Cloud sync — jsonbin.io<\u002Fh3>\n            <p>Optional. Keeps a private copy of tracker data so you can move between devices. Attachments and jsonbin credentials never travel. The Anthropic key travels only as vault ciphertext when encryption is on.<\u002Fp>\n            <div data-settings-grid=\"\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 820px\">\n              <label><span class=\"field-label\">jsonbin.io master key<\u002Fspan><span class=\"secret-row\"><input type=\"{{ jbKeyType }}\" value=\"{{ jbKey }}\" sc-camel-on-change=\"{{ setJbKey }}\" placeholder=\"$2a$10$…\" autocomplete=\"off\" aria-label=\"jsonbin master key\" style=\"width: 100%; min-height: 38px; font-family: var(--mono)\"><button class=\"icon-btn\" sc-camel-on-click=\"{{ toggleJbKey }}\" aria-pressed=\"{{ jbKeyPressed }}\" aria-label=\"{{ jbKeyEyeLabel }}\" title=\"{{ jbKeyEyeLabel }}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"2.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><\u002Fcircle><\u002Fsvg><\u002Fbutton><\u002Fspan><\u002Flabel>\n              <label><span class=\"field-label\">Bin ID<\u002Fspan><input type=\"text\" value=\"{{ jbId }}\" sc-camel-on-change=\"{{ setJbId }}\" placeholder=\"Created on first push\" aria-label=\"jsonbin bin id\" style=\"width: 100%; min-height: 38px; font-family: var(--mono)\"><\u002Flabel>\n            <\u002Fdiv>\n            <div style=\"margin-top: 9px; font-family: var(--mono); font-size: 9.5px; color: {{ syncWarnTone }}\">{{ syncWarn }}<\u002Fdiv>\n            <div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 9px\"><button sc-camel-on-click=\"{{ testSync }}\" disabled=\"{{ syncBusy }}\" style=\"min-height: 38px; padding: 9px 12px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">TEST CONNECTION<\u002Fbutton><span style=\"font-family: var(--mono); font-size: 9px; color: var(--ink-faint)\">{{ lastSync }}<\u002Fspan><\u002Fdiv>\n            <button sc-camel-on-click=\"{{ toggleAutoSync }}\" aria-pressed=\"{{ autoSyncPressed }}\" style=\"display: flex; gap: 9px; align-items: flex-start; width: 100%; margin-top: 12px; padding: 11px 0 0; border: none; border-top: 1px solid var(--line); background: transparent; color: var(--ink); text-align: left; cursor: pointer\"><span aria-hidden=\"true\" style=\"display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; flex-shrink: 0; border: 1px solid {{ autoSyncEdge }}; border-radius: 2px; background: {{ autoSyncBg }}; color: #FFFFFF; font-size: 12px; font-weight: 800\">{{ autoSyncGlyph }}<\u002Fspan><span><b style=\"display: block; font-size: 11.5px\">Sync automatically<\u002Fb><span style=\"display: block; margin-top: 3px; font-size: 10.5px; color: var(--ink-faint); line-height: 1.55\">Pull once after startup, then push after local changes settle. Last write wins; simultaneous edits are not merged.<\u002Fspan><\u002Fspan><\u002Fbutton>\n            <div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 11px\"><button sc-camel-on-click=\"{{ doPush }}\" disabled=\"{{ syncBusy }}\" style=\"min-height: 38px; padding: 9px 12px; border: none; background: #2C2D2E; color: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">PUSH TO CLOUD<\u002Fbutton><button sc-camel-on-click=\"{{ doPull }}\" disabled=\"{{ syncBusy }}\" style=\"min-height: 38px; padding: 9px 12px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">PULL FROM CLOUD<\u002Fbutton><\u002Fdiv>\n            <div style=\"margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--line)\"><span class=\"field-label\">Add another browser or device<\u002Fspan><p style=\"margin-bottom: 8px\">The connection code contains your jsonbin Master Key and Bin ID. Treat it like a password and transfer it through a secure channel.<\u002Fp><div data-sync-code-grid=\"\" style=\"display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 7px; max-width: 820px\"><button sc-camel-on-click=\"{{ copySyncCode }}\" style=\"min-height: 38px; padding: 9px 12px; border: 1px solid #CC000E; background: var(--surface); color: var(--accent-text); cursor: pointer; font-family: var(--mono); font-size: 9px; font-weight: 700\">COPY CONNECTION CODE<\u002Fbutton><input type=\"password\" value=\"{{ syncCode }}\" sc-camel-on-change=\"{{ setSyncCode }}\" placeholder=\"Paste a connection code here\" aria-label=\"Connection code\" autocomplete=\"off\" style=\"width: 100%; min-height: 38px; font-family: var(--mono)\"><button sc-camel-on-click=\"{{ applySyncCode }}\" style=\"min-height: 38px; padding: 9px 12px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font-family: var(--mono); font-size: 9px; font-weight: 700\">APPLY CODE<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n            <sc-if value=\"{{ hasSyncMsg }}\"><div style=\"margin-top: 9px; background: var(--surface-muted); border-left: 3px solid var(--rule); padding: 9px 11px; font-size: 11px\">{{ syncMsg }}<\u002Fdiv><\u002Fsc-if>\n          <\u002Fsection>\n          <section class=\"settings-card danger-zone\">\n            <h3>Danger zone<\u002Fh3>\n            <p>These actions replace or remove the active project. Download a backup or archive first.<\u002Fp>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap\"><button sc-camel-on-click=\"{{ archiveAndStart }}\" style=\"min-height: 38px; padding: 9px 12px; border: none; background: #CC000E; color: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9px; font-weight: 700\">ARCHIVE, THEN START A NEW ORGANISATION<\u002Fbutton><button sc-camel-on-click=\"{{ resetEverything }}\" style=\"min-height: 38px; padding: 9px 12px; border: 1px solid #B6000C; background: var(--surface); color: var(--danger-text); cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">RESET EVERYTHING<\u002Fbutton><\u002Fdiv>\n          <\u002Fsection>\n          <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ shortcutOpen }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 80; background: rgba(44,45,46,.56); display: flex; align-items: center; justify-content: center; padding: 24px\">\n      <div class=\"pane\" data-shortcuts-modal=\"\" tabindex=\"-1\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"shortcuts-title\" style=\"width: 100%; max-width: 620px; max-height: 88vh; overflow: auto; background: var(--canvas); border: 1px solid var(--rule); border-top: 3px solid #CC000E; border-radius: 4px; padding: 20px; box-shadow: 0 24px 70px rgba(20,20,20,.35)\">\n        <div style=\"display: flex; gap: 12px; align-items: flex-start\"><div style=\"flex: 1\"><h2 id=\"shortcuts-title\" style=\"margin: 0; font-size: 20px\">Keyboard shortcuts<\u002Fh2><p style=\"margin: 5px 0 0; font-size: 11.5px; line-height: 1.55; color: var(--ink-soft)\">Shortcuts work throughout the tracker and pause while you type in a field. Escape always closes the top panel.<\u002Fp><\u002Fdiv><button data-shortcuts-close=\"\" sc-camel-on-click=\"{{ closeShortcuts }}\" aria-label=\"Close keyboard shortcuts\" style=\"min-height: 36px; padding: 8px 11px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">CLOSE <span class=\"kbd\">ESC<\u002Fspan><\u002Fbutton><\u002Fdiv>\n        <div style=\"margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 4px 14px\">\n          <div class=\"shortcut-row\"><span><b>Open a section<\u002Fb><br><small style=\"color: var(--ink-faint)\">Overview through Annex A / SoA<\u002Fsmall><\u002Fspan><span><span class=\"kbd\">ALT<\u002Fspan> + <span class=\"kbd\">1–6<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"shortcut-row\"><span><b>Open Settings<\u002Fb><\u002Fspan><span><span class=\"kbd\">⌘ / CTRL<\u002Fspan> + <span class=\"kbd\">,<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"shortcut-row\"><span><b>Toggle light / dark appearance<\u002Fb><\u002Fspan><span><span class=\"kbd\">⌘ / CTRL<\u002Fspan> + <span class=\"kbd\">⇧<\u002Fspan> + <span class=\"kbd\">L<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"shortcut-row\"><span><b>Search the current section<\u002Fb><\u002Fspan><span class=\"kbd\">/<\u002Fspan><\u002Fdiv>\n          <div class=\"shortcut-row\"><span><b>Ask Annexa<\u002Fb><\u002Fspan><span><span class=\"kbd\">⌘ / CTRL<\u002Fspan> + <span class=\"kbd\">K<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"shortcut-row\"><span><b>Download a backup<\u002Fb><\u002Fspan><span><span class=\"kbd\">⌘ / CTRL<\u002Fspan> + <span class=\"kbd\">⇧<\u002Fspan> + <span class=\"kbd\">B<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"shortcut-row\"><span><b>Move through document fields<\u002Fb><br><small style=\"color: var(--ink-faint)\">While the document builder is open and focus is outside a field<\u002Fsmall><\u002Fspan><span><span class=\"kbd\">ALT<\u002Fspan> + <span class=\"kbd\">← / →<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"shortcut-row\"><span><b>Show this guide<\u002Fb><\u002Fspan><span class=\"kbd\">?<\u002Fspan><\u002Fdiv>\n          <div class=\"shortcut-row\"><span><b>Close the top panel<\u002Fb><\u002Fspan><span class=\"kbd\">ESC<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ legacySettings }}\">\n        <div style=\"position: fixed; inset: 0; z-index: 60; background: rgba(44,45,46,.5); display: flex; align-items: center; justify-content: center; padding: 72px 16px 20px\">\n        <div class=\"pane\" role=\"dialog\" aria-label=\"Settings\" style=\"background: var(--canvas); border: 1px solid var(--rule); border-radius: 4px; width: 100%; max-width: 920px; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 22px 60px rgba(44,45,46,.3)\">\n        <div data-set-head=\"\" style=\"flex-shrink: 0; background: var(--canvas); border-bottom: 1px solid var(--rule); border-radius: 4px 4px 0 0; padding: 16px 18px 12px\">\n          <div style=\"display: flex; justify-content: flex-end\">\n            <button sc-camel-on-click=\"{{ closeSettings }}\" aria-label=\"Close settings\" style=\"display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 9px 15px; min-height: 40px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\" style-hover=\"border-color: var(--accent-text); color: var(--accent-text)\"><span aria-hidden=\"true\">✕<\u002Fspan>CLOSE<\u002Fbutton>\n          <\u002Fdiv>\n          <h2 style=\"margin: 6px 0 0; font-size: 21px; font-weight: 700; letter-spacing: -.015em\">Settings<\u002Fh2>\n          <p style=\"margin: 5px 0 0; font-size: 13px; color: var(--ink-soft); line-height: 1.6\">Profile, organisation document, keys, vault and backups.<\u002Fp>\n          <div class=\"scroller\" style=\"display: flex; gap: 6px; margin-top: 12px; padding-bottom: 3px; overflow-x: auto\">\n            <sc-for list=\"{{ setNav }}\" as=\"s\" hint-placeholder-count=\"8\">\n              <button sc-camel-on-click=\"{{ s.go }}\" style=\"flex-shrink: 0; font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 7px 10px; min-height: 32px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface); color: var(--ink-soft); cursor: pointer; white-space: nowrap\" style-hover=\"border-color: var(--accent-text); color: var(--accent-text)\">{{ s.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- minmax(0,1fr) caps the column at the panel width. An implicit grid\n             column is min-content-floored, so one wide child (a table, a long\n             key) pushed the whole panel sideways. -->\n        <div class=\"scroller\" data-set-body=\"\" tabindex=\"0\" style=\"flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 16px 18px 18px\">\n          <section id=\"set-project\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">This project<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: var(--ink-soft); line-height: 1.6\">Used on every generated document and as the anchor date for the plan.<\u002Fp>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 11px\">\n              <label style=\"display: block\">\n                <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 4px\">Organisation<\u002Fspan>\n                <input type=\"text\" value=\"{{ company }}\" sc-camel-on-change=\"{{ setCompany }}\" placeholder=\"the legal entity being certified\" aria-label=\"Organisation\" style=\"width: 100%; min-height: 38px\">\n              <\u002Flabel>\n              <label style=\"display: block\">\n                <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 4px\">Project start<\u002Fspan>\n                <input type=\"date\" value=\"{{ startDate }}\" sc-camel-on-change=\"{{ setStart }}\" aria-label=\"Project start date\" style=\"width: 100%; min-height: 38px\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <label style=\"display: block; margin-top: 11px\">\n              <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 4px\">ISMS scope · clause 4.3<\u002Fspan>\n              <textarea value=\"{{ scope }}\" sc-camel-on-change=\"{{ setScope }}\" rows=\"3\" placeholder=\"what the ISMS covers, and what it deliberately excludes\" aria-label=\"ISMS scope\" style=\"width: 100%; resize: vertical; line-height: 1.6\"><\u002Ftextarea>\n            <\u002Flabel>\n          <\u002Fsection>\n\n          <section id=\"set-profile\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Organisation profile<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: var(--ink-soft); line-height: 1.6; max-width: 660px; text-wrap: pretty\">These seven answers decide which Annex A controls the engine proposes. A control you have overridden by hand is never touched by a change here.<\u002Fp>\n            <sc-for list=\"{{ profileQs }}\" as=\"p\" hint-placeholder-count=\"7\">\n              <div style=\"display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line)\">\n                <span style=\"flex: 1\">\n                  <span style=\"display: block; font-size: 13px; font-weight: 600; line-height: 1.45\">{{ p.q }}<\u002Fspan>\n                  <sc-if value=\"{{ p.hasHint }}\">\n                    <span style=\"display: block; font-size: 11.5px; color: var(--ink-faint); line-height: 1.55; margin-top: 3px\">{{ p.hint }}<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fspan>\n                <span style=\"display: flex; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; flex-shrink: 0\">\n                  <button sc-camel-on-click=\"{{ p.setYes }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; padding: 8px 13px; min-height: 36px; border: none; cursor: pointer; background: {{ p.yesBg }}; color: {{ p.yesFg }}\">YES<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ p.setNo }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; padding: 8px 13px; min-height: 36px; border: none; cursor: pointer; background: {{ p.noBg }}; color: {{ p.noFg }}\">NO<\u002Fbutton>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n\n          <section id=\"set-overrides\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Decisions you have taken over<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: var(--ink-soft); line-height: 1.6; max-width: 660px; text-wrap: pretty\">Every row here is a place you overruled the engine. It stops deriving that field, which is exactly what you want for a judgement you own — and worth reviewing when the profile or the risk register moves on. Handing one back does not delete anything you typed.<\u002Fp>\n            <sc-if value=\"{{ hasOverrides }}\">\n              <div>\n                <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 9px\">\n                  <span style=\"font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--accent-text)\">{{ overrideCount }} overridden<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ handBackAll }}\" style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .06em; padding: 7px 11px; min-height: 34px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink-soft); cursor: pointer\">HAND ALL BACK<\u002Fbutton>\n                <\u002Fdiv>\n                <sc-for list=\"{{ overrides }}\" as=\"o\" hint-placeholder-count=\"3\">\n                  <div style=\"display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line)\">\n                    <span style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .07em; padding: 3px 6px; border-radius: 2px; border: 1px solid #CC000E; color: var(--accent-text); flex-shrink: 0\">{{ o.kind }}<\u002Fspan>\n                    <span style=\"flex: 1; font-size: 12.5px\">{{ o.what }}<\u002Fspan>\n                    <button sc-camel-on-click=\"{{ o.hand }}\" title=\"Let the engine derive this again\" style=\"font-family: var(--mono); font-size: 9.5px; padding: 6px 10px; min-height: 32px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink-soft); cursor: pointer; flex-shrink: 0\">HAND BACK<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noOverrides }}\">\n              <p style=\"margin: 0; font-size: 12.5px; color: var(--ink-faint)\">Nothing overridden yet. Every status on screen is derived.<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fsection>\n\n          <section id=\"set-data\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">This browser's data<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: var(--ink-soft); line-height: 1.6; max-width: 660px; text-wrap: pretty\">Everything lives in this browser and goes nowhere else. A backup is the only copy that survives clearing site data.<\u002Fp>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n              <button sc-camel-on-click=\"{{ backup }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: #2C2D2E; color: #fff; cursor: pointer\">DOWNLOAD BACKUP<\u002Fbutton>\n              <label style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; display: flex; align-items: center; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">RESTORE BACKUP<input type=\"file\" accept=\"application/json\" sc-camel-on-change=\"{{ restore }}\" aria-label=\"Restore a backup\" style=\"display: none\"><\u002Flabel>\n              <button sc-camel-on-click=\"{{ newProject }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid #B6000C; border-radius: 2px; background: var(--surface); color: var(--danger-text); cursor: pointer\">START A NEW PROJECT<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"set-import\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Read your organisation's own document<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: var(--ink-soft); line-height: 1.6; max-width: 680px; text-wrap: pretty\">Upload a company profile, prospectus or intranet page — HTML, PDF, text or Markdown — and it will be read for the things clauses 4.1 to 4.3 ask for: external and internal issues, interested parties, locations, systems, and what belongs inside the scope. Nothing is written until you have seen it and ticked what to keep.<\u002Fp>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n              <label style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; display: flex; align-items: center; border: none; border-radius: 2px; background: #CC000E; color: #fff; cursor: pointer\">UPLOAD A DOCUMENT<input type=\"file\" accept=\".pdf,.docx,.txt,.md,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown\" sc-camel-on-change=\"{{ pickDoc }}\" aria-label=\"Choose a PDF, Word, text or Markdown organisation profile\" style=\"display: none\"><\u002Flabel>\n              <sc-if value=\"{{ isImpBusy }}\">\n                <span class=\"busy\" style=\"font-family: var(--mono); font-size: 10.5px; padding: 8px 12px; border-radius: 2px; color: var(--ink-soft)\">{{ impBusy }}…<\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ hasImpSrc }}\">\n                <span style=\"font-family: var(--mono); font-size: 10px; color: var(--ink-faint)\">{{ impSrc }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <details style=\"margin-top: 11px\">\n              <summary style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); cursor: pointer\">Or paste the relevant sections<\u002Fsummary>\n              <textarea value=\"{{ pasteVal }}\" sc-camel-on-change=\"{{ pasteDoc }}\" rows=\"5\" placeholder=\"Paste the parts of the document that describe the organisation, its market, its sites and its systems.\" aria-label=\"Paste organisation text\" style=\"width: 100%; resize: vertical; margin-top: 8px; line-height: 1.6\"><\u002Ftextarea>\n              <button sc-camel-on-click=\"{{ readPaste }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; margin-top: 7px; padding: 9px 13px; min-height: 38px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">READ THIS TEXT<\u002Fbutton>\n            <\u002Fdetails>\n            <sc-if value=\"{{ hasImpErr }}\">\n              <div style=\"margin-top: 11px; background: var(--warning-soft); border-left: 3px solid #8A5A00; border-radius: 2px; padding: 10px 12px; font-size: 12px; line-height: 1.6\">{{ impErr }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasFound }}\">\n              <div style=\"margin-top: 13px; border-top: 1px solid var(--line); padding-top: 13px\">\n                <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 9px\">What it found — untick anything you do not want<\u002Fdiv>\n                <sc-for list=\"{{ foundRows }}\" as=\"g\" hint-placeholder-count=\"5\">\n                  <div style=\"border: 1px solid var(--line); border-radius: 2px; padding: 10px 11px; margin-bottom: 8px\">\n                    <div style=\"display: flex; align-items: center; gap: 9px; margin-bottom: 6px\">\n                      <button sc-camel-on-click=\"{{ g.toggle }}\" aria-pressed=\"{{ g.on }}\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 5px 10px; min-height: 30px; border: 1px solid var(--rule); border-radius: 2px; background: {{ g.bg }}; color: {{ g.fg }}; cursor: pointer\">KEEP<\u002Fbutton>\n                      <span style=\"font-size: 12.5px; font-weight: 600; flex: 1\">{{ g.label }}<\u002Fspan>\n                      <span style=\"font-family: var(--mono); font-size: 10px; color: var(--ink-faint)\">{{ g.count }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                      <div style=\"font-size: 11.5px; color: var(--ink-soft); line-height: 1.55; padding: 2px 0 2px 11px; border-left: 2px solid var(--line)\">{{ it.t }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ g.hasMore }}\">\n                      <div style=\"font-family: var(--mono); font-size: 10px; color: var(--ink-faint); margin-top: 4px; padding-left: 11px\">{{ g.more }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px\">\n                  <button sc-camel-on-click=\"{{ applyFound }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: #17693A; color: #fff; cursor: pointer\">APPLY WHAT IS TICKED<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ discardFound }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink-soft); cursor: pointer\">DISCARD<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n\n          <section id=\"set-vault\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Vault — encrypt this browser's copy<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: var(--ink-soft); line-height: 1.6; max-width: 680px; text-wrap: pretty\">A passphrase derives an AES-GCM key, and everything written to browser storage goes through it. A temporary key can stay only in this tab until the idle timeout. <b>Forgetting the passphrase loses the project<\u002Fb> — there is no recovery path, so keep a downloaded backup somewhere you trust.<\u002Fp>\n            <sc-if value=\"{{ hasVault }}\">\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n                <span style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--success-text)\">VAULT ON — storage holds ciphertext<\u002Fspan>\n                <span style=\"flex: 1\"><\u002Fspan>\n                <button sc-camel-on-click=\"{{ lockNow }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: #2C2D2E; color: #fff; cursor: pointer\">LOCK NOW<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ vaultOff }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid #B6000C; border-radius: 2px; background: var(--surface); color: var(--danger-text); cursor: pointer\">TURN OFF<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noVault }}\">\n              <div style=\"display: grid; gap: 9px; max-width: 460px\">\n                <input type=\"password\" value=\"{{ vaultPass }}\" sc-camel-on-change=\"{{ setVaultPass }}\" placeholder=\"Passphrase — at least 10 characters\" aria-label=\"New passphrase\" style=\"width: 100%; min-height: 38px\">\n                <input type=\"password\" value=\"{{ vaultPass2 }}\" sc-camel-on-change=\"{{ setVaultPass2 }}\" placeholder=\"Repeat the passphrase\" aria-label=\"Repeat passphrase\" style=\"width: 100%; min-height: 38px\">\n                <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n                  <button sc-camel-on-click=\"{{ genTotp }}\" style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .06em; padding: 9px 12px; min-height: 36px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">ADD AN AUTHENTICATOR<\u002Fbutton>\n                  <sc-if value=\"{{ hasTotp }}\">\n                    <span style=\"font-family: var(--mono); font-size: 10px; color: var(--success-text)\">secret generated — add it below, then enter a code<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <sc-if value=\"{{ hasTotp }}\">\n                  <div style=\"background: var(--surface-muted); border: 1px solid var(--line); border-radius: 2px; padding: 10px 12px\">\n                    <div style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 5px\">Add this secret to your authenticator<\u002Fdiv>\n                    <div style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; word-break: break-all; color: var(--ink)\">{{ vaultTotp }}<\u002Fdiv>\n                    <input type=\"text\" value=\"{{ vaultCode }}\" sc-camel-on-change=\"{{ setVaultCode }}\" placeholder=\"Then enter the 6-digit code\" aria-label=\"Authenticator code\" inputmode=\"numeric\" style=\"width: 100%; margin-top: 9px; min-height: 38px\">\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <button sc-camel-on-click=\"{{ turnVaultOn }}\" disabled=\"{{ vaultBusy }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 10px 13px; min-height: 40px; border: none; border-radius: 2px; background: #CC000E; color: #fff; cursor: pointer\">TURN THE VAULT ON<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasVaultErr }}\">\n              <div style=\"margin-top: 11px; background: var(--danger-soft); border-left: 3px solid #B6000C; border-radius: 2px; padding: 10px 12px; font-size: 12px; line-height: 1.55\">{{ vaultErr }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n\n          <section id=\"set-key\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">AI assistance API<\u002Fh2>\n            <p style=\"margin: 0 0 11px; font-size: 12px; color: var(--ink-soft); line-height: 1.6; max-width: 680px; text-wrap: pretty\">Optional. Without a key, reading a document uses the built-in model. With one, calls go straight from this browser to Anthropic and the key is stored only here.<\u002Fp>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n              <input type=\"password\" value=\"{{ aiKey }}\" sc-camel-on-change=\"{{ setAiKey }}\" placeholder=\"sk-ant-…\" aria-label=\"Anthropic API key\" style=\"flex: 1; min-width: 220px; min-height: 38px; font-family: var(--mono)\">\n              <button sc-camel-on-click=\"{{ clearAiKey }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink-soft); cursor: pointer\">CLEAR<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-family: var(--mono); font-size: 10px; margin-top: 7px; color: {{ keyTone }}\">{{ keyState }}<\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"set-sync\" style=\"background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Cloud sync<\u002Fh2>\n            <p style=\"margin: 0 0 11px; font-size: 12px; color: var(--ink-soft); line-height: 1.6; max-width: 680px; text-wrap: pretty\">Pushes the project to a private bin on your own jsonbin account, so you can carry it between machines. Attachments stay here — they live under a separate key and are never part of the payload.<\u002Fp>\n            <div style=\"font-family: var(--mono); font-size: 10.5px; margin-bottom: 11px; color: {{ syncWarnTone }}\">{{ syncWarn }}<\u002Fdiv>\n            <div style=\"display: grid; gap: 9px; max-width: 520px\">\n              <input type=\"password\" value=\"{{ jbKey }}\" sc-camel-on-change=\"{{ setJbKey }}\" placeholder=\"jsonbin master key\" aria-label=\"jsonbin master key\" style=\"width: 100%; min-height: 38px; font-family: var(--mono)\">\n              <input type=\"text\" value=\"{{ jbId }}\" sc-camel-on-change=\"{{ setJbId }}\" placeholder=\"bin id — left empty, a push creates one\" aria-label=\"jsonbin bin id\" style=\"width: 100%; min-height: 38px; font-family: var(--mono)\">\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n                <button sc-camel-on-click=\"{{ doPush }}\" disabled=\"{{ syncBusy }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: #2C2D2E; color: #fff; cursor: pointer\">PUSH<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ doPull }}\" disabled=\"{{ syncBusy }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">PULL<\u002Fbutton>\n                <span style=\"font-family: var(--mono); font-size: 10px; color: var(--ink-faint)\">{{ lastSync }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasSyncMsg }}\">\n              <div style=\"margin-top: 11px; background: var(--surface-muted); border-left: 3px solid var(--rule); border-radius: 2px; padding: 10px 12px; font-size: 12px; line-height: 1.55\">{{ syncMsg }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n        <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n  <sc-if value=\"{{ buildOpen }}\">\n        <div style=\"position: fixed; inset: 0; z-index: 60; background: rgba(44,45,46,.5); display: flex; align-items: center; justify-content: center; padding: 72px 16px 20px\">\n        <div class=\"pane\" data-builder-modal=\"\" tabindex=\"-1\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"builder-title\" style=\"background: var(--canvas); border: 1px solid var(--rule); border-radius: 4px; width: 100%; max-width: 1080px; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 22px 60px rgba(44,45,46,.3)\">\n          <div style=\"flex-shrink: 0; background: var(--surface); border-bottom: 2px solid #2C2D2E; padding: 13px 16px\">\n            <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap\">\n              <span style=\"font-family: var(--mono); font-size: 12px; font-weight: 800; color: var(--accent-text)\">{{ bId }}<\u002Fspan>\n              <span id=\"builder-title\" style=\"flex: 1; min-width: 180px; font-size: 15px; font-weight: 700\">{{ bName }}<\u002Fspan>\n              <sc-raw-select value=\"{{ bStatus }}\" sc-camel-on-change=\"{{ setBStatus }}\" aria-label=\"Document status\" style=\"font-family: var(--mono); font-size: 11px; min-height: 34px; border-left: 3px solid {{ bStatusTone }}\">\n                <sc-for list=\"{{ bStatuses }}\" as=\"o\" hint-placeholder-count=\"6\">\n                  <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n              <button sc-camel-on-click=\"{{ closeBuild }}\" aria-label=\"Close the document builder\" aria-keyshortcuts=\"Escape\" style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 8px 13px; min-height: 36px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">CLOSE <span class=\"kbd\">ESC<\u002Fspan><\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 10px; margin-top: 9px\">\n              <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint)\">{{ bRef }}<\u002Fspan>\n              <span style=\"flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden\">\n                <span style=\"display: block; height: 100%; width: {{ bBarW }}; background: {{ bTone }}; border-radius: 3px; transition: width .3s ease\"><\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: {{ bTone }}\">{{ bProgress }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"scroller\" style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 16px\">\n            <sc-if value=\"{{ bHasWhy }}\">\n              <p style=\"margin: 0 0 14px; font-size: 12.5px; line-height: 1.65; color: var(--ink-soft); background: var(--surface); border-left: 3px solid #FBE7E8; border-radius: 2px; padding: 11px 13px; text-wrap: pretty\">{{ bWhy }}<\u002Fp>\n            <\u002Fsc-if>\n\n            <div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px\">\n              <button sc-camel-on-click=\"{{ fillBEmpty }}\" disabled=\"{{ bAiBusy }}\" style=\"min-height: 38px; padding: 9px 12px; border: none; border-radius: 2px; background: #CC000E; color: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">AI: FILL EMPTY<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ undoBAi }}\" disabled=\"{{ bUndoDisabled }}\" style=\"min-height: 38px; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">UNDO AI<\u002Fbutton>\n              <span class=\"builder-ai-note {{ bAiClass }}\" role=\"status\" aria-live=\"polite\">{{ bAiMsg }}<\u002Fspan>\n            <\u002Fdiv>\n\n            <div class=\"builder-layout\" data-builder-layout=\"\">\n              <nav class=\"builder-rail\" aria-label=\"Document fields\">\n                <sc-for list=\"{{ bRail }}\" as=\"r\" hint-placeholder-count=\"6\">\n                  <button class=\"builder-step\" sc-camel-on-click=\"{{ r.go }}\" aria-current=\"{{ r.current }}\" aria-label=\"{{ r.label }}\" style=\"--step-edge: {{ r.edge }}; --step-bg: {{ r.bg }}\">\n                    <span class=\"kbd\">{{ r.n }}<\u002Fspan><span class=\"builder-step-title\">{{ r.title }}<\u002Fspan><span class=\"builder-step-state\" aria-hidden=\"true\">{{ r.state }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fnav>\n\n              <section>\n                <sc-for list=\"{{ bQs }}\" as=\"q\" hint-placeholder-count=\"1\">\n                  <div style=\"background: var(--surface); border: 1px solid var(--line); border-left: 3px solid {{ q.edge }}; border-radius: 3px; padding: 16px\">\n                    <div style=\"display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin-bottom: 7px\">\n                      <span style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 800; color: var(--ink-faint)\">FIELD {{ q.n }} OF {{ bTotal }}<\u002Fspan>\n                      <span style=\"flex: 1; min-width: 200px; font-size: 14px; font-weight: 650; line-height: 1.45\">{{ q.q }}<\u002Fspan>\n                      <sc-if value=\"{{ q.live }}\"><span title=\"Read-only until you explicitly take over\" style=\"font-family: var(--mono); font-size: 8.5px; font-weight: 700; letter-spacing: .09em; padding: 3px 6px; border-radius: 2px; background: var(--success-soft); color: var(--success-text)\">LIVE<\u002Fspan><\u002Fsc-if>\n                      <sc-if value=\"{{ q.drafted }}\"><span style=\"font-family: var(--mono); font-size: 8.5px; font-weight: 700; letter-spacing: .09em; padding: 3px 6px; border-radius: 2px; background: #F7EEDC; color: var(--warning-text)\">AI DRAFT<\u002Fspan><\u002Fsc-if>\n                      <sc-if value=\"{{ q.overridden }}\"><span style=\"font-family: var(--mono); font-size: 8.5px; font-weight: 700; letter-spacing: .09em; padding: 3px 6px; border-radius: 2px; border: 1px solid #CC000E; color: var(--accent-text)\">YOURS<\u002Fspan><\u002Fsc-if>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ q.hasHint }}\"><p style=\"margin: 0 0 10px; font-size: 11.5px; line-height: 1.6; color: var(--ink-faint); text-wrap: pretty\">{{ q.hint }}<\u002Fp><\u002Fsc-if>\n                    <sc-if value=\"{{ q.isText }}\"><input type=\"text\" value=\"{{ q.v }}\" sc-camel-on-change=\"{{ q.set }}\" disabled=\"{{ q.disabled }}\" placeholder=\"{{ q.ph }}\" aria-label=\"{{ q.q }}\" style=\"width: 100%; min-height: 42px\"><\u002Fsc-if>\n                    <sc-if value=\"{{ q.isSelect }}\"><sc-raw-select value=\"{{ q.v }}\" sc-camel-on-change=\"{{ q.set }}\" disabled=\"{{ q.disabled }}\" aria-label=\"{{ q.q }}\" style=\"width: 100%; min-height: 42px; font-size: 12px\"><option value=\"\">— choose —<\u002Foption><sc-for list=\"{{ q.opts }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.o }}\">{{ o.o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fsc-if>\n                    <sc-if value=\"{{ q.isArea }}\"><textarea value=\"{{ q.v }}\" sc-camel-on-change=\"{{ q.set }}\" disabled=\"{{ q.disabled }}\" rows=\"6\" placeholder=\"{{ q.ph }}\" aria-label=\"{{ q.q }}\" style=\"width: 100%; resize: vertical; line-height: 1.6\"><\u002Ftextarea><\u002Fsc-if>\n                    <sc-if value=\"{{ q.isList }}\"><textarea value=\"{{ q.v }}\" sc-camel-on-change=\"{{ q.set }}\" disabled=\"{{ q.disabled }}\" rows=\"7\" placeholder=\"{{ q.ph }}\" aria-label=\"{{ q.q }} — one per line\" style=\"width: 100%; resize: vertical; line-height: 1.6\"><\u002Ftextarea><\u002Fsc-if>\n                    <div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px\">\n                      <sc-if value=\"{{ q.live }}\"><button sc-camel-on-click=\"{{ q.edit }}\" disabled=\"{{ bAiBusy }}\" style=\"min-height: 36px; padding: 8px 11px; border: 1px solid #17693A; background: var(--surface); color: var(--success-text); cursor: pointer; font-family: var(--mono); font-size: 9px; font-weight: 700\">EDIT BY HAND<\u002Fbutton><\u002Fsc-if>\n                      <sc-if value=\"{{ q.liveOverride }}\"><button sc-camel-on-click=\"{{ q.handBack }}\" disabled=\"{{ bAiBusy }}\" title=\"Discard the manual override and restore the tracker-owned value\" style=\"min-height: 36px; padding: 8px 11px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink-soft); cursor: pointer; font-family: var(--mono); font-size: 9px; font-weight: 700\">RESTORE LIVE VALUE<\u002Fbutton><\u002Fsc-if>\n                      <button sc-camel-on-click=\"{{ q.draft }}\" disabled=\"{{ bAiBusy }}\" style=\"min-height: 36px; padding: 8px 11px; border: none; background: #2C2D2E; color: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9px; font-weight: 700\">{{ q.aiLabel }}<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n\n                <div style=\"display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 12px\">\n                  <button sc-camel-on-click=\"{{ prevB }}\" disabled=\"{{ bAtStart }}\" aria-keyshortcuts=\"Alt+ArrowLeft\" style=\"min-height: 38px; padding: 9px 12px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\"><span class=\"kbd\">⌥←<\u002Fspan> PREVIOUS<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ nextB }}\" aria-keyshortcuts=\"Alt+ArrowRight\" style=\"min-height: 38px; padding: 9px 12px; border: none; background: #CC000E; color: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">{{ bNextLabel }} <span class=\"kbd\">⌥→<\u002Fspan><\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsection>\n            <\u002Fdiv>\n\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--rule)\">\n              <button sc-camel-on-click=\"{{ toggleBPreview }}\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 9px 12px; min-height: 38px; border: none; border-radius: 2px; background: #2C2D2E; color: #fff; cursor: pointer\">{{ bPreviewLabel }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ openDocTab }}\" style=\"font-family: var(--mono); font-size: 10px; padding: 9px 12px; min-height: 38px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer\">OPEN IN TAB<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ copyDoc }}\" style=\"font-family: var(--mono); font-size: 10px; padding: 9px 12px; min-height: 38px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer\">COPY MARKDOWN<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ downloadWord }}\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 9px 12px; min-height: 38px; border: none; background: #CC000E; color: #FFFFFF; cursor: pointer\">DOWNLOAD WORD<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ downloadDoc }}\" style=\"font-family: var(--mono); font-size: 10px; padding: 9px 12px; min-height: 38px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer\">MARKDOWN<\u002Fbutton>\n              <sc-if value=\"{{ bHasSheet }}\"><button sc-camel-on-click=\"{{ downloadSheet }}\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 9px 12px; min-height: 38px; border: 1px solid #17693A; background: var(--surface); color: var(--success-text); cursor: pointer\">DOWNLOAD EXCEL<\u002Fbutton><\u002Fsc-if>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ bPreviewOpen }}\">\n              <pre style=\"margin: 14px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px; font-family: var(--mono); font-size: 11.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; color: var(--ink); max-height: 60vh; overflow: auto\">{{ bRendered }}<\u002Fpre>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n  <sc-if value=\"{{ heatOpen }}\">\n            <div sc-camel-on-click=\"{{ closeHeat }}\" style=\"position: fixed; inset: 0; z-index: 62; background: rgba(44,45,46,.55); display: flex; align-items: center; justify-content: center; padding: 72px 16px 20px\">\n            <div class=\"pane\" role=\"dialog\" aria-label=\"Risk heat map\" sc-camel-on-click=\"{{ stop }}\" style=\"background: var(--surface); border: 1px solid var(--rule); border-top: 3px solid #CC000E; border-radius: 4px; width: 100%; max-width: 640px; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 22px 60px rgba(44,45,46,.34)\">\n              <div style=\"flex-shrink: 0; display: flex; align-items: center; gap: 9px; padding: 16px 18px 12px; flex-wrap: wrap\">\n                <span style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint)\">Heat map<\u002Fspan>\n                <span style=\"flex: 1\"><\u002Fspan>\n                <div style=\"display: flex; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden\">\n                  <button sc-camel-on-click=\"{{ setHeatInherent }}\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .07em; padding: 5px 10px; border: none; cursor: pointer; background: {{ heatInherentBg }}; color: {{ heatInherentFg }}; min-height: 34px\">INHERENT<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ setHeatResidual }}\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .07em; padding: 5px 10px; border: none; cursor: pointer; background: {{ heatResidualBg }}; color: {{ heatResidualFg }}; min-height: 34px\">RESIDUAL<\u002Fbutton>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ closeHeat }}\" aria-label=\"Close the heat map\" style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 7px 12px; min-height: 34px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); color: var(--ink); cursor: pointer\">✕<\u002Fbutton>\n              <\u002Fdiv>\n              <div class=\"scroller\" style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 0 18px 18px\">\n              <div style=\"display: flex; gap: 8px\">\n                <div style=\"font-family: var(--mono); font-size: 8.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-faint); writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; padding: 4px 0; font-size: 9.5px\">Impact<\u002Fdiv>\n                <div style=\"flex: 1\">\n                  <sc-for list=\"{{ heatCells }}\" as=\"row\" hint-placeholder-count=\"5\">\n                    <div style=\"display: flex; gap: 4px; margin-bottom: 4px; align-items: stretch\">\n                      <div style=\"width: 62px; flex-shrink: 0; text-align: right; padding-right: 5px; font-family: var(--mono); font-size: 9px; color: var(--ink-faint); display: flex; flex-direction: column; justify-content: center; line-height: 1.25\">\n                        <span style=\"font-weight: 700; color: var(--ink)\">{{ row.i }}<\u002Fspan>\n                        <span>{{ row.word }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <sc-for list=\"{{ row.row }}\" as=\"c\" hint-placeholder-count=\"5\">\n                        <button sc-camel-on-click=\"{{ c.pick }}\" title=\"{{ c.title }}\" aria-label=\"{{ c.title }}\" style=\"flex: 1; aspect-ratio: 1.35; min-height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 2px; border: 1px solid {{ c.edge }}; outline: {{ c.ring }}; outline-offset: 1px; background: {{ c.bg }}; color: {{ c.fg }}; font-family: var(--mono); font-size: 12px; font-weight: 800; cursor: {{ c.cursor }}; transition: transform .12s ease\" style-hover=\"transform: scale(1.07)\">{{ c.n }}<\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"display: flex; gap: 4px; margin-top: 2px\">\n                    <div style=\"width: 62px; flex-shrink: 0\"><\u002Fdiv>\n                    <sc-for list=\"{{ likeAxis }}\" as=\"l\" hint-placeholder-count=\"5\">\n                      <div style=\"flex: 1; text-align: center; font-family: var(--mono); font-size: 9px; color: var(--ink-faint); line-height: 1.3\">\n                        <span style=\"display: block; font-weight: 700; color: var(--ink)\">{{ l.n }}<\u002Fspan>\n                        <span style=\"display: block\">{{ l.label }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"text-align: center; font-family: var(--mono); font-size: 8.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-faint); margin-top: 7px; font-size: 9.5px\">Likelihood<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ heatPick }}\">\n                <div style=\"margin-top: 14px; background: var(--surface-muted); border-radius: 3px; padding: 11px 13px\">\n                  <div style=\"display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap\">\n                    <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint)\">{{ heatPickHead }}<\u002Fspan>\n                    <span style=\"flex: 1\"><\u002Fspan>\n                    <sc-if value=\"{{ heatHasRisks }}\">\n                      <button sc-camel-on-click=\"{{ filterHeat }}\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 6px 10px; min-height: 30px; border: none; border-radius: 2px; background: #CC000E; color: #fff; cursor: pointer\">SHOW THESE IN THE REGISTER<\u002Fbutton>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <p style=\"margin: 7px 0 0; font-size: 12px; line-height: 1.65; color: var(--ink-soft); text-wrap: pretty\">{{ heatPickBody }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ noHeatPick }}\">\n                <p style=\"margin: 14px 0 0; font-size: 11.5px; line-height: 1.6; color: var(--ink-faint); text-wrap: pretty\">Hover a cell for the exact scores behind it, or click one to pull those risks into the register.<\u002Fp>\n              <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n  <sc-if value=\"{{ mapOpen }}\">\n                <div sc-camel-on-click=\"{{ closeMap }}\" style=\"position: fixed; inset: 0; z-index: 62; background: rgba(44,45,46,
