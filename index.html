    <sc-if value=\"{{ c.app }}\">\n                          <sc-raw-select value=\"{{ c.status }}\" sc-camel-on-change=\"{{ c.setStatus }}\" aria-label=\"Control status\" style=\"font-family: var(--mono); font-size: 11px; width: 100%; min-height: 44px; border-left: 3px solid {{ c.statusTone }}\">\n                            <sc-for list=\"{{ c.statuses }}\" as=\"o\" hint-placeholder-count=\"3\">\n                              <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                            <\u002Fsc-for>\n                          <\u002Fsc-raw-select>\n                          <input type=\"text\" value=\"{{ c.owner }}\" sc-camel-on-change=\"{{ c.setOwner }}\" placeholder=\"control owner — required by A.5.2\" aria-label=\"Control owner\" style=\"width: 100%; min-height: 44px; border-color: {{ c.ownerEdge }}; background: {{ c.ownerBg }}\">\n                        <\u002Fsc-if>\n                        <textarea value=\"{{ c.why }}\" sc-camel-on-change=\"{{ c.setWhy }}\" rows=\"3\" placeholder=\"why this control is included or excluded\" aria-label=\"Justification\" style=\"width: 100%; resize: vertical; line-height: 1.55\"><\u002Ftextarea>\n                        <div style=\"display: flex; gap: 7px; align-items: center; flex-wrap: wrap\">\n                          <sc-if value=\"{{ c.whyManual }}\">\n                            <span style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .07em; padding: 3px 6px; border-radius: 2px; border: 1px solid #CC000E; color: #CC000E\">YOURS<\u002Fspan>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ c.canCite }}\">\n                            <button sc-camel-on-click=\"{{ c.cite }}\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #54585B; cursor: pointer\">CITE<\u002Fbutton>\n                          <\u002Fsc-if>\n                          <sc-for list=\"{{ c.riskChips }}\" as=\"r\" hint-placeholder-count=\"1\">\n                            <button sc-camel-on-click=\"{{ r.go }}\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 9px 12px; min-height: 38px; border: 1px solid #CC000E; border-radius: 2px; background: #fff; color: #CC000E; cursor: pointer\">{{ r.id }}<\u002Fbutton>\n                          <\u002Fsc-for>\n                          <sc-for list=\"{{ c.docChips }}\" as=\"d\" hint-placeholder-count=\"1\">\n                            <button sc-camel-on-click=\"{{ d.go }}\" style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 9px 12px; min-height: 38px; border: 1px solid {{ d.tone }}; border-radius: 2px; background: #fff; color: {{ d.tone }}; cursor: pointer\">{{ d.id }}<\u002Fbutton>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <p style=\"font-size: 11px; color: #65696C; margin-top: 12px; max-width: 900px; line-height: 1.65\">Applicability is decided, never defaulted, in strict precedence: a risk citing the control wins, then the organisation profile, then a covering document, then the baseline ISMS set. <b>Decided by<\u002Fb> names which of those settled it. Override the decision and it becomes <b>YOURS<\u002Fb> — the engine stops writing that row, and that provenance is what an auditor asks for under 6.1.3 d).<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isStub }}\">\n        <div style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-left: 3px solid #C4C1C1; padding: 16px 18px; border-radius: 3px; max-width: 720px\">\n          <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: #65696C\">Not ported yet<\u002Fdiv>\n          <p style=\"margin: 8px 0 10px; font-size: 12.5px; line-height: 1.7; color: #54585B\">{{ stubNote }}<\u002Fp>\n          <div style=\"font-family: var(--mono); font-size: 10.5px; color: #2C2D2E; background: #E4E2E1; border-radius: 2px; padding: 8px 10px; display: inline-block\">{{ stubCount }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fmain>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isSettings }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 70; background: rgba(44,45,46,.56); display: flex; align-items: center; justify-content: center; padding: 38px 16px 18px\">\n      <div class=\"pane\" data-settings-modal=\"\" tabindex=\"-1\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"settings-title\" style=\"background: #EFEDED; border: 1px solid #C4C1C1; border-radius: 4px; width: 100%; max-width: 1110px; max-height: 100%; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 24px 70px rgba(20,20,20,.35)\">\n        <div style=\"flex-shrink: 0; padding: 15px 20px 12px; border-bottom: 1px solid #C4C1C1; background: #EFEDED\">\n          <div style=\"display: flex; justify-content: flex-end\">\n            <button data-settings-close=\"\" sc-camel-on-click=\"{{ closeSettings }}\" aria-label=\"Close settings\" aria-keyshortcuts=\"Escape\" style=\"display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 8px 13px; border: 1px solid #C4C1C1; border-radius: 2px; background: #FFFFFF; color: #2C2D2E; cursor: pointer; font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .07em\"><span aria-hidden=\"true\">✕<\u002Fspan> CLOSE <span class=\"kbd\">ESC<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n          <h2 id=\"settings-title\" style=\"margin: 3px 0 0; font-size: 20px; font-weight: 700; letter-spacing: -.015em\">Settings<\u002Fh2>\n          <p style=\"margin: 5px 0 0; font-size: 11.5px; color: #54585B\">Project parameters, organisation profile, API keys, cloud sync and backups.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"scroller\" data-set-body=\"\" style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px 18px; display: grid; gap: 13px\">\n          <section class=\"settings-card\">\n            <h3>Project<\u002Fh3>\n            <p>The start date drives all plan dates and the whole certification timeline.<\u002Fp>\n            <div data-settings-grid=\"\" style=\"display: grid; grid-template-columns: 1.05fr 1fr 1fr 1fr; gap: 10px\">\n              <label><span class=\"field-label\">Company name<\u002Fspan><input type=\"text\" value=\"{{ company }}\" sc-camel-on-change=\"{{ setCompany }}\" placeholder=\"Your organisation\" style=\"width: 100%; min-height: 38px\"><\u002Flabel>\n              <label><span class=\"field-label\">Project manager<\u002Fspan><input type=\"text\" value=\"{{ projectManager }}\" sc-camel-on-change=\"{{ setProjectManager }}\" placeholder=\"Your name\" style=\"width: 100%; min-height: 38px\"><\u002Flabel>\n              <label><span class=\"field-label\">Project start date<\u002Fspan><input type=\"date\" value=\"{{ startDate }}\" sc-camel-on-change=\"{{ setStart }}\" style=\"width: 100%; min-height: 38px\"><\u002Flabel>\n              <label><span class=\"field-label\">Risk acceptance threshold<\u002Fspan><input type=\"number\" min=\"1\" max=\"25\" value=\"{{ threshold }}\" sc-camel-on-change=\"{{ setProjectThreshold }}\" style=\"width: 100%; min-height: 38px\"><\u002Flabel>\n            <\u002Fdiv>\n            <div style=\"margin-top: 12px; font-family: var(--mono); font-size: 10.5px; color: #54585B\">Certification decision lands <b style=\"color: #CC000E\">{{ certificationDate }}<\u002Fb> on the current dates.<\u002Fdiv>\n          <\u002Fsection>\n\n          <div style=\"padding: 0 1px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 16px\">Connections<\u002Fh2>\n            <p style=\"margin: 0; font-size: 11.5px; color: #54585B\">Encryption, keys, company-profile import, backups and private cloud sync.<\u002Fp>\n          <\u002Fdiv>\n\n          <section class=\"settings-card\">\n            <h3>Lock and encryption<\u002Fh3>\n            <p>A passphrase encrypts the browser copy with AES-GCM. A temporary key can stay only in this tab until the idle timeout; forgetting the passphrase makes the saved project unrecoverable.<\u002Fp>\n            <sc-if value=\"{{ hasVault }}\">\n              <div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap\">\n                <span style=\"font-family: var(--mono); font-size: 10px; font-weight: 700; color: #17693A; border: 1px solid #17693A; padding: 5px 8px; border-radius: 2px\">ENCRYPTED<\u002Fspan>\n                <button sc-camel-on-click=\"{{ lockNow }}\" style=\"min-height: 38px; padding: 9px 13px; border: none; border-radius: 2px; background: #2C2D2E; color: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 10px; font-weight: 700\">LOCK NOW<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ vaultOff }}\" style=\"min-height: 38px; padding: 9px 13px; border: 1px solid #B6000C; border-radius: 2px; background: #FFFFFF; color: #B6000C; cursor: pointer; font-family: var(--mono); font-size: 10px; font-weight: 700\">TURN OFF ENCRYPTION<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noVault }}\">\n              <div style=\"display: grid; gap: 8px; max-width: 540px\">\n                <span style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; color: #8A5A00\">NOT ENCRYPTED<\u002Fspan>\n                <input type=\"password\" value=\"{{ vaultPass }}\" sc-camel-on-change=\"{{ setVaultPass }}\" placeholder=\"Passphrase — at least 10 characters\" aria-label=\"New vault passphrase\" style=\"width: 100%; min-height: 38px\">\n                <input type=\"password\" value=\"{{ vaultPass2 }}\" sc-camel-on-change=\"{{ setVaultPass2 }}\" placeholder=\"Repeat passphrase\" aria-label=\"Repeat vault passphrase\" style=\"width: 100%; min-height: 38px\">\n                <div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap\">\n                  <button sc-camel-on-click=\"{{ genTotp }}\" style=\"min-height: 36px; padding: 8px 11px; border: 1px solid #C4C1C1; border-radius: 2px; background: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">ADD AUTHENTICATOR<\u002Fbutton>\n                  <sc-if value=\"{{ hasTotp }}\"><span style=\"font-size: 11px; color: #17693A\">Secret generated. Add it to your authenticator, then enter a code.<\u002Fspan><\u002Fsc-if>\n                <\u002Fdiv>\n                <sc-if value=\"{{ hasTotp }}\">\n                  <div style=\"background: #F7F6F6; border: 1px solid #E1DEDE; border-radius: 2px; padding: 10px\">\n                    <span class=\"field-label\">Authenticator secret<\u002Fspan><div style=\"font-family: var(--mono); font-size: 11px; font-weight: 700; word-break: break-all\">{{ vaultTotp }}<\u002Fdiv>\n                    <input type=\"text\" value=\"{{ vaultCode }}\" sc-camel-on-change=\"{{ setVaultCode }}\" placeholder=\"6-digit code\" inputmode=\"numeric\" aria-label=\"Authenticator code\" style=\"width: 100%; min-height: 38px; margin-top: 8px\">\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <button sc-camel-on-click=\"{{ turnVaultOn }}\" disabled=\"{{ vaultBusy }}\" style=\"justify-self: start; min-height: 38px; padding: 9px 13px; border: none; border-radius: 2px; background: #CC000E; color: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 10px; font-weight: 700\">SET PASSWORD AND AUTHENTICATOR<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasVaultErr }}\"><div style=\"margin-top: 10px; background: #FBE3E4; border-left: 3px solid #B6000C; padding: 9px 11px; font-size: 11.5px\">{{ vaultErr }}<\u002Fdiv><\u002Fsc-if>\n            <div style=\"margin-top: 14px; padding-top: 12px; border-top: 1px solid #E1DEDE; display: grid; gap: 7px\">\n              <div style=\"display: flex; align-items: center; gap: 9px; flex-wrap: wrap\">\n                <label style=\"display: flex; align-items: center; gap: 8px; margin: 0\">\n                  <span class=\"field-label\" style=\"margin: 0; white-space: nowrap\">Ask again after<\u002Fspan>\n                  <sc-raw-select value=\"{{ idleMins }}\" sc-camel-on-change=\"{{ setIdleMins }}\" aria-label=\"Vault idle timeout\" style=\"min-width: 130px; min-height: 38px; font-family: var(--mono); font-size: 10.5px\">\n                    <sc-for list=\"{{ idleChoices }}\" as=\"o\" hint-placeholder-count=\"11\">\n                      <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                <\u002Flabel>\n                <span style=\"font-size: 10.5px; color: #65696C; line-height: 1.5\">of no activity. Refreshing this tab will not ask again while the session is active; closing the tab normally ends the session.<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .04em; color: {{ sessionStatusTone }}\">{{ sessionStatus }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section class=\"settings-card\">\n            <h3>Organisation profile — drives the Statement of Applicability<\u002Fh3>\n            <p>These answers decide which Annex A controls can be excluded and write the justification for each exclusion. Manual risk decisions still outrank this profile.<\u002Fp>\n            <sc-for list=\"{{ profileQs }}\" as=\"p\" hint-placeholder-count=\"7\">\n              <div style=\"display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid #E1DEDE\">\n                <span style=\"flex: 1\"><span style=\"display: block; font-size: 12px; font-weight: 600; line-height: 1.45\">{{ p.q }}<\u002Fspan><sc-if value=\"{{ p.hasHint }}\"><span style=\"display: block; margin-top: 2px; font-size: 10.5px; color: #65696C; line-height: 1.5\">{{ p.hint }}<\u002Fspan><\u002Fsc-if><\u002Fspan>\n                <span style=\"display: flex; flex-shrink: 0; border: 1px solid #C4C1C1; border-radius: 2px; overflow: hidden\"><button sc-camel-on-click=\"{{ p.setYes }}\" style=\"min-height: 34px; padding: 7px 12px; border: none; background: {{ p.yesBg }}; color: {{ p.yesFg }}; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">YES<\u002Fbutton><button sc-camel-on-click=\"{{ p.setNo }}\" style=\"min-height: 34px; padding: 7px 12px; border: none; background: {{ p.noBg }}; color: {{ p.noFg }}; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">NO<\u002Fbutton><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n\n          <section class=\"settings-card\">\n            <h3>Automatic propagation<\u002Fh3>\n            <p>Clause conformity, control status, applicability, residual scores and risk status are normally kept in step with your registers. Manual overrides remain yours.<\u002Fp>\n            <button sc-camel-on-click=\"{{ toggleAutoDerive }}\" aria-pressed=\"{{ autoDerivePressed }}\" style=\"display: flex; gap: 10px; align-items: flex-start; width: 100%; border: none; background: transparent; color: #2C2D2E; padding: 0; text-align: left; cursor: pointer\">\n              <span aria-hidden=\"true\" style=\"display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; flex-shrink: 0; border: 1px solid {{ autoDeriveEdge }}; border-radius: 2px; background: {{ autoDeriveBg }}; color: #FFFFFF; font-size: 12px; font-weight: 800\">{{ autoDeriveGlyph }}<\u002Fspan>\n              <span><b style=\"display: block; font-size: 12px\">Keep control and risk status up to date automatically<\u002Fb><span style=\"display: block; margin-top: 3px; font-size: 10.5px; color: #65696C; line-height: 1.55\">Turn this off when you need to set every status manually.<\u002Fspan><\u002Fspan>\n            <\u002Fbutton>\n            <div style=\"display: flex; gap: 9px; align-items: center; flex-wrap: wrap; margin-top: 12px\">\n              <button sc-camel-on-click=\"{{ handBackAll }}\" disabled=\"{{ noOverrides }}\" style=\"min-height: 36px; padding: 8px 11px; border: 1px solid #C4C1C1; border-radius: 2px; background: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">CLEAR ALL MY OVERRIDES<\u002Fbutton>\n              <span style=\"font-family: var(--mono); font-size: 9px; color: #65696C\">{{ overrideCount }} FIELDS SET BY HAND<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasOverrides }}\"><details style=\"margin-top: 10px\"><summary style=\"font-family: var(--mono); font-size: 9.5px; color: #65696C; cursor: pointer\">Review manual overrides<\u002Fsummary><sc-for list=\"{{ overrides }}\" as=\"o\" hint-placeholder-count=\"3\"><div style=\"display: flex; gap: 9px; align-items: center; padding: 7px 0; border-bottom: 1px solid #E1DEDE\"><span style=\"font-family: var(--mono); font-size: 8.5px; color: #CC000E\">{{ o.kind }}<\u002Fspan><span style=\"flex: 1; font-size: 11px\">{{ o.what }}<\u002Fspan><button sc-camel-on-click=\"{{ o.hand }}\" style=\"padding: 6px 8px; border: 1px solid #C4C1C1; background: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 8.5px\">HAND BACK<\u002Fbutton><\u002Fdiv><\u002Fsc-for><\u002Fdetails><\u002Fsc-if>\n          <\u002Fsection>\n\n          <section class=\"settings-card\">\n            <h3>Anthropic API — powers Annexa<\u002Fh3>\n            <p>Optional. The key is stored only in this browser. It is masked whenever Settings opens and is never included in an export or cloud payload.<\u002Fp>\n            <span class=\"field-label\">Anthropic API key<\u002Fspan>\n            <div style=\"display: grid; grid-template-columns: minmax(0,1fr) 38px auto auto; gap: 6px; align-items: center; max-width: 760px\">\n              <input type=\"{{ aiKeyType }}\" value=\"{{ aiKey }}\" sc-camel-on-change=\"{{ setAiKey }}\" placeholder=\"sk-ant-…\" aria-label=\"Anthropic API key\" autocomplete=\"off\" style=\"width: 100%; min-height: 38px; font-family: var(--mono)\">\n              <button class=\"icon-btn\" sc-camel-on-click=\"{{ toggleAiKey }}\" aria-pressed=\"{{ aiKeyPressed }}\" aria-label=\"{{ aiKeyEyeLabel }}\" title=\"{{ aiKeyEyeLabel }}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"2.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><\u002Fcircle><\u002Fsvg><\u002Fbutton>\n              <button sc-camel-on-click=\"{{ saveAiKey }}\" style=\"min-height: 38px; padding: 9px 12px; border: none; border-radius: 2px; background: #CC000E; color: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">SAVE API KEY<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ clearAiKey }}\" style=\"min-height: 38px; padding: 9px 12px; border: 1px solid #C4C1C1; border-radius: 2px; background: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9.5px\">CLEAR<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"margin-top: 7px; font-family: var(--mono); font-size: 9px; color: {{ keyTone }}\">{{ keyState }}<\u002Fdiv>\n          <\u002Fsection>\n\n          <section class=\"settings-card\">\n            <h3>Start from a company profile — optional<\u002Fh3>\n            <p>Upload an existing profile document and Annexa will draft the organisation context for clauses 4.1, 4.2 and 4.3. Nothing is applied until you review it.<\u002Fp>\n            <div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap\"><label style=\"display: inline-flex; align-items: center; min-height: 38px; padding: 9px 13px; border-radius: 2px; background: #CC000E; color: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">CHOOSE A PROFILE<input type=\"file\" accept=\".pdf,.docx,.txt,.md,.csv,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown,text/csv\" sc-camel-on-change=\"{{ pickDoc }}\" aria-label=\"Choose a PDF, Word, text, Markdown or CSV organisation profile\" style=\"display: none\"><\u002Flabel><sc-if value=\"{{ isImpBusy }}\"><span class=\"busy\" style=\"padding: 7px 10px; font-family: var(--mono); font-size: 9.5px\">{{ impBusy }}…<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ hasImpSrc }}\"><span style=\"font-family: var(--mono); font-size: 9px; color: #65696C\">{{ impSrc }}<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n            <details style=\"margin-top: 9px\"><summary style=\"font-size: 10.5px; color: #54585B; cursor: pointer\">…or paste the text instead<\u002Fsummary><textarea value=\"{{ pasteVal }}\" sc-camel-on-change=\"{{ pasteDoc }}\" rows=\"4\" placeholder=\"Paste relevant organisation profile text\" style=\"width: 100%; margin-top: 7px; line-height: 1.6\"><\u002Ftextarea><button sc-camel-on-click=\"{{ readPaste }}\" style=\"margin-top: 7px; min-height: 36px; padding: 8px 11px; border: 1px solid #C4C1C1; background: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9.5px\">READ THIS TEXT<\u002Fbutton><\u002Fdetails>\n            <sc-if value=\"{{ hasImpErr }}\"><div style=\"margin-top: 9px; background: #FBEEDC; border-left: 3px solid #8A5A00; padding: 9px 11px; font-size: 11px\">{{ impErr }}<\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ hasFound }}\"><div style=\"margin-top: 11px; border-top: 1px solid #E1DEDE; padding-top: 10px\"><span class=\"field-label\">Review what Annexa found<\u002Fspan><sc-for list=\"{{ foundRows }}\" as=\"g\" hint-placeholder-count=\"5\"><div style=\"display: flex; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid #E1DEDE\"><button sc-camel-on-click=\"{{ g.toggle }}\" aria-pressed=\"{{ g.on }}\" style=\"min-width: 54px; padding: 6px 8px; border: 1px solid #C4C1C1; background: {{ g.bg }}; color: {{ g.fg }}; cursor: pointer; font-family: var(--mono); font-size: 8.5px\">KEEP<\u002Fbutton><span style=\"flex: 1; font-size: 11px\">{{ g.label }}<\u002Fspan><span style=\"font-family: var(--mono); font-size: 9px; color: #65696C\">{{ g.count }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><div style=\"display: flex; gap: 8px; margin-top: 9px\"><button sc-camel-on-click=\"{{ applyFound }}\" style=\"min-height: 36px; padding: 8px 11px; border: none; background: #17693A; color: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">APPLY SELECTED<\u002Fbutton><button sc-camel-on-click=\"{{ discardFound }}\" style=\"min-height: 36px; padding: 8px 11px; border: 1px solid #C4C1C1; background: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9.5px\">DISCARD<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n          <\u002Fsection>\n\n          <section class=\"settings-card\">\n            <h3>Finish a project and start a new organisation<\u002Fh3>\n            <p>Archive the whole project to a file, clear the tracker for the next organisation, or load an archive later.<\u002Fp>\n            <div style=\"background: #E4E2E1; border-radius: 2px; padding: 10px 12px; font-size: 10.5px; line-height: 1.55\"><b>{{ archiveSummary }}<\u002Fb><\u002Fdiv>\n            <label style=\"display: block; margin-top: 9px\"><span class=\"field-label\">Note for the archive (optional)<\u002Fspan><input type=\"text\" value=\"{{ archiveNote }}\" sc-camel-on-change=\"{{ setArchiveNote }}\" placeholder=\"e.g. certified 12 March 2027, certificate no. 1234\" style=\"width: 100%; min-height: 36px\"><\u002Flabel>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-top: 9px\"><button sc-camel-on-click=\"{{ archiveOnly }}\" style=\"min-height: 36px; padding: 8px 11px; border: none; background: #2C2D2E; color: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9px; font-weight: 700\">DOWNLOAD ARCHIVE ONLY<\u002Fbutton><button sc-camel-on-click=\"{{ archiveAndStart }}\" style=\"min-height: 36px; padding: 8px 11px; border: none; background: #CC000E; color: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9px; font-weight: 700\">ARCHIVE, THEN START A NEW ORGANISATION<\u002Fbutton><label style=\"display: inline-flex; align-items: center; min-height: 36px; padding: 8px 11px; border: 1px solid #CC000E; background: #FFFFFF; color: #CC000E; cursor: pointer; font-family: var(--mono); font-size: 9px; font-weight: 700\">RESTORE AN ARCHIVE<input type=\"file\" accept=\"application/json\" sc-camel-on-change=\"{{ restoreArchive }}\" style=\"display: none\"><\u002Flabel><\u002Fdiv>\n          <\u002Fsection>\n\n          <section class=\"settings-card\">\n            <h3>Backup<\u002Fh3>\n            <p>A local backup is the copy you control. Download one before a major change.<\u002Fp>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap\"><button sc-camel-on-click=\"{{ backup }}\" aria-keyshortcuts=\"Control+Shift+B Meta+Shift+B\" style=\"min-height: 38px; padding: 9px 12px; border: none; background: #2C2D2E; color: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">DOWNLOAD JSON BACKUP <span class=\"kbd\">⌘⇧B<\u002Fspan><\u002Fbutton><label style=\"display: inline-flex; align-items: center; min-height: 38px; padding: 9px 12px; border: 1px solid #C4C1C1; background: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">RESTORE FROM FILE<input type=\"file\" accept=\"application/json\" sc-camel-on-change=\"{{ restore }}\" style=\"display: none\"><\u002Flabel><button sc-camel-on-click=\"{{ resetEverything }}\" style=\"min-height: 38px; padding: 9px 12px; border: 1px solid #B6000C; background: #FFFFFF; color: #B6000C; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">RESET EVERYTHING<\u002Fbutton><\u002Fdiv>\n          <\u002Fsection>\n\n          <section class=\"settings-card\">\n            <h3>Cloud sync — jsonbin.io<\u002Fh3>\n            <p>Optional. Keeps a private copy of tracker data so you can move between devices. API keys and attachments are not included in the pushed payload.<\u002Fp>\n            <div data-settings-grid=\"\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 820px\">\n              <label><span class=\"field-label\">jsonbin.io master key<\u002Fspan><span class=\"secret-row\"><input type=\"{{ jbKeyType }}\" value=\"{{ jbKey }}\" sc-camel-on-change=\"{{ setJbKey }}\" placeholder=\"$2a$10$…\" autocomplete=\"off\" aria-label=\"jsonbin master key\" style=\"width: 100%; min-height: 38px; font-family: var(--mono)\"><button class=\"icon-btn\" sc-camel-on-click=\"{{ toggleJbKey }}\" aria-pressed=\"{{ jbKeyPressed }}\" aria-label=\"{{ jbKeyEyeLabel }}\" title=\"{{ jbKeyEyeLabel }}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"2.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><\u002Fcircle><\u002Fsvg><\u002Fbutton><\u002Fspan><\u002Flabel>\n              <label><span class=\"field-label\">Bin ID<\u002Fspan><input type=\"text\" value=\"{{ jbId }}\" sc-camel-on-change=\"{{ setJbId }}\" placeholder=\"Created on first push\" aria-label=\"jsonbin bin id\" style=\"width: 100%; min-height: 38px; font-family: var(--mono)\"><\u002Flabel>\n            <\u002Fdiv>\n            <div style=\"margin-top: 9px; font-family: var(--mono); font-size: 9.5px; color: {{ syncWarnTone }}\">{{ syncWarn }}<\u002Fdiv>\n            <div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 9px\"><button sc-camel-on-click=\"{{ doPush }}\" disabled=\"{{ syncBusy }}\" style=\"min-height: 38px; padding: 9px 12px; border: none; background: #2C2D2E; color: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">PUSH TO CLOUD<\u002Fbutton><button sc-camel-on-click=\"{{ doPull }}\" disabled=\"{{ syncBusy }}\" style=\"min-height: 38px; padding: 9px 12px; border: 1px solid #C4C1C1; background: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">PULL FROM CLOUD<\u002Fbutton><span style=\"font-family: var(--mono); font-size: 9px; color: #65696C\">{{ lastSync }}<\u002Fspan><\u002Fdiv>\n            <sc-if value=\"{{ hasSyncMsg }}\"><div style=\"margin-top: 9px; background: #F7F6F6; border-left: 3px solid #C4C1C1; padding: 9px 11px; font-size: 11px\">{{ syncMsg }}<\u002Fdiv><\u002Fsc-if>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ shortcutOpen }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 80; background: rgba(44,45,46,.56); display: flex; align-items: center; justify-content: center; padding: 24px\">\n      <div class=\"pane\" data-shortcuts-modal=\"\" tabindex=\"-1\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"shortcuts-title\" style=\"width: 100%; max-width: 620px; max-height: 88vh; overflow: auto; background: #EFEDED; border: 1px solid #C4C1C1; border-top: 3px solid #CC000E; border-radius: 4px; padding: 20px; box-shadow: 0 24px 70px rgba(20,20,20,.35)\">\n        <div style=\"display: flex; gap: 12px; align-items: flex-start\"><div style=\"flex: 1\"><h2 id=\"shortcuts-title\" style=\"margin: 0; font-size: 20px\">Keyboard shortcuts<\u002Fh2><p style=\"margin: 5px 0 0; font-size: 11.5px; line-height: 1.55; color: #54585B\">Shortcuts work throughout the tracker and pause while you type in a field. Escape always closes the top panel.<\u002Fp><\u002Fdiv><button data-shortcuts-close=\"\" sc-camel-on-click=\"{{ closeShortcuts }}\" aria-label=\"Close keyboard shortcuts\" style=\"min-height: 36px; padding: 8px 11px; border: 1px solid #C4C1C1; background: #FFFFFF; cursor: pointer; font-family: var(--mono); font-size: 9.5px; font-weight: 700\">CLOSE <span class=\"kbd\">ESC<\u002Fspan><\u002Fbutton><\u002Fdiv>\n        <div style=\"margin-top: 16px; background: #FFFFFF; border: 1px solid #E1DEDE; border-radius: 3px; padding: 4px 14px\">\n          <div class=\"shortcut-row\"><span><b>Open a section<\u002Fb><br><small style=\"color: #65696C\">Overview through Annex A / SoA<\u002Fsmall><\u002Fspan><span><span class=\"kbd\">ALT<\u002Fspan> + <span class=\"kbd\">1–6<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"shortcut-row\"><span><b>Open Settings<\u002Fb><\u002Fspan><span><span class=\"kbd\">⌘ / CTRL<\u002Fspan> + <span class=\"kbd\">,<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"shortcut-row\"><span><b>Search the current section<\u002Fb><\u002Fspan><span class=\"kbd\">/<\u002Fspan><\u002Fdiv>\n          <div class=\"shortcut-row\"><span><b>Ask Annexa<\u002Fb><\u002Fspan><span><span class=\"kbd\">⌘ / CTRL<\u002Fspan> + <span class=\"kbd\">K<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"shortcut-row\"><span><b>Download a backup<\u002Fb><\u002Fspan><span><span class=\"kbd\">⌘ / CTRL<\u002Fspan> + <span class=\"kbd\">⇧<\u002Fspan> + <span class=\"kbd\">B<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"shortcut-row\"><span><b>Show this guide<\u002Fb><\u002Fspan><span class=\"kbd\">?<\u002Fspan><\u002Fdiv>\n          <div class=\"shortcut-row\"><span><b>Close the top panel<\u002Fb><\u002Fspan><span class=\"kbd\">ESC<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ legacySettings }}\">\n        <div style=\"position: fixed; inset: 0; z-index: 60; background: rgba(44,45,46,.5); display: flex; align-items: center; justify-content: center; padding: 72px 16px 20px\">\n        <div class=\"pane\" role=\"dialog\" aria-label=\"Settings\" style=\"background: #EFEDED; border: 1px solid #C4C1C1; border-radius: 4px; width: 100%; max-width: 920px; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 22px 60px rgba(44,45,46,.3)\">\n        <div data-set-head=\"\" style=\"flex-shrink: 0; background: #EFEDED; border-bottom: 1px solid #C4C1C1; border-radius: 4px 4px 0 0; padding: 16px 18px 12px\">\n          <div style=\"display: flex; justify-content: flex-end\">\n            <button sc-camel-on-click=\"{{ closeSettings }}\" aria-label=\"Close settings\" style=\"display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 9px 15px; min-height: 40px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #2C2D2E; cursor: pointer\" style-hover=\"border-color: #CC000E; color: #CC000E\"><span aria-hidden=\"true\">✕<\u002Fspan>CLOSE<\u002Fbutton>\n          <\u002Fdiv>\n          <h2 style=\"margin: 6px 0 0; font-size: 21px; font-weight: 700; letter-spacing: -.015em\">Settings<\u002Fh2>\n          <p style=\"margin: 5px 0 0; font-size: 13px; color: #54585B; line-height: 1.6\">Profile, organisation document, keys, vault and backups.<\u002Fp>\n          <div class=\"scroller\" style=\"display: flex; gap: 6px; margin-top: 12px; padding-bottom: 3px; overflow-x: auto\">\n            <sc-for list=\"{{ setNav }}\" as=\"s\" hint-placeholder-count=\"8\">\n              <button sc-camel-on-click=\"{{ s.go }}\" style=\"flex-shrink: 0; font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 7px 10px; min-height: 32px; border: 1px solid #E1DEDE; border-radius: 2px; background: #FFFFFF; color: #54585B; cursor: pointer; white-space: nowrap\" style-hover=\"border-color: #CC000E; color: #CC000E\">{{ s.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- minmax(0,1fr) caps the column at the panel width. An implicit grid\n             column is min-content-floored, so one wide child (a table, a long\n             key) pushed the whole panel sideways. -->\n        <div class=\"scroller\" data-set-body=\"\" tabindex=\"0\" style=\"flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 16px 18px 18px\">\n          <section id=\"set-project\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">This project<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: #54585B; line-height: 1.6\">Used on every generated document and as the anchor date for the plan.<\u002Fp>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 11px\">\n              <label style=\"display: block\">\n                <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: #65696C; margin-bottom: 4px\">Organisation<\u002Fspan>\n                <input type=\"text\" value=\"{{ company }}\" sc-camel-on-change=\"{{ setCompany }}\" placeholder=\"the legal entity being certified\" aria-label=\"Organisation\" style=\"width: 100%; min-height: 38px\">\n              <\u002Flabel>\n              <label style=\"display: block\">\n                <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: #65696C; margin-bottom: 4px\">Project start<\u002Fspan>\n                <input type=\"date\" value=\"{{ startDate }}\" sc-camel-on-change=\"{{ setStart }}\" aria-label=\"Project start date\" style=\"width: 100%; min-height: 38px\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <label style=\"display: block; margin-top: 11px\">\n              <span style=\"display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: #65696C; margin-bottom: 4px\">ISMS scope · clause 4.3<\u002Fspan>\n              <textarea value=\"{{ scope }}\" sc-camel-on-change=\"{{ setScope }}\" rows=\"3\" placeholder=\"what the ISMS covers, and what it deliberately excludes\" aria-label=\"ISMS scope\" style=\"width: 100%; resize: vertical; line-height: 1.6\"><\u002Ftextarea>\n            <\u002Flabel>\n          <\u002Fsection>\n\n          <section id=\"set-profile\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Organisation profile<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: #54585B; line-height: 1.6; max-width: 660px; text-wrap: pretty\">These seven answers decide which Annex A controls the engine proposes. A control you have overridden by hand is never touched by a change here.<\u002Fp>\n            <sc-for list=\"{{ profileQs }}\" as=\"p\" hint-placeholder-count=\"7\">\n              <div style=\"display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-bottom: 1px solid #E1DEDE\">\n                <span style=\"flex: 1\">\n                  <span style=\"display: block; font-size: 13px; font-weight: 600; line-height: 1.45\">{{ p.q }}<\u002Fspan>\n                  <sc-if value=\"{{ p.hasHint }}\">\n                    <span style=\"display: block; font-size: 11.5px; color: #65696C; line-height: 1.55; margin-top: 3px\">{{ p.hint }}<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fspan>\n                <span style=\"display: flex; border: 1px solid #C4C1C1; border-radius: 2px; overflow: hidden; flex-shrink: 0\">\n                  <button sc-camel-on-click=\"{{ p.setYes }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; padding: 8px 13px; min-height: 36px; border: none; cursor: pointer; background: {{ p.yesBg }}; color: {{ p.yesFg }}\">YES<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ p.setNo }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; padding: 8px 13px; min-height: 36px; border: none; cursor: pointer; background: {{ p.noBg }}; color: {{ p.noFg }}\">NO<\u002Fbutton>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n\n          <section id=\"set-overrides\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Decisions you have taken over<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: #54585B; line-height: 1.6; max-width: 660px; text-wrap: pretty\">Every row here is a place you overruled the engine. It stops deriving that field, which is exactly what you want for a judgement you own — and worth reviewing when the profile or the risk register moves on. Handing one back does not delete anything you typed.<\u002Fp>\n            <sc-if value=\"{{ hasOverrides }}\">\n              <div>\n                <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 9px\">\n                  <span style=\"font-family: var(--mono); font-size: 11px; font-weight: 700; color: #CC000E\">{{ overrideCount }} overridden<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ handBackAll }}\" style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .06em; padding: 7px 11px; min-height: 34px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #54585B; cursor: pointer\">HAND ALL BACK<\u002Fbutton>\n                <\u002Fdiv>\n                <sc-for list=\"{{ overrides }}\" as=\"o\" hint-placeholder-count=\"3\">\n                  <div style=\"display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #E1DEDE\">\n                    <span style=\"font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .07em; padding: 3px 6px; border-radius: 2px; border: 1px solid #CC000E; color: #CC000E; flex-shrink: 0\">{{ o.kind }}<\u002Fspan>\n                    <span style=\"flex: 1; font-size: 12.5px\">{{ o.what }}<\u002Fspan>\n                    <button sc-camel-on-click=\"{{ o.hand }}\" title=\"Let the engine derive this again\" style=\"font-family: var(--mono); font-size: 9.5px; padding: 6px 10px; min-height: 32px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #54585B; cursor: pointer; flex-shrink: 0\">HAND BACK<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noOverrides }}\">\n              <p style=\"margin: 0; font-size: 12.5px; color: #65696C\">Nothing overridden yet. Every status on screen is derived.<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fsection>\n\n          <section id=\"set-data\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">This browser's data<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: #54585B; line-height: 1.6; max-width: 660px; text-wrap: pretty\">Everything lives in this browser and goes nowhere else. A backup is the only copy that survives clearing site data.<\u002Fp>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n              <button sc-camel-on-click=\"{{ backup }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: #2C2D2E; color: #fff; cursor: pointer\">DOWNLOAD BACKUP<\u002Fbutton>\n              <label style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; display: flex; align-items: center; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #2C2D2E; cursor: pointer\">RESTORE BACKUP<input type=\"file\" accept=\"application/json\" sc-camel-on-change=\"{{ restore }}\" aria-label=\"Restore a backup\" style=\"display: none\"><\u002Flabel>\n              <button sc-camel-on-click=\"{{ newProject }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid #B6000C; border-radius: 2px; background: #fff; color: #B6000C; cursor: pointer\">START A NEW PROJECT<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"set-import\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Read your organisation's own document<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: #54585B; line-height: 1.6; max-width: 680px; text-wrap: pretty\">Upload a company profile, prospectus or intranet page — HTML, PDF, text or Markdown — and it will be read for the things clauses 4.1 to 4.3 ask for: external and internal issues, interested parties, locations, systems, and what belongs inside the scope. Nothing is written until you have seen it and ticked what to keep.<\u002Fp>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n              <label style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; display: flex; align-items: center; border: none; border-radius: 2px; background: #CC000E; color: #fff; cursor: pointer\">UPLOAD A DOCUMENT<input type=\"file\" accept=\".pdf,.docx,.txt,.md,.csv,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown,text/csv\" sc-camel-on-change=\"{{ pickDoc }}\" aria-label=\"Choose a PDF, Word, text, Markdown or CSV organisation profile\" style=\"display: none\"><\u002Flabel>\n              <sc-if value=\"{{ isImpBusy }}\">\n                <span class=\"busy\" style=\"font-family: var(--mono); font-size: 10.5px; padding: 8px 12px; border-radius: 2px; color: #54585B\">{{ impBusy }}…<\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ hasImpSrc }}\">\n                <span style=\"font-family: var(--mono); font-size: 10px; color: #65696C\">{{ impSrc }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <details style=\"margin-top: 11px\">\n              <summary style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: #65696C; cursor: pointer\">Or paste the relevant sections<\u002Fsummary>\n              <textarea value=\"{{ pasteVal }}\" sc-camel-on-change=\"{{ pasteDoc }}\" rows=\"5\" placeholder=\"Paste the parts of the document that describe the organisation, its market, its sites and its systems.\" aria-label=\"Paste organisation text\" style=\"width: 100%; resize: vertical; margin-top: 8px; line-height: 1.6\"><\u002Ftextarea>\n              <button sc-camel-on-click=\"{{ readPaste }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; margin-top: 7px; padding: 9px 13px; min-height: 38px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #2C2D2E; cursor: pointer\">READ THIS TEXT<\u002Fbutton>\n            <\u002Fdetails>\n            <sc-if value=\"{{ hasImpErr }}\">\n              <div style=\"margin-top: 11px; background: #FBEEDC; border-left: 3px solid #8A5A00; border-radius: 2px; padding: 10px 12px; font-size: 12px; line-height: 1.6\">{{ impErr }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasFound }}\">\n              <div style=\"margin-top: 13px; border-top: 1px solid #E1DEDE; padding-top: 13px\">\n                <div style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: #65696C; margin-bottom: 9px\">What it found — untick anything you do not want<\u002Fdiv>\n                <sc-for list=\"{{ foundRows }}\" as=\"g\" hint-placeholder-count=\"5\">\n                  <div style=\"border: 1px solid #E1DEDE; border-radius: 2px; padding: 10px 11px; margin-bottom: 8px\">\n                    <div style=\"display: flex; align-items: center; gap: 9px; margin-bottom: 6px\">\n                      <button sc-camel-on-click=\"{{ g.toggle }}\" aria-pressed=\"{{ g.on }}\" style=\"font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 5px 10px; min-height: 30px; border: 1px solid #C4C1C1; border-radius: 2px; background: {{ g.bg }}; color: {{ g.fg }}; cursor: pointer\">KEEP<\u002Fbutton>\n                      <span style=\"font-size: 12.5px; font-weight: 600; flex: 1\">{{ g.label }}<\u002Fspan>\n                      <span style=\"font-family: var(--mono); font-size: 10px; color: #65696C\">{{ g.count }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                      <div style=\"font-size: 11.5px; color: #54585B; line-height: 1.55; padding: 2px 0 2px 11px; border-left: 2px solid #E1DEDE\">{{ it.t }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ g.hasMore }}\">\n                      <div style=\"font-family: var(--mono); font-size: 10px; color: #65696C; margin-top: 4px; padding-left: 11px\">{{ g.more }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px\">\n                  <button sc-camel-on-click=\"{{ applyFound }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: #17693A; color: #fff; cursor: pointer\">APPLY WHAT IS TICKED<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ discardFound }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #54585B; cursor: pointer\">DISCARD<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n\n          <section id=\"set-vault\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Vault — encrypt this browser's copy<\u002Fh2>\n            <p style=\"margin: 0 0 12px; font-size: 12px; color: #54585B; line-height: 1.6; max-width: 680px; text-wrap: pretty\">A passphrase derives an AES-GCM key, and everything written to browser storage goes through it. A temporary key can stay only in this tab until the idle timeout. <b>Forgetting the passphrase loses the project<\u002Fb> — there is no recovery path, so keep a downloaded backup somewhere you trust.<\u002Fp>\n            <sc-if value=\"{{ hasVault }}\">\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n                <span style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: #17693A\">VAULT ON — storage holds ciphertext<\u002Fspan>\n                <span style=\"flex: 1\"><\u002Fspan>\n                <button sc-camel-on-click=\"{{ lockNow }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: #2C2D2E; color: #fff; cursor: pointer\">LOCK NOW<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ vaultOff }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid #B6000C; border-radius: 2px; background: #fff; color: #B6000C; cursor: pointer\">TURN OFF<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noVault }}\">\n              <div style=\"display: grid; gap: 9px; max-width: 460px\">\n                <input type=\"password\" value=\"{{ vaultPass }}\" sc-camel-on-change=\"{{ setVaultPass }}\" placeholder=\"Passphrase — at least 10 characters\" aria-label=\"New passphrase\" style=\"width: 100%; min-height: 38px\">\n                <input type=\"password\" value=\"{{ vaultPass2 }}\" sc-camel-on-change=\"{{ setVaultPass2 }}\" placeholder=\"Repeat the passphrase\" aria-label=\"Repeat passphrase\" style=\"width: 100%; min-height: 38px\">\n                <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n                  <button sc-camel-on-click=\"{{ genTotp }}\" style=\"font-family: var(--mono); font-size: 10px; letter-spacing: .06em; padding: 9px 12px; min-height: 36px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #2C2D2E; cursor: pointer\">ADD AN AUTHENTICATOR<\u002Fbutton>\n                  <sc-if value=\"{{ hasTotp }}\">\n                    <span style=\"font-family: var(--mono); font-size: 10px; color: #17693A\">secret generated — add it below, then enter a code<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <sc-if value=\"{{ hasTotp }}\">\n                  <div style=\"background: #F7F6F6; border: 1px solid #E1DEDE; border-radius: 2px; padding: 10px 12px\">\n                    <div style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: #65696C; margin-bottom: 5px\">Add this secret to your authenticator<\u002Fdiv>\n                    <div style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; word-break: break-all; color: #2C2D2E\">{{ vaultTotp }}<\u002Fdiv>\n                    <input type=\"text\" value=\"{{ vaultCode }}\" sc-camel-on-change=\"{{ setVaultCode }}\" placeholder=\"Then enter the 6-digit code\" aria-label=\"Authenticator code\" inputmode=\"numeric\" style=\"width: 100%; margin-top: 9px; min-height: 38px\">\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <button sc-camel-on-click=\"{{ turnVaultOn }}\" disabled=\"{{ vaultBusy }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 10px 13px; min-height: 40px; border: none; border-radius: 2px; background: #CC000E; color: #fff; cursor: pointer\">TURN THE VAULT ON<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasVaultErr }}\">\n              <div style=\"margin-top: 11px; background: #FBE3E4; border-left: 3px solid #B6000C; border-radius: 2px; padding: 10px 12px; font-size: 12px; line-height: 1.55\">{{ vaultErr }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n\n          <section id=\"set-key\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">AI assistance API<\u002Fh2>\n            <p style=\"margin: 0 0 11px; font-size: 12px; color: #54585B; line-height: 1.6; max-width: 680px; text-wrap: pretty\">Optional. Without a key, reading a document uses the built-in model. With one, calls go straight from this browser to Anthropic and the key is stored only here.<\u002Fp>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n              <input type=\"password\" value=\"{{ aiKey }}\" sc-camel-on-change=\"{{ setAiKey }}\" placeholder=\"sk-ant-…\" aria-label=\"Anthropic API key\" style=\"flex: 1; min-width: 220px; min-height: 38px; font-family: var(--mono)\">\n              <button sc-camel-on-click=\"{{ clearAiKey }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #54585B; cursor: pointer\">CLEAR<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-family: var(--mono); font-size: 10px; margin-top: 7px; color: {{ keyTone }}\">{{ keyState }}<\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"set-sync\" style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-radius: 3px; padding: 16px\">\n            <h2 style=\"margin: 0 0 3px; font-size: 15px; font-weight: 700\">Cloud sync<\u002Fh2>\n            <p style=\"margin: 0 0 11px; font-size: 12px; color: #54585B; line-height: 1.6; max-width: 680px; text-wrap: pretty\">Pushes the project to a private bin on your own jsonbin account, so you can carry it between machines. Attachments stay here — they live under a separate key and are never part of the payload.<\u002Fp>\n            <div style=\"font-family: var(--mono); font-size: 10.5px; margin-bottom: 11px; color: {{ syncWarnTone }}\">{{ syncWarn }}<\u002Fdiv>\n            <div style=\"display: grid; gap: 9px; max-width: 520px\">\n              <input type=\"password\" value=\"{{ jbKey }}\" sc-camel-on-change=\"{{ setJbKey }}\" placeholder=\"jsonbin master key\" aria-label=\"jsonbin master key\" style=\"width: 100%; min-height: 38px; font-family: var(--mono)\">\n              <input type=\"text\" value=\"{{ jbId }}\" sc-camel-on-change=\"{{ setJbId }}\" placeholder=\"bin id — left empty, a push creates one\" aria-label=\"jsonbin bin id\" style=\"width: 100%; min-height: 38px; font-family: var(--mono)\">\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n                <button sc-camel-on-click=\"{{ doPush }}\" disabled=\"{{ syncBusy }}\" style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: none; border-radius: 2px; background: #2C2D2E; color: #fff; cursor: pointer\">PUSH<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ doPull }}\" disabled=\"{{ syncBusy }}\" style=\"font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 9px 13px; min-height: 38px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #2C2D2E; cursor: pointer\">PULL<\u002Fbutton>\n                <span style=\"font-family: var(--mono); font-size: 10px; color: #65696C\">{{ lastSync }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasSyncMsg }}\">\n              <div style=\"margin-top: 11px; background: #F7F6F6; border-left: 3px solid #C4C1C1; border-radius: 2px; padding: 10px 12px; font-size: 12px; line-height: 1.55\">{{ syncMsg }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n        <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n  <sc-if value=\"{{ buildOpen }}\">\n        <div style=\"position: fixed; inset: 0; z-index: 60; background: rgba(44,45,46,.5); display: flex; align-items: center; justify-content: center; padding: 72px 16px 20px\">\n        <div class=\"pane\" role=\"dialog\" aria-label=\"Document builder\" style=\"background: #EFEDED; border: 1px solid #C4C1C1; border-radius: 4px; width: 100%; max-width: 940px; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 22px 60px rgba(44,45,46,.3)\">\n          <div style=\"flex-shrink: 0; background: #FFFFFF; border-bottom: 2px solid #2C2D2E; padding: 13px 16px\">\n            <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap\">\n              <span style=\"font-family: var(--mono); font-size: 12px; font-weight: 800; color: #CC000E\">{{ bId }}<\u002Fspan>\n              <span style=\"flex: 1; min-width: 180px; font-size: 15px; font-weight: 700\">{{ bName }}<\u002Fspan>\n              <sc-raw-select value=\"{{ bStatus }}\" sc-camel-on-change=\"{{ setBStatus }}\" aria-label=\"Document status\" style=\"font-family: var(--mono); font-size: 11px; min-height: 34px; border-left: 3px solid {{ bStatusTone }}\">\n                <sc-for list=\"{{ bStatuses }}\" as=\"o\" hint-placeholder-count=\"6\">\n                  <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n              <button sc-camel-on-click=\"{{ closeBuild }}\" aria-label=\"Close the document builder\" style=\"font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 8px 13px; min-height: 36px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #2C2D2E; cursor: pointer\">CLOSE ✕<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 10px; margin-top: 9px\">\n              <span style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: #65696C\">{{ bRef }}<\u002Fspan>\n              <span style=\"flex: 1; height: 6px; background: #E1DEDE; border-radius: 3px; overflow: hidden\">\n                <span style=\"display: block; height: 100%; width: {{ bBarW }}; background: {{ bTone }}; border-radius: 3px; transition: width .3s ease\"><\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: {{ bTone }}\">{{ bProgress }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"scroller\" style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 16px\">\n            <sc-if value=\"{{ bHasWhy }}\">\n              <p style=\"margin: 0 0 14px; font-size: 12.5px; line-height: 1.65; color: #54585B; background: #FFFFFF; border-left: 3px solid #FBE7E8; border-radius: 2px; padding: 11px 13px; text-wrap: pretty\">{{ bWhy }}<\u002Fp>\n            <\u002Fsc-if>\n\n            <sc-for list=\"{{ bQs }}\" as=\"q\" hint-placeholder-count=\"6\">\n              <div style=\"background: #FFFFFF; border: 1px solid #E1DEDE; border-left: 3px solid {{ q.edge }}; border-radius: 3px; padding: 13px; margin-bottom: 10px\">\n                <div style=\"display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin-bottom: 6px\">\n                  <span style=\"font-family: var(--mono); font-size: 10.5px; font-weight: 800; color: #65696C\">{{ q.n }}<\u002Fspan>\n                  <span style=\"flex: 1; min-width: 200px; font-size: 13px; font-weight: 600; line-height: 1.45\">{{ q.q }}<\u002Fspan>\n                  <sc-if value=\"{{ q.live }}\">\n                    <span title=\"The tracker keeps this in step with the register\" style=\"font-family: var(--mono); font-size: 8.5px; font-weight: 700; letter-spacing: .09em; padding: 3px 6px; border-radius: 2px; background: #E4F0E8; color: #17693A\">LIVE<\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ q.overridden }}\">\n                    <span style=\"display: inline-flex; gap: 6px; align-items: center\">\n                      <span style=\"font-family: var(--mono); font-size: 8.5px; font-weight: 700; letter-spacing: .09em; padding: 3px 6px; border-radius: 2px; border: 1px solid #CC000E; color: #CC000E\">YOURS<\u002Fspan>\n                      <button sc-camel-on-click=\"{{ q.handBack }}\" title=\"Let the tracker keep this in step again\" style=\"font-family: var(--mono); font-size: 9px; padding: 4px 7px; min-height: 28px; border: 1px solid #C4C1C1; border-radius: 2px; background: #fff; color: #54585B; cursor: pointer\">HAND BACK<\u002Fbutton>\n                    <\u002Fspan>\n                  <\u002Fsc-if>\n , syncBusy: false,\n    aiKeyVisible: false, syncKeyVisible: false, shortcutOpen: false, archiveNote: \"\",\n    aiOpen: false, aiQ: \"\", aiA: \"\", aiBusy: false, aiSel: \"\",\n    soaQ: \"\", soaFilter: \"All\", soaClosed: {} };\n\n  /* Every write goes through here: clone, mutate, re-derive to a fixed point, persist.\n     Nothing is written while the vault is locked or while showing the seed. */\n  up(fn) {\n    const core = this.state.core;\n    const w = core.deepClone(this.state.st);\n    fn(w);\n    const next = this.propagate(core, w);\n    this.setState({ st: next }, () => this.persist(next));\n  }\n\n  upMan(kind, id, fn) {\n    this.up(s => { s.manual = { ...(s.manual || {}), [`${kind}:${id}`]: true }; fn(s); });\n  }\n\n  /* Settings are not project data: they never enter the tracker state object,\n     so a cloud push or an exported backup cannot carry the API key. */\n  upCfg(patch) {\n    const cfg = { ...(this.state.cfg || {}), ...patch };\n    this.setState({ cfg });\n    if (this.state.encrypted) return;\n    if ((this.props.dataSource || \"Saved tracker\") !== \"Saved tracker\") return;\n    try { localStorage.setItem(this.state.core.SKEY, JSON.stringify(cfg)); } catch (e) { /* quota */ }\n  }\n\n  persist(st) {\n    if (this.state.encrypted) return;\n    if ((this.props.dataSource || \"Saved tracker\") !== \"Saved tracker\") return;\n    clearTimeout(this.saveT);\n    this.saveT = setTimeout(async () => {\n      try {\n        /* A lock can fire during the save debounce. Never let that race turn an\n           encrypted project back into plain JSON after its key is discarded. */\n        if (this.state.hasVault && !this.vaultKey) return;\n        const { KEY, seal } = this.state.core;\n        const body = this.vaultKey\n          ? JSON.stringify({ __enc: true, ...(await seal(this.vaultKey, st)) })\n          : JSON.stringify(st);\n        localStorage.setItem(KEY, body);\n        this.setState({ saved: Date.now() });\n      } catch (e) { /* quota or private mode — the session keeps working */ }\n    }, 350);\n  }\n\n  componentDidMount() {\n    this.annexaOn = (e) => this.annexaFollow(e.clientX, e.clientY);\n    window.addEventListener(\"mousemove\", this.annexaOn, { passive: true });\n    this.keyOn = (e) => this.handleShortcut(e);\n    window.addEventListener(\"keydown\", this.keyOn);\n    this.activityOn = () => this.noteVaultActivity(false);\n    this.visibleOn = () => {\n      if (document.visibilityState === \"visible\") this.noteVaultActivity(true);\n    };\n    window.addEventListener(\"pointerdown\", this.activityOn, { passive: true });\n    window.addEventListener(\"touchstart\", this.activityOn, { passive: true });\n    window.addEventListener(\"scroll\", this.activityOn, { passive: true, capture: true });\n    document.addEventListener(\"visibilitychange\", this.visibleOn);\n    const startTab = NAV.findIndex(t => t.n === (this.props.startTab || \"Overview\"));\n    const narrow = window.matchMedia(\"(max-width: 859px)\").matches;\n    this.setState({ tab: startTab < 0 ? 0 : startTab, navOpen: !narrow && this.props.sidebarOpen !== false });\n\n    const mq = window.matchMedia(\"(max-width: 859px)\");\n    /* A drawer that opens over the content on load would hide it, so entering\n       mobile closes the nav and leaving it restores the rail. */\n    this.mqOn = () => this.setState(s => (mq.matches === s.mobile ? null\n      : { mobile: mq.matches, navOpen: !mq.matches }));\n    mq.addEventListener(\"change\", this.mqOn);\n    this.mqOn();\n\n    import((window.__resources && window.__resources.ismsCore) || \"./isms-core.js\").then(async core => {\n      /* The vault metadata holds the salt, and without it no passphrase can\n         derive the right key. So locking requires BOTH the ciphertext and that\n         salt — otherwise the payload is unrecoverable and a lock screen is just\n         a door with no key behind it. A fresh install has neither and opens\n         straight into the project, which is what publishing should do. */\n      let hasVault = false, meta = null;\n      try { meta = JSON.parse(localStorage.getItem(core.VAULT_KEY) || \"null\"); } catch (e) { meta = null; }\n      hasVault = !!(meta && meta.salt);\n\n      let raw = null, encrypted = false, locked = false, orphaned = false, storedEncrypted = null;\n      if ((this.props.dataSource || \"Saved tracker\") === \"Saved tracker\") {\n        try {\n          const s = localStorage.getItem(core.KEY);\n          if (s) {\n            const parsed = JSON.parse(s);\n            if (parsed && parsed.__enc) {\n              if (hasVault) { encrypted = true; locked = true; storedEncrypted = parsed; }\n              else orphaned = true;           // ciphertext with no salt: unreadable\n            } else raw = parsed;\n          }\n        } catch (e) { raw = null; }\n      }\n      let files = {};\n      try { files = JSON.parse(localStorage.getItem(core.FKEY) || \"{}\") || {}; } catch (e) { files = {}; }\n      let cfg = core.defaultSettings();\n      try { cfg = { ...cfg, ...(JSON.parse(localStorage.getItem(core.SKEY) || \"{}\") || {}) }; } catch (e) { /* defaults */ }\n      cfg.idleMins = core.normaliseIdleMins(cfg.idleMins);\n      if (storedEncrypted && hasVault) {\n        const sessionKey = await core.loadSession();\n        if (sessionKey) {\n          try {\n            raw = await core.unseal(sessionKey, storedEncrypted);\n            this.vaultKey = sessionKey;\n            core.touchSession(cfg.idleMins);\n            this.tabSessionExpected = true;\n            encrypted = false;\n            locked = false;\n          } catch (e) {\n            core.dropSession();\n            this.vaultKey = null;\n          }\n        }\n      }\n      this.setState({ core, encrypted, locked, hasVault, files, cfg,\n        st: this.propagate(core, core.hydrate(raw), cfg) }, () => {\n          if (orphaned) this.say(\"This browser held an encrypted copy with no key material, so it could not be opened. Started a fresh project.\");\n          if (this.vaultKey) {\n            this.lastSessionTouch = Date.now();\n            this.scheduleVaultExpiry();\n          }\n        });\n    }).catch(e => { this.loadError = e.message; this.forceUpdate(); });\n  }\n\n  /* ANNEXA's eyes follow the cursor. Written straight onto the element as two\n     custom properties and throttled to one frame, so an interactive character\n     costs no React re-render and no work between frames. */\n  annexaFollow(x, y) {\n    if (this.annexaQueued) return;\n    this.annexaQueued = true;\n    requestAnimationFrame(() => {\n      this.annexaQueued = false;\n      const els = document.querySelectorAll(\".annexa\");\n      for (let i = 0; i < els.length; i++) {\n        const r = els[i].getBoundingClientRect();\n        if (!r.width) continue;\n        const dx = x - (r.left + r.width / 2);\n        const dy = y - (r.top + r.height / 2);\n        const d = Math.sqrt(dx * dx + dy * dy) || 1;\n        const k = Math.min(1, d / 240) * 1.8;\n        els[i].style.setProperty(\"--ax\", (dx / d * k).toFixed(2) + \"px\");\n        els[i].style.setProperty(\"--ay\", (dy / d * k).toFixed(2) + \"px\");\n      }\n    });\n  }\n\n  componentWillUnmount() {\n    if (this.annexaOn) window.removeEventListener(\"mousemove\", this.annexaOn);\n    if (this.keyOn) window.removeEventListener(\"keydown\", this.keyOn);\n    if (this.activityOn) {\n      window.removeEventListener(\"pointerdown\", this.activityOn);\n      window.removeEventListener(\"touchstart\", this.activityOn);\n      window.removeEventListener(\"scroll\", this.activityOn, true);\n    }\n    if (this.visibleOn) document.removeEventListener(\"visibilitychange\", this.visibleOn);\n    if (this.mqOn) window.matchMedia(\"(max-width: 859px)\").removeEventListener(\"change\", this.mqOn);\n    clearTimeout(this.sessionT);\n    clearTimeout(this.saveT);\n  }\n\n  idleMinutes(value) {\n    const core = this.state.core;\n    return core ? core.normaliseIdleMins(value === undefined ? (this.state.cfg || {}).idleMins : value) : 10;\n  }\n\n  async startVaultSession(key, minutes) {\n    if (!key || !this.state.core) return;\n    this.tabSessionExpected = await this.state.core.saveSession(key, this.idleMinutes(minutes));\n    this.lastSessionTouch = Date.now();\n    if (this.tabSessionExpected) this.scheduleVaultExpiry();\n  }\n\n  scheduleVaultExpiry() {\n    clearTimeout(this.sessionT);\n    if (!this.vaultKey || !this.state.core) return;\n    const left = this.state.core.sessionLeft();\n    if (!(left > 0)) {\n      if (this.tabSessionExpected) this.lockVault(\"Session expired after inactivity.\");\n      return;\n    }\n    this.sessionT = setTimeout(() => this.checkVaultSession(), Math.min(left + 50, 2147483647));\n  }\n\n  checkVaultSession() {\n    if (!this.vaultKey || !this.state.core) return;\n    if (this.state.core.sessionLeft() <= 0) this.lockVault(\"Session expired after inactivity.\");\n    else this.scheduleVaultExpiry();\n  }\n\n  noteVaultActivity(force) {\n    if (!this.vaultKey || !this.state.core || this.state.locked || !this.state.hasVault || !this.tabSessionExpected) return;\n    const now = Date.now();\n    if (!force && this.lastSessionTouch && now - this.lastSessionTouch < 10000) return;\n    this.lastSessionTouch = now;\n    this.state.core.touchSession(this.idleMinutes());\n    this.scheduleVaultExpiry();\n  }\n\n  lockVault(message) {\n    const core = this.state.core;\n    const key = this.vaultKey;\n    const st = this.state.st;\n    const writeId = (this.lockWriteGeneration || 0) + 1;\n    this.lockWriteGeneration = writeId;\n    if (core) core.dropSession();\n    clearTimeout(this.sessionT);\n    clearTimeout(this.saveT);\n    this.vaultKey = null;\n    this.tabSessionExpected = false;\n    this.setState({\n      locked: true, encrypted: true, vaultPass: \"\", vaultPass2: \"\", vaultCode: \"\",\n      vaultErr: message || \"\",\n    });\n    /* Flush the latest debounced edit nFocus.focus) this.returnFocus.focus({ preventScroll: true });\n      this.returnFocus = null;\n    });\n  }\n\n  openShortcutGuide() {\n    this.shortcutReturnFocus = document.activeElement;\n    this.setState({ shortcutOpen: true }, () => {\n      requestAnimationFrame(() => {\n        const close = document.querySelector(\"[data-shortcuts-close]\");\n        if (close) close.focus({ preventScroll: true });\n      });\n    });\n  }\n\n  closeShortcutGuide() {\n    this.setState({ shortcutOpen: false }, () => {\n      if (this.shortcutReturnFocus && this.shortcutReturnFocus.focus) this.shortcutReturnFocus.focus({ preventScroll: true });\n      this.shortcutReturnFocus = null;\n    });\n  }\n\n  focusCurrentSearch() {\n    const el = document.querySelector(`[data-context-search=\"${this.state.tab}\"]`);\n    if (!el) { this.say(\"This section has no search field.\"); return; }\n    el.focus({ preventScroll: false });\n    if (el.select) el.select();\n  }\n\n  downloadBackup() {\n    const st = this.state.st;\n    if (!st) return;\n    const a = document.createElement(\"a\");\n    a.href = URL.createObjectURL(new Blob([JSON.stringify(st, null, 2)], { type: \"application/json\" }));\n    a.download = `isms-tracker-${st.start}.json`;\n    a.click();\n    setTimeout(() => URL.revokeObjectURL(a.href), 1000);\n    this.say(\"Backup downloaded.\");\n  }\n\n  downloadProjectArchive(startFresh) {\n    const core = this.state.core;\n    if (!core || !this.state.st) return;\n    const archive = core.buildArchive(\n      this.state.st,\n      this.state.cfg || core.defaultSettings(),\n      this.state.files,\n      this.state.archiveNote,\n    );\n    this.saveBlob(\n      new Blob([JSON.stringify(archive, null, 2)], { type: \"application/json\" }),\n      core.archiveName(archive),\n    );\n    if (!startFresh) { this.say(\"Project archive downloaded.\"); return; }\n    const fresh = this.propagate(core, core.hydrate(core.defaultState()));\n    fresh.risks = [];\n    this.setState({ st: fresh, tab: 0, archiveNote: \"\", settingsOpen: false }, () => this.persist(fresh));\n    this.say(\"Project archived. A new organisation is ready.\");\n  }\n\n  restoreProjectArchive(e) {\n    const file = e.target.files && e.target.files[0];\n    e.target.value = \"\";\n    if (!file) return;\n    const reader = new FileReader();\n    reader.onload = () => {\n      try {\n        const raw = JSON.parse(reader.result);\n        if (!raw || raw.kind !== \"isms-tracker-archive\" || !raw.tracker) throw new Error(\"Not an archive\");\n        const next = this.propagate(this.state.core, this.state.core.hydrate(raw.tracker));\n        if (raw.prefs && typeof raw.prefs === \"object\") this.upCfg(raw.prefs);\n        this.setState({ st: next, archiveNote: \"\" }, () => this.persist(next));\n        this.say(\"Project archive restored.\");\n      } catch (err) { this.say(\"That file is not a valid ISMS project archive.\"); }\n    };\n    reader.readAsText(file);\n  }\n\n  resetEverything() {\n    if (!confirm(\"Reset everything on this browser? This removes the project, settings, API keys, attachments, vault metadata and saved session. Download a backup first if you need one.\")) return;\n    const c = this.state.core;\n    this.lockWriteGeneration = (this.lockWriteGeneration || 0) + 1;\n    [c.KEY, c.SKEY, c.VAULT_KEY, c.FKEY, c.SESS].forEach(k => {\n      try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) { /* ignore */ }\n    });\n    window.location.reload();\n  }\n\n  handleShortcut(e) {\n    this.noteVaultActivity(false);\n    const s = this.state;\n    if (e.key === \"Tab\") {\n      if (s.shortcutOpen && this.trapFocus(e, \"[data-shortcuts-modal]\")) return;\n      if (s.settingsOpen && this.trapFocus(e, \"[data-settings-modal]\")) return;\n    }\n\n    if (e.key === \"Escape\") {\n      if (s.shortcutOpen) this.closeShortcutGuide();\n      else if (s.mapOpen) this.setState({ mapOpen: false });\n      else if (s.heatOpen) this.setState({ heatOpen: false, heatSel: null });\n      else if (s.buildId) this.setState({ buildId: null });\n      else if (s.settingsOpen) this.closeSettingsPanel();\n      else if (s.aiOpen) this.setState({ aiOpen: false });\n      else return;\n      e.preventDefault();\n      return;\n    }\n\n    if (this.isTypingTarget(e.target) || e.repeat) return;\n    const mod = e.ctrlKey || e.metaKey;\n\n    if (e.altKey && !e.ctrlKey && !e.metaKey && /^[1-6]$/.test(e.key)) {\n      this.setState({ tab: Number(e.key) - 1, settingsOpen: false, shortcutOpen: false });\n      e.preventDefault();\n      return;\n    }\n    if (mod && e.key === \",\") { this.openSettingsPanel(); e.preventDefault(); return; }\n    if (mod && String(e.key).toLowerCase() === \"k\") {\n      this.setState({ aiOpen: true }, () => {\n        const q = document.querySelector(\"[data-ai-question]\");\n        if (q) q.focus({ preventScroll: true });\n      });\n      e.preventDefault();\n      return;\n    }\n    if (mod && e.shiftKey && String(e.key).toLowerCase() === \"b\") {\n      this.downloadBackup(); e.preventDefault(); return;\n    }\n    if (!mod && !e.altKey && e.key === \"/\") { this.focusCurrentSearch(); e.preventDefault(); return; }\n    if (!mod && !e.altKey && (e.key === \"?\" || (e.shiftKey && e.key === \"/\"))) {\n      this.openShortcutGuide(); e.preventDefault();\n    }\n  }\n\n  /* Propagate derived status. Ported from the App's derivation effect: touches only\n     entries the user has not decided by hand, never writes Verified, and stops as\n     soon as nothing differs. The original re-ran on every state change, so it\n     converged across renders; here one call iterates to the same fixed point.\n     Storage is never written from this pass. */\n  propagate(core, input, config) {\n    const cfg = config || this.state.cfg;\n    if (cfg && cfg.autoDerive === false) return input;\n    const { CLAUSES, CONTROLS, deepClone, isManual, controlDecision, autoControlStatus,\n      autoClaus
